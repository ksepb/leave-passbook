<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>假期存摺</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#2F5D50">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="假期存摺">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;700;900&family=Noto+Sans+TC:wght@400;500;700&family=IBM+Plex+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#F3EFE4;
    --paper-deep:#EAE3D2;
    --ink:#2B2A28;
    --ink-soft:#6B6459;
    --jade:#2F5D50; --jade-soft:#DDE8E2;
    --brick:#A03B3B; --brick-soft:#F1DFDA;
    --blue:#355E7A; --blue-soft:#DCE6EC;
    --olive:#7C7530; --olive-soft:#EAE7D3;
    --plum:#5B5A8C; --plum-soft:#E1E0EE;
    --rust:#A8592F; --rust-soft:#F1DDCC;
    --rose:#A8456B; --rose-soft:#F2DDE6;
    --teal:#2A7A75; --teal-soft:#DBEBE9;
    --line:#C9C2B0;
    --amber:#B5761A;
  }
  *{box-sizing:border-box;}
  html{touch-action:manipulation;}
  body{
    margin:0; background:var(--paper);
    background-image:radial-gradient(circle at 1px 1px, rgba(43,42,40,.07) 1px, transparent 0);
    background-size:24px 24px;
    color:var(--ink); font-family:'Noto Sans TC', sans-serif;
    padding:24px 16px calc(86px + env(safe-area-inset-bottom)); min-height:100vh;
  }
  .wrap{max-width:760px;margin:0 auto;}
  @keyframes fadeInPage{from{opacity:0;transform:translateY(4px);}to{opacity:1;transform:translateY(0);}}
  .page-fade{animation:fadeInPage .25s ease-out;}
  .shimmer-once{position:relative;overflow:hidden;}
  .add-success-box{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:60px 20px;text-align:center;animation:fadeInPage .2s ease-out;}
  .add-success-check{width:64px;height:64px;border-radius:50%;background:var(--jade);color:#fff;font-size:32px;font-weight:900;display:flex;align-items:center;justify-content:center;margin-bottom:16px;animation:stampIn .35s ease-out;}
  .add-success-text{font-size:16px;font-weight:700;color:var(--ink);}
  .ledger-thumb{width:36px;height:36px;max-width:36px;max-height:36px;object-fit:cover;border-radius:8px;border:1px solid var(--line);cursor:pointer;flex-shrink:0;}
  .photo-badge{display:inline-flex;align-items:center;background:var(--blue-soft);color:var(--blue);font-size:12.5px;font-weight:700;padding:3px 8px;border-radius:20px;cursor:pointer;flex-shrink:0;}
  .photo-icon{font-size:15px;cursor:pointer;flex-shrink:0;}
  input[type="file"]{width:100%;max-width:100%;box-sizing:border-box;font-size:13px;color:var(--ink-soft);}
  .shimmer-once::after{
    content:'';
    position:absolute; top:0; left:-60%; width:55%; height:100%;
    background:linear-gradient(120deg, transparent, rgba(255,255,255,.55), transparent);
    animation:shimmerSweep 1.2s ease-out 1;
    pointer-events:none;
  }
  @keyframes shimmerSweep{
    0%{left:-60%;}
    100%{left:120%;}
  }
  .bottom-nav{
    position:fixed; left:0; right:0; bottom:0; z-index:50;
    display:flex; justify-content:space-around; align-items:center;
    background:rgba(255,253,248,.97); -webkit-backdrop-filter:blur(10px); backdrop-filter:blur(10px);
    border-top:1px solid var(--line);
    padding:12px 8px calc(12px + env(safe-area-inset-bottom));
    box-shadow:0 -4px 16px rgba(43,42,40,.08);
  }
  .nav-item{
    flex:1; display:flex; flex-direction:column; align-items:center; gap:5px;
    background:none; border:none; padding:6px 4px; color:var(--ink-soft);
    font-family:'Noto Sans TC',sans-serif; font-weight:700; font-size:14px;
    border-radius:16px; transition:color .15s ease;
  }
  .nav-item .nav-icon-wrap{
    width:52px; height:44px; border-radius:16px;
    display:flex; align-items:center; justify-content:center;
    transition:background .15s ease, transform .15s ease;
  }
  .nav-item .nav-icon{font-size:28px; line-height:1;}
  .nav-item.active{color:var(--jade);}
  .nav-item.active .nav-icon-wrap{background:var(--jade-soft);}
  .nav-item:active .nav-icon-wrap{transform:scale(.9);}
  header{text-align:center;margin-bottom:24px;}
  .eyebrow{font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:.18em;color:var(--ink-soft);text-transform:uppercase;}
  header h1{font-family:'Noto Serif TC',serif;font-weight:900;font-size:30px;margin:6px 0 2px;letter-spacing:.06em;}
  header p.sub{font-size:14px;color:var(--ink-soft);margin:0;}
  header p.sub-lead{font-size:14px;color:var(--ink-soft);margin:6px 0 10px;}
  header p.sub-foot{font-size:11.5px;color:var(--ink-soft);margin:10px 0 0;letter-spacing:.02em;}
  .home-chips{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin:0 auto;max-width:320px;}
  .chip{display:inline-flex;align-items:center;gap:4px;padding:5px 13px;border-radius:20px;font-family:'Noto Sans TC',sans-serif;font-size:12px;font-weight:500;color:var(--ink-soft);background:rgba(255,255,255,.5);border:1px solid var(--line);}

  .undo-bar{position:fixed;left:16px;right:16px;bottom:calc(92px + env(safe-area-inset-bottom));z-index:250;background:#3A2F22;color:#fff;padding:14px 18px;border-radius:12px;font-size:16px;font-weight:600;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;box-shadow:0 10px 30px rgba(0,0,0,.35);animation:fadeInPage .2s ease-out;}
  .undo-bar button{font-size:15px;padding:8px 14px;}
  .undo-bar + .undo-bar{bottom:calc(160px + env(safe-area-inset-bottom));}
  .select-summary-bar{position:fixed;left:16px;right:16px;bottom:calc(92px + env(safe-area-inset-bottom));z-index:240;background:var(--ink);color:#fff;padding:11px 16px;border-radius:12px;font-size:14.5px;font-weight:600;display:flex;align-items:center;justify-content:space-between;gap:10px;box-shadow:0 10px 30px rgba(0,0,0,.3);animation:fadeInPage .15s ease-out;}
  .skip-warning-bar{position:fixed;left:16px;right:16px;bottom:calc(148px + env(safe-area-inset-bottom));z-index:240;background:var(--amber);color:#fff;padding:10px 16px;border-radius:12px;font-size:13.5px;font-weight:600;box-shadow:0 10px 30px rgba(0,0,0,.3);animation:fadeInPage .15s ease-out;}
  .select-summary-bar .ssb-need{opacity:.75;font-weight:500;}
  .select-summary-bar.ssb-ok{background:var(--jade);}
  .undo-bar button{background:var(--amber);padding:5px 10px;font-size:12px;}

  .reminder-bar{background:#FDF1DC;border:1px solid var(--amber);color:#6b4a12;padding:10px 14px;border-radius:6px;font-size:14px;margin-bottom:16px;line-height:1.7;}
  .reminder-bar strong{display:block;margin-bottom:4px;font-size:13px;}
  .reminder-bar.reminder-urgent{background:#FBE4E2;border-color:#C0392B;color:#8b241a;}
  .reminder-bar .urgent-line{color:#C0392B;font-weight:700;}

  .stamps{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-bottom:20px;align-items:start;}
  .stamp-card{position:relative;background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px 16px 16px;overflow:hidden;box-shadow:0 2px 6px rgba(43,42,40,.05);cursor:pointer;transition:transform .12s ease, box-shadow .12s ease;}
  .stamp-card:active{transform:scale(.97);}
  .stamp-card .label{font-size:14px;font-weight:700;color:var(--ink-soft);letter-spacing:.03em;}
  .stamp-card .num{font-family:'IBM Plex Mono',monospace;font-size:22px;font-weight:700;line-height:1.15;margin-top:8px;white-space:nowrap;}
  .stamp-card .num small{font-size:11px;font-weight:500;color:var(--ink-soft);display:block;margin-top:8px;line-height:1.5;}
  .mini-chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:10px;}
  .mini-chip{font-size:10.5px;font-weight:700;padding:3px 8px;border-radius:8px;white-space:nowrap;}
  .hour-inline{font-family:'IBM Plex Mono',monospace;font-size:13.5px;font-weight:700;color:var(--amber);vertical-align:middle;}
  .stamp-card.warn .num{color:var(--amber);}
  .stamp-card.level-warn{border-color:var(--amber);}
  .stamp-card.level-warn .num{color:var(--amber);}
  .stamp-card.level-danger{border-color:var(--brick);background:var(--brick-soft);}
  .stamp-card.level-danger .num{color:var(--brick);}
  .seal{position:absolute;right:-8px;top:-8px;width:56px;height:56px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:'Noto Serif TC',serif;font-weight:900;font-size:18px;transform:rotate(-12deg);opacity:.8;border:2px solid currentColor;}
  .seal::after{content:'';position:absolute;inset:4px;border:1px solid currentColor;border-radius:50%;opacity:.6;}
  .c-jade{color:var(--jade);} .c-brick{color:var(--brick);} .c-blue{color:var(--blue);} .c-olive{color:var(--olive);} .c-plum{color:var(--plum);} .c-rust{color:var(--rust);} .c-rose{color:var(--rose);} .c-teal{color:var(--teal);}
  .c-jade-bg{background:var(--jade);} .c-brick-bg{background:var(--brick);} .c-blue-bg{background:var(--blue);} .c-olive-bg{background:var(--olive);} .c-plum-bg{background:var(--plum);} .c-rust-bg{background:var(--rust);} .c-rose-bg{background:var(--rose);} .c-teal-bg{background:var(--teal);}

  .dashboard{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-bottom:18px;}
  .dash-card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px 14px;text-align:center;}
  .dash-card .label{font-size:11px;color:var(--ink-soft);}
  .dash-card .num{font-family:'IBM Plex Mono',monospace;font-size:20px;font-weight:700;margin-top:4px;}

  .hero-card{background:linear-gradient(155deg, #5C8A78, var(--jade));color:#fff;border-radius:20px;padding:22px 20px 20px;margin-bottom:16px;box-shadow:0 12px 28px -12px rgba(47,93,80,.4);}
  .hero-card .hero-label{font-size:13px;opacity:.85;}
  .hero-card .hero-num{font-family:'IBM Plex Mono',monospace;font-size:40px;font-weight:700;margin-top:4px;line-height:1.1;color:#F0C868;}
  .hero-card .hero-sub{font-size:11.5px;opacity:.75;margin-top:6px;}
  .hero-card .hero-divider{border:none;border-top:1px solid rgba(255,255,255,.25);margin:16px 0;}
  .hero-card .hero-stats{display:flex;gap:12px;}
  .hero-card .hero-stat{flex:1;}
  .hero-card .hero-stat .hero-stat-label{font-size:12px;opacity:.8;}
  .hero-card .hero-stat .hero-stat-num{font-family:'IBM Plex Mono',monospace;font-size:22px;font-weight:700;margin-top:3px;}

  .toolbar{background:rgba(255,255,255,.7);border:1px solid var(--line);border-radius:6px;padding:12px 14px;margin:10px 0 18px;}
  .toolbar-row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;}
  .toolbar-row + .toolbar-row{margin-top:10px;padding-top:10px;border-top:1px dashed var(--line);}
  .toolbar-row input[type=text]{flex:1;min-width:160px;font-family:'Noto Sans TC',sans-serif;font-size:16px;padding:8px 10px;border:1px solid var(--line);border-radius:4px;background:#fff;color:var(--ink);}
  .year-switch{display:flex;align-items:center;gap:6px;}
  .year-switch button.sortbtn{width:44px;height:44px;padding:0;min-height:0;display:flex;align-items:center;justify-content:center;font-size:19px;font-weight:900;color:var(--jade);background:var(--jade-soft);border-color:var(--jade-soft);border-radius:50%;}
  .view-toggles{display:flex;gap:8px;}
  .view-toggles button{flex:1;}
  button.sortbtn{background:#fff;color:var(--ink-soft);border:1px solid var(--line);font-weight:500;padding:9px 14px;min-height:38px;}
  .year-label{font-family:'IBM Plex Mono',monospace;font-weight:700;min-width:64px;text-align:center;}
  .section-label{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.14em;color:var(--ink-soft);text-transform:uppercase;margin:6px 2px 10px;}
  .leave-tabs{display:flex;gap:8px;flex-wrap:nowrap;overflow-x:auto;margin-bottom:16px;padding-bottom:4px;-webkit-overflow-scrolling:touch;scrollbar-width:none;}
  .leave-tabs::-webkit-scrollbar{display:none;}
  .leave-tab{flex-shrink:0;font-family:'Noto Sans TC',sans-serif;font-size:14.5px;font-weight:700;padding:9px 16px;border-radius:20px;border:1px solid var(--line);cursor:pointer;transition:transform .1s ease;}
  .leave-tab:active{transform:scale(.96);}
  .manage-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:20px;}
  @media(max-width:620px){.manage-grid{grid-template-columns:1fr;}}

  section.block{background:rgba(255,255,255,.85);border:1px solid var(--line);border-radius:16px;padding:18px 16px 20px;margin-bottom:20px;}
  section.block h2{font-family:'Noto Serif TC',serif;font-size:19px;margin:0 0 12px;display:flex;align-items:center;gap:8px;}
  section.block h2 .dot{width:9px;height:9px;border-radius:50%;display:inline-block;}
  .dot-jade{background:var(--jade);} .dot-brick{background:var(--brick);} .dot-blue{background:var(--blue);} .dot-olive{background:var(--olive);} .dot-plum{background:var(--plum);} .dot-rust{background:var(--rust);} .dot-rose{background:var(--rose);} .dot-teal{background:var(--teal);}

  form.entry{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px;align-items:flex-end;}
  .field{display:flex;flex-direction:column;gap:4px;flex:1;min-width:110px;}
  .field label{font-size:13px;color:var(--ink-soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .field input,.field select{font-family:'IBM Plex Mono',monospace;font-size:16px;padding:8px 12px;min-height:38px;border:1px solid var(--line);border-radius:10px;background-color:#fdfcf9;color:var(--ink);font-weight:600;transition:border-color .15s ease, box-shadow .15s ease, background-color .15s ease;box-sizing:border-box;}
  select{
    -webkit-appearance:none; appearance:none;
    background-image:url("data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAyNCAyNCI+PHBhdGggZD0iTTUgOWw3IDcgNy03IiBmaWxsPSJub25lIiBzdHJva2U9IiMyRjVENTAiIHN0cm9rZS13aWR0aD0iMy41IiBzdHJva2UtbGluZWNhcD0icm91bmQiIHN0cm9rZS1saW5lam9pbj0icm91bmQiLz48L3N2Zz4=");
    background-repeat:no-repeat; background-position:right 9px center; background-size:19px;
    padding-right:34px !important;
  }
  .field input:focus,.field select:focus{background-color:#fff;}
  .field input:focus,.field select:focus{outline:none;border-color:var(--jade);box-shadow:0 0 0 3px var(--jade-soft);}
  .field.note{flex:2;min-width:140px;}
  .form-row{display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end;flex:1 1 100%;margin-bottom:2px;}
  .quickdays{display:flex;gap:6px;}
  .quickdays button{padding:8px 9px;min-height:38px;min-width:32px;font-size:11.5px;background:transparent;color:var(--ink-soft);border:1px solid var(--line);border-radius:10px;font-weight:600;box-sizing:border-box;}
  .quickdays button:active{color:var(--jade);border-color:var(--jade);}
  .days-row{display:flex;gap:6px;align-items:center;}
  .date-row{display:flex;gap:6px;align-items:center;flex-wrap:wrap;}
  .date-row input{flex:1;min-width:130px;}
  .date-toggle{padding:8px 9px;min-height:44px;min-width:44px;font-size:11.5px;background:transparent;color:var(--ink-soft);border:1px solid var(--line);border-radius:10px;font-weight:600;flex:none;box-sizing:border-box;}
  .date-toggle:active{color:var(--jade);border-color:var(--jade);}
  .days-row input[type=number]{width:66px;flex:none;border-radius:12px;}
  .field-days{flex:1 1 220px;min-width:220px;}
  button{font-family:'Noto Sans TC',sans-serif;font-size:13px;font-weight:700;padding:9px 16px;border:none;border-radius:14px;cursor:pointer;color:#fff;transition:transform .1s ease, opacity .15s ease;}
  button:active{transform:scale(.96);}
  .btn-jade{background:var(--jade);} .btn-brick{background:var(--brick);} .btn-blue{background:var(--blue);} .btn-olive{background:var(--olive);} .btn-plum{background:var(--plum);} .btn-rust{background:var(--rust);} .btn-rose{background:var(--rose);} .btn-teal{background:var(--teal);}
  button.ghost{background:transparent;color:var(--ink-soft);border:1px solid var(--line);font-weight:500;}

  .total-row{display:flex;gap:8px;align-items:flex-end;margin-bottom:16px;padding-bottom:14px;border-bottom:1px dashed var(--line);flex-wrap:wrap;}
  .quota-accordion-item{border-bottom:1px solid var(--line);}
  .quota-accordion-item:last-child{border-bottom:none;}
  .quota-accordion-head{width:100%;display:flex;justify-content:space-between;align-items:center;background:none;border:none;padding:12px 2px;font-family:'Noto Sans TC',sans-serif;font-size:16.5px;font-weight:700;cursor:pointer;color:var(--ink);}
  .quota-accordion-body{padding:0 2px 14px;display:flex;gap:8px;align-items:flex-end;flex-wrap:wrap;}
  .auth-option{border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:12px;background:#fff;}
  .auth-option:last-child{margin-bottom:0;}
  .auth-option-title{font-weight:700;font-size:15px;margin-bottom:4px;}
  .auth-option .hint{margin-bottom:10px;}
  .use-preview-box{background:var(--jade-soft);border-radius:10px;padding:10px 12px;margin:8px 0 14px;}
  .use-preview-line{font-size:13.5px;color:var(--ink);padding:3px 0;}
  .src-batch-list{border:1px solid var(--line);border-radius:10px;padding:6px 12px 10px;overflow:hidden;box-sizing:border-box;max-width:100%;}
  .src-batch-row{display:flex;align-items:center;flex-wrap:wrap;gap:6px 10px;padding:9px 0;border-top:1px solid var(--line);max-width:100%;box-sizing:border-box;}
  .src-batch-row:first-child{border-top:none;}
  .src-batch-check{display:flex;align-items:center;gap:6px;font-size:15.5px;color:var(--ink);cursor:pointer;flex:0 1 auto;min-width:0;max-width:100%;}
  .src-batch-label{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;flex:0 1 auto;}
  .src-batch-remain{color:var(--jade);font-weight:700;font-size:14px;flex-shrink:0;white-space:nowrap;}
  .src-batch-row:has(input[type="checkbox"]:checked) .src-batch-remain{display:none;}
  .src-batch-check input[type="checkbox"]{flex-shrink:0;width:18px;height:18px;}
  .src-batch-days{width:60px;box-sizing:border-box;padding:6px 4px;font-size:15px;text-align:center;border:1px solid var(--line);border-radius:8px;flex-shrink:0;}
  .src-batch-input-wrap{display:flex;align-items:center;gap:5px;flex-shrink:0;}
  .src-batch-unit{font-size:14px;color:var(--ink-soft);flex-shrink:0;}
  .avail-batch-list{display:flex;flex-direction:column;gap:8px;margin-bottom:16px;}
  .avail-batch-item{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:#fff;}
  .avail-batch-title{font-weight:700;font-size:14.5px;margin-bottom:3px;}
  .avail-batch-list-label{font-size:14px;font-weight:700;color:var(--jade);margin:10px 0 8px;}
  .avail-batch-remain{font-size:14px;color:var(--jade);font-weight:700;white-space:nowrap;overflow-x:auto;}
  .avail-batch-hours{color:var(--ink-soft);font-weight:600;font-size:13px;margin-left:2px;}
  .avail-batch-expiry{font-size:12.5px;margin-top:3px;font-family:'IBM Plex Mono',monospace;}
  .info-icon-btn{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:50%;border:1px solid var(--line);background:#fff;color:var(--ink-soft);font-size:13px;cursor:pointer;margin-left:6px;vertical-align:middle;}
  .overview-panel{background:var(--jade-soft);border-radius:14px;padding:14px 16px;margin-bottom:16px;}
  .overview-balance{font-size:15px;font-weight:700;color:var(--ink);}
  .overview-expiry{font-size:13.5px;}
  .overview-panel-header{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:6px;}
  .overview-edit-link{flex-shrink:0;font-size:12px;color:var(--jade);background:#fff;padding:4px 10px;border-radius:20px;cursor:pointer;font-weight:600;white-space:nowrap;}
  .sync-status-box{border-radius:10px;padding:10px 12px;margin:8px 0 12px;font-size:13.5px;}
  .sync-status-box.sync-status-synced{background:var(--jade-soft);color:var(--jade);}
  .sync-status-box.sync-status-syncing{background:var(--paper-deep);color:var(--ink-soft);}
  .sync-status-box.sync-status-error,.sync-status-box.sync-status-idle{background:var(--amber-soft, #FBEFDC);color:var(--amber);}

<script>
const APP_VERSION = 'v2026.08.12-27';
const STORAGE_KEY = 'leave-passbook-data';

// 每次交付新版時手動更新這個字串（見上方 const APP_VERSION 宣告），方便使用者確認瀏覽器有沒有讀到最新版本

const firebaseConfig = {
  apiKey: "AIzaSyC5YIH145QTtNlSy8JyRsXsJjerS98eufE",
  authDomain: "leave-passbook-b3bc0.firebaseapp.com",
  projectId: "leave-passbook-b3bc0",
  storageBucket: "leave-passbook-b3bc0.firebasestorage.app",
  messagingSenderId: "391707124875",
  appId: "1:391707124875:web:adc76c284479df83e8a08e"
};
window.firebaseConfig = firebaseConfig;

let currentUser = null;
let fbAuth = null;
let fbDb = null;
let fbStorage = null;
let cloudSyncing = false;

function initFirebase(){
  try{
    if(typeof firebase === 'undefined'){ setStatus('雲端功能載入失敗（Firebase 套件沒抓到）', false); return; }
    firebase.initializeApp(firebaseConfig);
    fbAuth = firebase.auth();
    fbDb = firebase.firestore();
    fbStorage = firebase.storage();
    // 開啟離線持久化：離線時的寫入會自動存進手機本機（IndexedDB），
    // 就算 App 中途被關掉、離線很久才重開，網路恢復後 Firestore SDK 會自己補送出去，不會遺失。
    // synchronizeTabs 讓同一台裝置如果同時開多個分頁/視窗也能正確運作。
    fbDb.enablePersistence({ synchronizeTabs: true }).catch(e=>{
      // failed-precondition：瀏覽器不支援多分頁同步持久化（例如已開好幾個分頁）
      // unimplemented：瀏覽器本身不支援（例如 Safari 無痕模式），這兩種都不影響基本功能，只是離線時不會自動排隊
      console.warn('離線持久化未能啟用（不影響基本功能）', e && e.code);
    });
    fbAuth.setPersistence(firebase.auth.Auth.Persistence.LOCAL).catch(e=>console.error('設定登入保存方式失敗', e));
    let firstAuthCheck = true;
    fbAuth.onAuthStateChanged(async (user)=>{
      currentUser = user;
      render();
      if(user){ cleanupExpiredCompPhotos(); }
      if(firstAuthCheck){
        firstAuthCheck = false;
        if(user){ setStatus('✓ 偵測到已登入：' + (user.email||user.displayName||''), true); }
        else { setStatus('偵測結果：目前沒有登入狀態', false); }
      }
    });
    fbAuth.getRedirectResult().then(async (result)=>{
      if(result && result.user){
        // 真正剛從登入跳轉回來，才需要詢問雲端/本機衝突
        currentUser = result.user;
        await pullOrPushOnSignIn();
        applyUiScale();
        render();
      }
    }).catch(e=>{
      setStatus('登入失敗：' + (e && e.message ? e.message : String(e)), false);
    });
  }catch(e){ console.error('Firebase 初始化失敗', e); }
}

async function signInWithGoogle(){
  if(!fbAuth){ setStatus('雲端同步尚未就緒，請稍後再試', false); return; }
  try{
    const provider = new firebase.auth.GoogleAuthProvider();
    const result = await fbAuth.signInWithPopup(provider);
    if(result && result.user){
      currentUser = result.user;
      await pullOrPushOnSignIn();
      applyUiScale();
      render();
    }
  }catch(e){
    window.alert('Google 登入失敗：' + (e && e.message ? e.message : String(e)));
    setStatus('登入失敗', false);
  }
}

function toggleEmailAuthForm(mode){
  const emailEl = document.getElementById('emailPwEmail');
  const pwEl = document.getElementById('emailPwPassword');
  if(emailEl) emailPwEmailVal = emailEl.value;
  if(pwEl) emailPwPasswordVal = pwEl.value;
  emailAuthMode = mode;
  forgotPasswordMode = false;
  forgotPasswordSent = false;
  render();
}

async function submitEmailPasswordAuth(mode, btnEl){
  if(!fbAuth){ setStatus('雲端同步尚未就緒，請稍後再試', false); return; }
  const email = (document.getElementById('emailPwEmail')||{}).value.trim() || '';
  const pw = (document.getElementById('emailPwPassword')||{}).value || '';
  if(!email || !pw){ setStatus('請輸入 Email 跟密碼', false); return; }
  if(pw.length < 6){ setStatus('密碼至少要 6 個字', false); return; }
  if(btnEl){ btnEl.disabled = true; btnEl.textContent = '處理中…'; }
  setStatus('處理中…（跟 Firebase 對話中，最多等 15 秒）', true);
  const withTimeout = (p, ms, label) => Promise.race([
    p,
    new Promise((_, reject) => setTimeout(()=>reject(Object.assign(new Error(`${label}逾時：等了 ${ms/1000} 秒都沒回應，可能是網路問題或這個瀏覽器環境擋住了 Firebase 的連線`), {code:'timeout'})), ms))
  ]);
  try{
    const result = await withTimeout(
      mode==='signup' ? fbAuth.createUserWithEmailAndPassword(email, pw) : fbAuth.signInWithEmailAndPassword(email, pw),
      15000, mode==='signup'?'註冊':'登入'
    );
    if(result && result.user){
      currentUser = result.user; // 直接用剛拿到的結果，不要等 onAuthStateChanged 非同步更新，避免時機沒對上
      emailAuthMode = null;
      emailPwEmailVal = '';
      emailPwPasswordVal = '';
      setStatus('帳號驗證通過，同步雲端資料中…', true);
      await withTimeout(pullOrPushOnSignIn(), 15000, '雲端同步');
      applyUiScale();
      render();
      setStatus(mode==='signup' ? '註冊並登入成功' : '登入成功', true);
      window.alert(mode==='signup' ? '✓ 註冊並登入成功！\n\n以後每次登記資料，都會自動同步到雲端。' : '✓ 登入成功！\n\n之後每次登記資料，都會自動同步到雲端。');
    }
  }catch(e){
    console.error('Email 密碼登入失敗', e);
    const msg = {
      'auth/email-already-in-use': '這個 Email 已經註冊過了，改用「登入」',
      'auth/invalid-email': 'Email 格式不對',
      'auth/weak-password': '密碼太簡單，至少要 6 個字',
      'auth/user-not-found': '找不到這個帳號，確認 Email 是否正確，或改用「註冊」',
      'auth/wrong-password': '密碼不對',
      'auth/invalid-credential': 'Email 或密碼不對',
    }[e && e.code] || (e && e.message) || String(e);
    window.alert('❌ ' + (mode==='signup'?'註冊':'登入') + '失敗：\n\n' + msg);
    setStatus('失敗：' + msg, false);
    if(btnEl){ btnEl.disabled = false; btnEl.textContent = mode==='signup' ? '註冊並登入' : '登入'; }
  }
}

// 驗證外部資料（匯入備份／雲端拉下來的資料）結構是否合理，
// 避免壞掉或被手動改亂的資料被直接套用進來
function validateState(parsed){
  const errors = [];
  if(!parsed || typeof parsed !== 'object'){ errors.push('資料不是有效的物件格式'); return {valid:false, errors}; }

  if(parsed.records !== undefined){
    if(typeof parsed.records !== 'object' || parsed.records===null){ errors.push('records 假別紀錄區塊格式不對'); }
    else {
      const validKeys = LEAVE_TYPES.map(t=>t.key);
      Object.keys(parsed.records).forEach(key=>{
        if(!validKeys.includes(key)){ errors.push(`「${key}」不是有效的假別代號`); return; }
        const arr = parsed.records[key];
        if(!Array.isArray(arr)){ errors.push(`「${key}」底下的紀錄不是陣列格式`); return; }
        arr.forEach((r,i)=>{
          if(!r || typeof r !== 'object'){ errors.push(`${key} 第 ${i+1} 筆不是有效的紀錄物件`); return; }
          if(!r.date || !/^\d{4}-\d{1,2}-\d{1,2}$/.test(r.date) || isNaN(new Date(r.date).getTime())){ errors.push(`${key} 第 ${i+1} 筆日期不合法（${r.date}）`); }
          const amt = r.unit==='hour' ? r.amount : (r.unit==='day' ? r.amount : r.days);
          if(typeof amt !== 'number' || isNaN(amt) || amt<=0){ errors.push(`${key} 第 ${i+1} 筆的天數／小時數不合法`); }
        });
      });
    }
  }

  if(parsed.compRecords !== undefined){
    if(!Array.isArray(parsed.compRecords)){ errors.push('compRecords 補休／換休紀錄不是陣列格式'); }
    else {
      parsed.compRecords.forEach((r,i)=>{
        if(!r || typeof r !== 'object'){ errors.push(`補休／換休第 ${i+1} 筆不是有效的紀錄物件`); return; }
        if(!['comp','exchange'].includes(r.category||'comp')){ errors.push(`補休／換休第 ${i+1} 筆的類別不合法`); }
        if(!['earn','use'].includes(r.type)){ errors.push(`補休／換休第 ${i+1} 筆的類型不合法`); }
        if(!r.date || !/^\d{4}-\d{1,2}-\d{1,2}$/.test(r.date) || isNaN(new Date(r.date).getTime())){ errors.push(`補休／換休第 ${i+1} 筆日期不合法`); }
        if(typeof r.amount !== 'number' || isNaN(r.amount) || r.amount<=0){ errors.push(`補休／換休第 ${i+1} 筆數量不合法`); }
      });
    }
  }

  if(parsed.quotaByYear !== undefined && (typeof parsed.quotaByYear !== 'object' || parsed.quotaByYear===null)){
    errors.push('quotaByYear 總天數設定格式不對');
  }

  return { valid: errors.length===0, errors };
}

function applyCloudData(jsonStr){
  try{
    const parsed = JSON.parse(jsonStr);
    const check = validateState(parsed);
    if(!check.valid){
      console.error('雲端資料驗證失敗，保留本機資料', check.errors);
      logAppError('雲端資料驗證失敗，已保留本機資料', check.errors.slice(0,5).join('；'));
      setStatus('雲端資料格式異常，已保留本機資料（詳情見設定頁錯誤記錄）', false);
      return;
    }
    state = Object.assign(defaultState(), parsed);
  }catch(e){
    console.error('雲端資料格式錯誤', e);
    logAppError('雲端資料格式錯誤', e && e.message ? e.message : String(e));
    setStatus('雲端資料格式異常，已保留本機資料', false);
  }
}

function countAllRecords(s){
  let n = 0;
  Object.values(s.records||{}).forEach(arr=> n += (arr||[]).length);
  n += (s.compRecords||[]).length;
  return n;
}

async function pullOrPushOnSignIn(){
  if(!fbDb || !currentUser) return;
  try{
    const docRef = fbDb.collection('leavePassbook').doc(currentUser.uid);
    const snap = await docRef.get();
    if(!snap.exists){
      await docRef.set({ data: JSON.stringify(state), updatedAt: Date.now(), deviceId: getDeviceId(), deviceName: getDeviceName() });
      setStatus('已將目前資料上傳到雲端', true);
    } else {
      const cloudData = snap.data();
      const localCount = countAllRecords(state);
      if(localCount > 0){
        let cloudCount = 0, cloudTimeText = '未知';
        try{
          const cloudParsed = JSON.parse(cloudData.data);
          cloudCount = countAllRecords(cloudParsed);
        }catch(e){}
        if(cloudData.updatedAt){
          const d = new Date(cloudData.updatedAt);
          cloudTimeText = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
        }
        const cloudDeviceText = cloudData.deviceName ? `由「${cloudData.deviceName}」` : '';
        const useCloud = window.confirm(
          `發現雲端跟這台裝置都有資料，請選擇要保留哪一份：\n\n` +
          `☁️ 雲端：共 ${cloudCount} 筆（${cloudDeviceText}最後更新 ${cloudTimeText}）\n` +
          `📱 這台裝置（${getDeviceName()}）：共 ${localCount} 筆\n\n` +
          `按「確定」→ 用雲端資料覆蓋這台裝置畫面\n` +
          `按「取消」→ 用這台裝置的資料覆蓋雲端`
        );
        if(useCloud){ applyCloudData(cloudData.data); }
        else { await docRef.set({ data: JSON.stringify(state), updatedAt: Date.now(), deviceId: getDeviceId(), deviceName: getDeviceName() }); }
      } else {
        applyCloudData(cloudData.data);
      }
    }
    await saveState();
  }catch(e){
    setStatus('雲端同步失敗：' + (e && e.message ? e.message : String(e)), false);
  }
}

let cloudSyncStatus = 'idle'; // idle | syncing | synced | error
let lastSyncTime = null;
let isOnline = (typeof navigator!=='undefined' && navigator.onLine!==undefined) ? navigator.onLine : true;
let pendingSync = false; // 離線或同步進行中時又有新變更，記著等這輪結束要再送一次最新的
function loadLastSyncTime(){
  try{
    const raw = localStorage.getItem('lastSyncTime');
    if(raw){ lastSyncTime = new Date(Number(raw)); cloudSyncStatus = 'synced'; }
  }catch(e){}
}
function initOnlineDetection(){
  try{
    window.addEventListener('online', ()=>{
      isOnline = true;
      render();
      syncToCloud(); // 恢復網路，主動補送一次，確保離線期間排隊的資料真的送出去
    });
    window.addEventListener('offline', ()=>{
      isOnline = false;
      render();
    });
  }catch(e){}
}
async function syncToCloud(){
  if(!fbDb || !currentUser) return;
  if(cloudSyncing){ pendingSync = true; return; } // 上一輪還沒結束（可能離線中卡住），先記住，等它結束再補送最新的
  cloudSyncing = true;
  cloudSyncStatus = 'syncing';
  render();
  try{
    // Firestore 已開啟離線持久化：離線時這個 set() 會先存進本機排隊，
    // 要等網路恢復、伺服器真的收到確認後這裡才會 resolve，所以離線時這個 await 會一直卡著是正常的。
    await fbDb.collection('leavePassbook').doc(currentUser.uid).set({ data: JSON.stringify(state), updatedAt: Date.now(), deviceId: getDeviceId(), deviceName: getDeviceName() });
    cloudSyncStatus = 'synced';
    lastSyncTime = new Date();
    try{ localStorage.setItem('lastSyncTime', String(lastSyncTime.getTime())); }catch(e){}
  }catch(e){
    console.error('雲端同步失敗', e);
    cloudSyncStatus = 'error';
    logAppError('雲端同步失敗', e && e.message ? e.message : String(e));
  }finally{
    cloudSyncing = false;
    render();
    if(pendingSync){
      pendingSync = false;
      syncToCloud(); // 這段期間又有新變更，用目前最新的 state 再送一次
    }
  }
}
async function retrySyncNow(){
  if(!currentUser){ setStatus('尚未登入，無法同步', false); return; }
  setStatus('正在重新同步…', true);
  await syncToCloud();
  if(cloudSyncStatus==='synced'){ setStatus('已同步到雲端', true); }
  else if(!isOnline){ setStatus('目前離線，資料已存本機，恢復網路後會自動同步', false); }
  else { setStatus('同步失敗，請檢查網路連線後再試一次', false); }
}

// 資料來源：ruyut/TaiwanCalendar（源自人事行政總處公告的辦公日曆表），透過 jsDelivr CDN 取得
let holidayCache = {}; // { [year]: {dateStr: {isHoliday, description}}} | false(失敗) | null(讀取中)
async function ensureHolidayYear(year){
  if(holidayCache[year] !== undefined) return; // 已經有資料、讀取中、或已失敗過，都不重複要求
  holidayCache[year] = null;
  const cacheKey = 'taiwanHolidays:' + year;
  try{
    let list = null;
    try{
      const cached = localStorage.getItem(cacheKey);
      if(cached) list = JSON.parse(cached);

function isoDate(y,m,d){
  if(!y||!m||!d) return '';
  return `${y}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
}
function isValidCalendarDate(y,m,d){
  if(!Number.isInteger(y) || !Number.isInteger(m) || !Number.isInteger(d)) return false;
  if(y < 1900 || y > 2200) return false;
  if(m < 1 || m > 12) return false;
  const lastDay = new Date(y, m, 0).getDate(); // 該月實際天數（含閏年2月自動處理）
  if(d < 1 || d > lastDay) return false;
  return true;
}
function parseFlexibleDate(raw){
  if(!raw) return '';
  raw = String(raw).trim();
  if(/^\d{4}-\d{1,2}-\d{1,2}$/.test(raw)){
    const [y,m,d] = raw.split('-').map(Number);
    if(!isValidCalendarDate(y,m,d)) return '';
    return isoDate(y,m,d);
  }
  if(raw.includes('/')){
    const parts = raw.split('/').map(s=>s.trim());
    if(parts.length===3){
      let y = parseInt(parts[0],10);
      const m = parseInt(parts[1],10);
      const d = parseInt(parts[2],10);
      if(!isNaN(y) && y < 200) y += 1911; // 兩三位數視為民國年
      if(!isValidCalendarDate(y,m,d)) return '';
      return isoDate(y,m,d);
    }
    if(parts.length===2){
      const m = parseInt(parts[0],10);
      const d = parseInt(parts[1],10);
      if(!isValidCalendarDate(CUR_YEAR,m,d)) return ''; // 沒填年份，預設今年
      return isoDate(CUR_YEAR, m, d);
    }
  }
  // 其餘格式（例如打錯字、不支援的分隔符號）一律視為解析失敗，不要把原始文字當日期存進去
  return '';
}

function toROC(dateStr){
  if(!dateStr) return '';
  const parts = String(dateStr).split('-');
  if(parts.length!==3) return dateStr;
  const y = parseInt(parts[0],10) - 1911;
  const m = parseInt(parts[1],10);
  const d = parseInt(parts[2],10);
  if(isNaN(y) || isNaN(m) || isNaN(d)) return dateStr;
  return `${y}/${m}/${d}`;
}
function toDays(r){
  if(r.unit==='hour') return Number(r.amount)/getHoursPerDay();
  if(r.unit==='day') return Number(r.amount);

}

  const amt = r.unit==='day' ? r.amount : r.days;

}

// 先進先出核心運算：算出每一筆「獲得」紀錄實際還剩多少沒被用掉，
// 同時記錄每一筆「使用」紀錄實際扣了哪些批次各多少天（不管是手動指定還是自動判斷），
// 這樣歷史紀錄畫面才能不管是不是手動指定，都能顯示「這筆實際扣了哪幾批」。
function _compFifoCore(category, excludeId){
  const records = state.compRecords
    .filter(r=>(r.category||'comp')===category && r.id!==excludeId)
    .slice()
    .sort((a,b)=> a.date.localeCompare(b.date) || (a.type==='earn'?-1:1));
  const batches = [];
  const breakdown = {}; // useRecordId -> [{date, note, take, batchId}]
  records.forEach(r=>{
    const days = toDays(r);
    if(r.type==='earn'){
      batches.push({id:r.id, date:r.date, expiry:r.expiry, note:r.note, photoUrl:r.photoUrl, remainDays: days});
    } else {
      let toDeduct = days;
      const pinnedIds = new Set();
      const useLog = [];
      const takeFrom = (b, amt) => {
        if(amt<=0.0001) return;
        b.remainDays -= amt;
        useLog.push({date:b.date, note:b.note, take:amt, batchId:b.id});
      };
      // 新版：手動指定多筆批次各自的天數
      if(Array.isArray(r.sourceAllocations) && r.sourceAllocations.length){
        r.sourceAllocations.forEach(alloc=>{
          if(!alloc || !alloc.id) return;
          pinnedIds.add(alloc.id);
          if(toDeduct<=0) return;
          const pinned = batches.find(b=>b.id===alloc.id);
          if(pinned && pinned.remainDays>0){
            const want = (alloc.days!=null && alloc.days>0) ? Math.min(alloc.days, pinned.remainDays, toDeduct) : Math.min(pinned.remainDays, toDeduct);
            takeFrom(pinned, want);
            toDeduct -= want;
          }
        });
      }
      // 舊版：手動指定單一批次優先扣（相容舊資料）
      else if(r.sourceEarnId){
        pinnedIds.add(r.sourceEarnId);
        const pinned = batches.find(b=>b.id===r.sourceEarnId);
        if(pinned && pinned.remainDays>0){
          const take = Math.min(pinned.remainDays, toDeduct);
          takeFrom(pinned, take);
          toDeduct -= take;
        }
      }
      // 指定批次扣不夠（或沒有指定）的部分，自動接回先進先出，從最早的開始補
      // 第一階段：優先從「沒被指定過」的批次補，這樣才符合「只指定扣一部分、故意留一部分」的預期
      for(const b of batches){
        if(toDeduct<=0) break;
        if(pinnedIds.has(b.id)) continue;
        if(b.remainDays<=0) continue;
        const take = Math.min(b.remainDays, toDeduct);
        takeFrom(b, take);
        toDeduct -= take;
      }
      // 第二階段：如果沒被指定的批次全部用完還是不夠，代表真的需要動用「已指定但還有剩」的批次，
      // 這時候不該再放著不用害系統誤判成餘額不足，改回去繼續照日期先後補（不然總量會對不起來，參見一致性檢查）
      if(toDeduct>0){
        for(const b of batches){
          if(toDeduct<=0) break;
          if(b.remainDays<=0) continue;
          const take = Math.min(b.remainDays, toDeduct);
          takeFrom(b, take);
          toDeduct -= take;
        }
      }
      // 若扣抵量超過目前所有獲得批次總和（理論上不該發生），超出的部分忽略，不影響到期提醒
      if(useLog.length) breakdown[r.id] = useLog;
    }
  });
  return { batches, breakdown };
}
function compFifoRemaining(category, excludeId){
  return _compFifoCore(category, excludeId).batches;
}
// 給歷史紀錄畫面用：查某一筆使用紀錄實際扣了哪幾批、各扣多少（不管是手動指定還是自動判斷）
function compUsageBreakdown(category, useRecordId){
  return _compFifoCore(category, null).breakdown[useRecordId] || [];
}

// ---- 補休/換休一致性檢查 ----
// 目前結餘實際上有兩套算法：compBalanceAsOf（簡單加總，總獲得-總使用）跟 compFifoRemaining（依批次先進先出）。
// 正常情況下兩邊加總應該要相等；如果不相等，最可能的原因是「使用量超過獲得量」（超扣），
// FIFO那邊扣過頭會停在0不會變負數，但簡單加總會誠實顯示負數，兩邊才會兜不起來。
// 這裡只做「發現了就記一筆錯誤紀錄」，不會跳出來打擾使用者，也不會改動任何現有的計算或畫面。
function checkCompLedgerConsistency(){
  try{
    ['comp','exchange'].forEach(category=>{
      const fifoTotal = compFifoRemaining(category).reduce((s,b)=> s + Math.max(0, b.remainDays), 0);
      const simpleTotal = compBalanceAsOf(category, '9999-12-31', null); // 涵蓋所有年度的全時段簡單加總
      const diff = Math.abs(fifoTotal - simpleTotal);
      if(diff > 0.01){
        const label = category==='comp' ? '補休' : '換休';
        console.warn(`[一致性檢查] ${label}結餘不一致：FIFO加總=${fifoTotal}，簡單加總=${simpleTotal}`);
        logAppError(
          `${label}結餘計算不一致`,
          `FIFO加總＝${fmt(fifoTotal)} 天，簡單加總＝${fmt(simpleTotal)} 天，差異＝${fmt(diff)} 天。最可能是使用量超過獲得量（超扣）造成的，可以去「假別紀錄」檢查${label}紀錄有沒有登記錯誤。`
        );
      }
    });
  }catch(e){ console.error('一致性檢查本身發生錯誤', e); }
}
function computeUsePreviewHtml(category, amount, unit, pins, excludeId){
  if(!amount || amount<=0) return '';
  // 向下相容：舊呼叫方式傳入單一字串id（代表「優先扣這批，不夠自動接續」），統一轉成陣列格式處理
  if(typeof pins === 'string'){ pins = pins ? [{id:pins, days:null}] : []; }
  if(!Array.isArray(pins)) pins = [];
  pins = pins.filter(p=>p && p.id);
  const days = unit==='hour' ? amount/getHoursPerDay() : amount;
  const info = COMP_CATEGORIES[category];
  const batches = compFifoRemaining(category, excludeId).filter(b=>b.remainDays>0.0001);
  let toDeduct = days;
  const consumed = [];
  const pinnedIds = new Set(pins.map(p=>p.id));
  const skippedPins = []; // 記錄「有勾選、有填天數，但因為前面已經滿足需求而完全沒用到」的批次，之後要明確警告使用者
  pins.forEach(pin=>{
    const pinned = batches.find(b=>b.id===pin.id);
    if(toDeduct<=0.0001){
      if(pinned && pin.days!=null && pin.days>0) skippedPins.push(pinned);
      return;
    }
    if(!pinned || pinned.remainDays<=0.0001) return;
    // 有明確指定天數的話用指定的（但不能超過該批剩餘量、也不能超過還需要的量）；沒指定天數則沿用舊邏輯：這批盡量扣、扣到滿足需求為止
    const want = (pin.days!=null && pin.days>0) ? Math.min(pin.days, pinned.remainDays, toDeduct) : Math.min(pinned.remainDays, toDeduct);
    if(want>0.0001){
      consumed.push({date:pinned.date, note:pinned.note, take:want, remainAfter: pinned.remainDays-want, pinned:true, _id:pinned.id});
      pinned.remainDays -= want;
      toDeduct -= want;
    }
  });
  for(const b of batches){
    if(toDeduct<=0.0001) break;
    if(pinnedIds.has(b.id)) continue;
    const take = Math.min(b.remainDays, toDeduct);
    if(take>0.0001){
      consumed.push({date:b.date, note:b.note, take, remainAfter: b.remainDays-take, pinned:false});
      b.remainDays -= take;
      toDeduct -= take;
    }
  }
  // 第二階段：沒被指定的批次都不夠補的話，回頭動用「已指定但還有剩」的批次繼續補，
  // 邏輯要跟compFifoRemaining一致，不然預覽畫面看到的結果會跟實際存檔後不一樣
  if(toDeduct>0.0001){
    for(const b of batches){
      if(toDeduct<=0.0001) break;
      if(b.remainDays<=0.0001) continue;
      const take = Math.min(b.remainDays, toDeduct);
      if(take>0.0001){
        const existing = consumed.find(c=>c._id===b.id);
        b.remainDays -= take;
        toDeduct -= take;
        if(existing){ existing.take += take; existing.remainAfter = b.remainDays; }
        else { consumed.push({date:b.date, note:b.note, take, remainAfter: b.remainDays, pinned:true, _id:b.id}); }
      }
    }
  }
  let html = '<div class="use-preview-box">';
  if(consumed.length===0){
    html += `<p class="hint" style="color:var(--brick);margin:0;">⚠️ 目前沒有可扣的${info.label}結餘，這筆送出後結餘會變負數。</p>`;
  } else {
    html += `<p class="hint" style="margin:0 0 6px;font-weight:700;color:var(--ink);">這筆會${pins.length?'先扣你指定的那幾筆，不夠再':'自動'}扣最早獲得的那幾筆：</p>`;
    html += consumed.map(c=>`<div class="use-preview-line">${c.pinned?'⭐ ':''}${toROC(c.date)}${c.note?`（${escapeHtml(c.note)}）`:''}　－${fmt(c.take)} 天，扣完後這筆還剩 ${fmt(c.remainAfter)} 天</div>`).join('');
    if(toDeduct>0.0001){
      html += `<p class="hint" style="color:var(--brick);margin:6px 0 0;">⚠️ 現有結餘不夠扣，還缺 ${fmt(toDeduct)} 天，這筆送出後結餘會變負數。</p>`;
    }
  }
  html += '</div>';
  let skipHtml = '';
  if(skippedPins.length){
    // 這裡故意不做escapeHtml：這段文字之後在畫面上一律用textContent顯示（瀏覽器會自動安全處理），
    // 若在這裡先跳脫，交給textContent顯示時反而會把跳脫符號字面顯示出來
    const skippedList = skippedPins.map(b=>`${toROC(b.date)}${b.note?`（${b.note}）`:''}`).join('、');
    skipHtml = `⚠️ 已選超過需求，未用到：${skippedList}`;
  }
  return { previewHtml: html, skipHtml };
}

function gatherCompSrcPins(listElId, hoursPerDay){
  const pins = [];
  const listEl = document.getElementById(listElId);
  if(!listEl) return pins;
  const hpd = hoursPerDay || getHoursPerDay();
  listEl.querySelectorAll('.src-batch-row').forEach(row=>{
    const cb = row.querySelector('input[type="checkbox"]');
    if(cb && cb.checked){
      const hoursInput = row.querySelector('.src-batch-days');
      const raw = hoursInput && hoursInput.value !== '' ? parseFloat(hoursInput.value) : null;
      // 批次清單一律用「小時」輸入，這裡統一換算回天數存起來，內部一律用天數運算
      const days = (raw!=null && raw>0) ? raw/hpd : null;
      pins.push({ id: row.dataset.batchId, days });
    }
  });
  return pins;
}
function onCompSrcRowToggle(checkboxEl, category){
  const row = checkboxEl.closest('.src-batch-row');
  if(!row) return;
  const wrap = row.querySelector('.src-batch-input-wrap');
  const hoursInput = row.querySelector('.src-batch-days');
  const listEl = row.closest('.src-batch-list');
  let isEdit = false, editId = null;
  if(listEl && listEl.id.indexOf('editCompSrcBatchList-')===0){
    isEdit = true;
    editId = listEl.id.slice('editCompSrcBatchList-'.length);
  }
  if(checkboxEl.checked){
    if(wrap) wrap.style.display = '';
    if(hoursInput && !hoursInput.value){
      const remainDays = parseFloat(row.dataset.batchRemain)||0; // 這個一律是天數，換算成小時填入預設值
      if(remainDays>0) hoursInput.value = fmt(remainDays*getHoursPerDay());
    }
  } else {
    if(wrap) wrap.style.display = 'none';
    if(hoursInput) hoursInput.value = '';
  }
  if(isEdit){ updateEditUsePreview(editId, category); } else { updateUsePreview(category); }
}
function resetCompSrcBatchList(listElId){
  const listEl = document.getElementById(listElId);
  if(!listEl) return;
  listEl.querySelectorAll('input[type="checkbox"]').forEach(c=>{ c.checked = false; });
  listEl.querySelectorAll('.src-batch-input-wrap').forEach(w=>{ w.style.display='none'; });
  listEl.querySelectorAll('.src-batch-days').forEach(d=>{ d.value=''; });
}

function updateSelectSummaryBar(barId, manualOn, pins, amount, unit){
  const bar = document.getElementById(barId);
  if(!bar) return;
  if(!manualOn || !amount || amount<=0){ bar.style.display = 'none'; return; }
  const hpd = getHoursPerDay();
  const neededHours = unit==='hour' ? amount : amount*hpd;
  const selectedHours = pins.reduce((s,p)=> s + (p.days!=null ? p.days*hpd : 0), 0);
  bar.style.display = 'flex';
  bar.classList.toggle('ssb-ok', selectedHours >= neededHours - 0.001);
  bar.innerHTML = `<span>已選 ${fmt(selectedHours)} 小時</span><span class="ssb-need">需要 ${fmt(neededHours)} 小時</span>`;
}
function updateUsePreview(category){
  const previewEl = document.getElementById('usePreview');
  const wrapEl = document.getElementById('manualSourceWrap');
  const expiryWrapEl = document.getElementById('compExpiryWrap');
  const skipEl = document.getElementById('compSkipWarning');
  if(!previewEl) return;
  const typeEl = document.getElementById('compType');
  const isUse = typeEl && typeEl.value === 'use';
  if(wrapEl) wrapEl.style.display = isUse ? '' : 'none';
  if(expiryWrapEl) expiryWrapEl.style.display = isUse ? 'none' : '';
  if(!isUse){ previewEl.innerHTML = ''; if(skipEl) skipEl.style.display='none'; updateSelectSummaryBar('compSelectSummary', false, [], 0, 'day'); return; }
  const amountEl = document.getElementById('compAmount');
  const unitEl = document.getElementById('compUnit');
  const amount = parseFloat(amountEl && amountEl.value);
  const unit = unitEl ? unitEl.value : 'day';
  const manualOn = document.getElementById('compManualToggle');
  const isManualOn = !!(manualOn && manualOn.checked);
  const pins = isManualOn ? gatherCompSrcPins('compSrcBatchList') : [];
  const result = computeUsePreviewHtml(category, amount, unit, pins, null);
  previewEl.innerHTML = result.previewHtml;
  if(skipEl){
    if(result.skipHtml){ skipEl.style.display = ''; skipEl.textContent = result.skipHtml; }
    else { skipEl.style.display = 'none'; }
  }
  updateSelectSummaryBar('compSelectSummary', isManualOn, pins, amount, unit);
}

const COMP_CATEGORIES = {

};

function stampCard(t){
  const remain = remainOf(t.key, selectedYear);
  const quota = getQuota(t.key, selectedYear);
  const used = quota - remain;
  // 三段式顏色分級：安全(不特別標色) / 用到70%~90%轉黃 / 用到90%以上或已超額轉紅
  let level = '';
  if(remain < 0){ level = 'level-danger'; }
  else if(quota > 0){
    const usedRatio = used / quota;
    if(usedRatio >= 0.9) level = 'level-danger';
    else if(usedRatio >= 0.7) level = 'level-warn';
  }
  const chips = [];
  if(t.key==='sick'){
    const excess = menstrualExcess(selectedYear);
    if(excess>0) chips.push(`<span class="mini-chip" style="background:var(--rose-soft);color:var(--rose);">生理假併入 ${fmt(excess)}天</span>`);
    if(remain<0) chips.push(`<span class="mini-chip" style="background:var(--brick-soft);color:var(--brick);">超額 ${fmt(-remain)}天，需擇一抵銷</span>`);
  }
  if(t.key==='personal'){
    const fc = usedOf('familyCare', selectedYear);
    if(fc>0) chips.push(`<span class="mini-chip" style="background:var(--plum-soft);color:var(--plum);">家照併入 ${fmt(fc)}天</span>`);
    const paid = personalPaidUsed(selectedYear), unpaid = personalUnpaidUsed(selectedYear);
    if(paid>0) chips.push(`<span class="mini-chip" style="background:var(--jade-soft);color:var(--jade);">💰有薪 ${fmt(paid)}天</span>`);
    if(unpaid>0) chips.push(`<span class="mini-chip" style="background:var(--brick-soft);color:var(--brick);">無薪 ${fmt(unpaid)}天</span>`);
  }
  return `
    <div class="stamp-card ${level}" style="box-shadow:0 10px 24px -10px color-mix(in srgb, var(--${t.c}) 45%, transparent);" onclick="viewLeaveDetail('${t.key}')">
      <div class="seal c-${t.c}">${t.seal}</div>
      <div class="label">${t.label}剩餘</div>
      <div class="num c-${t.c}">${fmt(remain)}天 <span class="hour-inline">${fmt(remain*getHoursPerDay())}小時</span><small>共 ${fmt(getQuota(t.key,selectedYear))} 天</small></div>
      ${chips.length? `<div class="mini-chips">${chips.join('')}</div>` : ''}
    </div>`;
}

const DATE_TOKEN_RE = '(?:今天|今日|明天|明日|昨天|昨日|\\d{1,4}[\\/\\-]\\d{1,2}[\\/\\-]\\d{1,2}|\\d{1,2}[\\/\\-]\\d{1,2}|\\d{1,2}月\\d{1,2}日?)';
// 給日期區間用，只認斜線格式的日期，避免跟區間用的「-」混在一起分不清
const DATE_SLASH_RE = '(?:\\d{1,4}\\/\\d{1,2}\\/\\d{1,2}|\\d{1,2}\\/\\d{1,2})';
function numOrCn(tok){
  if(tok===undefined || tok===null) return NaN;
  if(CN_NUM_MAP[tok] !== undefined) return CN_NUM_MAP[tok];
  return parseFloat(tok);
}

function shiftDate(dateStr, deltaDays){
  const d = new Date(dateStr+'T00:00:00');
  d.setDate(d.getDate()+deltaDays);
  return isoDate(d.getFullYear(), d.getMonth()+1, d.getDate());
}

function parseDateToken(tok, contextYear){
  if(!tok) return null;
  tok = tok.trim();
  if(tok==='今天'||tok==='今日') return TODAY;
  if(tok==='明天'||tok==='明日') return shiftDate(TODAY,1);
  if(tok==='昨天'||tok==='昨日') return shiftDate(TODAY,-1);
  let m = tok.match(/^(\d{1,4})[\/\-](\d{1,2})[\/\-](\d{1,2})$/);
  if(m){
    let y = parseInt(m[1],10);
    if(y<200) y += 1911; // 民國年自動換算
    return isoDate(y, parseInt(m[2],10), parseInt(m[3],10));
  }
  m = tok.match(/^(\d{1,2})[\/\-](\d{1,2})$/);
  if(m){ return isoDate(contextYear, parseInt(m[1],10), parseInt(m[2],10)); }
  m = tok.match(/^(\d{1,2})月(\d{1,2})日?$/);
  if(m){ return isoDate(contextYear, parseInt(m[1],10), parseInt(m[2],10)); }
  return null;
}

function parseAmountToken(numTok, unitTok){
  if(numTok===undefined || numTok===null || numTok==='') return {amount:1, unit:'day'};
  if(numTok==='半天') return {amount:0.5, unit:'day'};
  if(numTok==='全天' || numTok==='整天') return {amount:1, unit:'day'};
  let amount = parseFloat(numTok);
  if(isNaN(amount) && CN_NUM_MAP[numTok] !== undefined) amount = CN_NUM_MAP[numTok];
  if(isNaN(amount)) return null;
  const unit = (unitTok==='H'||unitTok==='h'||unitTok==='小時') ? 'hour' : 'day';
  return {amount, unit};
}

function kwBuildFromRest(rest, defaultCompType, leaveKeywordPattern){
  let mm;
  // 加X補Y (備註) -> 補休獲得（固定2年）
  mm = rest.match(new RegExp(`^加\\s*${KW_NUM_OR_CN}\\s*補\\s*${KW_NUM_OR_CN}\\s*${KW_NOTE_TOKEN}$`));
  if(mm){
    const amount = numOrCn(mm[2]);
    if(isNaN(amount)) return null;
    return { kind:'comp', category:'comp', compType:'earn', unit:'day', amount, note:(mm[3]||'').trim() };
  }
  // 加X換Y (備註) -> 換休獲得（固定1年）
  mm = rest.match(new RegExp(`^加\\s*${KW_NUM_OR_CN}\\s*換\\s*${KW_NUM_OR_CN}\\s*${KW_NOTE_TOKEN}$`));
  if(mm){
    const amount = numOrCn(mm[2]);
    if(isNaN(amount)) return null;
    return { kind:'comp', category:'exchange', compType:'earn', unit:'day', amount, note:(mm[3]||'').trim() };
  }
  // (使用|用|獲得|得)? 補休/補 X(H/天/半天/全天) (備註) -> 補休（固定2年）
  mm = rest.match(new RegExp(`^(使用|用|獲得|得)?\\s*(?:補休|補)\\s*(?:${KW_AMOUNT_TOKEN}\\s*${KW_UNIT_TOKEN})?\\s*${KW_NOTE_TOKEN}$`));
  if(mm){
    const parsed = parseAmountToken(mm[2], mm[3]);
    if(!parsed) return null;
    let compType = defaultCompType;
    if(mm[1]==='使用' || mm[1]==='用') compType='use';
    else if(mm[1]==='獲得' || mm[1]==='得') compType='earn';
    return { kind:'comp', category:'comp', compType, unit:parsed.unit, amount:parsed.amount, note:(mm[4]||'').trim() };
  }
  // (使用|用|獲得|得)? 換休/換 X(H/天/半天/全天) (備註) -> 換休（固定1年）
  mm = rest.match(new RegExp(`^(使用|用|獲得|得)?\\s*(?:換休|換)\\s*(?:${KW_AMOUNT_TOKEN}\\s*${KW_UNIT_TOKEN})?\\s*${KW_NOTE_TOKEN}$`));
  if(mm){
    const parsed = parseAmountToken(mm[2], mm[3]);
    if(!parsed) return null;
    let compType = defaultCompType;
    if(mm[1]==='使用' || mm[1]==='用') compType='use';
    else if(mm[1]==='獲得' || mm[1]==='得') compType='earn';
    return { kind:'comp', category:'exchange', compType, unit:parsed.unit, amount:parsed.amount, note:(mm[4]||'').trim() };
  }
  // (請|使用|用)? <假別關鍵字> X(H/天/半天/全天) (備註)
  mm = rest.match(new RegExp(`^(請|使用|用)?\\s*(${leaveKeywordPattern})\\s*(?:${KW_AMOUNT_TOKEN}\\s*${KW_UNIT_TOKEN})?\\s*${KW_NOTE_TOKEN}$`));
  if(mm){
    const mapEntry = KEYWORD_LEAVE_MAP.find(k=> new RegExp('^(?:'+k.re+')$').test(mm[2]));
    const parsed = parseAmountToken(mm[3], mm[4]);
    if(!parsed || !mapEntry) return null;
    return { kind:'leave', leaveKey: mapEntry.key, leaveLabel: mapEntry.label, unit:parsed.unit, amount:parsed.amount, note:(mm[5]||'').trim() };
  }
  return null;
}

function parseKeywordLines(text, defaultCompType){
  const items = [];
  const unmatched = [];
  const rawLines = text.split('\n').map(l=>l.replace(/[\s\u3000]+/g,' ').trim());
  const leaveKeywordPattern = KEYWORD_LEAVE_MAP.map(k=>k.re).join('|');

  rawLines.forEach(line=>{
    if(!line) return;
    if(/^(#|\/\/|、)/.test(line)) return; // 忽略註解／項目符號行

    let m;

    // A) 日期區間：M/D~M/D 或 M/D-M/D <內容> -> 展開成每天一筆（有沒有空格都可以）
    m = line.match(new RegExp(`^(${DATE_TOKEN_RE})\\s*[~～]\\s*(${DATE_TOKEN_RE})\\s*(.+)$`))
      || line.match(new RegExp(`^(${DATE_SLASH_RE})-(${DATE_SLASH_RE})\\s*(.+)$`));
    if(m){
      const d1 = parseDateToken(m[1], selectedYear);
      let d2 = parseDateToken(m[2], selectedYear);
      if(d1 && d2){
        // 若結束日期比開始日期早，視為跨年（例如 12/30-1/2），結束日期年份自動+1
        if(new Date(d2+'T00:00:00').getTime() < new Date(d1+'T00:00:00').getTime()){
          const d2Parts = d2.split('-');
          d2 = isoDate(parseInt(d2Parts[0],10)+1, parseInt(d2Parts[1],10), parseInt(d2Parts[2],10));
        }
        const built = kwBuildFromRest(m[3].trim(), defaultCompType, leaveKeywordPattern);
        if(built){
          let cur = d1, guard = 0;
          const endTime = new Date(d2+'T00:00:00').getTime();
          while(new Date(cur+'T00:00:00').getTime() <= endTime && guard < 62){
            items.push(Object.assign({}, built, { date: cur, raw: line }));
            cur = shiftDate(cur, 1);
            guard++;
          }
          return;
        }
      }
    }

    // B) 單一日期開頭：<日期><其餘內容>，日期後面有沒有空格都可以
    m = line.match(new RegExp(`^(${DATE_TOKEN_RE})\\s*(.+)$`));
    if(m){
      const d = parseDateToken(m[1], selectedYear);
      if(d){
        const built = kwBuildFromRest(m[2].trim(), defaultCompType, leaveKeywordPattern);
        if(built){ items.push(Object.assign({}, built, { date: d, raw: line })); return; }
      }
    }

    // C) 假別總天數設定：特休/年假/病假/事假/家庭照顧假/身心照顧假 [原]X [剩Y]
    m = line.match(new RegExp(`^(${leaveKeywordPattern})\\s*(?:原)?\\s*([\\d.]+)\\s*(?:剩\\s*([\\d.]+))?\\s*$`));
    if(m){
      const mapEntry = KEYWORD_LEAVE_MAP.find(k=> new RegExp('^(?:'+k.re+')$').test(m[1]));
      items.push({ kind:'quota', quotaKey: mapEntry.key, quotaLabel: mapEntry.label,
        total: parseFloat(m[2]), remain: m[3]!==undefined ? parseFloat(m[3]) : null, raw: line });
      return;
    }

    unmatched.push(line);
  });

  return { items, unmatched };
}

function compExpiryReminders(){
  const todayD = new Date(TODAY);
  const result = [];
  ['comp','exchange'].forEach(category=>{
    compFifoRemaining(category).forEach(b=>{
      if(!b.expiry || b.remainDays<=0.001) return; // 沒有到期日、或這筆已經被用完了，不用提醒
      const diffDays = Math.round((new Date(b.expiry) - todayD)/86400000);
      if(diffDays <= 90) result.push(Object.assign({}, b, {category, diffDays}));
    });
  });
  return result.sort((a,b)=> a.diffDays-b.diffDays);
}

function reminderBanner(){
  const list = compExpiryReminders();
  const compHtml = list.length? (()=>{
    const hasUrgent = list.some(r=>r.diffDays<=7);
    const items = list.map(r=>{
      const statusTxt = r.diffDays < 0 ? `已過期 ${Math.abs(r.diffDays)} 天` : (r.diffDays===0? '今天到期' : `${r.diffDays} 天後到期`);
      const catLabel = COMP_CATEGORIES[r.category||'comp'].label;
      const lineClass = r.diffDays<=7 ? 'urgent-line' : '';
      return `<span class="${lineClass}">${toROC(r.date)} 獲得的 ${fmt(r.remainDays)} 天${catLabel}（尚未用完的部分），到期日 ${toROC(r.expiry)}（${statusTxt}）</span>`;
    }).join('<br>');
    return `<div class="reminder-bar${hasUrgent?' reminder-urgent':''}"><strong>⚠️ 補休／換休到期提醒</strong>${items}</div>`;
  })() : '';

  const month = NOW.getMonth()+1;
  const annualUsed = usedOf('annual', CUR_YEAR);
  const annualMin = getAnnualMinDays();
  const shortfall = annualMin - annualUsed;
  const daysLeftInYear = Math.round((new Date(CUR_YEAR,11,31) - new Date(TODAY+'T00:00:00')) / 86400000);
  const annualHtml = (month>=10 && shortfall>0) ? (()=>{
    const urgent = daysLeftInYear <= 30;
    return `<div class="reminder-bar${urgent?' reminder-urgent':''}"><strong>🌴 特休最低使用天數提醒</strong>今年（${CUR_YEAR}）特休已使用 ${fmt(annualUsed)} 天，未達最低要求 ${fmt(annualMin)} 天，尚需再休 ${fmt(shortfall)} 天，建議儘早排定（可在「設定」分頁調整門檻）。</div>`;
  })() : '';

  return compHtml + annualHtml;
}

function calendarPanel(){
  if(!calendarMode) return '';
  const y = calYear, m = calMonth;
  ensureHolidayYear(y); // 不等待，資料回來時會自動重新渲染
  const holidays = (holidayCache[y] && typeof holidayCache[y]==='object') ? holidayCache[y] : null;
  const firstDay = new Date(y, m-1, 1);
  const startWeekday = firstDay.getDay();
  const daysInMonth = new Date(y, m, 0).getDate();
  const dayMap = {};
  const ymPrefix = `${y}-${String(m).padStart(2,'0')}`;
  LEAVE_TYPES.forEach(t=>{
    (state.records[t.key]||[]).forEach(r=>{
      if(r.date.startsWith(ymPrefix)){
        const d = parseInt(r.date.slice(8,10),10);
        if(!dayMap[d]) dayMap[d]=[];
        dayMap[d].push({kind:'leave', key:t.key, id:r.id, seal:t.label.slice(0,2), wide:true, c:t.c, label:`${t.label} ${displayAmount(r)}${r.note? '：'+r.note:''}`});
      }
    });
  });
  state.compRecords.forEach(r=>{
    if(r.date.startsWith(ymPrefix)){
      const d = parseInt(r.date.slice(8,10),10);
      if(!dayMap[d]) dayMap[d]=[];
      const cat = r.category||'comp';
      const info = COMP_CATEGORIES[cat];
      const sign = r.type==='earn' ? '+' : '－';
      dayMap[d].push({kind:'comp', key:cat, id:r.id, seal:sign+info.label, wide:true, c:info.c, label:`${info.label}${r.type==='earn'?'獲得':'使用'} ${displayAmount(r)}${r.note? '：'+r.note:''}`});
    }
  });
  let cells = '';
  const prevMonthDays = new Date(y, m-1, 0).getDate();
  for(let i=0;i<startWeekday;i++){
    const dayNum = prevMonthDays - startWeekday + 1 + i;
    cells += `<div class="cal-cell adjacent"><div class="cal-daynum">${dayNum}</div></div>`;
  }
  const monthUsage = {}; // key -> 天數，給月摘要用
  for(let d=1; d<=daysInMonth; d++){
    const items = dayMap[d]||[];
    const dots = items.map(it=>`<span class="cal-dot ${it.wide?'cal-dot-wide':''} c-${it.c}-bg">${it.seal}</span>`).join('');
    const dateStr = `${y}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const isToday = (dateStr===TODAY);
    const isSelected = (dateStr===calSelectedDate);
    const weekday = (startWeekday + d - 1) % 7;
    const isWeekend = weekday===0 || weekday===6;
    const h = holidays ? holidays[dateStr] : null;
    const isNamedHoliday = h && h.isHoliday && h.description; // 只標「有名字」的假日（國定假日/補假等），週六日本來就看得出來，不特別標
    const isMakeupWorkday = h && h.isHoliday===false && h.description; // 例如「補行上班」：本來是假日但這天要上班
    const daynumClass = isNamedHoliday ? 'holiday' : '';
    const weekendClass = (isWeekend && !isMakeupWorkday) ? 'weekend' : '';
    const holidayBgClass = isNamedHoliday ? 'holiday-bg' : '';
    const makeupBadge = isMakeupWorkday ? `<span class="cal-makeup-badge">班</span>` : '';
    cells += `<div class="cal-cell ${isToday?'today':''} ${isSelected?'selected':''} ${weekendClass} ${holidayBgClass}" onclick="selectCalDay('${dateStr}')"><div class="cal-daynum ${daynumClass}">${d}${isNamedHoliday?'<span class="cal-holiday-dot"></span>':''}${makeupBadge}</div><div class="cal-dots">${dots}</div></div>`;
  }
  const trailingCount = (7 - ((startWeekday + daysInMonth) % 7)) % 7;
  for(let i=1;i<=trailingCount;i++){
    cells += `<div class="cal-cell adjacent"><div class="cal-daynum">${i}</div></div>`;
  }

}

function statsChart(){
  if(!chartMode) return '';
  const y = selectedYear;
  const monthTotals = Array(12).fill(0).map(()=> ({}));
  LEAVE_TYPES.forEach(t=>{
    (state.records[t.key]||[]).forEach(r=>{
      if(r.date.startsWith(String(y))){
        const mIdx = parseInt(r.date.slice(5,7),10)-1;
        monthTotals[mIdx][t.key] = (monthTotals[mIdx][t.key]||0) + toDays(r);
      }
    });
  });
  state.compRecords.filter(r=>r.type==='use' && r.date.startsWith(String(y))).forEach(r=>{
    const mIdx = parseInt(r.date.slice(5,7),10)-1;
    const cat = r.category||'comp';
    monthTotals[mIdx][cat] = (monthTotals[mIdx][cat]||0) + toDays(r);
  });
  const maxVal = Math.max(1, ...monthTotals.map(m=> Object.values(m).reduce((s,v)=>s+v,0)));
  const TRACK_H = 130;
  const typeList = LEAVE_TYPES.concat([{key:'comp', c:'brick', label:'補休使用'}, {key:'exchange', c:'teal', label:'換休使用'}]);
  const bars = monthTotals.map((m,i)=>{
    const total = Object.values(m).reduce((s,v)=>s+v,0);
    const segments = typeList.map(t=>{
      const v = m[t.key]||0;
      if(v<=0) return '';
      const px = Math.max(2, Math.round(v/maxVal*TRACK_H));
      return `<div class="chart-seg c-${t.c}-bg" style="height:${px}px" title="${t.label} ${fmt(v)}天"></div>`;
    }).join('');
    const isActiveMonth = calendarMode && calYear===y && (i+1)===calMonth;
    return `<div class="chart-col ${isActiveMonth?'chart-col-active':''}" onclick="jumpToCalMonth(${y},${i+1})">
      <div class="chart-bar-track">${segments}</div>
      <div class="chart-label">${i+1}月</div>
      <div class="chart-total">${total>0?fmt(total):''}</div>
    </div>`;
  }).join('');
  return `
    <div class="block">
      <h2><span class="dot dot-jade"></span>${y} 年度統計圖</h2>
      <div class="chart-wrap">${bars}</div>
      <div class="chart-legend">
        ${LEAVE_TYPES.map(t=>`<span class="legend-item"><span class="legend-dot c-${t.c}-bg"></span>${t.label}</span>`).join('')}
        <span class="legend-item"><span class="legend-dot c-brick-bg"></span>補休使用</span>
      </div>
    </div>`;
}

function renderAvailBatchList(category){
  const info = COMP_CATEGORIES[category];
  const todayD = new Date(TODAY);
  const batches = compFifoRemaining(category)
    .filter(b=>b.remainDays>0.0001)
    .map(b=>Object.assign({}, b, {diffDays: b.expiry ? Math.round((new Date(b.expiry)-todayD)/86400000) : null}))
    .sort((a,b)=>{
      if(a.diffDays===null && b.diffDays===null) return a.date.localeCompare(b.date);
      if(a.diffDays===null) return 1;
      if(b.diffDays===null) return -1;
      return a.diffDays-b.diffDays;
    });
  if(batches.length===0){
    return `<div class="hint" style="margin-bottom:12px;">目前沒有還能使用的${info.label}紀錄。</div>`;
  }
  return `<div class="avail-batch-list">${batches.map(b=>{
    const urgent = b.diffDays!==null && b.diffDays<=7;
    const expiryTxt = b.diffDays===null ? '' : (b.diffDays<0? `已過期 ${Math.abs(b.diffDays)} 天` : (b.diffDays===0?'今天到期':`${b.diffDays} 天後到期`));
    return `<div class="avail-batch-item">
      <div class="avail-batch-title">${toROC(b.date)}${b.note?`（${escapeHtml(b.note)}）`:''}${b.photoUrl?` <span class="photo-badge" onclick="window.open('${escapeAttr(b.photoUrl)}','_blank')">📷 附件</span>`:''}</div>
      <div class="avail-batch-remain">剩 ${fmt(b.remainDays)} 天<span class="avail-batch-hours">（${fmt(b.remainDays*getHoursPerDay())} 小時）</span></div>
      ${b.expiry? `<div class="avail-batch-expiry" style="color:${urgent?'var(--brick)':'var(--amber)'};">⏳ 到期 ${toROC(b.expiry)}（${expiryTxt}）</div>` : ''}
    </div>`;
  }).join('')}</div>`;
}

function compSectionHtml(category){
  category = category || 'comp';
  const info = COMP_CATEGORIES[category];
  const allComp = state.compRecords.filter(r=>r.date.startsWith(String(selectedYear)) && (r.category||'comp')===category);
  let compRows = allComp.filter(r=>matchesSearch(r.date, r.note, info.label, r.type==='earn'?'獲得':'使用'));
  compRows.sort((a,b)=> sortAsc ? a.date.localeCompare(b.date) : b.date.localeCompare(a.date));
  const compEmptyMsg = allComp.length===0 ? `${selectedYear} 年尚無${info.label}紀錄，可以點上方「＋新增一筆」登記第一筆 👆` : '查無符合搜尋的紀錄';
  const dMin = isoDate(CUR_YEAR-5,1,1), dMax = yearMax(CUR_YEAR+1), dDef = defaultDateFor(selectedYear);
  const forceExpand = (groupRows)=> editing && editing.kind==='comp' && groupRows.some(r=>r.id===editing.id);
  const totalFn = (groupRows)=>{
    const net = groupRows.reduce((s,r)=> s + (r.type==='earn'? toDays(r): -toDays(r)), 0);
    return `${groupRows.length} 筆・淨 ${net>=0?'+':''}${fmt(net)} 天`;
  };
  const listHtml = renderMonthGroups(category, compRows, compEmptyMsg, r=>buildCompLi(r,dMin,dMax,category), totalFn, forceExpand);
  const curBalance = compBalanceUpTo(selectedYear, category);
  const nearestExpiry = compFifoRemaining(category)
    .filter(b=>b.expiry && b.remainDays>0.001)
    .map(b=>Object.assign({}, b, {diffDays: Math.round((new Date(b.expiry) - new Date(TODAY))/86400000)}))
    .sort((a,b)=>a.diffDays-b.diffDays)[0];
  return `
    <section class="block">
      <h2><span class="dot dot-${info.c}"></span>${info.label}<button type="button" class="info-icon-btn" onclick="toggleInfoHint('${category}')" title="說明">ⓘ</button></h2>
      ${infoHintExpanded[category] ? `<div class="hint" style="margin-bottom:10px;">可選擇用「天」或「小時」登記，換算比例為 1 天 = ${getHoursPerDay()} 小時（可在「設定」分頁調整）。${info.label}期限固定為 ${info.defaultYears} 年。</div>` : ''}

      <div class="overview-panel">
        <div class="overview-balance">截至 ${selectedYear} 年底結餘：<strong>${fmt(curBalance)} 天</strong><span class="avail-batch-hours">（${fmt(curBalance*getHoursPerDay())} 小時）</span></div>
        ${nearestExpiry ? (()=>{
          const isUrgent = nearestExpiry.diffDays<=90;
          const color = nearestExpiry.diffDays<=7 ? 'var(--brick)' : (isUrgent ? 'var(--amber)' : 'var(--ink)');
          const countdown = nearestExpiry.diffDays<0?`已過期 ${Math.abs(nearestExpiry.diffDays)} 天`:(nearestExpiry.diffDays===0?'今天到期':`${nearestExpiry.diffDays} 天後到期`);
          return `<div class="overview-expiry" style="margin-top:6px;font-size:14.5px;">⏳ 最近到期：<strong style="color:${color};">${toROC(nearestExpiry.expiry)}</strong><span class="avail-batch-hours" style="margin-left:4px;">（${countdown}）</span></div>`;
        })() : ''}
        <div class="avail-batch-list-label">🗂️ 還沒用完的紀錄</div>
        ${renderAvailBatchList(category)}
      </div>

      <button type="button" class="btn-${info.c}" style="margin-bottom:14px;" onclick="openAddRecord('${category}')">＋ 新增一筆</button>
      <div class="history-divider"><span>📖 以下是 <button type="button" class="divider-year-btn" onclick="changeYear(-1)" aria-label="上一年">‹</button><span class="divider-year-num">${selectedYear}</span><button type="button" class="divider-year-btn" onclick="changeYear(1)" aria-label="下一年">›</button> 年的歷史紀錄</span></div>
      ${listHtml}
      <div style="margin-top:16px;">
        <button type="button" class="ghost" onclick="toggleResetPanel('${category}')">${resetPanelOpen[category]?'▲ 收起':'⋯ 更多操作'}</button>
        ${resetPanelOpen[category] ? `
        <div class="reset-row">
          <span class="reset-label">清除紀錄：</span>
          <select id="compResetScope">
            <option value="day">指定某天</option>
            <option value="month">指定某月</option>
            <option value="year">指定某年</option>
            <option value="all">全部</option>
          </select>
          <button class="danger-btn" onclick="resetRecords(document.getElementById('compResetScope').value, '${category}')">重置</button>
        </div>
        ` : ''}
      </div>
    </section>
`;
}

function bottomNav(){
  const items = [
    {key:'home', icon:'🏠', label:'首頁'},
    {key:'viz', icon:'📅', label:'行事曆'},

    {key:'data', icon:'⚙️', label:'設定'}
  ];
  const effectiveActive = activePage==='addRecord' ? 'leaves' : activePage;
  return `
    <nav class="bottom-nav">
      ${items.map(it=>`
        <button type="button" class="nav-item ${effectiveActive===it.key?'active':''}" onclick="switchPage('${it.key}')">

          <span class="nav-label">${it.label}</span>
        </button>`).join('')}

}

function render(){
  expiryTouched = false;

  const isPageChange = lastRenderedPage !== activePage;
  lastRenderedPage = activePage;

  let pageContent = '';
  let pageTitle = '假期存摺';
  if(activePage==='home'){ pageContent = pageHome(isPageChange); }
  else if(activePage==='leaves'){ pageContent = pageLeaves(); pageTitle = '假別紀錄'; }
  else if(activePage==='viz'){ pageContent = pageViz(); pageTitle = '行事曆'; }
  else if(activePage==='quick'){ pageContent = pageQuickInput(); pageTitle = '快速輸入'; }
  else if(activePage==='data'){ pageContent = pageData(); pageTitle = '資料管理'; }
  else if(activePage==='addRecord'){ pageContent = pageAddRecord(); pageTitle = '新增紀錄'; }

  document.getElementById('app').innerHTML = `
    <header>
      <h1>${activePage==='home' ? '假期存摺' : pageTitle}</h1>
    </header>

    ${lastDeleted? `<div class="undo-bar"><span>已刪除：${escapeHtml(lastDeleted.label)}</span><button onclick="undoDelete()">復原</button></div>` : ''}
    ${getResetSnapshot()? `<div class="undo-bar"><span>⚠️ 曾重置：${escapeHtml(getResetSnapshot().label)}（30分鐘內可復原）</span><button onclick="restoreResetSnapshot()">復原</button></div>` : ''}

    <div class="${isPageChange ? 'page-fade' : ''}">
      ${pageContent}
    </div>

    <div class="status" id="statusMsg" style="text-align:center;"></div>
  `;
  lastAddedId = null;
  document.getElementById('bottomNavHolder').innerHTML = bottomNav();
}

function setStatus(msg, ok){
  const el = document.getElementById('statusMsg');
  if(!el) return;
  el.textContent = msg;
  el.className = 'status ' + (ok? 'ok':'err');
  setTimeout(()=>{ if(el){ el.textContent=''; el.className='status'; } }, 6000);
}

function setDays(id,val){ const el=document.getElementById(id); if(el) el.value = val; }
function setDateQuick(id, offsetDays){
  const el = document.getElementById(id);
  if(!el) return;
  el.value = offsetDays===0 ? TODAY : shiftDate(TODAY, offsetDays);
}
function playRemoveAnimation(btnEl){
  return new Promise(resolve=>{
    const li = btnEl ? btnEl.closest('li') : null;
    if(!li){ resolve(); return; }
    li.classList.add('removing');
    setTimeout(resolve, 200);
  });
}

function toggleDateInputType(id){
  const el = document.getElementById(id);
  if(!el) return;
  if(el.type === 'date'){
    el.type = 'text';
    el.removeAttribute('pattern');
    el.placeholder = '例：7/23、115/7/23、2026-07-23';
    el.value = '';
    el.focus();
  } else {
    el.type = 'date';
  }
}

function toggleCalendar(){
  calendarMode = !calendarMode;
  if(calendarMode){ calYear = selectedYear; calMonth = (selectedYear===CUR_YEAR)? NOW.getMonth()+1 : 1; }

function changeCalMonth(delta){
  calMonth += delta;
  if(calMonth<1){ calMonth=12; calYear--; }
  if(calMonth>12){ calMonth=1; calYear++; }
  render();
}
function jumpToToday(){
  calYear = CUR_YEAR;
  calMonth = NOW.getMonth()+1;
  render();
}
let calTouchStartX = null;
let calTouchStartY = null;
function calTouchStart(e){
  if(!e.touches || !e.touches[0]) return;
  calTouchStartX = e.touches[0].clientX;
  calTouchStartY = e.touches[0].clientY;
}
function calTouchEnd(e){
  if(calTouchStartX===null || !e.changedTouches || !e.changedTouches[0]) return;
  const endX = e.changedTouches[0].clientX;
  const endY = e.changedTouches[0].clientY;
  const deltaX = endX - calTouchStartX;
  const deltaY = endY - calTouchStartY;
  calTouchStartX = null;
  calTouchStartY = null;
  // 橫向滑動幅度要明顯大於縱向，避免跟上下捲動衝突
  if(Math.abs(deltaX) > 50 && Math.abs(deltaX) > Math.abs(deltaY)*1.5){
    if(deltaX < 0) changeCalMonth(1); else changeCalMonth(-1);
  }
}
function toggleChart(){ chartMode = !chartMode; render(); }

async function addRecord(key, e){
  e.preventDefault();
  try{
    const date = parseFlexibleDate(document.getElementById(key+'Date').value);
    const unit = document.getElementById(key+'Unit').value;
    const amount = parseFloat(document.getElementById(key+'Amount').value);
    const note = document.getElementById(key+'Note').value.trim();
    if(!date || isNaN(amount) || amount<=0){ setStatus('請填寫日期與數量', false); return; }
    const daysEquiv = unit==='hour' ? amount/getHoursPerDay() : amount;
    const currentRemain = remainOf(key, selectedYear);
    if(currentRemain - daysEquiv < 0){
      const label = (LEAVE_TYPES.find(t=>t.key===key)||{}).label || '';
      if(!window.confirm(`這筆會超過可用的${label}天數（目前剩餘 ${fmt(currentRemain)} 天 ≈ ${fmt(currentRemain*getHoursPerDay())} 小時），仍要登記嗎？`)) return;
    }
    const id = uid();
    if(!state.records[key]) state.records[key]=[];
    state.records[key].push({ id, date, unit, amount, note });
    lastAddedId = id;
    state.lastUsedType = key;
    await saveState();
    setStatus('已登記使用', true);
    const tLabel = (LEAVE_TYPES.find(t=>t.key===key)||{}).label || '';
    finishAddWithConfirm(`已新增 ${displayAmount({unit,amount})}${tLabel}`);
  }catch(err){
    setStatus('儲存失敗：' + (err && err.message ? err.message : String(err)), false);
    console.error(err);
  }
}

async function saveEditRecord(key,id){
  try{
    const date = parseFlexibleDate(document.getElementById(`editDate-${key}-${id}`).value);
    const amount = parseFloat(document.getElementById(`editAmount-${key}-${id}`).value);
    const unit = document.getElementById(`editUnit-${key}-${id}`).value;
    const note = document.getElementById(`editNote-${key}-${id}`).value.trim();
    if(!date || isNaN(amount) || amount<=0){ setStatus('請填寫正確的日期與數量', false); return; }
    const arr = state.records[key] || [];
    const idx = arr.findIndex(r=>r.id===id);
    if(idx>-1){
      const updated = Object.assign({}, arr[idx], {date, unit, amount, note});
      delete updated.days;
      arr[idx] = updated;
    }
    editing = null;
    await saveState();
    render();

  }catch(err){
    setStatus('更新失敗：' + (err && err.message ? err.message : String(err)), false);
    console.error(err);
  }
}

function registerUndo(info){
  if(lastDeleted && lastDeleted.timeoutId) clearTimeout(lastDeleted.timeoutId);
  lastDeleted = info;
  lastDeleted.timeoutId = setTimeout(()=>{
    // 復原時限過了，這筆是真的不會復原了，這時候才把雲端照片一併清掉
    if(info.item && info.item.photoUrl){ deleteCompPhoto(info.item.photoUrl); }
    lastDeleted=null;
    render();
  }, 6000);
}

async function removeRecord(btnEl, key, id){
  const arr0 = state.records[key] || [];
  const target = arr0.find(r=>r.id===id);
  const label0 = (LEAVE_TYPES.find(t=>t.key===key)||{}).label || key;
  const confirmText = target ? `確定刪除這筆 ${toROC(target.date)} ${label0} ${displayAmount(target)}？` : '確定要刪除這筆紀錄嗎？';
  if(!window.confirm(confirmText)) return;
  try{
    await playRemoveAnimation(btnEl);
    const arr = state.records[key] || [];
    const idx = arr.findIndex(r=>r.id===id);
    if(idx===-1) return;
    const item = arr[idx];
    arr.splice(idx,1);
    const label = (LEAVE_TYPES.find(t=>t.key===key)||{}).label || key;
    registerUndo({ kind:'record', key, item, index: idx, label: `${label} ${toROC(item.date)} ${displayAmount(item)}` });
    await saveState();
    render();
  }catch(err){
    setStatus('刪除失敗：' + (err && err.message ? err.message : String(err)), false);
  }
}

async function undoDelete(){
  if(!lastDeleted) return;
  clearTimeout(lastDeleted.timeoutId);
  if(lastDeleted.kind==='record'){
    if(!state.records[lastDeleted.key]) state.records[lastDeleted.key]=[];
    state.records[lastDeleted.key].splice(lastDeleted.index,0,lastDeleted.item);
  } else {
    state.compRecords.splice(lastDeleted.index,0,lastDeleted.item);
  }
  lastDeleted = null;
  await saveState();
  render();
}
