              <button type="button" onclick="setDays('${t.key}Amount',1);updateUnitColor('${t.key}Amount','${t.key}Unit','${t.key}ConvertHint');">1</button>
              <button type="button" onclick="setDays('${t.key}Amount',2);updateUnitColor('${t.key}Amount','${t.key}Unit','${t.key}ConvertHint');">2</button>
            </div>
            <div class="quickdays" id="${t.key}QuickHour" style="display:none;">
              <button type="button" onclick="setDays('${t.key}Amount',1);updateUnitColor('${t.key}Amount','${t.key}Unit','${t.key}ConvertHint');">1</button>
              <button type="button" onclick="setDays('${t.key}Amount',2);updateUnitColor('${t.key}Amount','${t.key}Unit','${t.key}ConvertHint');">2</button>
              <button type="button" onclick="setDays('${t.key}Amount',4);updateUnitColor('${t.key}Amount','${t.key}Unit','${t.key}ConvertHint');">4</button>
              <button type="button" onclick="setDays('${t.key}Amount',8);updateUnitColor('${t.key}Amount','${t.key}Unit','${t.key}ConvertHint');">8</button>
            </div>
          </div>
          <div class="convert-hint u-day" id="${t.key}ConvertHint">使用 <b>${fmt(getHoursPerDay())} 小時</b></div>
        </div>
        <div class="field note"><label>備註</label><input type="text" id="${t.key}Note" placeholder="原因或備註"></div>
        <button type="submit" class="btn-${t.c}">登記使用</button>

}

function buildCompLi(r, dMin, dMax, category, forceEdit){
  category = category || r.category || 'comp';
  const info = COMP_CATEGORIES[category];
  // 這筆正在被「彈窗編輯」（quickEditModal）處理時，底下清單本身不能同時也渲染成編輯表單，
  // 不然會產生跟彈窗裡一模一樣的id（例如editCompDate-xxx重複兩份），存檔時document.getElementById
  // 抓到的會是畫面上第一個（被彈窗蓋住、使用者看不到也沒有實際輸入的那份），導致存檔內容是舊資料、
  // 使用者操作起來像「完全沒反應」。forceEdit=true是專門給quickEditModal自己呼叫時用的，跳過這個排除規則。
  const suppressForModal = quickEditModalOpen && quickEditModalOpen.id===r.id && !forceEdit;
  if(editing && editing.kind==='comp' && editing.id===r.id && !suppressForModal){
    const eu = r.unit || 'day';
    const ea = r.unit ? r.amount : r.days;
    const editBatches = compFifoRemaining(category, r.id).filter(b=>b.remainDays>0.0001);
    // 相容舊資料：舊版只有單一 sourceEarnId，新版是 sourceAllocations 陣列，統一轉成陣列處理
    const initialPins = Array.isArray(r.sourceAllocations) && r.sourceAllocations.length ? r.sourceAllocations
      : (r.sourceEarnId ? [{id:r.sourceEarnId, days:null}] : []);
    const initialPinMap = new Map(initialPins.map(p=>[p.id, p.days]));
    const hasManual = initialPins.length > 0;
    const initialResult = r.type==='use' ? computeUsePreviewHtml(category, ea, eu, initialPins, r.id, r.date) : { previewHtml:'', skipHtml:'' };
    const initialPreview = initialResult.previewHtml;
    const initialSkipHtml = initialResult.skipHtml;
    const initialSelectedHours = initialPins.reduce((s,p)=> s + (p.days!=null ? p.days*getHoursPerDay() : 0), 0);
    const initialNeededHours = eu==='hour' ? ea : ea*getHoursPerDay();
    const initialIsOver = initialSelectedHours > initialNeededHours + 0.001;
    const initialIsExact = !initialIsOver && initialSelectedHours >= initialNeededHours - 0.001;
    const showInitialBar = r.type==='use' && hasManual;
    const initialNeedLabel = initialIsOver ? `多選了 ${fmt(initialSelectedHours-initialNeededHours)} 小時，記得取消勾選` : `需要 ${fmt(initialNeededHours)} 小時`;
    const initialBarHtml = showInitialBar ? `<span>已選 ${fmt(initialSelectedHours)} 小時</span><span class="ssb-need">${initialNeedLabel}</span>` : '';
    return `<li class="editrow" id="editrow-${category}-${r.id}">
      <div class="field">
        <label>類型</label>
        <select id="editCompType-${r.id}" onchange="updateEditUsePreview('${r.id}','${category}')">
          <option value="earn" ${r.type==='earn'?'selected':''}>獲得${info.label}</option>
          <option value="use" ${r.type==='use'?'selected':''}>使用${info.label}</option>
        </select>
      </div>
      <div class="field">
        <label>日期</label>
        <div class="date-row"><input type="date" id="editCompDate-${r.id}" value="${r.date}" min="${dMin}" max="${dMax}" onchange="onEditCompDateChange('${r.id}','${category}');updateEditUsePreview('${r.id}','${category}')"><button type="button" class="date-toggle" onclick="toggleDateInputType('editCompDate-${r.id}')" title="切換手動輸入">⌨</button></div>
      </div>
      <div class="field field-days">
        <label>數量</label>
        <div class="days-row">
          <input type="number" id="editCompAmount-${r.id}" value="${ea}" min="0.5" step="0.5" oninput="updateEditUsePreview('${r.id}','${category}')">
          <select id="editCompUnit-${r.id}" onchange="updateEditUsePreview('${r.id}','${category}')">
            <option value="day" ${eu==='day'?'selected':''}>天</option>
            <option value="hour" ${eu==='hour'?'selected':''}>小時</option>
          </select>
        </div>
      </div>
      <div class="field note">
        <label>備註</label>
        <input type="text" id="editCompNote-${r.id}" value="${escapeAttr(r.note||'')}">
      </div>
      <div class="field" style="width:100%;">
        <label>${ICON_CAMERA}照片</label>
        ${r.photoUrl && !editPhotoRemoved[r.id] ? `
          <div style="display:flex;align-items:center;gap:10px;margin-bottom:6px;">
            <img src="${escapeAttr(r.photoUrl)}" class="ledger-thumb" style="width:56px;height:56px;" onclick="window.open('${escapeAttr(r.photoUrl)}','_blank')" alt="目前的照片">
            <button type="button" class="ghost" onclick="editPhotoRemoved['${r.id}']=true;render();">移除照片</button>
          </div>
          <p class="hint" style="margin:0 0 6px;">選新照片會直接取代上面這張</p>
        ` : (r.photoUrl && editPhotoRemoved[r.id] ? `<p class="hint" style="color:var(--brick);margin:0 0 6px;">將會移除原本的照片（存檔後才會真的刪除）<span class="overview-edit-link" style="margin-left:6px;" onclick="delete editPhotoRemoved['${r.id}'];render();">取消</span></p>` : '')}
        ${currentUser ? `<input type="file" id="editCompPhotoInput-${r.id}" accept="image/*">` : `<p class="hint" style="margin:0;">需要先登入雲端帳號才能使用這個功能</p>`}
      </div>
      <div id="editCompExpiryWrap-${r.id}" style="${r.type==='earn'?'':'display:none;'}width:100%;">
        <div class="field">
          <label>${ICON_HOURGLASS}到期日</label>
          <div class="date-row"><input type="date" id="editCompExpiry-${r.id}" value="${r.expiry||compDefaultExpiry(category, r.date)}" oninput="editExpiryTouched=true"><button type="button" class="date-toggle" onclick="toggleDateInputType('editCompExpiry-${r.id}')" title="切換手動輸入">⌨</button></div>
        </div>
      </div>
      <div id="editUsePreview-${r.id}">${initialPreview}</div>
      <div id="editManualSourceWrap-${r.id}" style="${r.type==='use'?'':'display:none;'}width:100%;">
        <label class="manual-source-toggle">
          <input type="checkbox" id="editManualToggle-${r.id}" ${hasManual?'checked':''} onchange="toggleEditManualSource('${r.id}','${category}')"> 手動指定要扣哪幾筆（可複選，預設自動扣最早獲得的那筆）
        </label>
        <div class="field" id="editManualSourceField-${r.id}" style="${hasManual?'':'display:none;'}margin-bottom:14px;max-width:100%;overflow:hidden;">
                    <div id="editCompSrcBatchList-${r.id}" class="src-batch-list">
            ${editBatches.map(b=>{
              const pinDaysRaw = initialPinMap.has(b.id) ? initialPinMap.get(b.id) : null;
              const isChecked = initialPinMap.has(b.id);
              const pinDisplayVal = pinDaysRaw!=null ? fmt(pinDaysRaw*getHoursPerDay()) : '';
              return `
              <div class="src-batch-row" data-batch-id="${b.id}" data-batch-remain="${b.remainDays}">
                <label class="src-batch-check">
                  <input type="checkbox" ${isChecked?'checked':''} onchange="onCompSrcRowToggle(this,'${category}')">
                  <span class="src-batch-label">${toROC(b.date)}${b.note?`（${escapeHtml(b.note)}）`:''}${b.expiry && b.expiry < r.date ? '<span class="src-batch-expired">已過期</span>' : ''}</span>
                  <span class="src-batch-remain">剩${fmt(b.remainDays*getHoursPerDay())}小時</span>
                </label>
                <div class="src-batch-input-wrap" style="${isChecked?'':'display:none;'}">
                  <select class="src-batch-days" onchange="updateEditUsePreview('${r.id}','${category}')">${compHourOptions(b.remainDays*getHoursPerDay(), pinDisplayVal)}</select>
                  <span class="src-batch-unit">時</span>
                </div>
              </div>`;
            }).join('') || `<p class="hint" style="margin:0;">目前沒有還有效的批次可以指定。</p>`}
          </div>
        </div>
      </div>
      <div class="comp-bottom-alerts" id="editCompBottomAlerts-${r.id}">
        <div id="editCompSkipWarning-${r.id}" class="skip-warning-bar" style="${initialSkipHtml?'':'display:none;'}">${escapeHtml(initialSkipHtml)}</div>
        <div id="editCompSelectSummary-${r.id}" class="select-summary-bar${initialIsExact?' ssb-ok':''}${initialIsOver?' ssb-over':''}" style="${showInitialBar?'':'display:none;'}">${initialBarHtml}</div>
      </div>
      <div class="row">
        <button class="btn-${info.c}" onclick="saveEditComp('${r.id}', this)">儲存</button>
        <button class="ghost" onclick="cancelEdit()">取消</button>
      </div>
      <div id="editCompBottomSpacer-${r.id}" style="height:0;"></div>
    </li>`;
  }
  return `<li class="${r.id===lastAddedId?'stamp-in':''}" data-rec-date="${r.date}" style="position:relative;">
    ${r.id===lastEditedId ? `<span class="edit-confirm-badge">✓ 已編輯</span>` : ''}
    <div class="ledger-top">
      <span class="d">${toROC(r.date)}</span>
      <span class="tag" style="background:var(--${info.c}-soft);color:var(--${info.c});">${r.type==='earn'?'獲得':'使用'}</span>
      <span class="days" style="color:var(--${info.c});">${r.type==='earn'?'+':'-'}${displayAmount(r)}</span>
    </div>
    ${r.note? `<div class="ledger-note-row">${ICON_NOTE}${escapeHtml(r.note)}</div>` : ''}
    <div class="ledger-bottom">
      ${r.expiry? `<div class="expiry">${ICON_HOURGLASS}${info.label}到期日：${toROC(r.expiry)}</div>` : (() => {
        if(r.type!=='use') return '<div></div>';
        const usage = compUsageBreakdown(category, r.id);
        if(!usage.length) return '<div></div>';
        const isManual = (Array.isArray(r.sourceAllocations) && r.sourceAllocations.length) || !!r.sourceEarnId;
        const label = isManual ? `${ICON_FOLDER}指定扣：` : `${ICON_FOLDER}扣自：`;
        const parts = usage.map(u=> `${toROC(u.date)}${u.note?`（${escapeHtml(u.note)}）`:''} ${fmt(u.take*getHoursPerDay())}小時`);
        return `<div class="expiry alloc-list">${label}${parts.map(p=>`<div class="alloc-line">${p}</div>`).join('')}</div>`;
      })()}
      ${r.type==='earn' ? (() => {
        const usedBy = compEarnUsedByBreakdown(category, r.id);
        if(!usedBy.length) return '';
        const parts = usedBy.map(u=> `${toROC(u.useDate)} 用了 ${fmt(u.take*getHoursPerDay())}小時`);
        return `<div class="expiry alloc-list" style="color:var(--jade);">🔻 已被使用：${parts.map(p=>`<div class="alloc-line">${p}</div>`).join('')}</div>`;
      })() : ''}
      ${r.photoUrl? `<img src="${escapeAttr(r.photoUrl)}" class="ledger-thumb" onclick="window.open('${escapeAttr(r.photoUrl)}','_blank')" alt="附件照片">` : ''}
      <div class="ledger-actions">
        <button class="del" title="編輯" onclick="startEditComp('${r.id}')">✎ 編輯</button>
        <button class="del" title="刪除" onclick="removeComp(event.currentTarget,'${r.id}')">✕ 刪除</button>
      </div>
    </div>
  </li>`;
}

function openQuickEditModal(category, id){
  quickEditModalOpen = {category, id};
  editing = {kind:'comp', id};
  render();
}
function closeQuickEditModal(){
  quickEditModalOpen = null;
  editing = null;
  render();
}
function quickEditModal(){
  if(!quickEditModalOpen) return '';
  const {category, id} = quickEditModalOpen;
  const rec = state.compRecords.find(r=>r.id===id);
  if(!rec){ return ''; } // 紀錄不見了（例如剛好被刪除），彈窗內容渲染不出來就不顯示，避免報錯
  const info = COMP_CATEGORIES[category];
  const dMin = isoDate(CUR_YEAR-5,1,1), dMax = yearMax(CUR_YEAR+1);
  // 直接重用buildCompLi在editing狀態下產生的編輯表單內容（跟原地展開是同一份表單），只是外面包一層彈窗，不是另外重寫一份
  const formHtml = buildCompLi(rec, dMin, dMax, category, true);
  return `
    <div class="modal-overlay" onclick="closeQuickEditModal()">
      <div class="modal-box" style="max-width:400px;max-height:85vh;overflow-y:auto;" onclick="event.stopPropagation()">
        <h3>編輯${info.label}紀錄</h3>
        <ul class="ledger" style="list-style:none;padding:0;margin:0;">${formHtml}</ul>
      </div>
    </div>`;
}
function setAvailBatchYearFilter(category, year){
  availBatchYearFilter[category] = year;
  render();
}

// 「尚未使用的日期」清單收合狀態：使用者手動點過就永遠照使用者的選擇；
// 沒手動選過時，用筆數決定預設（超過3筆太長，預設收合；3筆以內直接展開，不用多點一次）
function isAvailBatchCollapsed(category, count){
  if(!state.availBatchCollapsed) state.availBatchCollapsed = {};
  const manual = state.availBatchCollapsed[category];
  if(manual !== undefined) return manual;
  return count > 3;
}
function toggleAvailBatchCollapse(category, currentlyCollapsed){
  if(!state.availBatchCollapsed) state.availBatchCollapsed = {};
  state.availBatchCollapsed[category] = !currentlyCollapsed;
  saveState();
  render();
}

function renderAvailBatchList(category){
  const info = COMP_CATEGORIES[category];
  const todayD = new Date(TODAY);
  const batches = compFifoRemaining(category)
    .filter(b=>b.remainDays>0.0001)
    // 依照「獲得年份 ≤ 目前看的年度 ≤ 到期年份」過濾：
    // 還沒獲得的（獲得年份晚於目前看的年度）不該出現；已經在更早年度就過期的也不該出現；
    // 同一年內到期的，還算有效，維持顯示
    .filter(b=>{
      const earnYear = parseInt(b.date.slice(0,4),10);
      if(earnYear > selectedYear) return false;
      if(b.expiry){
        const expiryYear = parseInt(b.expiry.slice(0,4),10);
        if(expiryYear < selectedYear) return false;
      }
      return true;
    })
    .map(b=>Object.assign({}, b, {diffDays: b.expiry ? Math.round((new Date(b.expiry)-todayD)/86400000) : null, earnYear: parseInt(b.date.slice(0,4),10)}))
    .sort((a,b)=>{
      if(a.diffDays===null && b.diffDays===null) return a.date.localeCompare(b.date);
      if(a.diffDays===null) return 1;
      if(b.diffDays===null) return -1;
      return a.diffDays-b.diffDays;
    });
  if(batches.length===0){
    return `<div class="avail-batch-list-label" style="color:var(--brick);">${ICON_FOLDER}${info.label}未使用日期</div><div class="hint" style="margin-bottom:12px;">目前沒有還能使用的${info.label}紀錄。</div>`;
  }
  const collapsed = isAvailBatchCollapsed(category, batches.length);
  const stackHeader = `
    <button type="button" class="avail-batch-stack-toggle" onclick="toggleAvailBatchCollapse('${category}', ${collapsed})">
      <span class="avail-batch-list-label" style="color:var(--brick);margin:0;">${ICON_FOLDER}${info.label}未使用日期</span>
      <span class="avail-batch-stack-right">
        <span class="avail-batch-stack-icon ${collapsed?'':'is-open'}">
          <span class="stack-card stack-card-1"></span>
          <span class="stack-card stack-card-2"></span>
          <span class="stack-card stack-card-3"></span>
        </span>
        <span class="avail-batch-stack-count">共 ${batches.length} 筆</span>
        <span class="chevron ${collapsed?'chevron-closed':'chevron-open'}">${collapsed?'<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>':'<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>'}</span>
      </span>
    </button>`;
  // 依「獲得年份」（西元）產生篩選鈕，只列出目前清單裡實際還有剩餘的年份；只有1個年份時完全不顯示，避免多一排東西擠畫面
  const distinctYears = Array.from(new Set(batches.map(b=>b.earnYear))).sort((a,b)=>a-b);
  const currentFilter = availBatchYearFilter[category] || 'all';
  const effectiveFilter = distinctYears.includes(currentFilter) || currentFilter==='all' ? currentFilter : 'all';
  const pillsHtml = distinctYears.length>=2 ? `
    <div class="year-pills" style="--pill-c:var(--${info.c}-strong);">
      <button type="button" class="year-pill ${effectiveFilter==='all'?'active':''}" onclick="setAvailBatchYearFilter('${category}','all')">全部</button>
      ${distinctYears.map(y=>`<button type="button" class="year-pill ${effectiveFilter===y?'active':''}" onclick="setAvailBatchYearFilter('${category}',${y})">${y}</button>`).join('')}
    </div>` : '';
  const shownBatches = effectiveFilter==='all' ? batches : batches.filter(b=>b.earnYear===effectiveFilter);
  const listHtml = `${pillsHtml}<div class="avail-batch-list">${shownBatches.map(b=>{
    const urgent = b.diffDays!==null && b.diffDays<=7;
    const expiryTxt = b.diffDays===null ? '' : (b.diffDays<0? `已過期${Math.abs(b.diffDays)}天` : (b.diffDays===0?'今天到期':`${b.diffDays}天後到期`));
    return `<div class="avail-batch-item">
      ${b.id===lastEditedId ? `<span class="edit-confirm-badge">✓ 已編輯</span>` : ''}
      <button type="button" class="avail-batch-edit-btn" onclick="openQuickEditModal('${category}','${b.id}')" title="編輯">✎</button>
      <div class="avail-batch-title"><span class="avail-batch-date">${toROC(b.date)}</span>${b.note?`<span class="avail-batch-note-tag">${escapeHtml(b.note)}</span>`:''}${b.photoUrl?` <span class="photo-badge" onclick="window.open('${escapeAttr(b.photoUrl)}','_blank')">${ICON_CAMERA}附件</span>`:''}</div>
      <div class="avail-batch-remain">剩 ${fmt(b.remainDays)} 天<span class="avail-batch-hours-strong">（${fmt(b.remainDays*getHoursPerDay())} 小時）</span></div>
      ${b.expiry? `<div class="avail-batch-expiry" style="color:${urgent?'var(--brick)':'var(--amber)'};">${ICON_HOURGLASS}到期 ${toROC(b.expiry)}（${expiryTxt}）</div>` : ''}
    </div>`;
  }).join('')}</div>`;
  // 收合時，實際內容區顯示「真的疊在一起」的預覽——只有最上面那張顯示完整真實內容（日期/備註/剩餘天數），
  // 下面幾張改成純色實心窄條（不放文字），避免好幾張卡片的文字疊在同個位置糊成一團看不清楚；最多疊5張
  const previewBatches = shownBatches.slice(0,3);
  const n = previewBatches.length;
  const peek = 34; // 每張後面的卡片露出的高度
  const overlap = 8; // 每兩張相鄰卡片之間固定重疊這麼多，才會有「疊在一起」的感覺；文字會靠內距往下挪開這個重疊區，不會被蓋到
  const cardH = peek + overlap; // 每張卡片（含最上面那張）都用同一個高度，重疊幅度才會一致，看起來才會像同一疊
  const frontH = cardH;
  // 後面幾張用該假別自己的主題色，越後面越淡（呼應之前的配色邏輯，但這次整張卡片淡淡上色，不是純色窄條），
  // 淡到文字還是看得清楚（第一張永遠白底黑字最清楚；後面幾張文字顏色也跟著調深一點，避免淡底配淡字看不到）
  const layerBg = i => i===0 ? 'var(--card)' : `color-mix(in srgb, var(--amber) ${22-i*5}%, var(--card))`;
  // 第4筆：給一個看得出卡片形狀（有邊框、有陰影）但不放內容的空卡片，比純陰影更有「真的有一張卡在那裡」的實感；
  // 第5筆以上：只用模糊陰影暗示「還有更多」，不用讓人知道確切幾筆，畢竟疊到那麼多層已經不需要一一交代
  const totalCount = shownBatches.length;
  const has4th = totalCount >= 4;
  const has5th = totalCount >= 5;
  const emptyLayerReveal = 18; // 露出這麼多像素，數字越小露出越少
  const emptyLayerTop = 2*peek + emptyLayerReveal;
  // 第4筆現在也放真實日期文字，但因為這張卡片大部分被第3張蓋住，只有下緣露出來，
  // 所以文字要貼在這張卡片的「下緣」對齊，剛好落在露出的那一截範圍內，不然文字放在習慣的頂部反而會被蓋住看不到
  const emptyLayerHtml = has4th ? `<div class="stack-preview-layer stack-preview-layer-empty" style="height:${cardH}px;transform:translateY(${emptyLayerTop}px) scale(${1-3*0.02});z-index:0;background:${layerBg(3)};"></div>` : '';
  const moreHintTop = has4th ? emptyLayerTop+cardH : (n>0 ? (n-1)*peek+cardH : 0);
  const moreHintHtml = has5th ? `<div class="stack-preview-more-hint" style="top:${moreHintTop}px;"></div>` : '';
  const stackPreviewHtml = n ? `
    <div class="avail-batch-stack-preview ${collapsed?'':'is-hidden'}" onclick="toggleAvailBatchCollapse('${category}', ${collapsed})" style="height:${(has4th?emptyLayerTop+cardH:(n>1?(n-1)*peek+cardH:frontH))+(has5th?10:0)}px;">
      ${previewBatches.map((b,i)=>`
        <div class="stack-preview-layer ${i===0?'stack-preview-layer-front':''}" style="height:${i===0?frontH:cardH}px;transform:translateY(${i*peek}px) scale(${1-i*0.02});z-index:${n-i};background:${layerBg(i)};">
          <span class="avail-batch-date">${toROC(b.date)}</span>
          ${b.note?`<span class="avail-batch-note-tag">${escapeHtml(b.note)}</span>`:''}
          <span class="stack-preview-remain">${overviewUnit==='day' ? `剩 ${fmt(b.remainDays)} 天` : `剩 ${fmt(b.remainDays*getHoursPerDay())} 小時`}</span>
        </div>`).join('')}
      ${emptyLayerHtml}
      ${moreHintHtml}
    </div>` : '';
  return `${stackHeader}${stackPreviewHtml}<div class="avail-batch-collapse-wrap ${collapsed?'':'is-expanded'}"><div class="avail-batch-collapse-inner">${listHtml}</div></div>`;
}

function toggleCustomAdd(){ customAddOpen = !customAddOpen; render(); }
function setCustomAddType(t){ customAddType = t; render(); }

// 「其他假別」目前有效（還沒用完）的所有名目清單，每個名目各自獨立算FIFO結餘
function getActiveCustomLabels(){
  const labels = Array.from(new Set(state.compRecords.filter(r=>(r.category||'comp')==='custom' && r.customLabel).map(r=>r.customLabel)));
  return labels.map(label=>{
    const batches = compFifoRemaining('custom', null, label).filter(b=>b.remainDays>0.0001);
    const remainDays = batches.reduce((s,b)=>s+b.remainDays, 0);
    const nearestExpiry = batches.filter(b=>b.expiry).sort((a,b)=>a.expiry.localeCompare(b.expiry))[0];
    return { label, remainDays, batches, nearestExpiry: nearestExpiry ? nearestExpiry.expiry : null };
  }).filter(x=>x.remainDays>0.0001);
}

async function addCustomRecord(e){
  e.preventDefault();
  // 跟addRecord/addComp同一個鎖，這個是當初修的時候漏掉的第三個新增入口
  if(isAddingRecord) return;
  isAddingRecord = true;
  try{
    const type = customAddType;
    const label = document.getElementById('customLabelInput') ? document.getElementById('customLabelInput').value.trim() : '';
    const date = parseFlexibleDate(document.getElementById('customDate').value);
    const unit = document.getElementById('customUnit').value;
    const amount = parseFloat(document.getElementById('customAmount').value);
    const note = document.getElementById('customNote').value.trim();
    if(!date || !isFinite(amount) || amount<=0){ setStatus('請填寫日期與數量', false); return; }
    if(type==='earn' && !label){ setStatus('請填寫假別名稱（例如：婚假、喪假）', false); return; }
    let useLabel = label;
    if(type==='use'){
      const sel = document.getElementById('customUseLabelSelect');
      useLabel = sel ? sel.value : '';
      if(!useLabel){ setStatus('請選擇要使用哪個假別名目', false); return; }
    }
    const daysEquiv = unit==='hour' ? amount/getHoursPerDay() : amount;
    if(type==='use'){
      const balAsOfDate = compBalanceAsOf('custom', date, null, useLabel);
      if(balAsOfDate - daysEquiv < 0){
        if(!window.confirm(`⚠️ 依日期順序計算，到 ${toROC(date)} 這天為止，「${useLabel}」只累積了 ${fmt(balAsOfDate)} 天，登記後會變負數，仍要登記嗎？`)) return;
      }
    }
    const id = uid();
    const record = { id, type, date, unit, amount, note, category:'custom', customLabel: useLabel };
    if(type==='earn'){
      const expiryEl = document.getElementById('customExpiry');
      const expiry = expiryEl ? parseFlexibleDate(expiryEl.value) : null;
      if(expiry) record.expiry = expiry;
    }
    state.compRecords.push(record);
    lastAddedId = id;
    expandedMonths[`custom-${date.slice(0,7)}`] = true; // 剛新增的月份要展開，不然還是停在原本展開的那個月，看不到新加的
    customAddOpen = false;
    await saveState();
    render();
    setStatus(`已新增${type==='earn'?'獲得':'使用'}「${useLabel}」${fmt(amount)}${unit==='hour'?'小時':'天'}`, true);
  }catch(err){
    setStatus('新增失敗：' + (err && err.message ? err.message : String(err)), false);
  } finally {
    isAddingRecord = false;
  }
}

function compSectionHtml(category){
  category = category || 'comp';
  const info = COMP_CATEGORIES[category];
  const allComp = state.compRecords.filter(r=>r.date.startsWith(String(selectedYear)) && (r.category||'comp')===category);
  let compRows = allComp.filter(r=>matchesSearch(r.date, r.note, info.label, r.type==='earn'?'獲得':'使用'));
  compRows.sort((a,b)=> sortAsc ? a.date.localeCompare(b.date) : b.date.localeCompare(a.date));
  const compEmptyMsg = allComp.length===0 ? `${selectedYear} 年尚無${info.label}紀錄，可以點上方「＋新增一筆」登記第一筆 👆` : '查無符合搜尋的紀錄';
  const dMin = isoDate(CUR_YEAR-5,1,1), dMax = yearMax(CUR_YEAR+1), dDef = defaultDateFor(selectedYear);
  const forceExpand = (groupRows)=> (editing && editing.kind==='comp' && groupRows.some(r=>r.id===editing.id)) || (revealDate && groupRows.some(r=>r.date===revealDate));
  const totalFn = (groupRows)=>{
    const net = groupRows.reduce((s,r)=> s + (r.type==='earn'? toDays(r): -toDays(r)), 0);
    const netLabel = groupRows.length===1 ? '' : '淨 ';
    return `${groupRows.length} 筆・${netLabel}${net>=0?'+':''}${fmt(net*getHoursPerDay())}小時`;
  };
  const subTotalFn = (groupRows)=>{
    const earn = groupRows.filter(r=>r.type==='earn').reduce((s,r)=>s+toDays(r),0);
    const use = groupRows.filter(r=>r.type==='use').reduce((s,r)=>s+toDays(r),0);
    if(earn>0 && use>0) return `獲得 ${fmt(earn*getHoursPerDay())} 小時・使用 ${fmt(use*getHoursPerDay())} 小時`;
    return '';
  };
  const listHtml = renderMonthGroups(category, compRows, compEmptyMsg, r=>buildCompLi(r,dMin,dMax,category), totalFn, forceExpand, subTotalFn);
  const curBalance = compBalanceUpTo(selectedYear, category);
  const nearestExpiry = compFifoRemaining(category)
    .filter(b=>b.expiry && b.remainDays>0.001)
    .map(b=>Object.assign({}, b, {diffDays: Math.round((new Date(b.expiry) - new Date(TODAY))/86400000)}))
    .sort((a,b)=>a.diffDays-b.diffDays)[0];
  const carryOver = compFifoRemaining(category)
    .filter(b=> parseInt(String(b.date).slice(0,4),10) < selectedYear)

// ===== 外觀（淺色／深色）=====
// 'auto' 跟隨手機設定、'light' 固定淺色、'dark' 固定深色；只存在這台裝置（localStorage），不影響雲端同步與備份
function getThemePref(){
  try{ const v = localStorage.getItem('themePref'); return (v==='light' || v==='dark') ? v : 'auto'; }catch(e){ return 'auto'; }
}
function systemPrefersDark(){
  try{ return !!(window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches); }catch(e){ return false; }
}
function applyTheme(){
  const pref = getThemePref();
  const dark = pref==='dark' || (pref==='auto' && systemPrefersDark());
  try{
    document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
    const m = document.getElementById('themeColorMeta'); if(m) m.setAttribute('content', dark ? '#1C1A17' : '#2F5D50');
  }catch(e){}
}
function setThemePref(pref){
  try{
    if(pref==='light' || pref==='dark') localStorage.setItem('themePref', pref);
    else localStorage.removeItem('themePref');
  }catch(e){}
  applyTheme();
  render();
}
function initThemeWatcher(){
  applyTheme();
  // 選「跟隨手機」時，手機切換深淺色（例如晚上自動變深色）App 也跟著變，不用重開
  try{
    const mq = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)');
    if(mq){
      const onChange = ()=>{ if(getThemePref()==='auto'){ applyTheme(); render(); maybeShowThemeAutoHint(); } };
      if(mq.addEventListener) mq.addEventListener('change', onChange); else if(mq.addListener) mq.addListener(onChange);
    }
  }catch(e){}
}

// 一次性說明：設定是「跟隨手機」、App 第一次因為手機是深色而顯示成深色時，底部出現一行說明，之後這台裝置永遠不再出現。
// 如果這台裝置沒辦法記住「已經說明過」（例如隱私瀏覽模式），寧可不顯示，也不要每次開App都跳
// 假別分頁那一排：畫面重畫後，讓選中的分頁留在看得到的位置（不然選了最右邊的假別，整排又跳回最左邊），並更新邊緣淡出
let leaveTabsScrollLeft = 0;
function updateLeaveTabsFade(el){
  if(!el) return;
  leaveTabsScrollLeft = el.scrollLeft;
  const canLeft = el.scrollLeft > 2;
  const canRight = el.scrollLeft + el.clientWidth < el.scrollWidth - 2;
  el.classList.remove('fade-left','fade-right','fade-both');
  if(canLeft && canRight) el.classList.add('fade-both');
  else if(canRight) el.classList.add('fade-right');
  else if(canLeft) el.classList.add('fade-left');
}
function syncLeaveTabsRow(){
  try{
    const row = document.getElementById('leaveTabsRow');
    if(!row || !row.querySelector) return;
    row.scrollLeft = leaveTabsScrollLeft; // 先回到重畫前的位置，不要跳回最左邊
    const act = row.querySelector('.is-active');
    if(act){
      const l = act.offsetLeft, r = l + act.offsetWidth;
      if(l < row.scrollLeft + 8) row.scrollLeft = Math.max(0, l - 24);
      else if(r > row.scrollLeft + row.clientWidth - 8) row.scrollLeft = r - row.clientWidth + 24;
    }
    updateLeaveTabsFade(row);
  }catch(e){}
}
let themeHintPending = false;
function maybeShowThemeAutoHint(){
  try{
    if(getThemePref()!=='auto' || !systemPrefersDark()) return;
    // 開App時剛好跳出其他視窗（例如過期補休要決定、特休天數要設定）：先不顯示、也先不記「已說明過」，
    // 等視窗關掉再顯示，不然說明會被視窗蓋住、5秒後消失，等於白白用掉這唯一一次
    if(document.querySelector('.modal-overlay')){ themeHintPending = true; return; }
    themeHintPending = false;
    if(localStorage.getItem('themeAutoHintShown')) return;
    localStorage.setItem('themeAutoHintShown', '1');
    if(localStorage.getItem('themeAutoHintShown')!=='1') return;
  }catch(e){ return; }
  try{
    const el = document.createElement('div');
    el.className = 'theme-hint-overlay';
    el.innerHTML = `<div class="theme-hint-toast" role="status">
      <div class="theme-hint-icon"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg></div>
      <div class="theme-hint-title">已切換為深色</div>
      <div class="theme-hint-sub">跟隨手機・可在設定更改</div>
    </div>`;
    el.onclick = ()=>el.remove();
    document.body.appendChild(el);
    setTimeout(()=>{ el.remove(); }, 5000);
  }catch(e){}
}

// 每次畫畫面時開一份新的扣抵計算快取，畫完就丟掉，確保下次操作一定用最新資料重算
function render(){
  const prevMemo = fifoMemo;
  fifoMemo = new Map();
  try{ _renderInner(); }
  finally{ fifoMemo = prevMemo; }
  syncLeaveTabsRow();
  // 深色說明因為當時有視窗開著而延後的話，視窗一關就補顯示
  if(themeHintPending && !document.querySelector('.modal-overlay')) maybeShowThemeAutoHint();
}
function _renderInner(){
  expiryTouched = false;
  compNoteTouched = false;

  const isPageChange = lastRenderedPage !== activePage;
  lastRenderedPage = activePage;

  let pageContent = '';
  if(activePage==='home'){ pageContent = pageHome(isPageChange); }
  else if(activePage==='leaves'){ pageContent = pageLeaves(); }
  else if(activePage==='viz'){ pageContent = pageViz(); }
  else if(activePage==='quick'){ pageContent = pageQuickInput(); }
  else if(activePage==='data'){ pageContent = pageData(); }
  else if(activePage==='addRecord'){ pageContent = pageAddRecord(); }
  else if(activePage==='yearRecord'){ pageContent = pageYearRecord(); }

  document.getElementById('app').innerHTML = `
    ${storageUnavailable ? `<div class="storage-warning-banner">${ICON_WARNING}偵測到目前無法儲存資料到這台裝置，你在這裡做的任何操作都不會被保存！可能是隱私瀏覽模式或儲存空間已滿，請改用一般瀏覽模式重新打開。</div>` : ''}
    ${activePage==='home' ? `<header><h1>假期存摺</h1></header>` : ''}

    ${lastDeleted? `<div class="undo-bar"><span>已刪除：${escapeHtml(lastDeleted.label)}</span><button onclick="undoDelete()">復原</button></div>` : ''}
    ${getResetSnapshot()? `<div class="undo-bar"><span>${ICON_WARNING} 曾重置：${escapeHtml(getResetSnapshot().label)}（30分鐘內可復原）</span><button onclick="restoreResetSnapshot()">復原</button></div>` : ''}

    <div class="${isPageChange ? 'page-fade' : ''}">
      ${pageContent}
    </div>

    ${expiryDecisionModalOpen ? expiryDecisionModal() : ''}
    ${annualQuotaModalOpen ? annualQuotaModal() : ''}
    ${quickEditModalOpen ? quickEditModal() : ''}

let calTouchStartX = null;
let calTouchStartY = null;
let leaveTouchStartX = null;
let leaveTouchStartY = null;
function leaveTouchStart(e){
  if(!e.touches || !e.touches[0]) return;
  leaveTouchStartX = e.touches[0].clientX;
  leaveTouchStartY = e.touches[0].clientY;
}
function leaveTouchEnd(e){
  if(leaveTouchStartX===null || !e.changedTouches || !e.changedTouches[0]) return;
  const endX = e.changedTouches[0].clientX;
  const endY = e.changedTouches[0].clientY;
  const deltaX = endX - leaveTouchStartX;
  const deltaY = endY - leaveTouchStartY;
  leaveTouchStartX = null;
  leaveTouchStartY = null;
  // 橫向滑動幅度要明顯大於縱向，避免跟上下捲動衝突（跟行事曆滑動判斷邏輯一致）
  // 滑年份、不滑假別：假別分頁本身已經是可以左右滑動的分頁列，內容區再滑會互搶手勢，
  // 年份則是跟行事曆一樣的「時間序列」概念，滑動起來邏輯一致、也沒有既有的橫向滑動搶手勢
  if(Math.abs(deltaX) > 50 && Math.abs(deltaX) > Math.abs(deltaY)*1.5){
    if(deltaX < 0) changeYear(1); else changeYear(-1);
  }
}
function calTouchStart(e){
  if(!e.touches || !e.touches[0]) return;
  calTouchStartX = e.touches[0].clientX;
  calTouchStartY = e.touches[0].clientY;
}
function calTouchEnd(e){
  if(calTouchStartX===null || !e.changedTouches || !e.changedTouches[0]) return;
  const endX = e.changedTouches[0].clientX;
  const endY = e.changedTouches[0].clientY;
  const deltaX = endX - calTouchStartX;
  const deltaY = endY - calTouchStartY;
  calTouchStartX = null;
  calTouchStartY = null;
  // 橫向滑動幅度要明顯大於縱向，避免跟上下捲動衝突
  if(Math.abs(deltaX) > 50 && Math.abs(deltaX) > Math.abs(deltaY)*1.5){
    if(deltaX < 0) changeCalMonth(1); else changeCalMonth(-1);
  }
}

function updateUnitColor(amountId, unitId, hintId, verbOrSelectId){
  const amountEl = document.getElementById(amountId);
  const unitEl = document.getElementById(unitId);
  const hintEl = document.getElementById(hintId);
  if(!amountEl || !unitEl || !hintEl) return;
  const unit = unitEl.value;
  const amount = parseFloat(amountEl.value) || 0;
  unitEl.classList.toggle('u-day', unit==='day');
  unitEl.classList.toggle('u-hour', unit==='hour');
  const converted = unit==='day' ? amount*getHoursPerDay() : amount/getHoursPerDay();
  const convertedLabel = unit==='day' ? '小時' : '天';
  // verbOrSelectId：可直接傳「獲得」/「使用」字面值（例如其他假別表單，切換時會整頁重繪，字面值一定是最新的），
  // 或傳一個 <select> 的 id（例如補休/換休的 compType，切換不會整頁重繪，所以每次都要重新讀 DOM 現值）
  let verb = '';
  if(verbOrSelectId==='獲得' || verbOrSelectId==='使用'){
    verb = verbOrSelectId;
  } else if(verbOrSelectId){
    const verbEl = document.getElementById(verbOrSelectId);
    if(verbEl) verb = verbEl.value==='use' ? '使用' : '獲得';
  }
  hintEl.innerHTML = verb ? `${verb} <b>${fmt(converted)} ${convertedLabel}</b>` : `使用 <b>${fmt(converted)} ${convertedLabel}</b>`;
  hintEl.classList.toggle('u-day', unit==='day');
  hintEl.classList.toggle('u-hour', unit==='hour');
}

async function addRecord(key, e){
  e.preventDefault();
  // 手機上快速點兩下「新增」按鈕，第二下可能在第一下的saveState()還沒完成前就先跑完前半段的同步驗證，
  // 沒有這個鎖的話兩次都會各自push一筆進去，變成重複新增同一筆
  if(isAddingRecord) return;
  isAddingRecord = true;
  try{
    const unit = document.getElementById(key+'Unit').value;
    const amount = parseFloat(document.getElementById(key+'Amount').value);
    const note = document.getElementById(key+'Note').value.trim();
    if(!isFinite(amount) || amount<=0){ setStatus('請填寫數量', false); return; }
    const daysEquiv = unit==='hour' ? amount/getHoursPerDay() : amount;

    if(multiDateMode){
      if(multiDateList.length===0){ setStatus('請先加入至少一個日期', false); return; }
      const totalDaysEquiv = daysEquiv * multiDateList.length;
      const currentRemain = remainOf(key, selectedYear);
      if(currentRemain - totalDaysEquiv < 0){
        const label = (LEAVE_TYPES.find(t=>t.key===key)||{}).label || '';
        if(!window.confirm(`這 ${multiDateList.length} 天加起來會超過可用的${label}天數（目前剩餘 ${fmt(currentRemain)} 天，這次共需要 ${fmt(totalDaysEquiv)} 天），仍要登記嗎？`)) return;
      }
      if(!state.records[key]) state.records[key]=[];
      let lastId = null;
      const addedCount = multiDateList.length;
      for(const date of multiDateList){
        const id = uid();
        state.records[key].push({ id, date, unit, amount, note });
        lastId = id;
        expandedMonths[`${key}-${date.slice(0,7)}`] = true; // 剛新增的月份要展開，不然還是停在原本展開的那個月，看不到新加的
      }
      lastAddedId = lastId;
      state.lastUsedType = key;
      multiDateMode = false; multiDateList = [];
      await saveState();
      setStatus('已登記使用', true);
      const tLabel = (LEAVE_TYPES.find(t=>t.key===key)||{}).label || '';
      finishAddWithConfirm(`已新增 ${addedCount} 筆${tLabel}（每筆 ${displayAmount({unit,amount})}）`);
      return;
    }

    const date = parseFlexibleDate(document.getElementById(key+'Date').value);
    if(!date){ setStatus('請填寫日期', false); return; }
    const currentRemain = remainOf(key, selectedYear);
    if(currentRemain - daysEquiv < 0){
      const label = (LEAVE_TYPES.find(t=>t.key===key)||{}).label || '';
      if(!window.confirm(`這筆會超過可用的${label}天數（目前剩餘 ${fmt(currentRemain)} 天 ≈ ${fmt(currentRemain*getHoursPerDay())} 小時），仍要登記嗎？`)) return;
    }
    const id = uid();
    if(!state.records[key]) state.records[key]=[];
    state.records[key].push({ id, date, unit, amount, note });
    lastAddedId = id;
    expandedMonths[`${key}-${date.slice(0,7)}`] = true; // 剛新增的月份要展開，不然還是停在原本展開的那個月，看不到新加的
    state.lastUsedType = key;
    await saveState();
    setStatus('已登記使用', true);
    const tLabel = (LEAVE_TYPES.find(t=>t.key===key)||{}).label || '';
    finishAddWithConfirm(`已新增 ${displayAmount({unit,amount})}${tLabel}`);
  }catch(err){
    setStatus('儲存失敗：' + (err && err.message ? err.message : String(err)), false);
    console.error(err);
  } finally {
    isAddingRecord = false;
  }
}

function registerUndo(info){
  if(lastDeleted && lastDeleted.timeoutId){
    clearTimeout(lastDeleted.timeoutId);
    // 上一筆的復原時限還沒到就被這次的新刪除蓋掉：上一筆已經不能復原了，它的照片（已在待刪清單裡）可以馬上處理
    if(lastDeleted.item && lastDeleted.item.photoUrl){ enqueuePhotoDelete(lastDeleted.item.photoUrl, 0); }
  }
  const hadPrevious = !!(lastDeleted && lastDeleted.timeoutId);
  lastDeleted = info;
  // 刪除當下就先把照片記進待刪清單（6秒後才生效）：就算6秒內App被關掉，下次開App也會補刪，不會變孤兒
  if(info.item && info.item.photoUrl){ enqueuePhotoDelete(info.item.photoUrl, 6000); }
  lastDeleted.timeoutId = setTimeout(()=>{
    lastDeleted=null;
    render();
    processPhotoDeleteQueue(); // 復原時限過了，照片正式刪除
  }, 6000);
  if(hadPrevious) processPhotoDeleteQueue(); // 上一筆已經不能復原，它的照片現在就可以刪
}

async function removeRecord(btnEl, key, id){
  const arr0 = state.records[key] || [];
  const target = arr0.find(r=>r.id===id);
  const label0 = (LEAVE_TYPES.find(t=>t.key===key)||{}).label || key;
  const confirmText = target ? `確定刪除這筆 ${toROC(target.date)} ${label0} ${displayAmount(target)}？` : '確定要刪除這筆紀錄嗎？';
  if(!window.confirm(confirmText)) return;
  try{
    await playRemoveAnimation(btnEl);
    const arr = state.records[key] || [];
    const idx = arr.findIndex(r=>r.id===id);
    if(idx===-1) return;
    const item = arr[idx];
    arr.splice(idx,1);
    const label = (LEAVE_TYPES.find(t=>t.key===key)||{}).label || key;
    registerUndo({ kind:'record', key, item, index: idx, label: `${label} ${toROC(item.date)} ${displayAmount(item)}` });
    await saveState();
    render();
  }catch(err){
    setStatus('刪除失敗：' + (err && err.message ? err.message : String(err)), false);
  }
}

async function undoDelete(){
  if(!lastDeleted) return;
  clearTimeout(lastDeleted.timeoutId);
  // 復原前先確認這筆沒有被別的方式帶回來（例如6秒內剛好雲端同步把它帶回來），不然會出現兩筆一樣id的紀錄，
  // 資料驗證會擋下來，其他裝置就同步不到了
  const itemId = lastDeleted.item && lastDeleted.item.id;
  let reinserted = false;
  if(lastDeleted.kind==='record'){
    if(!state.records[lastDeleted.key]) state.records[lastDeleted.key]=[];
    if(!state.records[lastDeleted.key].some(r=>r.id===itemId)){ state.records[lastDeleted.key].splice(lastDeleted.index,0,lastDeleted.item); reinserted = true; }
  } else {
    if(!state.compRecords.some(r=>r.id===itemId)){ state.compRecords.splice(lastDeleted.index,0,lastDeleted.item); reinserted = true; }
  }
  const undonePhoto = lastDeleted.item && lastDeleted.item.photoUrl;
  if(undonePhoto){
    // 真的加回去了 → 照片要留著；沒加回去（同一筆已經被別的版本帶回來）→ 這張照片可能沒人用了，交給待刪清單判斷（有人用就不會刪）
    if(reinserted) dequeuePhotoDelete(undonePhoto);
    else enqueuePhotoDelete(undonePhoto, 0);
  }
  lastDeleted = null;
  await saveState();
  render();
  if(undonePhoto && !reinserted) processPhotoDeleteQueue();
}

async function applyKwItems(){
  const recordCount = kwPendingItems.filter(it=>it.kind!=='quota').length;
  const quotaItems = kwPendingItems.filter(it=>it.kind==='quota');
  let msg = `確定要新增這 ${kwPendingItems.length} 筆嗎？`;
  if(quotaItems.length>0){
    msg += `\n其中包含 ${quotaItems.length} 筆會直接覆蓋「總天數」設定：\n` +
      quotaItems.map(q=>`・${CUR_YEAR} 年${q.quotaLabel}總天數 → ${fmt(q.total)} 天`).join('\n');
  }
  if(!window.confirm(msg)) return;
  try{
    kwPendingItems.forEach(item=>{
      if(item.kind==='quota'){
        setQuota(item.quotaKey, CUR_YEAR, item.total); // 快速輸入沒有年份，總天數一律設定今年
        return;
      }
      const id = uid();
      if(item.kind==='comp'){
        const category = item.category || 'comp';
        const info = COMP_CATEGORIES[category];
        const rec = { id, type:item.compType, date:item.date, unit:item.unit, amount:Number(item.amount), note:item.note||'', category };
        if(rec.type==='earn'){ rec.expiry = compDefaultExpiry(category, item.date); }
        else if(item.sourceEarnId){ rec.sourceEarnId = item.sourceEarnId; }
        state.compRecords.push(rec);
      } else if(item.kind==='leave'){
        if(!state.records[item.leaveKey]) state.records[item.leaveKey]=[];
        state.records[item.leaveKey].push({ id, date:item.date, unit:item.unit, amount:Number(item.amount), note:item.note||'' });
      }
    });
    kwDraftText = ''; // 已經登記完成，輸入框清空，避免再按一次解析重複登記
    kwPendingItems = [];
    kwUnmatchedLines = [];
    await saveState();
    setStatus('已新增解析出的紀錄', true);
    successConfirm = `已新增 ${recordCount} 筆紀錄`;
    render();
    setTimeout(()=>{ successConfirm = null; render(); }, 450);
  }catch(err){
    setStatus('新增失敗：' + (err && err.message ? err.message : String(err)), false);
  }
}

function saveResetSnapshot(label){
  try{
    // 30分鐘內又重置一次：上一份快照會被這次蓋掉（不能再復原），它清掉的那些照片要先排入待刪，不然會變孤兒
    const prevRaw = localStorage.getItem('resetSnapshot');
    if(prevRaw){ try{ const prev = JSON.parse(prevRaw); expireSnapshotPhotos('resetSnapshot', prev.compRecords); }catch(e){} }
    const snapshot = { time: Date.now(), label, records: state.records, compRecords: state.compRecords };
    localStorage.setItem('resetSnapshot', JSON.stringify(snapshot));
    // 30 分鐘後，如果這份快照還是同一份、也沒被復原，才真的清掉裡面紀錄對應的雲端照片
    setTimeout(()=>{ finalizeResetSnapshotCleanup(snapshot.time); }, 30*60*1000);
  }catch(e){}
}
// 快照過期（不能再復原了）：把「快照裡有、現在的紀錄已經沒在用」的照片排進待刪清單，再移除快照。
// 不管是30分鐘計時器到了、還是App關掉再開時才發現過期，都走這一條，照片不會因為App沒一直開著而被遺忘
function expireSnapshotPhotos(storageKey, snapRecords){
  const oldUrls = (snapRecords||[]).filter(r=>r && r.photoUrl).map(r=>r.photoUrl);
  const currentUrls = new Set((state && state.compRecords||[]).filter(r=>r.photoUrl).map(r=>r.photoUrl));
  oldUrls.filter(u=>!currentUrls.has(u)).forEach(u=>enqueuePhotoDelete(u, 0));
  try{ localStorage.removeItem(storageKey); }catch(e){}
}
async function finalizeResetSnapshotCleanup(snapshotTime){
  try{
    const raw = localStorage.getItem('resetSnapshot');
    if(!raw) return; // 已經被復原、或已經清過了，不用處理
    const snap = JSON.parse(raw);
    if(snap.time !== snapshotTime) return; // 中途又發生過別次重置，這是舊的排程了
    // 重置可能只清某個範圍，快照存的是整份compRecords，所以只處理「重置後真的消失了」的照片
    expireSnapshotPhotos('resetSnapshot', snap.compRecords);
    processPhotoDeleteQueue();
  }catch(e){ console.error('清理重置快照的照片失敗', e); }
}
function getResetSnapshot(){
  try{
    const raw = localStorage.getItem('resetSnapshot');
    if(!raw) return null;
    const snap = JSON.parse(raw);
    if(Date.now() - snap.time > 30*60*1000){ expireSnapshotPhotos('resetSnapshot', snap.compRecords); return null; }
    return snap;
  }catch(e){ return null; }
}
async function restoreResetSnapshot(){
  const snap = getResetSnapshot();
  if(!snap){ setStatus('復原時限已過（30分鐘），或沒有可復原的重置', false); return; }
  if(!window.confirm(`確定要復原「${snap.label}」這次重置嗎？\n（只會把被清除的紀錄加回來，重置之後你新增的其他紀錄不會受影響）`)) return;

  // 用ID比對，只把「快照裡有、但現在不存在」的紀錄加回來，
  // 不去整份覆蓋，這樣重置之後新增的紀錄不會被蓋掉
  let restoredCount = 0;
  Object.keys(snap.records||{}).forEach(key=>{
    if(!state.records[key]) state.records[key] = [];
    const currentIds = new Set(state.records[key].map(r=>r.id));
    (snap.records[key]||[]).forEach(r=>{
      if(!currentIds.has(r.id)){
        state.records[key].push(r);
        restoredCount++;
      }
    });
  });
  const currentCompIds = new Set(state.compRecords.map(r=>r.id));
  (snap.compRecords||[]).forEach(r=>{
    if(!currentCompIds.has(r.id)){
      state.compRecords.push(r);
      restoredCount++;
    }
  });

  // 快照裡「因為同一筆（同id）現在已經有別的版本而沒有加回來」的紀錄，它的照片如果現在沒人用，要排入待刪，不然快照一移除就變孤兒
  const nowUrls = new Set(state.compRecords.filter(r=>r.photoUrl).map(r=>r.photoUrl));
  (snap.compRecords||[]).forEach(r=>{ if(r && r.photoUrl && !nowUrls.has(r.photoUrl)) enqueuePhotoDelete(r.photoUrl, 0); });
  try{ localStorage.removeItem('resetSnapshot'); }catch(e){}
  await saveState();
  render();
  processPhotoDeleteQueue();
  setStatus(`已復原 ${restoredCount} 筆被清除的紀錄`, true);
}

async function resetRecords(scope, key){
  let matcher, scopeLabel;
  if(scope==='day'){
    const d = window.prompt('請輸入要清除的日期（格式 YYYY-MM-DD），例如 2026-07-23', TODAY);
    if(!d) return;
    if(!/^\d{4}-\d{1,2}-\d{1,2}$/.test(d.trim())){ alert('日期格式不對，請用 YYYY-MM-DD'); return; }
    const iso = parseFlexibleDate(d.trim());
    if(!iso){ alert('這不是一個真實存在的日期，請確認月份與日期'); return; }
    matcher = ds => ds===iso;
    scopeLabel = `${toROC(iso)} 當天`;
  } else if(scope==='month'){
    const input = window.prompt('請輸入要清除的年月（格式 YYYY-MM），例如 2026-07', `${selectedYear}-${String(NOW.getMonth()+1).padStart(2,'0')}`);
    if(!input) return;
    if(!/^\d{4}-\d{1,2}$/.test(input.trim())){ alert('格式不對，請用 YYYY-MM'); return; }
    const parts = input.trim().split('-');
    const norm = `${parts[0]}-${parts[1].padStart(2,'0')}`;
    matcher = ds => ds.startsWith(norm);
    scopeLabel = `${norm} 整月`;
  } else if(scope==='year'){
    const input = window.prompt('請輸入要清除的年度（西元），例如 2026', String(selectedYear));
    if(!input) return;
    if(!/^\d{4}$/.test(input.trim())){ alert('格式不對，請輸入 4 位數西元年'); return; }
    matcher = ds => ds.startsWith(input.trim());
    scopeLabel = `西元 ${input.trim()} 年全年`;
  } else {
    matcher = () => true;
    scopeLabel = '全部（不限日期）';
  }

  const keysToClear = key==='ALL' ? LEAVE_TYPES.map(t=>t.key).concat(['comp','exchange','custom']) : [key];
  let count = 0;
  keysToClear.forEach(k=>{
    if(k==='comp' || k==='exchange' || k==='custom'){ count += state.compRecords.filter(r=>(r.category||'comp')===k && matcher(r.date)).length; }
    else { count += (state.records[k]||[]).filter(r=>matcher(r.date)).length; }
  });

  if(count===0){ setStatus('這個範圍內沒有符合的紀錄', false); return; }

  const targetLabel = key==='ALL' ? '所有假別（含補休／換休／其他假別）' : (key==='comp' ? '補休' : key==='exchange' ? '換休' : (key==='custom' ? '其他假別' : ((LEAVE_TYPES.find(t=>t.key===key)||{}).label||key)));
  if(!window.confirm(`確定要清除「${targetLabel}」在 ${scopeLabel} 的 ${count} 筆紀錄嗎？\n（清除前會先自動備份，30分鐘內可以在「設定」頁復原）`)) return;

  saveResetSnapshot(`${targetLabel} - ${scopeLabel}`);

  keysToClear.forEach(k=>{
    if(k==='comp' || k==='exchange' || k==='custom'){ state.compRecords = state.compRecords.filter(r=> !((r.category||'comp')===k && matcher(r.date))); }
    else { state.records[k] = (state.records[k]||[]).filter(r=>!matcher(r.date)); }
  });

  await saveState();
  render();
  setStatus(`已清除 ${count} 筆紀錄`, true);
}

// 上傳補休/換休的證明照片到 Firebase Storage，回傳可以直接看圖的網址
// 沒有登入的話不能上傳（因為要對應到你的帳號底下），會回傳 null
// 上傳前先檢查檔案類型跟大小，選錯馬上知道，不用等上傳到一半才發現
function validatePhotoFile(file){
  const allowedTypes = ['image/jpeg','image/png','image/webp','image/heic','image/heif'];
  // iPhone拍的照片預設就是HEIC格式，但有些情況瀏覽器回報的file.type是空字串或認不得，
  // 這時候退而求其次看副檔名，避免手機直接拍的照片反而傳不上來
  const nameLower = (file.name||'').toLowerCase();
  const looksLikeHeic = nameLower.endsWith('.heic') || nameLower.endsWith('.heif');
  if(!allowedTypes.includes(file.type) && !looksLikeHeic){
    return { valid:false, message:'請選擇圖片格式的檔案（JPG/PNG/WEBP/HEIC）' };
  }
  const maxBytes = 5 * 1024 * 1024;
  if(file.size > maxBytes){
    return { valid:false, message:'照片太大（超過 5MB），請選擇小一點的檔案，或用手機截圖模式重新拍' };
  }
  return { valid:true };
}
async function uploadCompPhoto(file, recordId){
  if(!fbStorage || !currentUser){ return null; }
  const ext = ((file.name.split('.').pop() || 'jpg').toLowerCase().replace(/[^a-z0-9]/g,'') || 'jpg');
  const uniqueSuffix = Date.now().toString(36) + Math.random().toString(36).slice(2,6);
  const path = `leavePassbook/${currentUser.uid}/${recordId}-${uniqueSuffix}.${ext}`;
  const ref = fbStorage.ref().child(path);
  await ref.put(file);
  return await ref.getDownloadURL();
}

// ===== 待刪除照片清單（防止雲端孤兒照片）=====
// 所有「照片要從雲端刪掉」的情況都先記進手機裡的這份清單，真的刪成功（或雲端本來就沒有了）才從清單拿掉。
// 這樣不管是刪到一半App被關掉、離線、還沒登入、網路出錯，下次開App／恢復網路／回到前景／登入時都會再補刪，照片不會被遺忘在雲端。
// 安全規則：真正刪除前一定再檢查一次，只要目前任何紀錄、或還在30分鐘復原期限內的快照、或6秒內可以按「復原」的那筆還在用這張照片，就絕對不刪
const PHOTO_DELETE_QUEUE_KEY = 'pendingPhotoDeletes';
const PHOTO_DELETE_MAX_TRIES = 30;
function loadPhotoDeleteQueue(){
  try{
    const arr = JSON.parse(localStorage.getItem(PHOTO_DELETE_QUEUE_KEY) || '[]');
    return Array.isArray(arr) ? arr.filter(x=>x && typeof x.url==='string' && x.url) : [];
  }catch(e){ return []; }
}
function savePhotoDeleteQueue(q){
  try{ localStorage.setItem(PHOTO_DELETE_QUEUE_KEY, JSON.stringify(q.slice(-500))); }catch(e){}
}
function enqueuePhotoDelete(url, delayMs){
  if(!url) return;
  const q = loadPhotoDeleteQueue();
  const existing = q.find(x=>x.url===url);
  const notBefore = Date.now() + (delayMs||0);
  if(existing){ existing.notBefore = Math.min(existing.notBefore||notBefore, notBefore); }
  else { q.push({ url, notBefore, tries: 0, addedAt: Date.now() }); }
  savePhotoDeleteQueue(q);
}
function dequeuePhotoDelete(url){
  savePhotoDeleteQueue(loadPhotoDeleteQueue().filter(x=>x.url!==url));
}
// 目前「還有人在用」的照片：現有紀錄 + 還能復原的重置快照／還原前快照 + 6秒內還能按復原的那筆
function referencedPhotoUrls(){
  const set = new Set();
  const add = arr => (arr||[]).forEach(r=>{ if(r && r.photoUrl) set.add(r.photoUrl); });
  add(state && state.compRecords);
  try{ const rs = getResetSnapshot(); if(rs) add(rs.compRecords); }catch(e){}
  try{ const ps = getPreRestoreSnapshot(); if(ps && ps.state) add(ps.state.compRecords); }catch(e){}
  if(lastDeleted && lastDeleted.item && lastDeleted.item.photoUrl) set.add(lastDeleted.item.photoUrl);
  return set;
}
// 真的去雲端刪一張：刪成功、或雲端本來就沒有這個檔案（例如另一台裝置已經刪過）都算完成
async function deletePhotoNow(photoUrl){
  try{ await fbStorage.refFromURL(photoUrl).delete(); return true; }
  catch(e){
    if(e && (e.code==='storage/object-not-found' || e.code==='storage/invalid-url' || e.code==='storage/invalid-argument')) return true;
    return false;
  }
}
let photoQueueRunning = false;
let photoQueueRerun = false;
async function processPhotoDeleteQueue(){
  if(photoQueueRunning){ photoQueueRerun = true; return; } // 正在跑：記著跑完再跑一次，不會漏掉這次觸發
  if(!fbStorage || !currentUser || !isOnline) return; // 沒登入／離線時刪不了，留著等之後
  photoQueueRunning = true;
  try{
    const q = loadPhotoDeleteQueue();
    if(!q.length) return;
    const inUse = referencedPhotoUrls();
    const now = Date.now();
    const done = new Set();
    const failed = new Map();
    for(const item of q){
      if((item.notBefore||0) > now) continue; // 還在6秒復原期間
      if(inUse.has(item.url)){
        // 還有紀錄在用（例如按了復原、別台裝置同步回來、或這筆紀錄正在更新中）：絕對不刪，先留在清單等；
        // 連續30天都還在用，代表它確定被用回去了，才從清單拿掉
        if(now - (item.addedAt||now) > 30*24*60*60*1000) done.add(item.url);
        continue;
      }
      // 前面刪別張要等網路，這段期間資料可能變了（例如雲端同步把紀錄帶回來），刪之前再確認一次這張真的沒人用
      if(referencedPhotoUrls().has(item.url)) continue;
      const ok = await deletePhotoNow(item.url);
      if(ok) done.add(item.url);
      else failed.set(item.url, (item.tries||0)+1);
    }
    // 處理期間可能又有新的照片被排進來，要以最新的清單為準合併，不能蓋掉
    const latest = loadPhotoDeleteQueue().filter(x=>!done.has(x.url)).map(x=>{
      if(!failed.has(x.url)) return x;
      const tries = failed.get(x.url);
      if(tries===1) logAppError('照片清理失敗，已排入待刪清單，之後會自動重試', '網址：' + x.url);
      return Object.assign({}, x, { tries });
    });
    // 不設放棄上限：放棄就等於製造孤兒。留在清單裡幾乎不佔空間，每次觸發試一次，總有一次會成功
    // 連續失敗很多次時再提醒一次（例如換了帳號、權限設定被改），方便到Firebase Console查
    latest.filter(x=>failed.has(x.url) && x.tries===PHOTO_DELETE_MAX_TRIES).forEach(x=>logAppError('照片已連續多次刪除失敗，仍會持續自動重試（如果一直失敗，可以到Firebase Console手動處理）', '網址：' + x.url));
    savePhotoDeleteQueue(latest);
  }finally{
    photoQueueRunning = false;
    if(photoQueueRerun){ photoQueueRerun = false; setTimeout(processPhotoDeleteQueue, 0); }
  }
}
// 原本各處呼叫的入口：改成「先排入清單、馬上試著處理」，失敗會留在清單裡之後重試
async function deleteCompPhoto(photoUrl){
  if(!photoUrl) return;
  enqueuePhotoDelete(photoUrl, 0);
  await processPhotoDeleteQueue();
}

// 到期自動清照片：只清「已經過期的補休/換休獲得紀錄」的照片，
// 紀錄本身不會被刪除，只有附件照片會被清掉（因為證明文件過期後通常不用留了）
async function cleanupExpiredCompPhotos(){
  if(!state.autoDeleteExpiredPhotos || !currentUser) return;
  const today = TODAY;
  const GRACE_MONTHS = 6; // 到期後再留6個月緩衝，補休(2年到期)實際會存到2.5年，換休(1年到期)存到1.5年
  // 刻意不管這批還有沒有剩、是不是選了「保留」：到期滿6個月就一律清掉，避免照片長期佔用免費雲端空間
  // （紀錄本身跟剩餘天數都不受影響，只是附件照片不見；清完同時移除紀錄上的照片網址，不會留下指向不存在檔案的連結）
  const expired = state.compRecords.filter(r=> r.type==='earn' && r.photoUrl && r.expiry && addMonths(r.expiry, GRACE_MONTHS) < today);
  if(expired.length===0) return;
  // 先把紀錄上的照片網址拿掉並存檔，再交給待刪清單去刪（刪失敗會自動重試，不會因為網址已經拿掉而被遺忘）
  expired.forEach(r=>{ enqueuePhotoDelete(r.photoUrl, 0); delete r.photoUrl; });
  await saveState(); render();
  processPhotoDeleteQueue();
}

async function addComp(e, category){
  e.preventDefault();
  // 跟addRecord同一個鎖，涵蓋所有「新增紀錄」的表單，避免快速點兩下造成重複送出
  if(isAddingRecord) return;
  isAddingRecord = true;
  category = category || 'comp';
  const info = COMP_CATEGORIES[category];
  try{
    const type = document.getElementById('compType').value;
    const date = parseFlexibleDate(document.getElementById('compDate').value);
    const unit = document.getElementById('compUnit').value;
    const amount = parseFloat(document.getElementById('compAmount').value);
    const expiry = parseFlexibleDate(document.getElementById('compExpiry').value) || null;
    let note = document.getElementById('compNote').value.trim();
    if(!date || !isFinite(amount) || amount<=0){ setStatus('請填寫日期與數量', false); return; }
    const daysEquiv = unit==='hour' ? amount/getHoursPerDay() : amount;
    let manualPins = [];
    if(type==='use'){
      const manualOn = document.getElementById('compManualToggle');
      if(manualOn && manualOn.checked) manualPins = gatherCompSrcPins('compSrcBatchList');
      // 手動模式下，備註只即時顯示使用者自己勾選的那幾筆；如果使用者沒有另外自己改過備註（compNoteTouched還是false），
      // 送出前用同一套FIFO邏輯重新算一次實際會扣到哪些批次，缺口若真的接到手動沒選過的批次，把那筆的備註也一併補進來，
      // 避免存檔後備註跟實際扣款狀況兜不起來
      if(manualPins.length && !compNoteTouched){
        const finalResult = computeUsePreviewHtml(category, amount, unit, manualPins, null, date);
        if(finalResult.fallbackNote){
          note = note ? `${note}｜${finalResult.fallbackNote}` : `使用 ${finalResult.fallbackNote}`;
        }
      }
      const balAsOfDate = compBalanceAsOf(category, date, null);
      if(balAsOfDate - daysEquiv < 0){
        if(!window.confirm(`⚠️ 依日期順序計算，到 ${toROC(date)} 這天為止，${info.label}只累積了 ${fmt(balAsOfDate)} 天（可能是因為這筆使用的日期比對應的獲得日期早），登記後會變負數，仍要登記嗎？`)) return;
      } else {
        // 總數夠，但有一部分是已過期的批次（不會自動扣）：先講清楚，讓使用者決定要不要回去手動指定
        const chk = computeUsePreviewHtml(category, amount, unit, manualPins, null, date);
        if(chk.shortfall>0.0001 && chk.expiredLeft>0.0001){
          if(!window.confirm(`⚠️ 有效的${info.label}不夠扣，還缺 ${fmt(chk.shortfall)} 天。\n已過期的 ${fmt(chk.expiredLeft)} 天不會自動扣抵，如果要用請按「取消」，回去勾選「手動指定」選它。\n\n仍要直接登記嗎？`)) return;
        }
      }
    }
    const id = uid();
    const record = { id, type, date, unit, amount, note, category };
    if(type==='earn' && expiry) record.expiry = expiry;
    if(type==='use' && manualPins.length) record.sourceAllocations = manualPins;
    const photoInput = document.getElementById('compPhotoInput');
    const photoFile = photoInput && photoInput.files && photoInput.files[0];
    const submitBtn = e.submitter || (e.target && e.target.querySelector('button[type="submit"]'));
    if(photoFile){
      const photoCheck = validatePhotoFile(photoFile);
      if(!photoCheck.valid){
        setStatus(`這筆已存，但照片沒有上傳：${photoCheck.message}`, false);
      } else if(!currentUser){
        setStatus('未登入雲端帳號，這筆已存但無法上傳照片（登入後才能使用照片功能）', false);
      } else {
        if(submitBtn){ submitBtn.disabled = true; submitBtn.textContent = '📤 照片上傳中…'; }
        try{
          record.photoUrl = await uploadCompPhoto(photoFile, id);
        }catch(err){
          console.error('照片上傳失敗', err);
          logAppError('補休換休照片上傳失敗', err && err.message ? err.message : String(err));
          setStatus('這筆已存，但照片上傳失敗：' + (err && err.message ? err.message : String(err)), false);
        }
      }
    }
    state.compRecords.push(record);
    lastAddedId = id;
    expandedMonths[`${category}-${date.slice(0,7)}`] = true; // 剛新增的月份要展開，不然還是停在原本展開的那個月，看不到新加的
    state.lastUsedType = category;
    await saveState();
    setStatus(`已登記${info.label}`, true);
    finishAddWithConfirm(`已新增 ${displayAmount(record)}${info.label}`);
  }catch(err){
    setStatus('儲存失敗：' + (err && err.message ? err.message : String(err)), false);
    console.error(err);
  } finally {
    isAddingRecord = false;
  }
}

async function startEditComp(id){
  if(editing && (editing.kind!=='comp' || editing.id!==id)){
    if(!window.confirm('目前正在編輯另一筆，還沒儲存的內容會不見，確定要切換嗎？')) return;
  }
  editing = {kind:'comp', id}; editExpiryTouched = false; delete editPhotoRemoved[id]; render();
}

async function saveEditComp(id, btnEl){
  try{
    const type = document.getElementById(`editCompType-${id}`).value;
    const date = parseFlexibleDate(document.getElementById(`editCompDate-${id}`).value);
    const amount = parseFloat(document.getElementById(`editCompAmount-${id}`).value);
    const unit = document.getElementById(`editCompUnit-${id}`).value;
    const note = document.getElementById(`editCompNote-${id}`).value.trim();
    if(!date || !isFinite(amount) || amount<=0){ setStatus('請填寫正確的日期與數量', false); return; }
    const idx = state.compRecords.findIndex(r=>r.id===id);
    if(idx>-1){
      const category = state.compRecords[idx].category || 'comp';
      const info = COMP_CATEGORIES[category];
      const daysEquiv = unit==='hour' ? amount/getHoursPerDay() : amount;
      if(type==='use'){
        const balAsOfDate = compBalanceAsOf(category, date, id);
        if(balAsOfDate - daysEquiv < 0){
          if(!window.confirm(`⚠️ 依日期順序計算，到 ${toROC(date)} 這天為止，${info.label}只累積了 ${fmt(balAsOfDate)} 天，儲存後會變負數，仍要儲存嗎？`)) return;
        } else {
          const editManualOn = document.getElementById(`editManualToggle-${id}`);
          const editPins = (editManualOn && editManualOn.checked) ? gatherCompSrcPins(`editCompSrcBatchList-${id}`) : [];
          const chk = computeUsePreviewHtml(category, amount, unit, editPins, id, date);
          if(chk.shortfall>0.0001 && chk.expiredLeft>0.0001){
            if(!window.confirm(`⚠️ 有效的${info.label}不夠扣，還缺 ${fmt(chk.shortfall)} 天。\n已過期的 ${fmt(chk.expiredLeft)} 天不會自動扣抵，如果要用請按「取消」，回去勾選「手動指定」選它。\n\n仍要直接儲存嗎？`)) return;
          }
        }
      }
      const updated = Object.assign({}, state.compRecords[idx], {type,date,unit,amount,note});
      delete updated.days;
      if(type==='use'){
        delete updated.sourceEarnId; // 舊欄位一律清掉，改用sourceAllocations
        const manualOn = document.getElementById(`editManualToggle-${id}`);
        if(manualOn && manualOn.checked){
          const pins = gatherCompSrcPins(`editCompSrcBatchList-${id}`);
          if(pins.length){ updated.sourceAllocations = pins; } else { delete updated.sourceAllocations; }
        } else {
          delete updated.sourceAllocations;
        }
        delete updated.expiry;
      } else {
        delete updated.sourceEarnId;
        delete updated.sourceAllocations;
        const expiryEl = document.getElementById(`editCompExpiry-${id}`);
        const expiry = expiryEl ? parseFlexibleDate(expiryEl.value) : null;
        if(expiry){ updated.expiry = expiry; } else { delete updated.expiry; }
        // 改了到期日，之前針對舊到期日做的「保留」決定就不再適用（不然改成未來日期後，自動扣抵還是會一直跳過這批）
        if((updated.expiry||null) !== (state.compRecords[idx].expiry||null)) delete updated.expiryDecision;
      }

      const oldPhotoUrl = updated.photoUrl || null;
      const photoInput = document.getElementById(`editCompPhotoInput-${id}`);
      const newPhotoFile = photoInput && photoInput.files && photoInput.files[0];
      if(newPhotoFile){
        const photoCheck = validatePhotoFile(newPhotoFile);
        if(!photoCheck.valid){
          setStatus(`照片沒有更換：${photoCheck.message}（其他修改已存）`, false);
        } else if(!currentUser){
          setStatus('未登入雲端帳號，無法上傳照片，其他修改已存', false);
        } else {
          if(btnEl){ btnEl.disabled = true; btnEl.textContent = '📤 照片上傳中…'; }
          try{
            updated.photoUrl = await uploadCompPhoto(newPhotoFile, id);
            if(oldPhotoUrl) enqueuePhotoDelete(oldPhotoUrl, 0); // 換照片，舊的排入待刪（等紀錄更新完才真的刪）
          }catch(err){
            console.error('照片上傳失敗', err);
            logAppError('編輯時照片上傳失敗', err && err.message ? err.message : String(err));
            setStatus('照片上傳失敗，其他修改已存：' + (err && err.message ? err.message : String(err)), false);
          }
        }
      } else if(editPhotoRemoved[id] && oldPhotoUrl){
        delete updated.photoUrl;
        enqueuePhotoDelete(oldPhotoUrl, 0);
      }
      delete editPhotoRemoved[id];

      // 上傳照片要等網路，這段期間清單可能變了（例如刪了別筆、或雲端同步把整份資料換掉），
      // 原本記住的位置已經不可靠，一定要用id重新找一次，不然會蓋到別筆紀錄
      const curIdx = state.compRecords.findIndex(r=>r.id===id);
      if(curIdx<0){
        // 這筆在上傳期間已經不在了（被刪除或同步掉），修改不套用；剛上傳的新照片沒有紀錄要用，排入待刪
        if(updated.photoUrl && updated.photoUrl!==oldPhotoUrl) enqueuePhotoDelete(updated.photoUrl, 0);
        editing = null; quickEditModalOpen = null;
        render();
        processPhotoDeleteQueue();
        setStatus('這筆紀錄在儲存期間已被刪除或同步更新，這次修改沒有套用', false);
        return;
      }
      state.compRecords[curIdx] = updated;
      processPhotoDeleteQueue(); // 紀錄已經換成新的，舊照片現在沒人用了才刪
    }
    editing = null;
    quickEditModalOpen = null;
    lastEditedId = id; // 編輯完成後顯示「✓ 已編輯」淡入淡出小標籤，不用會造成視覺失真的放大動畫
    await saveState();
    render();
    setStatus('已更新紀錄', true);
  }catch(err){
    setStatus('更新失敗：' + (err && err.message ? err.message : String(err)), false);
    console.error(err);
  }
}

// 補休/換休/其他假別紀錄的顯示名稱與顏色。其他假別（custom）不在 COMP_CATEGORIES 裡，
// 直接查 COMP_CATEGORIES[category] 會拿到 undefined，接著讀 .label 就會整個畫面報錯，所有「逐筆掃全部 compRecords」的地方都要用這個
function compCategoryInfo(r){
  const category = r.category||'comp';
  if(category==='custom') return { label: r.customLabel || '其他假別', c: 'amber' };
  return COMP_CATEGORIES[category] || COMP_CATEGORIES.comp;
}
function compRecordLabel(r){
  const category = r.category||'comp';
  return category==='custom' ? (r.customLabel || '其他假別') : COMP_CATEGORIES[category].label;
}
async function removeComp(btnEl, id){
  const target0 = state.compRecords.find(r=>r.id===id);
  const confirmText = target0 ? `確定刪除這筆 ${toROC(target0.date)} ${compRecordLabel(target0)} ${displayAmount(target0)}？` : '確定要刪除這筆紀錄嗎？';
  if(!window.confirm(confirmText)) return;
  try{
    await playRemoveAnimation(btnEl);
    const idx = state.compRecords.findIndex(r=>r.id===id);
    if(idx===-1) return;
    const item = state.compRecords[idx];
    state.compRecords.splice(idx,1);
    registerUndo({ kind:'comp', item, index: idx, label: `${compRecordLabel(item)} ${toROC(item.date)} ${displayAmount(item)}` });
    await saveState();
    render();
  }catch(err){
    setStatus('刪除失敗：' + (err && err.message ? err.message : String(err)), false);
  }
}

function getExportFilters(){
  const selectedTypes = Array.from(document.querySelectorAll('.exportTypeChk')).filter(c=>c.checked).map(c=>c.value);
  const startEl = document.getElementById('exportStartDate');
  const endEl = document.getElementById('exportEndDate');
  const start = startEl && startEl.value ? startEl.value : null;
  const end = endEl && endEl.value ? endEl.value : null;
  return { selectedTypes, start, end };
}
function setExportAllTypes(val){
  document.querySelectorAll('.exportTypeChk').forEach(c=>{ c.checked = val; });
}
function inExportRange(dateStr, start, end){
  if(start && dateStr < start) return false;
  if(end && dateStr > end) return false;
  return true;
}

function downloadExcelBackup(){
  try{
    if(typeof XLSX === 'undefined'){ setStatus('Excel 匯出功能載入失敗，請檢查網路連線', false); return; }
    const { selectedTypes, start, end } = getExportFilters();
    if(selectedTypes.length===0){ setStatus('請至少勾選一個假別才能匯出', false); return; }
    const allTypeKeys = LEAVE_TYPES.map(t=>t.key).concat(['comp','exchange','custom']);
    const isFiltered = !!start || !!end || selectedTypes.length < allTypeKeys.length;
    const wb = XLSX.utils.book_new();

    if(!isFiltered){
      // 摘要頁：只有完全沒篩選（全假別、全日期）才附上，因為摘要是全年度總覽，跟局部篩選對不上
      const summaryRows = [['假別','總天數','已使用(天)','剩餘(天)']];
      LEAVE_TYPES.forEach(t=>{
        summaryRows.push([t.label, fmt(getQuota(t.key, CUR_YEAR)), fmt(usedOf(t.key, CUR_YEAR)), fmt(remainOf(t.key, CUR_YEAR))]);
      });
      summaryRows.push(['補休', '', '', fmt(compBalanceUpTo(CUR_YEAR,'comp'))]);
      summaryRows.push(['換休', '', '', fmt(compBalanceUpTo(CUR_YEAR,'exchange'))]);
      const summarySheet = XLSX.utils.aoa_to_sheet(summaryRows);
      XLSX.utils.book_append_sheet(wb, summarySheet, '摘要');
    }

    // 各假別分頁
    LEAVE_TYPES.filter(t=>selectedTypes.includes(t.key)).forEach(t=>{
      const rows = [['日期(民國)','日期(西元)','數量','單位','備註']];
      (state.records[t.key]||[]).filter(r=>inExportRange(r.date, start, end)).slice().sort((a,b)=>a.date.localeCompare(b.date)).forEach(r=>{
        const unit = r.unit==='hour' ? '小時' : '天';
        const amount = r.unit ? r.amount : r.days;
        rows.push([toROC(r.date), r.date, amount, unit, r.note||'']);
      });
      if(rows.length===1 && isFiltered) return; // 篩選後這個假別沒有資料，不產生空分頁
      const sheet = XLSX.utils.aoa_to_sheet(rows);
      XLSX.utils.book_append_sheet(wb, sheet, t.label);
    });

    // 補休／換休分頁
    ['comp','exchange'].filter(cat=>selectedTypes.includes(cat)).forEach(cat=>{
      const info = COMP_CATEGORIES[cat];
      const compRows = [['日期(民國)','日期(西元)','類型','數量','單位','備註','到期日(民國)']];
      state.compRecords.filter(r=>(r.category||'comp')===cat && inExportRange(r.date, start, end)).slice().sort((a,b)=>a.date.localeCompare(b.date)).forEach(r=>{
        const unit = r.unit==='hour' ? '小時' : '天';
        const amount = r.unit ? r.amount : r.days;
        compRows.push([toROC(r.date), r.date, r.type==='earn'?'獲得':'使用', amount, unit, r.note||'', r.expiry? toROC(r.expiry):'']);
      });
      if(compRows.length===1 && isFiltered) return;
      const compSheet = XLSX.utils.aoa_to_sheet(compRows);
      XLSX.utils.book_append_sheet(wb, compSheet, info.label);
    });

    // 其他假別分頁（自訂名目，例如婚假/喪假）：原本完全沒有涵蓋到，用一張合併分頁、多一欄「名目」區分，
    // 不要每個名目各開一張分頁，避免使用者自訂了很多種名目時分頁太多太亂
    if(selectedTypes.includes('custom')){
      const customRows = [['名目','日期(民國)','日期(西元)','類型','數量','單位','備註','到期日(民國)']];
      state.compRecords.filter(r=>(r.category||'comp')==='custom' && inExportRange(r.date, start, end)).slice().sort((a,b)=>a.date.localeCompare(b.date)).forEach(r=>{
        const unit = r.unit==='hour' ? '小時' : '天';
        const amount = r.unit ? r.amount : r.days;
        customRows.push([r.customLabel||'其他假別', toROC(r.date), r.date, r.type==='earn'?'獲得':'使用', amount, unit, r.note||'', r.expiry? toROC(r.expiry):'']);
      });
      if(!(customRows.length===1 && isFiltered)){
        const customSheet = XLSX.utils.aoa_to_sheet(customRows);
        XLSX.utils.book_append_sheet(wb, customSheet, '其他假別');
      }
    }

    if(wb.SheetNames.length===0){ setStatus('篩選範圍內沒有資料可以匯出', false); return; }

    const d = new Date();
    const stamp = d.getFullYear()+String(d.getMonth()+1).padStart(2,'0')+String(d.getDate()).padStart(2,'0');
    const suffix = isFiltered ? '-篩選' : '';
    XLSX.writeFile(wb, `假期存摺備份-${stamp}${suffix}.xlsx`);
    setStatus('已下載 Excel 檔', true);
  }catch(e){
    setStatus('Excel 匯出失敗：' + (e && e.message ? e.message : String(e)), false);
  }
}

function buildFullReportText(){
  const lines = [];
  const now = new Date();
  const stamp = now.getFullYear()+'-'+String(now.getMonth()+1).padStart(2,'0')+'-'+String(now.getDate()).padStart(2,'0')+' '+String(now.getHours()).padStart(2,'0')+':'+String(now.getMinutes()).padStart(2,'0');
  lines.push('📒 假期存摺完整紀錄');
  lines.push('匯出時間：'+stamp);
  lines.push('（含所有年度、所有假別、所有筆數，僅供閱讀與存檔，無法用來還原資料）');
  lines.push('');

  LEAVE_TYPES.forEach(t=>{
    lines.push(`■ ${t.label}`);
    const years = Object.keys(state.quotaByYear).filter(y=> state.quotaByYear[y][t.key]!==undefined).sort();
    if(years.length){
      years.forEach(y=> lines.push(`　${y} 年總天數：${fmt(state.quotaByYear[y][t.key])} 天`));
    }
    const recs = (state.records[t.key]||[]).slice().sort((a,b)=>a.date.localeCompare(b.date));
    if(recs.length===0){ lines.push('　（無使用紀錄）'); }
    else { recs.forEach(r=> lines.push(`　${toROC(r.date)}　用 ${displayAmount(r)}${r.note? '　'+r.note:''}`)); }
    lines.push('');
  });

  ['comp','exchange'].forEach(cat=>{
    const info = COMP_CATEGORIES[cat];
    lines.push(`■ ${info.label}`);
    const compRecs = state.compRecords.filter(r=>(r.category||'comp')===cat).slice().sort((a,b)=>a.date.localeCompare(b.date));
    if(compRecs.length===0){ lines.push('　（無紀錄）'); }
    else {
      compRecs.forEach(r=>{
        let line = `　${toROC(r.date)}　${r.type==='earn'?'獲得':'使用'} ${displayAmount(r)}`;
        if(r.note) line += '　'+r.note;
        if(r.expiry) line += `　（到期：${toROC(r.expiry)}）`;
        lines.push(line);
      });
    }
    lines.push('');
    lines.push(`目前${info.label}結餘：${fmt(compBalanceUpTo(CUR_YEAR,cat))} 天（≈ ${fmt(compBalanceUpTo(CUR_YEAR,cat)*getHoursPerDay())} 小時）`);
    lines.push('');
  });

  // 其他假別（自訂名目，例如婚假/喪假）：原本這裡完全沒有涵蓋到，匯出的「完整紀錄」文字上寫著含所有假別，卻漏了這塊，
  // 用全部compRecords裡出現過的customLabel（不只是還沒用完的），確保完整報表真的完整
  const allCustomLabels = Array.from(new Set(state.compRecords.filter(r=>(r.category||'comp')==='custom' && r.customLabel).map(r=>r.customLabel)));
  if(allCustomLabels.length){
    lines.push('■ 其他假別');
    allCustomLabels.forEach(label=>{
      lines.push(`　【${label}】`);
      const recs = state.compRecords.filter(r=>(r.category||'comp')==='custom' && r.customLabel===label).slice().sort((a,b)=>a.date.localeCompare(b.date));
      recs.forEach(r=>{
        let line = `　　${toROC(r.date)}　${r.type==='earn'?'獲得':'使用'} ${displayAmount(r)}`;
        if(r.note) line += '　'+r.note;
        if(r.expiry) line += `　（到期：${toROC(r.expiry)}）`;
        lines.push(line);
      });
      lines.push(`　　目前結餘：${fmt(compBalanceUpTo(CUR_YEAR,'custom',label))} 天`);
    });
    lines.push('');
  }

  return lines.join('\n');
}

async function copyFullReport(btnEl){
  const text = buildFullReportText();
  try{
    await navigator.clipboard.writeText(text);
    setStatus('已複製完整文字紀錄', true);
    if(btnEl){ const orig = btnEl.textContent; btnEl.textContent = '✓ 已複製'; setTimeout(()=>{ btnEl.textContent = orig; }, 1500); }
  }catch(err){
    document.getElementById('fullReportText').value = text;
    document.getElementById('fullReportArea').style.display = 'block';
    setStatus('請手動選取下方文字並複製', false);
  }
}

function downloadFullReport(){
  try{
    const text = buildFullReportText();
    const blob = new Blob([text], {type:'text/plain;charset=utf-8'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    const d = new Date();
    const stamp = d.getFullYear()+String(d.getMonth()+1).padStart(2,'0')+String(d.getDate()).padStart(2,'0');
    a.href = url; a.download = `假期存摺完整紀錄-${stamp}.txt`;
    document.body.appendChild(a); a.click(); a.remove();
    URL.revokeObjectURL(url);
    setStatus('已下載完整報表', true);
  }catch(e){ setStatus('下載失敗，請改用「複製完整文字」', false); }
}

function buildSummaryText(){
  const lines = [];
  const now = new Date();
  const stamp = now.getFullYear()+'-'+String(now.getMonth()+1).padStart(2,'0')+'-'+String(now.getDate()).padStart(2,'0')+' '+String(now.getHours()).padStart(2,'0')+':'+String(now.getMinutes()).padStart(2,'0');
  lines.push('📒 假期存摺摘要');
  lines.push('更新時間：'+stamp);
  lines.push('');
  LEAVE_TYPES.forEach(t=>{
    lines.push(`${t.label}：剩餘 ${fmt(remainOf(t.key, CUR_YEAR))} 天（共 ${fmt(getQuota(t.key, CUR_YEAR))} 天）`);
  });
  lines.push(`補休：結餘 ${fmt(compBalanceUpTo(CUR_YEAR,'comp'))} 天（≈ ${fmt(compBalanceUpTo(CUR_YEAR,'comp')*getHoursPerDay())} 小時）`);
  lines.push(`換休：結餘 ${fmt(compBalanceUpTo(CUR_YEAR,'exchange'))} 天（≈ ${fmt(compBalanceUpTo(CUR_YEAR,'exchange')*getHoursPerDay())} 小時）`);
  lines.push('');
  lines.push('最近紀錄：');
  const combined = [];
  LEAVE_TYPES.forEach(t=>{
    (state.records[t.key]||[]).forEach(r=> combined.push({date:r.date, text:`${t.label} 用 ${displayAmount(r)}${r.note? '　'+r.note:''}`}));
  });
  state.compRecords.forEach(r=>{
    const info = compCategoryInfo(r);
    combined.push({date:r.date, text:`${info.label} ${r.type==='earn'?'獲得':'使用'} ${displayAmount(r)}${r.note? '　'+r.note:''}`});
  });
  combined.sort((a,b)=> b.date.localeCompare(a.date));
  if(combined.length===0){ lines.push('（尚無紀錄）'); }
  else { combined.slice(0,10).forEach(c=> lines.push(`${toROC(c.date)}　${c.text}`)); }
  return lines.join('\n');
}

function backupJson(){ return JSON.stringify(state, null, 2); }

async function emailBackup(){
  try{
    const text = backupJson();
    const d = new Date();
    const stamp = d.getFullYear()+String(d.getMonth()+1).padStart(2,'0')+String(d.getDate()).padStart(2,'0');
    const filename = `假期存摺備份-${stamp}.json`;
    if(navigator.canShare && navigator.share){
      try{
        const file = new File([text], filename, {type:'application/json'});
        if(navigator.canShare({files:[file]})){
          await navigator.share({ files:[file], title:'假期存摺備份', text:'假期存摺備份檔，可選「郵件」寄給自己保存' });
          setStatus('已開啟分享選單，選「郵件」即可用附件寄出', true);
          return;
        }
      }catch(e){
        if(e && e.name === 'AbortError'){ return; }
        // 分享檔案失敗就往下走 mailto 備援
      }
    }
    // 備援：郵件內文放不下完整備份，改用 mailto 開信件並提示手動附加
    const subject = encodeURIComponent('假期存摺備份 - ' + stamp);
    const body = encodeURIComponent('備份資料量較大，無法直接放進郵件內文寄出。\n\n請先在「設定」分頁點「下載備份檔」或「複製備份文字」，再手動附加檔案或貼上到這封信裡寄給自己保存。');
    window.location.href = `mailto:?subject=${subject}&body=${body}`;
  }catch(e){
    setStatus('開啟郵件失敗：' + (e && e.message ? e.message : String(e)), false);
  }
}

function downloadBackup(){
  try{
    const blob = new Blob([backupJson()], {type:'application/json'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    const d = new Date();
    const stamp = d.getFullYear()+String(d.getMonth()+1).padStart(2,'0')+String(d.getDate()).padStart(2,'0');
    a.href = url; a.download = `假期存摺備份-${stamp}.json`;
    document.body.appendChild(a); a.click(); a.remove();
    URL.revokeObjectURL(url);
    setStatus('已下載備份檔', true);
  }catch(e){ setStatus('下載失敗，請改用「複製備份文字」', false); }
}

function savePreRestoreSnapshot(){
  try{
    // 30分鐘內又還原一次：上一份還原前快照會被蓋掉，它引用、現在已經沒人用的照片先排入待刪
    const prevRaw = localStorage.getItem('preRestoreSnapshot');
    if(prevRaw){ try{ const prev = JSON.parse(prevRaw); expireSnapshotPhotos('preRestoreSnapshot', prev.state && prev.state.compRecords); }catch(e){} }
    const snapshot = { time: Date.now(), state: state };
    localStorage.setItem('preRestoreSnapshot', JSON.stringify(snapshot));
    // 跟重置快照用同一套邏輯：30分鐘後主動清掉，不是等使用者剛好再打開設定頁才順便清，
    // 不然快照可能永遠留在手機裡；同時把「還原前」那份資料裡、現在已經沒有任何紀錄在用的照片視為孤兒，一併從雲端清掉
    setTimeout(()=>{ finalizePreRestoreSnapshotCleanup(snapshot.time); }, 30*60*1000);
  }catch(e){ /* 存不下去就算了，不影響還原本身，只是少了這層保險 */ }
}
async function finalizePreRestoreSnapshotCleanup(snapshotTime){
  try{
    const raw = localStorage.getItem('preRestoreSnapshot');
    if(!raw) return; // 已經被復原、或已經清過了，不用處理
    const snap = JSON.parse(raw);
    if(snap.time !== snapshotTime) return; // 中途又發生過別次還原，這是舊的排程了，不要誤刪新快照
    // 「還原前」那份資料裡引用的照片，如果現在（還原後、使用者沒有反悔）已經沒有任何一筆紀錄還在用，就是孤兒照片，清掉
    expireSnapshotPhotos('preRestoreSnapshot', snap.state && snap.state.compRecords);
    processPhotoDeleteQueue();
  }catch(e){ console.error('清理還原前快照的照片失敗', e); }
}
function getPreRestoreSnapshot(){
  try{
    const raw = localStorage.getItem('preRestoreSnapshot');
    if(!raw) return null;
    const snap = JSON.parse(raw);
    if(Date.now() - snap.time > 30*60*1000){ expireSnapshotPhotos('preRestoreSnapshot', snap.state && snap.state.compRecords); return null; } // 跟重置的復原視窗一樣是30分鐘
    return snap;
  }catch(e){ return null; }
}
// 「復原還原前版本」是整包換回去，不是像重置復原那樣一筆一筆比對加回來——
// 因為「還原」本來就是整包取代，要復原也應該是整包換回原本那份，這樣才符合使用者「反悔剛才那次還原」的預期
async function restorePreRestoreSnapshot(){
  const snap = getPreRestoreSnapshot();
  if(!snap){ setStatus('復原時限已過（30分鐘），或沒有可復原的還原前版本', false); return; }
  if(!window.confirm('確定要復原到「還原備份」之前的版本嗎？\n（這會把剛才還原進來的資料整個換掉，改回還原前的樣子）')) return;
  // 整份換回去之前，記下「現在這份」用到的照片；換回去後沒人用的（例如還原後才新增的紀錄的照片）排入待刪
  const discardedUrls = (state.compRecords||[]).filter(r=>r.photoUrl).map(r=>r.photoUrl);
  state = snap.state;
  state.records = Object.assign(defaultState().records, state.records||{});
  try{ localStorage.removeItem('preRestoreSnapshot'); }catch(e){}
  const keptUrls = new Set((state.compRecords||[]).filter(r=>r.photoUrl).map(r=>r.photoUrl));
  discardedUrls.filter(u=>!keptUrls.has(u)).forEach(u=>enqueuePhotoDelete(u, 0));
  await saveState();
  render();
  processPhotoDeleteQueue();
  setStatus('已復原到還原備份之前的版本', true);
}
async function restoreBackup(){
  const raw = document.getElementById('importText').value.trim();
  if(!raw){ setStatus('請先貼上備份內容', false); return; }
  try{
    const parsed = JSON.parse(raw);
    if(!parsed.records){ throw new Error('格式不符'); }
    const check = validateState(parsed);
    if(!check.valid){
      const preview = check.errors.slice(0,5).join('\n');
      const more = check.errors.length>5 ? `\n…等共 ${check.errors.length} 個問題` : '';
      window.alert(`⚠️ 這份備份資料有問題，沒有匯入：\n\n${preview}${more}\n\n請確認貼上的是完整、沒有被修改過的備份內容。`);
      setStatus('匯入失敗：資料內容有問題', false);
      return;
    }
    savePreRestoreSnapshot(); // 先把現在這份存起來，萬一還原錯了、或還原完發現不是想要的那份，30分鐘內都可以換回來
    state = Object.assign(defaultState(), parsed);
    state.records = Object.assign(defaultState().records, parsed.records||{}); // 缺少的假別補回空陣列
    lastDeleted = null; editing = null; searchQuery=''; sortAsc=false; expandedMonths={};
    selectedYear = CUR_YEAR; calendarMode=false; chartMode=false;
    state.calendarMode = false; state.chartMode = false;
    await saveState();
    render();
    setStatus('已還原備份資料', true);
  }catch(e){ setStatus('還原失敗，請確認貼上的內容是完整的備份 JSON', false); }
}

// 網址加上 ?resetScale=1 可以強制把「畫面大小」設定清回預設值1倍，不動到其他任何資料（假別紀錄、設定都不受影響）。
// 用途：某些預覽/測試環境的 localStorage 會跨檔案殘留上次存的縮放設定，讓畫面看起來卡住停在舊的大小，這個提供一個安全的手動重置方式
async function checkResetScaleParam(){
  try{
    if(new URLSearchParams(window.location.search).get('resetScale')!=='1') return false;
    state.uiScale = 1;
    await saveState();
    const url = new URL(window.location.href);
    url.searchParams.delete('resetScale');
    window.history.replaceState({}, '', url); // 清掉網址上的參數，重新整理或分享網址時不會又觸發一次
    return true;
  }catch(e){ return false; } // 不支援URLSearchParams的極舊瀏覽器就算了，不影響其他功能
}

  initFirebase();
  completeEmailLinkSignIn();
  if('serviceWorker' in navigator){
    navigator.serviceWorker.register('sw.js').catch(e=>console.error('Service Worker 註冊失敗', e));
  }
})();
