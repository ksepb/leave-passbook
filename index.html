<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>假期存摺</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#2F5D50">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="假期存摺">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;700;900&family=Noto+Sans+TC:wght@400;500;700&family=IBM+Plex+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#F3EFE4;
    --paper-deep:#EAE3D2;
    --ink:#2B2A28;
    --ink-soft:#6B6459;
    --jade:#2F5D50; --jade-soft:#DDE8E2;
    --brick:#A03B3B; --brick-soft:#F1DFDA;
    --blue:#355E7A; --blue-soft:#DCE6EC;
    --olive:#7C7530; --olive-soft:#EAE7D3;
    --plum:#7A4B6B; --plum-soft:#EDDEE7;
    --rust:#A8592F; --rust-soft:#F1DDCC;
    --rose:#A8456B; --rose-soft:#F2DDE6;
    --teal:#2A7A75; --teal-soft:#DBEBE9;
    --line:#C9C2B0;
    --amber:#B5761A;
  }
  *{box-sizing:border-box;}
  html{touch-action:manipulation;}
  body{
    margin:0; background:var(--paper);
    background-image:radial-gradient(circle at 1px 1px, rgba(43,42,40,.07) 1px, transparent 0);
    background-size:24px 24px;
    color:var(--ink); font-family:'Noto Sans TC', sans-serif;
    padding:24px 16px calc(86px + env(safe-area-inset-bottom)); min-height:100vh;
  }
  .wrap{max-width:760px;margin:0 auto;}
  .bottom-nav{
    position:fixed; left:0; right:0; bottom:0; z-index:50;
    display:flex; justify-content:space-around; align-items:center;
    background:rgba(255,253,248,.97); -webkit-backdrop-filter:blur(10px); backdrop-filter:blur(10px);
    border-top:1px solid var(--line);
    padding:12px 8px calc(12px + env(safe-area-inset-bottom));
    box-shadow:0 -4px 16px rgba(43,42,40,.08);
  }
  .nav-item{
    flex:1; display:flex; flex-direction:column; align-items:center; gap:5px;
    background:none; border:none; padding:6px 4px; color:var(--ink-soft);
    font-family:'Noto Sans TC',sans-serif; font-weight:700; font-size:14px;
    border-radius:16px; transition:color .15s ease;
  }
  .nav-item .nav-icon-wrap{
    width:52px; height:44px; border-radius:16px;
    display:flex; align-items:center; justify-content:center;
    transition:background .15s ease, transform .15s ease;
  }
  .nav-item .nav-icon{font-size:28px; line-height:1;}
  .nav-item.active{color:var(--jade);}
  .nav-item.active .nav-icon-wrap{background:var(--jade-soft);}
  .nav-item:active .nav-icon-wrap{transform:scale(.9);}
  header{text-align:center;margin-bottom:24px;}
  header .eyebrow{font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:.18em;color:var(--ink-soft);text-transform:uppercase;}
  header h1{font-family:'Noto Serif TC',serif;font-weight:900;font-size:30px;margin:6px 0 2px;letter-spacing:.06em;}
  header p.sub{font-size:14px;color:var(--ink-soft);margin:0;}
  header p.sub-lead{font-size:14px;color:var(--ink-soft);margin:6px 0 10px;}
  header p.sub-foot{font-size:11.5px;color:var(--ink-soft);margin:10px 0 0;letter-spacing:.02em;}
  .home-chips{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin:0 auto;max-width:320px;}
  .chip{display:inline-flex;align-items:center;gap:4px;padding:5px 13px;border-radius:20px;font-family:'Noto Sans TC',sans-serif;font-size:12px;font-weight:500;color:var(--ink-soft);background:rgba(255,255,255,.5);border:1px solid var(--line);}

  .undo-bar{background:#3A2F22;color:#fff;padding:10px 14px;border-radius:6px;font-size:14px;display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:16px;flex-wrap:wrap;}
  .undo-bar button{background:var(--amber);padding:5px 10px;font-size:12px;}

  .reminder-bar{background:#FDF1DC;border:1px solid var(--amber);color:#6b4a12;padding:10px 14px;border-radius:6px;font-size:14px;margin-bottom:16px;line-height:1.7;}
  .reminder-bar strong{display:block;margin-bottom:4px;font-size:13px;}

  .stamps{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-bottom:20px;align-items:start;}
  .stamp-card{position:relative;background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px 16px 16px;overflow:hidden;box-shadow:0 2px 6px rgba(43,42,40,.05);cursor:pointer;transition:transform .12s ease, box-shadow .12s ease;}
  .stamp-card:active{transform:scale(.97);}
  .stamp-card .label{font-size:11px;color:var(--ink-soft);letter-spacing:.03em;}
  .stamp-card .num{font-family:'IBM Plex Mono',monospace;font-size:22px;font-weight:700;line-height:1.15;margin-top:8px;white-space:nowrap;}
  .stamp-card .num small{font-size:11px;font-weight:500;color:var(--ink-soft);display:block;margin-top:8px;line-height:1.5;}
  .mini-chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:10px;}
  .mini-chip{font-size:10.5px;font-weight:700;padding:3px 8px;border-radius:8px;white-space:nowrap;}
  .hour-inline{font-family:'IBM Plex Mono',monospace;font-size:13.5px;font-weight:700;color:var(--amber);vertical-align:middle;}
  .stamp-card.warn .num{color:var(--amber);}
  .seal{position:absolute;right:-8px;top:-8px;width:56px;height:56px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:'Noto Serif TC',serif;font-weight:900;font-size:18px;transform:rotate(-12deg);opacity:.8;border:2px solid currentColor;}
  .seal::after{content:'';position:absolute;inset:4px;border:1px solid currentColor;border-radius:50%;opacity:.6;}
  .c-jade{color:var(--jade);} .c-brick{color:var(--brick);} .c-blue{color:var(--blue);} .c-olive{color:var(--olive);} .c-plum{color:var(--plum);} .c-rust{color:var(--rust);} .c-rose{color:var(--rose);} .c-teal{color:var(--teal);}
  .c-jade-bg{background:var(--jade);} .c-brick-bg{background:var(--brick);} .c-blue-bg{background:var(--blue);} .c-olive-bg{background:var(--olive);} .c-plum-bg{background:var(--plum);} .c-rust-bg{background:var(--rust);} .c-rose-bg{background:var(--rose);} .c-teal-bg{background:var(--teal);}

  .dashboard{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-bottom:18px;}
  .dash-card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px 14px;text-align:center;}
  .dash-card .label{font-size:11px;color:var(--ink-soft);}
  .dash-card .num{font-family:'IBM Plex Mono',monospace;font-size:20px;font-weight:700;margin-top:4px;}

  .toolbar{background:rgba(255,255,255,.7);border:1px solid var(--line);border-radius:6px;padding:12px 14px;margin:10px 0 18px;}
  .toolbar-row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;}
  .toolbar-row + .toolbar-row{margin-top:10px;padding-top:10px;border-top:1px dashed var(--line);}
  .toolbar-row input[type=text]{flex:1;min-width:160px;font-family:'Noto Sans TC',sans-serif;font-size:16px;padding:8px 10px;border:1px solid var(--line);border-radius:4px;background:#fff;color:var(--ink);}
  .year-switch{display:flex;align-items:center;gap:6px;}
  .year-switch button.sortbtn{width:38px;height:38px;padding:0;min-height:0;display:flex;align-items:center;justify-content:center;font-size:19px;font-weight:900;color:var(--jade);background:var(--jade-soft);border-color:var(--jade-soft);border-radius:50%;}
  .view-toggles{display:flex;gap:8px;}
  .view-toggles button{flex:1;}
  button.sortbtn{background:#fff;color:var(--ink-soft);border:1px solid var(--line);font-weight:500;padding:9px 14px;min-height:38px;}
  .year-label{font-family:'IBM Plex Mono',monospace;font-weight:700;min-width:64px;text-align:center;}
  .section-label{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.14em;color:var(--ink-soft);text-transform:uppercase;margin:6px 2px 10px;}
  .leave-tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px;}
  .leave-tab{font-family:'Noto Sans TC',sans-serif;font-size:13px;font-weight:700;padding:9px 16px;border-radius:20px;border:1px solid var(--line);cursor:pointer;transition:transform .1s ease;}
  .leave-tab:active{transform:scale(.96);}
  .manage-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:20px;}
  @media(max-width:620px){.manage-grid{grid-template-columns:1fr;}}

  section.block{background:rgba(255,255,255,.85);border:1px solid var(--line);border-radius:16px;padding:18px 16px 20px;margin-bottom:20px;}
  section.block h2{font-family:'Noto Serif TC',serif;font-size:17px;margin:0 0 12px;display:flex;align-items:center;gap:8px;}
  section.block h2 .dot{width:9px;height:9px;border-radius:50%;display:inline-block;}
  .dot-jade{background:var(--jade);} .dot-brick{background:var(--brick);} .dot-blue{background:var(--blue);} .dot-olive{background:var(--olive);} .dot-plum{background:var(--plum);} .dot-rust{background:var(--rust);} .dot-rose{background:var(--rose);} .dot-teal{background:var(--teal);}

  form.entry{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px;align-items:flex-end;}
  .field{display:flex;flex-direction:column;gap:4px;flex:1;min-width:110px;}
  .field label{font-size:11px;color:var(--ink-soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .field input,.field select{font-family:'IBM Plex Mono',monospace;font-size:16px;padding:8px 12px;min-height:38px;border:1px solid var(--line);border-radius:10px;background-color:#fdfcf9;color:var(--ink);font-weight:600;transition:border-color .15s ease, box-shadow .15s ease, background-color .15s ease;box-sizing:border-box;}
  select{
    -webkit-appearance:none; appearance:none;
    background-image:url("data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAyNCAyNCI+PHBhdGggZD0iTTUgOWw3IDcgNy03IiBmaWxsPSJub25lIiBzdHJva2U9IiMyRjVENTAiIHN0cm9rZS13aWR0aD0iMy41IiBzdHJva2UtbGluZWNhcD0icm91bmQiIHN0cm9rZS1saW5lam9pbj0icm91bmQiLz48L3N2Zz4=");
    background-repeat:no-repeat; background-position:right 9px center; background-size:19px;
    padding-right:34px !important;
  }
  .field input:focus,.field select:focus{background-color:#fff;}
  .field input:focus,.field select:focus{outline:none;border-color:var(--jade);box-shadow:0 0 0 3px var(--jade-soft);}
  .field.note{flex:2;min-width:140px;}
  .form-row{display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end;flex:1 1 100%;margin-bottom:2px;}
  .quickdays{display:flex;gap:6px;}
  .quickdays button{padding:8px 9px;min-height:38px;min-width:32px;font-size:11.5px;background:transparent;color:var(--ink-soft);border:1px solid var(--line);border-radius:10px;font-weight:600;box-sizing:border-box;}
  .quickdays button:active{color:var(--jade);border-color:var(--jade);}
  .days-row{display:flex;gap:6px;align-items:center;}
  .date-row{display:flex;gap:6px;align-items:center;flex-wrap:wrap;}
  .date-row input{flex:1;min-width:130px;}
  .date-toggle{padding:8px 9px;min-height:38px;min-width:32px;font-size:11.5px;background:transparent;color:var(--ink-soft);border:1px solid var(--line);border-radius:10px;font-weight:600;flex:none;box-sizing:border-box;}
  .date-toggle:active{color:var(--jade);border-color:var(--jade);}
  .days-row input[type=number]{width:66px;flex:none;border-radius:12px;}
  .field-days{flex:1 1 220px;min-width:220px;}
  button{font-family:'Noto Sans TC',sans-serif;font-size:13px;font-weight:700;padding:9px 16px;border:none;border-radius:14px;cursor:pointer;color:#fff;transition:transform .1s ease, opacity .15s ease;}
  button:active{transform:scale(.96);}
  .btn-jade{background:var(--jade);} .btn-brick{background:var(--brick);} .btn-blue{background:var(--blue);} .btn-olive{background:var(--olive);} .btn-plum{background:var(--plum);} .btn-rust{background:var(--rust);} .btn-rose{background:var(--rose);} .btn-teal{background:var(--teal);}
  button.ghost{background:transparent;color:var(--ink-soft);border:1px solid var(--line);font-weight:500;}

  .total-row{display:flex;gap:8px;align-items:flex-end;margin-bottom:16px;padding-bottom:14px;border-bottom:1px dashed var(--line);flex-wrap:wrap;}
  .hint{font-size:14px;color:var(--ink-soft);line-height:1.6;}
  .total-row .hint{flex-basis:100%;margin-top:-2px;}

  ul.ledger{list-style:none;margin:0;padding:0;}
  ul.ledger li{display:block;padding:11px 12px;border:1px solid var(--line);border-radius:12px;background:#fff;font-size:14px;margin-bottom:8px;}
  ul.ledger li:last-child{margin-bottom:0;}
  ul.ledger .ledger-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
  ul.ledger .ledger-bottom{display:flex;align-items:center;gap:8px;margin-top:8px;}
  ul.ledger .d{font-family:'IBM Plex Mono',monospace;color:var(--ink-soft);font-size:12px;}
  ul.ledger .tag{font-family:'IBM Plex Mono',monospace;font-size:11px;font-weight:600;padding:2px 6px;border-radius:3px;text-align:center;}
  ul.ledger .days{font-family:'IBM Plex Mono',monospace;font-weight:700;}
  ul.ledger .note{color:var(--ink);font-weight:600;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%;}
  ul.ledger .expiry{font-size:10.5px;color:var(--amber);font-family:'IBM Plex Mono',monospace;flex:1;}
  ul.ledger .ledger-actions{display:flex;gap:8px;margin-left:auto;flex:none;}
  ul.ledger .del{background:#fff;border:1.5px solid var(--line);border-radius:12px;color:var(--ink-soft);font-size:12px;font-weight:700;cursor:pointer;padding:8px 11px;min-height:36px;line-height:1;display:inline-flex;align-items:center;gap:4px;}
  ul.ledger li.editrow{display:flex;flex-wrap:wrap;align-items:center;background:#fffaf0;border-radius:4px;padding:8px;gap:6px;}
  li.editrow input,li.editrow select{font-family:'Noto Sans TC',sans-serif;font-size:16px;padding:7px 10px;border:1.5px solid var(--line);border-radius:12px;}
  .empty{font-size:14px;color:var(--ink-soft);padding:14px 2px;line-height:1.6;text-align:center;}

  @keyframes stampIn{0%{transform:scale(1.5) rotate(-6deg);opacity:0;}60%{transform:scale(.96) rotate(1deg);opacity:1;}100%{transform:scale(1) rotate(0);}}
  li.stamp-in{animation:stampIn .32s ease-out;}
  @keyframes fadeOutRemove{to{opacity:0;transform:scale(.92) translateX(10px);}}
  ul.ledger li.removing{animation:fadeOutRemove .2s ease-in forwards;pointer-events:none;}

  .cal-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
  .cal-title{font-family:'Noto Serif TC',serif;font-weight:700;font-size:15px;}
  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;}
  .cal-weekdays{margin-bottom:4px;font-size:11px;color:var(--ink-soft);text-align:center;}
  .cal-cell{min-height:52px;border:1px solid var(--line);border-radius:4px;padding:3px;background:#fff;}
  .cal-cell.empty{border:none;background:transparent;}
  .cal-cell.today{border-color:var(--jade);box-shadow:0 0 0 1px var(--jade) inset;}
  .cal-daynum{font-size:10px;color:var(--ink-soft);}
  .cal-dots{display:flex;flex-wrap:wrap;gap:2px;margin-top:2px;}
  .cal-dot{display:inline-flex;align-items:center;justify-content:center;width:15px;height:15px;border-radius:50%;font-size:8px;font-weight:700;color:#fff;}

  .chart-wrap{display:flex;gap:5px;align-items:flex-end;height:150px;padding:8px 2px 0;overflow-x:auto;}
  .chart-col{flex:1;min-width:20px;display:flex;flex-direction:column;align-items:center;}
  .chart-bar-track{width:100%;max-width:24px;height:130px;display:flex;flex-direction:column-reverse;background:var(--paper-deep);border-radius:2px 2px 0 0;overflow:hidden;}
  .chart-seg{width:100%;}
  .chart-label{font-size:9.5px;color:var(--ink-soft);margin-top:4px;}
  .chart-total{font-size:9px;color:var(--ink-soft);font-family:'IBM Plex Mono',monospace;}
  .chart-legend{display:flex;flex-wrap:wrap;gap:10px;margin-top:12px;font-size:11px;color:var(--ink-soft);}
  .legend-item{display:flex;align-items:center;gap:4px;}
  .legend-dot{width:9px;height:9px;border-radius:50%;display:inline-block;}

  .backup{background:rgba(255,255,255,.85);border:1px solid var(--line);border-radius:16px;padding:18px 16px 20px;}
  .backup.danger-zone{border-color:var(--brick);background:rgba(241,223,218,.5);margin-bottom:20px;}
  .backup.danger-zone h2{color:var(--brick);}
  .month-group{margin-bottom:10px;}
  .month-group:last-child{margin-bottom:0;}
  .month-header{width:100%;display:flex;align-items:center;gap:8px;border-radius:10px 10px 0 0;padding:10px 12px;color:var(--ink);text-align:left;transition:background .15s ease, border-color .15s ease;}
  .month-header.month-header-closed{background:linear-gradient(135deg, #F6EAD2, var(--paper-deep));border:1px solid #E4D3A8;border-radius:10px;}
  .month-header.month-header-open{background:linear-gradient(135deg, #DCEAE4, var(--paper-deep));border:1px solid #B9D6C9;border-bottom:none;}
  .month-header .month-title{font-family:'Noto Serif TC',serif;font-weight:700;font-size:13.5px;}
  .month-header .month-meta{font-size:11.5px;color:var(--ink-soft);font-family:'IBM Plex Mono',monospace;margin-left:auto;}
  .month-header .chevron{display:flex;align-items:center;justify-content:center;width:32px;height:32px;border-radius:50%;flex:none;background:#fff;box-shadow:0 1px 3px rgba(43,42,40,.15);}
  .month-header .chevron svg{display:block;}
  .month-header .chevron-open{color:var(--jade);border:2px solid var(--jade);}
  .month-header .chevron-closed{color:var(--amber);border:2px solid var(--amber);}
  .month-body{background:#EFF6F3;border:1px solid #B9D6C9;border-top:none;border-radius:0 0 10px 10px;padding:10px 8px 4px;}
  .month-body ul.ledger{margin:0;}
  .month-group .ledger{margin-top:8px;}
  .reset-row{display:flex;align-items:center;gap:8px;margin-top:12px;padding-top:12px;border-top:1px dashed var(--line);flex-wrap:wrap;}
  .history-divider{display:flex;align-items:center;text-align:center;color:var(--ink-soft);font-size:12px;font-weight:600;margin:20px 0 14px;}
  .history-divider::before,.history-divider::after{content:'';flex:1;border-top:1px dashed var(--line);}
  .history-divider span{padding:0 10px;white-space:nowrap;}
  .kw-examples{display:flex;flex-direction:column;gap:8px;margin-bottom:18px;}
  .kw-example{border-left:3px solid var(--line);background:rgba(255,255,255,.55);border-radius:0 10px 10px 0;padding:9px 12px;}
  .kw-example-code{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:5px;}
  .kw-example-desc{font-size:12.5px;color:var(--ink-soft);line-height:1.6;}
  .kw-code{font-family:'IBM Plex Mono',monospace;font-size:12px;font-weight:700;padding:3px 8px;border-radius:6px;white-space:nowrap;display:inline-block;}
  .reset-label{font-size:12px;color:var(--ink-soft);}
  .reset-row select{font-family:'Noto Sans TC',sans-serif;font-size:12.5px;padding:6px 7px;border:1px solid var(--line);border-radius:4px;background:#fff;color:var(--ink);}
  .danger-btn{background:#fff;color:var(--brick);border:1px solid var(--brick);font-weight:700;padding:8px 14px;min-height:38px;font-size:12.5px;}
  .backup h2{font-family:'Noto Serif TC',serif;font-size:16px;margin:0 0 6px;}
  .backup p{font-size:14px;color:var(--ink-soft);margin:0 0 12px;line-height:1.6;}
  .backup .row{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px;}
  textarea{width:100%;font-family:'IBM Plex Mono',monospace;font-size:16px;border:1px solid var(--line);border-radius:4px;padding:8px;background:#fdfcf9;color:var(--ink-soft);resize:vertical;}
  .status{font-size:12px;margin-top:8px;min-height:16px;}
  .status.ok{color:var(--jade);}
  .status.err{color:var(--brick);}
  .loading{text-align:center;padding:60px 0;color:var(--ink-soft);font-size:13px;}
</style>
<script src="https://www.gstatic.com/firebasejs/12.16.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.16.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.16.0/firebase-firestore-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
</head>
<body>
<div class="wrap" id="app">
  <div class="loading" id="loading">載入存摺資料中…</div>
</div>

<script>
const APP_VERSION = 'v2026.07.24-42';
const STORAGE_KEY = 'leave-passbook-data';

const firebaseConfig = {
  apiKey: "AIzaSyC5YIH145QTtNlSy8JyRsXsJjerS98eufE",
  authDomain: "leave-passbook-b3bc0.firebaseapp.com",
  projectId: "leave-passbook-b3bc0",
  storageBucket: "leave-passbook-b3bc0.firebasestorage.app",

  appId: "1:391707124875:web:adc76c284479df83e8a08e"
};
window.firebaseConfig = firebaseConfig;

// Gemini API 呼叫改由 Firebase AI Logic（見本檔案後面的 type="module" 區塊）處理，
// 前端不再持有任何 AI 金鑰，額度濫用防護交給 App Check。
let currentUser = null;
let fbAuth = null;
let fbDb = null;
let cloudSyncing = false;

function initFirebase(){
  try{
    if(typeof firebase === 'undefined'){ setStatus('雲端功能載入失敗（Firebase 套件沒抓到）', false); return; }
    firebase.initializeApp(firebaseConfig);
    fbAuth = firebase.auth();
    fbDb = firebase.firestore();
    fbAuth.setPersistence(firebase.auth.Auth.Persistence.LOCAL).catch(e=>console.error('設定登入保存方式失敗', e));
    let firstAuthCheck = true;
    fbAuth.onAuthStateChanged(async (user)=>{
      currentUser = user;
      render();
      if(firstAuthCheck){
        firstAuthCheck = false;
        if(user){ setStatus('✓ 偵測到已登入：' + (user.email||user.displayName||''), true); }
        else { setStatus('偵測結果：目前沒有登入狀態', false); }
      }
    });
    fbAuth.getRedirectResult().then(async (result)=>{
      if(result && result.user){
        // 真正剛從登入跳轉回來，才需要詢問雲端/本機衝突
        await pullOrPushOnSignIn();
        render();
      }
    }).catch(e=>{
      setStatus('登入失敗：' + (e && e.message ? e.message : String(e)), false);
    });
  }catch(e){ console.error('Firebase 初始化失敗', e); }
}

async function signInWithGoogle(){
  if(!fbAuth){ setStatus('雲端同步尚未就緒，請稍後再試', false); return; }
  try{
    const provider = new firebase.auth.GoogleAuthProvider();
    const result = await fbAuth.signInWithPopup(provider);
    if(result && result.user){
      await pullOrPushOnSignIn();
      render();
    }
  }catch(e){
    setStatus('登入失敗：' + (e && e.message ? e.message : String(e)), false);
  }
}

async function signOutUser(){
  if(!fbAuth) return;
  try{
    await fbAuth.signOut();
    currentUser = null;
    render();
    setStatus('已登出，之後資料只會存在本機', true);
  }catch(e){
    setStatus('登出失敗：' + (e && e.message ? e.message : String(e)), false);
  }
}

function applyCloudData(jsonStr){
  try{
    const parsed = JSON.parse(jsonStr);
    state = Object.assign(defaultState(), parsed);
  }catch(e){ console.error('雲端資料格式錯誤', e); }
}

function countAllRecords(s){
  let n = 0;
  Object.values(s.records||{}).forEach(arr=> n += (arr||[]).length);
  n += (s.compRecords||[]).length;
  return n;
}

async function pullOrPushOnSignIn(){
  if(!fbDb || !currentUser) return;
  try{
    const docRef = fbDb.collection('leavePassbook').doc(currentUser.uid);
    const snap = await docRef.get();
    if(!snap.exists){
      await docRef.set({ data: JSON.stringify(state), updatedAt: Date.now() });
      setStatus('已將目前資料上傳到雲端', true);
    } else {
      const cloudData = snap.data();
      const localCount = countAllRecords(state);
      if(localCount > 0){
        let cloudCount = 0, cloudTimeText = '未知';
        try{
          const cloudParsed = JSON.parse(cloudData.data);
          cloudCount = countAllRecords(cloudParsed);
        }catch(e){}
        if(cloudData.updatedAt){
          const d = new Date(cloudData.updatedAt);
          cloudTimeText = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
        }
        const useCloud = window.confirm(
          `發現雲端跟這台裝置都有資料，請選擇要保留哪一份：\n\n` +
          `☁️ 雲端：共 ${cloudCount} 筆（最後更新 ${cloudTimeText}）\n` +
          `📱 這台裝置：共 ${localCount} 筆\n\n` +
          `按「確定」→ 用雲端資料覆蓋這台裝置畫面\n` +
          `按「取消」→ 用這台裝置的資料覆蓋雲端`
        );
        if(useCloud){ applyCloudData(cloudData.data); }
        else { await docRef.set({ data: JSON.stringify(state), updatedAt: Date.now() }); }
      } else {
        applyCloudData(cloudData.data);
      }
    }
    await saveState();
  }catch(e){
    setStatus('雲端同步失敗：' + (e && e.message ? e.message : String(e)), false);
  }
}

async function syncToCloud(){
  if(!fbDb || !currentUser || cloudSyncing) return;
  cloudSyncing = true;
  try{
    await fbDb.collection('leavePassbook').doc(currentUser.uid).set({ data: JSON.stringify(state), updatedAt: Date.now() });
  }catch(e){
    console.error('雲端同步失敗', e);
  }finally{
    cloudSyncing = false;
  }
}


const LEAVE_TYPES = [
  {key:'annual', label:'特休', seal:'休', c:'jade', defaultQuota:0, hint:'依到職年資自行填入'},
  {key:'sick', label:'病假', seal:'病', c:'blue', defaultQuota:28, hint:'常見上限 28 天／年，實際依公司規定；生理假超過3天的部分會自動併入此處計算；超過總天數的部分依規定可用事假或特休擇一抵銷，需自行決定'},
  {key:'personal', label:'事假', seal:'事', c:'olive', defaultQuota:14, hint:'常見上限 14 天／年（不給薪），實際依公司規定；家庭照顧假會全額自動併入此處計算'},
  {key:'familyCare', label:'家庭照顧假', seal:'家', c:'plum', defaultQuota:7, hint:'併入事假總天數計算，常見上限 7 天／年'},
  {key:'menstrual', label:'生理假', seal:'生', c:'rose', defaultQuota:12, hint:'每月至多1天；全年前3天不併入病假，超過部分自動併入病假計算（性平法第14條）'},
  {key:'mentalCare', label:'身心照顧假', seal:'心', c:'rust', defaultQuota:3, hint:'依公司規定，預設 3 天，可自行調整'}
];

const NOW = new Date();
const TODAY = NOW.getFullYear()+'-'+String(NOW.getMonth()+1).padStart(2,'0')+'-'+String(NOW.getDate()).padStart(2,'0');
const CUR_YEAR = NOW.getFullYear();
const DEFAULT_HOURS_PER_DAY = 8;
function getHoursPerDay(){ return (state && state.hoursPerDay) ? Number(state.hoursPerDay) : DEFAULT_HOURS_PER_DAY; }
const DEFAULT_PERSONAL_PAID_DAYS = 7;
function getPersonalPaidDays(){ return (state && state.personalPaidDays !== undefined && state.personalPaidDays !== null) ? Number(state.personalPaidDays) : DEFAULT_PERSONAL_PAID_DAYS; }
function personalPaidUsed(year){
  year = year || selectedYear;
  return Math.min(usedOf('personal', year), getPersonalPaidDays());
}
function personalUnpaidUsed(year){
  year = year || selectedYear;
  return Math.max(0, usedOf('personal', year) - getPersonalPaidDays());
}

let state = { quotaByYear:{}, records:{}, compRecords:[] };
let lastAddedId = null;
let lastDeleted = null;
let editing = null;
let searchQuery = '';
let sortAsc = false;

let calendarMode = false;
let calYear = CUR_YEAR;
let calMonth = NOW.getMonth()+1;
let chartMode = false;

let kwUnmatchedLines = [];

let activeLeaveTab = 'annual';
function switchLeaveTab(key){ activeLeaveTab = key; searchQuery=''; render(); }
let activePage = 'home';
function switchPage(page){ activePage = page; window.scrollTo(0,0); render(); }
function viewLeaveDetail(key){ activeLeaveTab = key; switchPage('leaves'); }

function monthLabel(ym){
  const y = parseInt(ym.slice(0,4),10) - 1911;
  const m = parseInt(ym.slice(5,7),10);
  return `${y}年${m}月`;
}

function toggleMonthExpand(stateKey, current){ expandedMonths[stateKey] = !current; render(); }

function renderMonthGroups(listKey, rows, emptyMsg, liBuilder, totalFn, forceExpand){
  if(rows.length===0) return `<div class="empty">${emptyMsg}</div>`;
  const groups = {};
  const order = [];
  rows.forEach(r=>{
    const ym = r.date.slice(0,7);
    if(!groups[ym]){ groups[ym]=[]; order.push(ym); }
    groups[ym].push(r);
  });
  return order.map((ym, idx)=>{
    const groupRows = groups[ym];
    const stateKey = `${listKey}-${ym}`;
    const isFirst = idx===0;
    const forced = forceExpand ? forceExpand(groupRows) : false;
    const expanded = forced ? true : (searchQuery ? true : (expandedMonths[stateKey] !== undefined ? expandedMonths[stateKey] : isFirst));
    const metaText = totalFn ? totalFn(groupRows) : `${groupRows.length} 筆`;
    return `
      <div class="month-group">
        <button type="button" class="month-header ${expanded?'month-header-open':'month-header-closed'}" onclick="toggleMonthExpand('${stateKey}', ${expanded})">
          <span class="month-title">${monthLabel(ym)}</span>
          <span class="month-meta">${metaText}</span>
          <span class="chevron ${expanded?'chevron-open':'chevron-closed'}">${expanded?'<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>':'<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>'}</span>
        </button>
        ${expanded? `<div class="month-body"><ul class="ledger">${groupRows.map(liBuilder).join('')}</ul></div>` : ''}
      </div>`;
  }).join('');
}

function onCompDateChange(category){
  if(expiryTouched) return;
  const years = (COMP_CATEGORIES[category||'comp']||COMP_CATEGORIES.comp).defaultYears;
  const dateVal = parseFlexibleDate(document.getElementById('compDate').value);
  const expiryEl = document.getElementById('compExpiry');
  if(dateVal && expiryEl) expiryEl.value = addYears(dateVal, years);
}

function yearMin(y){ return y+'-01-01'; }
function yearMax(y){ return y+'-12-31'; }
function defaultDateFor(y){ return y===CUR_YEAR ? TODAY : y+'-01-01'; }
function addYears(dateStr, n){
  try{
    const d = new Date(dateStr+'T00:00:00');
    d.setFullYear(d.getFullYear()+n);
    return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
  }catch(e){ return ''; }
}

function defaultState(){
  const records={};
  LEAVE_TYPES.forEach(t=>{ records[t.key]=[]; });
  return { quotaByYear:{}, records, compRecords:[], hoursPerDay: DEFAULT_HOURS_PER_DAY, personalPaidDays: DEFAULT_PERSONAL_PAID_DAYS };
}

function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
function fmt(n){ return (Math.round(n*10)/10).toString(); }
function escapeHtml(s){ return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function escapeAttr(s){ return String(s||'').replace(/&/g,'&amp;').replace(/"/g,'&quot;'); }
function matchesSearch(...parts){
  if(!searchQuery) return true;
  const q = searchQuery.toLowerCase();
  return parts.some(p => (p||'').toString().toLowerCase().includes(q));
}

async function loadState(){
  state = defaultState();
  try{
    let raw = null;
    if(window.storage && typeof window.storage.get === 'function'){
      const res = await window.storage.get(STORAGE_KEY, false);
      raw = res && res.value;
    } else {
      raw = localStorage.getItem(STORAGE_KEY);
    }
    if(raw){
      const parsed = JSON.parse(raw);
      state.records = Object.assign(state.records, parsed.records||{});
      state.compRecords = parsed.compRecords || [];
      if(parsed.quotaByYear){
        state.quotaByYear = parsed.quotaByYear;
      } else {
        let flatQuotas = null;
        if(parsed.quotas){ flatQuotas = parsed.quotas; }
        else if(parsed.annualTotal !== undefined){
          flatQuotas = { annual: parsed.annualTotal || 0 };
          state.records.annual = parsed.annualRecords || state.records.annual;
        }
        if(flatQuotas){ state.quotaByYear[CUR_YEAR] = Object.assign({}, flatQuotas); }
      }
      if(parsed.hoursPerDay){ state.hoursPerDay = Number(parsed.hoursPerDay); }
      if(parsed.personalPaidDays !== undefined && parsed.personalPaidDays !== null){ state.personalPaidDays = Number(parsed.personalPaidDays); }
    }
  }catch(e){ /* 無資料，使用預設值 */ }
}

async function saveState(){
  try{
    const json = JSON.stringify(state);
    if(window.storage && typeof window.storage.set === 'function'){
      await window.storage.set(STORAGE_KEY, json, false);
    } else {
      localStorage.setItem(STORAGE_KEY, json);
    }
  }catch(e){ console.error('儲存失敗', e); }
  syncToCloud();
}

function getQuota(key, year){
  year = year || selectedYear;
  const y = state.quotaByYear[year];
  if(y && y[key] !== undefined) return y[key];
  const t = LEAVE_TYPES.find(t=>t.key===key);
  return t ? t.defaultQuota : 0;
}
function setQuota(key, year, val){
  if(!state.quotaByYear[year]) state.quotaByYear[year] = {};
  state.quotaByYear[year][key] = val;
}
const MENSTRUAL_FREE_DAYS = 3;
function menstrualExcess(year){
  year = year || selectedYear;
  const used = (state.records['menstrual']||[]).filter(r=>r.date.startsWith(String(year))).reduce((s,r)=>s+toDays(r),0);
  return Math.max(0, used - MENSTRUAL_FREE_DAYS);
}
function sickRawUsed(key, year){
  return (state.records[key]||[]).filter(r=>r.date.startsWith(String(year))).reduce((s,r)=>s+toDays(r),0);
}
function sickExcess(year){
  year = year || selectedYear;
  const used = sickRawUsed('sick', year) + menstrualExcess(year);
  const quota = getQuota('sick', year);
  return Math.max(0, used - quota);
}
function usedOf(key, year){
  year = year || selectedYear;
  let base = (state.records[key]||[]).filter(r=>r.date.startsWith(String(year))).reduce((s,r)=>s+toDays(r),0);
  if(key === 'sick'){ base += menstrualExcess(year); }
  if(key === 'personal'){ base += usedOf('familyCare', year); }
  return base;
}
function remainOf(key, year){
  year = year || selectedYear;
  return getQuota(key,year) - usedOf(key,year);
}
function isoDate(y,m,d){
  if(!y||!m||!d) return '';
  return `${y}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
}
function parseFlexibleDate(raw){
  if(!raw) return '';
  raw = String(raw).trim();
  if(/^\d{4}-\d{1,2}-\d{1,2}$/.test(raw)){
    const [y,m,d] = raw.split('-').map(Number);
    return isoDate(y,m,d);
  }
  if(raw.includes('/')){
    const parts = raw.split('/').map(s=>s.trim());
    if(parts.length===3){
      let y = parseInt(parts[0],10);
      const m = parseInt(parts[1],10);
      const d = parseInt(parts[2],10);
      if(!isNaN(y) && y < 200) y += 1911; // 兩三位數視為民國年
      return isoDate(y,m,d);
    }
    if(parts.length===2){
      const m = parseInt(parts[0],10);
      const d = parseInt(parts[1],10);
      return isoDate(CUR_YEAR, m, d); // 沒填年份，預設今年
    }
  }
  return raw;
}

function toROC(dateStr){
  if(!dateStr) return '';
  const parts = String(dateStr).split('-');
  if(parts.length!==3) return dateStr;
  const y = parseInt(parts[0],10) - 1911;
  const m = parseInt(parts[1],10);
  const d = parseInt(parts[2],10);
  if(isNaN(y) || isNaN(m) || isNaN(d)) return dateStr;
  return `${y}/${m}/${d}`;
}
function toDays(r){
  if(r.unit==='hour') return Number(r.amount)/getHoursPerDay();
  if(r.unit==='day') return Number(r.amount);
  return Number(r.days)||0;
}
function displayAmount(r){
  if(r.unit==='hour') return `${fmt(r.amount)} 小時`;
  const amt = r.unit==='day' ? r.amount : r.days;
  return `${fmt(amt)} 天`;
}
function compBalanceUpTo(year, category){
  category = category || 'comp';
  return state.compRecords.filter(r=> parseInt(r.date.slice(0,4),10) <= year && (r.category||'comp')===category).reduce((s,r)=> s + (r.type==='earn'? toDays(r): -toDays(r)),0);
}
const COMP_CATEGORIES = {
  comp: { label:'補休', c:'brick', defaultYears:2 },
  exchange: { label:'換休', c:'teal', defaultYears:1 }
};

function stampCard(t){
  const remain = remainOf(t.key, selectedYear);
  const chips = [];
  if(t.key==='sick'){
    const excess = menstrualExcess(selectedYear);
    if(excess>0) chips.push(`<span class="mini-chip" style="background:var(--rose-soft);color:var(--rose);">生理假併入 ${fmt(excess)}天</span>`);
    if(remain<0) chips.push(`<span class="mini-chip" style="background:var(--brick-soft);color:var(--brick);">超額 ${fmt(-remain)}天，需擇一抵銷</span>`);
  }
  if(t.key==='personal'){
    const fc = usedOf('familyCare', selectedYear);
    if(fc>0) chips.push(`<span class="mini-chip" style="background:var(--plum-soft);color:var(--plum);">家照併入 ${fmt(fc)}天</span>`);
    const paid = personalPaidUsed(selectedYear), unpaid = personalUnpaidUsed(selectedYear);
    if(paid>0) chips.push(`<span class="mini-chip" style="background:var(--jade-soft);color:var(--jade);">💰有薪 ${fmt(paid)}天</span>`);
    if(unpaid>0) chips.push(`<span class="mini-chip" style="background:var(--brick-soft);color:var(--brick);">無薪 ${fmt(unpaid)}天</span>`);
  }
  return `
    <div class="stamp-card ${remain<0?'warn':''}" style="box-shadow:0 10px 24px -10px color-mix(in srgb, var(--${t.c}) 45%, transparent);" onclick="viewLeaveDetail('${t.key}')">
      <div class="seal c-${t.c}">${t.seal}</div>
      <div class="label">${t.label}剩餘</div>
      <div class="num c-${t.c}">${fmt(remain)}天 <span class="hour-inline">${fmt(remain*getHoursPerDay())}小時</span><small>共 ${fmt(getQuota(t.key,selectedYear))} 天</small></div>
      ${chips.length? `<div class="mini-chips">${chips.join('')}</div>` : ''}
    </div>`;
}

function compStampCard(category){
  category = category || 'comp';
  const info = COMP_CATEGORIES[category];
  const compBal = compBalanceUpTo(selectedYear, category);
  return `
    <div class="stamp-card ${compBal<0?'warn':''}" style="box-shadow:0 10px 24px -10px color-mix(in srgb, var(--${info.c}) 45%, transparent);" onclick="viewLeaveDetail('${category}')">
      <div class="seal c-${info.c}">${info.label.slice(0,1)}</div>
      <div class="label">${info.label}結餘</div>
      <div class="num c-${info.c}">${fmt(compBal)}天 <span class="hour-inline">${fmt(compBal*getHoursPerDay())}小時</span><small>至 ${selectedYear} 年底・期限${info.defaultYears}年</small></div>
    </div>`;
}

function dashboardPanel(){
  const y = CUR_YEAR;
  const ym = y + '-' + String(NOW.getMonth()+1).padStart(2,'0');
  let monthTotal = 0, yearTotal = 0;
  LEAVE_TYPES.forEach(t=>{
    (state.records[t.key]||[]).forEach(r=>{
      if(r.date.startsWith(String(y))) yearTotal += toDays(r);
      if(r.date.startsWith(ym)) monthTotal += toDays(r);
    });
  });
  state.compRecords.filter(r=>r.type==='use').forEach(r=>{
    if(r.date.startsWith(String(y))) yearTotal += toDays(r);
    if(r.date.startsWith(ym)) monthTotal += toDays(r);
  });
  const totalRemain = remainOf('annual', CUR_YEAR) + compBalanceUpTo(CUR_YEAR,'comp') + compBalanceUpTo(CUR_YEAR,'exchange');
  return `
    <div class="dashboard">
      <div class="dash-card"><div class="label">本月已請假</div><div class="num">${fmt(monthTotal)}天</div></div>
      <div class="dash-card"><div class="label">今年已請假</div><div class="num">${fmt(yearTotal)}天</div></div>
      <div class="dash-card"><div class="label">特休＋補休＋換休合計</div><div class="num">${fmt(totalRemain)}天</div><div style="font-size:10px;color:var(--ink-soft);margin-top:4px;">僅計算特休、補休、換休，不含病假/事假等</div></div>
    </div>`;
}


const KEYWORD_LEAVE_MAP = [
  {re:'特休|年假', key:'annual', label:'特休'},
  {re:'生理假|生理', key:'menstrual', label:'生理假'},
  {re:'病假|病', key:'sick', label:'病假'},
  {re:'事假|事', key:'personal', label:'事假'},
  {re:'家庭照顧假|家照', key:'familyCare', label:'家庭照顧假'},
  {re:'身心照顧假|身照|身心|不爽假', key:'mentalCare', label:'身心照顧假'}
];
const KW_AMOUNT_TOKEN = '(半天|全天|整天|[\\d.]+|[一二三四五六七八九十兩])';
const KW_UNIT_TOKEN = '(H|h|小時|天)?';
const KW_NOTE_TOKEN = '[\\(（]?([^\\)）]*)[\\)）]?';
const CN_NUM_MAP = {'半':0.5,'一':1,'二':2,'兩':2,'三':3,'四':4,'五':5,'六':6,'七':7,'八':8,'九':9,'十':10};
const KW_NUM_OR_CN = '([\\d.]+|[一二三四五六七八九十兩半])';
function numOrCn(tok){
  if(tok===undefined || tok===null) return NaN;
  if(CN_NUM_MAP[tok] !== undefined) return CN_NUM_MAP[tok];
  return parseFloat(tok);
}

function shiftDate(dateStr, deltaDays){
  const d = new Date(dateStr+'T00:00:00');
  d.setDate(d.getDate()+deltaDays);
  return isoDate(d.getFullYear(), d.getMonth()+1, d.getDate());
}

function parseDateToken(tok, contextYear){
  if(!tok) return null;
  tok = tok.trim();
  if(tok==='今天'||tok==='今日') return TODAY;
  if(tok==='明天'||tok==='明日') return shiftDate(TODAY,1);
  if(tok==='昨天'||tok==='昨日') return shiftDate(TODAY,-1);
  let m = tok.match(/^(\d{1,4})[\/\-](\d{1,2})[\/\-](\d{1,2})$/);
  if(m){
    let y = parseInt(m[1],10);
    if(y<200) y += 1911; // 民國年自動換算
    return isoDate(y, parseInt(m[2],10), parseInt(m[3],10));
  }
  m = tok.match(/^(\d{1,2})[\/\-](\d{1,2})$/);
  if(m){ return isoDate(contextYear, parseInt(m[1],10), parseInt(m[2],10)); }
  m = tok.match(/^(\d{1,2})月(\d{1,2})日?$/);
  if(m){ return isoDate(contextYear, parseInt(m[1],10), parseInt(m[2],10)); }
  return null;
}

function parseAmountToken(numTok, unitTok){
  if(numTok==='半天') return {amount:0.5, unit:'day'};
  if(numTok==='全天' || numTok==='整天') return {amount:1, unit:'day'};
  let amount = parseFloat(numTok);
  if(isNaN(amount) && CN_NUM_MAP[numTok] !== undefined) amount = CN_NUM_MAP[numTok];
  if(isNaN(amount)) return null;
  const unit = (unitTok==='H'||unitTok==='h'||unitTok==='小時') ? 'hour' : 'day';
  return {amount, unit};
}

function kwBuildFromRest(rest, defaultCompType, leaveKeywordPattern){
  let mm;
  // 加X補Y (備註) -> 補休獲得（固定2年）
  mm = rest.match(new RegExp(`^加\\s*${KW_NUM_OR_CN}\\s*補\\s*${KW_NUM_OR_CN}\\s*${KW_NOTE_TOKEN}$`));
  if(mm){
    const amount = numOrCn(mm[2]);
    if(isNaN(amount)) return null;
    return { kind:'comp', category:'comp', compType:'earn', unit:'day', amount, note:(mm[3]||'').trim() };
  }
  // 加X換Y (備註) -> 換休獲得（固定1年）
  mm = rest.match(new RegExp(`^加\\s*${KW_NUM_OR_CN}\\s*換\\s*${KW_NUM_OR_CN}\\s*${KW_NOTE_TOKEN}$`));
  if(mm){
    const amount = numOrCn(mm[2]);
    if(isNaN(amount)) return null;
    return { kind:'comp', category:'exchange', compType:'earn', unit:'day', amount, note:(mm[3]||'').trim() };
  }
  // (使用|用|獲得|得)? 補休/補 X(H/天/半天/全天) (備註) -> 補休（固定2年）
  mm = rest.match(new RegExp(`^(使用|用|獲得|得)?\\s*(?:補休|補)\\s*${KW_AMOUNT_TOKEN}\\s*${KW_UNIT_TOKEN}\\s*${KW_NOTE_TOKEN}$`));
  if(mm){
    const parsed = parseAmountToken(mm[2], mm[3]);
    if(!parsed) return null;
    let compType = defaultCompType;
    if(mm[1]==='使用' || mm[1]==='用') compType='use';
    else if(mm[1]==='獲得' || mm[1]==='得') compType='earn';
    return { kind:'comp', category:'comp', compType, unit:parsed.unit, amount:parsed.amount, note:(mm[4]||'').trim() };
  }
  // (使用|用|獲得|得)? 換休/換 X(H/天/半天/全天) (備註) -> 換休（固定1年）
  mm = rest.match(new RegExp(`^(使用|用|獲得|得)?\\s*(?:換休|換)\\s*${KW_AMOUNT_TOKEN}\\s*${KW_UNIT_TOKEN}\\s*${KW_NOTE_TOKEN}$`));
  if(mm){
    const parsed = parseAmountToken(mm[2], mm[3]);
    if(!parsed) return null;
    let compType = defaultCompType;
    if(mm[1]==='使用' || mm[1]==='用') compType='use';
    else if(mm[1]==='獲得' || mm[1]==='得') compType='earn';
    return { kind:'comp', category:'exchange', compType, unit:parsed.unit, amount:parsed.amount, note:(mm[4]||'').trim() };
  }
  // (請|使用|用)? <假別關鍵字> X(H/天/半天/全天) (備註)
  mm = rest.match(new RegExp(`^(請|使用|用)?\\s*(${leaveKeywordPattern})\\s*${KW_AMOUNT_TOKEN}\\s*${KW_UNIT_TOKEN}\\s*${KW_NOTE_TOKEN}$`));
  if(mm){
    const mapEntry = KEYWORD_LEAVE_MAP.find(k=> new RegExp('^(?:'+k.re+')$').test(mm[2]));
    const parsed = parseAmountToken(mm[3], mm[4]);
    if(!parsed || !mapEntry) return null;
    return { kind:'leave', leaveKey: mapEntry.key, leaveLabel: mapEntry.label, unit:parsed.unit, amount:parsed.amount, note:(mm[5]||'').trim() };
  }
  return null;
}

function parseKeywordLines(text, defaultCompType){
  const items = [];
  const unmatched = [];
  const rawLines = text.split('\n').map(l=>l.trim());
  const leaveKeywordPattern = KEYWORD_LEAVE_MAP.map(k=>k.re).join('|');

  rawLines.forEach(line=>{
    if(!line) return;
    if(/^(#|\/\/|、)/.test(line)) return; // 忽略註解／項目符號行

    let m;

    // A) 日期區間：M/D~M/D 或 M/D-M/D <內容> -> 展開成每天一筆
    m = line.match(/^(\S+)\s*[~～]\s*(\S+)\s+(.+)$/) || line.match(/^(\S+)-(\S+)\s+(.+)$/);
    if(m){
      const d1 = parseDateToken(m[1], selectedYear);
      let d2 = parseDateToken(m[2], selectedYear);
      if(d1 && d2){
        // 若結束日期比開始日期早，視為跨年（例如 12/30-1/2），結束日期年份自動+1
        if(new Date(d2+'T00:00:00').getTime() < new Date(d1+'T00:00:00').getTime()){
          const d2Parts = d2.split('-');
          d2 = isoDate(parseInt(d2Parts[0],10)+1, parseInt(d2Parts[1],10), parseInt(d2Parts[2],10));
        }
        const built = kwBuildFromRest(m[3].trim(), defaultCompType, leaveKeywordPattern);
        if(built){
          let cur = d1, guard = 0;
          const endTime = new Date(d2+'T00:00:00').getTime();
          while(new Date(cur+'T00:00:00').getTime() <= endTime && guard < 62){
            items.push(Object.assign({}, built, { date: cur, raw: line }));
            cur = shiftDate(cur, 1);
            guard++;
          }
          return;
        }
      }
    }

    // B) 單一日期開頭：<日期> <其餘內容>
    m = line.match(/^(\S+)\s+(.+)$/);
    if(m){
      const d = parseDateToken(m[1], selectedYear);
      if(d){
        const built = kwBuildFromRest(m[2].trim(), defaultCompType, leaveKeywordPattern);
        if(built){ items.push(Object.assign({}, built, { date: d, raw: line })); return; }
      }
    }

    // C) 假別總天數設定：特休/年假/病假/事假/家庭照顧假/身心照顧假 [原]X [剩Y]
    m = line.match(new RegExp(`^(${leaveKeywordPattern})\\s*(?:原)?\\s*([\\d.]+)\\s*(?:剩\\s*([\\d.]+))?\\s*$`));
    if(m){
      const mapEntry = KEYWORD_LEAVE_MAP.find(k=> new RegExp('^(?:'+k.re+')$').test(m[1]));
      items.push({ kind:'quota', quotaKey: mapEntry.key, quotaLabel: mapEntry.label,
        total: parseFloat(m[2]), remain: m[3]!==undefined ? parseFloat(m[3]) : null, raw: line });
      return;
    }

    unmatched.push(line);
  });

  return { items, unmatched };
}

function compExpiryReminders(){
  const todayD = new Date(TODAY);
  return state.compRecords.filter(r=>r.type==='earn' && r.expiry).map(r=>{
    const diffDays = Math.round((new Date(r.expiry) - todayD)/86400000);
    return Object.assign({}, r, {diffDays});
  }).filter(r=> r.diffDays <= 30).sort((a,b)=> a.diffDays-b.diffDays);
}

function reminderBanner(){
  const list = compExpiryReminders();
  const compHtml = list.length? (()=>{
    const items = list.map(r=>{
      const statusTxt = r.diffDays < 0 ? `已過期 ${Math.abs(r.diffDays)} 天` : (r.diffDays===0? '今天到期' : `${r.diffDays} 天後到期`);
      const catLabel = COMP_CATEGORIES[r.category||'comp'].label;
      return `${toROC(r.date)} 獲得的 ${displayAmount(r)}${catLabel}，到期日 ${toROC(r.expiry)}（${statusTxt}）`;
    }).join('<br>');
    return `<div class="reminder-bar"><strong>⚠️ 補休／換休到期提醒</strong>${items}</div>`;
  })() : '';

  const month = NOW.getMonth()+1;
  const annualRemain = remainOf('annual', CUR_YEAR);
  const annualHtml = (month>=10 && annualRemain>0) ?
    `<div class="reminder-bar"><strong>📅 特休消化提醒</strong>今年（${CUR_YEAR}）還有 ${fmt(annualRemain)} 天特休未請，建議儘早排定使用，避免年底沒排到。</div>` : '';

  return compHtml + annualHtml;
}

function calendarPanel(){
  if(!calendarMode) return '';
  const y = calYear, m = calMonth;
  const firstDay = new Date(y, m-1, 1);
  const startWeekday = firstDay.getDay();
  const daysInMonth = new Date(y, m, 0).getDate();
  const dayMap = {};
  const ymPrefix = `${y}-${String(m).padStart(2,'0')}`;
  LEAVE_TYPES.forEach(t=>{
    (state.records[t.key]||[]).forEach(r=>{
      if(r.date.startsWith(ymPrefix)){
        const d = parseInt(r.date.slice(8,10),10);
        if(!dayMap[d]) dayMap[d]=[];
        dayMap[d].push({seal:t.seal, c:t.c, label:`${t.label} ${displayAmount(r)}${r.note? '：'+r.note:''}`});
      }
    });
  });
  state.compRecords.forEach(r=>{
    if(r.date.startsWith(ymPrefix)){
      const d = parseInt(r.date.slice(8,10),10);
      if(!dayMap[d]) dayMap[d]=[];
      const info = COMP_CATEGORIES[r.category||'comp'];
      dayMap[d].push({seal:info.label.slice(0,1), c:info.c, label:`${info.label}${r.type==='earn'?'獲得':'使用'} ${displayAmount(r)}${r.note? '：'+r.note:''}`});
    }
  });
  let cells = '';
  for(let i=0;i<startWeekday;i++) cells += `<div class="cal-cell empty"></div>`;
  for(let d=1; d<=daysInMonth; d++){
    const items = dayMap[d]||[];
    const dots = items.map(it=>`<span class="cal-dot c-${it.c}-bg" title="${escapeAttr(it.label)}">${it.seal}</span>`).join('');
    const isToday = (`${y}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`===TODAY);
    cells += `<div class="cal-cell ${isToday?'today':''}"><div class="cal-daynum">${d}</div><div class="cal-dots">${dots}</div></div>`;
  }
  return `
    <div class="block">
      <div class="cal-header">
        <button type="button" class="ghost" onclick="changeCalMonth(-1)">‹</button>
        <div class="cal-title">${y} 年 ${m} 月</div>
        <button type="button" class="ghost" onclick="changeCalMonth(1)">›</button>
      </div>
      <div class="cal-grid cal-weekdays"><div>日</div><div>一</div><div>二</div><div>三</div><div>四</div><div>五</div><div>六</div></div>
      <div class="cal-grid">${cells}</div>
    </div>`;
}

function statsChart(){
  if(!chartMode) return '';
  const y = selectedYear;
  const monthTotals = Array(12).fill(0).map(()=> ({}));
  LEAVE_TYPES.forEach(t=>{
    (state.records[t.key]||[]).forEach(r=>{
      if(r.date.startsWith(String(y))){
        const mIdx = parseInt(r.date.slice(5,7),10)-1;
        monthTotals[mIdx][t.key] = (monthTotals[mIdx][t.key]||0) + toDays(r);
      }
    });
  });
  state.compRecords.filter(r=>r.type==='use' && r.date.startsWith(String(y))).forEach(r=>{
    const mIdx = parseInt(r.date.slice(5,7),10)-1;
    const cat = r.category||'comp';
    monthTotals[mIdx][cat] = (monthTotals[mIdx][cat]||0) + toDays(r);
  });
  const maxVal = Math.max(1, ...monthTotals.map(m=> Object.values(m).reduce((s,v)=>s+v,0)));
  const TRACK_H = 130;
  const typeList = LEAVE_TYPES.concat([{key:'comp', c:'brick', label:'補休使用'}, {key:'exchange', c:'teal', label:'換休使用'}]);
  const bars = monthTotals.map((m,i)=>{
    const total = Object.values(m).reduce((s,v)=>s+v,0);
    const segments = typeList.map(t=>{
      const v = m[t.key]||0;
      if(v<=0) return '';
      const px = Math.max(2, Math.round(v/maxVal*TRACK_H));
      return `<div class="chart-seg c-${t.c}-bg" style="height:${px}px" title="${t.label} ${fmt(v)}天"></div>`;
    }).join('');
    return `<div class="chart-col">
      <div class="chart-bar-track">${segments}</div>
      <div class="chart-label">${i+1}月</div>
      <div class="chart-total">${total>0?fmt(total):''}</div>
    </div>`;
  }).join('');
  return `
    <div class="block">
      <h2><span class="dot dot-jade"></span>${y} 年度統計圖</h2>
      <div class="chart-wrap">${bars}</div>
      <div class="chart-legend">
        ${LEAVE_TYPES.map(t=>`<span class="legend-item"><span class="legend-dot c-${t.c}-bg"></span>${t.label}</span>`).join('')}
        <span class="legend-item"><span class="legend-dot c-brick-bg"></span>補休使用</span>
      </div>
    </div>`;
}

    {key:'exchange', label:'換休', c:'teal'}
  ].concat(LEAVE_TYPES.slice(1).map(t=>({key:t.key, label:t.label, c:t.c})));
  return `
    <div class="leave-tabs">
      ${tabs.map(t=>{
        const isActive = activeLeaveTab===t.key;
        const style = isActive
          ? `background:var(--${t.c});color:#fff;border-color:var(--${t.c});`
          : `background:#fff;color:var(--ink-soft);border-color:var(--line);`;
        return `<button type="button" class="leave-tab" style="${style}" onclick="switchLeaveTab('${t.key}')">${t.label}</button>`;
      }).join('')}
    </div>`;
}

      ${t.key==='personal' && usedOf('familyCare',selectedYear)>0 ? `<div class="reminder-bar"><strong>⚠️ 併入事假提醒</strong>${selectedYear} 年家庭照顧假 ${fmt(usedOf('familyCare',selectedYear))} 天已全額自動計入事假已使用天數。</div>` : ''}
      ${t.key==='personal' && usedOf('personal',selectedYear)>0 ? `<div class="reminder-bar"><strong>💰 有薪／無薪對帳</strong>${selectedYear} 年事假共已用 ${fmt(usedOf('personal',selectedYear))} 天，其中有薪 ${fmt(personalPaidUsed(selectedYear))} 天、無薪 ${fmt(personalUnpaidUsed(selectedYear))} 天（門檻：每年前 ${fmt(getPersonalPaidDays())} 天有薪，可在「設定」分頁調整）。</div>` : ''}

function buildCompLi(r, dMin, dMax, category){
  category = category || r.category || 'comp';
  const info = COMP_CATEGORIES[category];
  if(editing && editing.kind==='comp' && editing.id===r.id){
    const eu = r.unit || 'day';
    const ea = r.unit ? r.amount : r.days;
    return `<li class="editrow">
      <select id="editCompType-${r.id}">
        <option value="earn" ${r.type==='earn'?'selected':''}>獲得${info.label}</option>
        <option value="use" ${r.type==='use'?'selected':''}>使用${info.label}</option>
      </select>
      <span class="date-row" style="flex:none;"><input type="date" id="editCompDate-${r.id}" value="${r.date}" min="${dMin}" max="${dMax}" style="width:130px;"><button type="button" class="date-toggle" onclick="toggleDateInputType('editCompDate-${r.id}')" title="切換手動輸入">⌨</button></span>
      <input type="number" id="editCompAmount-${r.id}" value="${ea}" min="0.5" step="0.5" style="width:70px;">
      <select id="editCompUnit-${r.id}" style="width:64px;">
        <option value="day" ${eu==='day'?'selected':''}>天</option>
        <option value="hour" ${eu==='hour'?'selected':''}>小時</option>
      </select>
      <input type="text" id="editCompNote-${r.id}" value="${escapeAttr(r.note||'')}" style="flex:1;min-width:100px;">
      <button class="btn-${info.c}" onclick="saveEditComp('${r.id}')">儲存</button>
      <button class="ghost" onclick="cancelEdit()">取消</button>
    </li>`;
  }
  return `<li class="${r.id===lastAddedId?'stamp-in':''}">
    <div class="ledger-top">
      <span class="d">${toROC(r.date)}</span>
      <span class="tag" style="background:var(--${info.c}-soft);color:var(--${info.c});">${r.type==='earn'?'獲得':'使用'}</span>
      <span class="days">${r.type==='earn'?'+':'-'}${displayAmount(r)}</span>
      ${r.note? `<span class="note">📝 ${escapeHtml(r.note)}</span>` : ''}
    </div>
    <div class="ledger-bottom">
      ${r.expiry? `<div class="expiry">⏳ ${info.label}到期日：${toROC(r.expiry)}</div>`:'<div></div>'}
      <div class="ledger-actions">
        <button class="del" title="編輯" onclick="startEditComp('${r.id}')">✎ 編輯</button>
        <button class="del" title="刪除" onclick="removeComp(event.currentTarget,'${r.id}')">✕ 刪除</button>
      </div>
    </div>
  </li>`;
}

function compSectionHtml(category){
  category = category || 'comp';
  const info = COMP_CATEGORIES[category];
  const allComp = state.compRecords.filter(r=>r.date.startsWith(String(selectedYear)) && (r.category||'comp')===category);
  let compRows = allComp.filter(r=>matchesSearch(r.date, r.note, info.label, r.type==='earn'?'獲得':'使用'));
  compRows.sort((a,b)=> sortAsc ? a.date.localeCompare(b.date) : b.date.localeCompare(a.date));
  const compEmptyMsg = allComp.length===0 ? `${selectedYear} 年尚無${info.label}紀錄，可以在上方表單登記第一筆 👆` : '查無符合搜尋的紀錄';

  const forceExpand = (groupRows)=> editing && editing.kind==='comp' && groupRows.some(r=>r.id===editing.id);
  const totalFn = (groupRows)=>{
    const net = groupRows.reduce((s,r)=> s + (r.type==='earn'? toDays(r): -toDays(r)), 0);
    return `${groupRows.length} 筆・淨 ${net>=0?'+':''}${fmt(net)} 天`;
  };
  const listHtml = renderMonthGroups(category, compRows, compEmptyMsg, r=>buildCompLi(r,dMin,dMax,category), totalFn, forceExpand);
  return `
    <section class="block">
      <h2><span class="dot dot-${info.c}"></span>${info.label}</h2>
      <div class="hint" style="margin-bottom:10px;">可選擇用「天」或「小時」登記，換算比例為 1 天 = ${getHoursPerDay()} 小時（可在「設定」分頁調整）。${info.label}期限固定為 ${info.defaultYears} 年。</div>
      <form class="entry" onsubmit="addComp(event, '${category}')">
        <div class="form-row">
          <div class="field" style="flex:0 0 160px;"><label>類型</label>
            <select id="compType">
              <option value="earn">獲得${info.label}</option>
              <option value="use">使用${info.label}</option>
            </select>
          </div>

        <div class="form-row">
          <div class="field" style="flex:1;min-width:170px;"><label>日期</label><div class="date-row"><input type="date" id="compDate" value="${dDef}" min="${dMin}" max="${dMax}" onchange="onCompDateChange('${category}')" required><button type="button" class="date-toggle" onclick="setDateQuick('compDate',0);onCompDateChange('${category}');">今天</button><button type="button" class="date-toggle" onclick="setDateQuick('compDate',-1);onCompDateChange('${category}');">昨天</button><button type="button" class="date-toggle" onclick="toggleDateInputType('compDate')" title="切換手動輸入">⌨</button></div></div>
        </div>
        <div class="form-row">
          <div class="field field-days">
            <label>數量</label>
            <div class="days-row">
              <input type="number" id="compAmount" min="0.5" step="0.5" value="1" required>
              <select id="compUnit" onchange="onCompUnitChange()" style="width:82px;padding:8px 4px;">
                <option value="day">天</option>
                <option value="hour">小時</option>
              </select>
              <div class="quickdays" id="compQuickDay">
                <button type="button" onclick="setDays('compAmount',0.5)">0.5</button>
                <button type="button" onclick="setDays('compAmount',1)">1</button>
                <button type="button" onclick="setDays('compAmount',2)">2</button>
              </div>
              <div class="quickdays" id="compQuickHour" style="display:none;">
                <button type="button" onclick="setDays('compAmount',1)">1</button>
                <button type="button" onclick="setDays('compAmount',2)">2</button>
                <button type="button" onclick="setDays('compAmount',4)">4</button>
              </div>
            </div>
          </div>
        </div>
        <div class="form-row">
          <div class="field" style="flex:1;min-width:210px;">
            <label>⏳ 到期日（自動預設 ${info.defaultYears} 年後，可手動修改）</label>
            <div class="date-row"><input type="date" id="compExpiry" value="${addYears(dDef,info.defaultYears)}" oninput="expiryTouched=true"><button type="button" class="date-toggle" onclick="toggleDateInputType('compExpiry')" title="切換手動輸入">⌨</button></div>
          </div>
        </div>
        <div class="form-row">
          <div class="field note"><label>備註</label><input type="text" id="compNote" placeholder="例如：假日加班換休"></div>
          <button type="submit" class="btn-${info.c}">登記</button>
        </div>
      </form>
      <div class="history-divider"><span>📖 以下是 ${selectedYear} 年的歷史紀錄</span></div>
      ${listHtml}
      <div class="reset-row">
        <span class="reset-label">清除紀錄：</span>
        <select id="compResetScope">
          <option value="day">指定某天</option>
          <option value="month">指定某月</option>
          <option value="year">指定某年</option>
          <option value="all">全部</option>
        </select>
        <button class="danger-btn" onclick="resetRecords(document.getElementById('compResetScope').value, '${category}')">重置</button>
      </div>
    </section>
`;
}

async function addRecord(key, e){
  e.preventDefault();
  try{
    const date = parseFlexibleDate(document.getElementById(key+'Date').value);
    const unit = document.getElementById(key+'Unit').value;
    const amount = parseFloat(document.getElementById(key+'Amount').value);
    const note = document.getElementById(key+'Note').value.trim();
    if(!date || isNaN(amount) || amount<=0){ setStatus('請填寫日期與數量', false); return; }
    const daysEquiv = unit==='hour' ? amount/getHoursPerDay() : amount;
    const currentRemain = remainOf(key, selectedYear);
    if(currentRemain - daysEquiv < 0){
      const label = (LEAVE_TYPES.find(t=>t.key===key)||{}).label || '';
      if(!window.confirm(`這筆會超過可用的${label}天數（目前剩餘 ${fmt(currentRemain)} 天 ≈ ${fmt(currentRemain*getHoursPerDay())} 小時），仍要登記嗎？`)) return;
    }
    const id = uid();
    if(!state.records[key]) state.records[key]=[];
    state.records[key].push({ id, date, unit, amount, note });
    lastAddedId = id;
    await saveState();
    render();
    setStatus('已登記使用', true);
  }catch(err){
    setStatus('儲存失敗：' + (err && err.message ? err.message : String(err)), false);
    console.error(err);
  }
}

async function aiParseFreeform(){
  const btn = document.getElementById('aiParseBtn');
  const textEl = document.getElementById('aiInputText');
  const text = textEl ? textEl.value : '';
  if(!text || !text.trim()){ setStatus('請先輸入想描述的內容', false); return; }
  if(!window.aiReady || !window.aiModel){ setStatus('AI 服務尚未就緒，請稍後再試（若剛開啟頁面請等一下）', false); return; }
  if(btn){ btn.disabled = true; btn.textContent = 'AI 解析中…'; }
  try{
    const prompt = buildAiPrompt(text.trim());
    const result = await window.aiModel.generateContent(prompt);
    const raw = result && result.response ? result.response.text() : '';
    if(!raw){ throw new Error('AI 沒有回傳可用的內容'); }
    let cleaned = raw.trim().replace(/^```json\s*/i,'').replace(/^```\s*/,'').replace(/```\s*$/,'');
    let parsed;
    try{ parsed = JSON.parse(cleaned); }
    catch(e){ throw new Error('AI 回傳的內容格式異常，請換個說法再試一次'); }
    if(!Array.isArray(parsed)) parsed = [];

    const validLeaveKeys = LEAVE_TYPES.map(t=>t.key);
    const items = [];
    const rejected = [];
    parsed.forEach(it=>{
      if(!it || typeof it !== 'object'){ return; }
      const dateOk = typeof it.date === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(it.date);
      const amountOk = typeof it.amount === 'number' && it.amount > 0;
      const unitOk = it.unit === 'day' || it.unit === 'hour';
      if(!dateOk || !amountOk || !unitOk){ rejected.push(JSON.stringify(it)); return; }
      if(it.kind === 'leave'){
        if(!validLeaveKeys.includes(it.leaveKey)){ rejected.push(JSON.stringify(it)); return; }
        const label = (LEAVE_TYPES.find(t=>t.key===it.leaveKey)||{}).label || it.leaveKey;
        items.push({ kind:'leave', leaveKey: it.leaveKey, leaveLabel: label, unit: it.unit, amount: it.amount, note: it.note||'', date: it.date, raw: '(AI) ' + (it.note||'') });
      } else if(it.kind === 'comp'){
        const category = (it.category==='exchange') ? 'exchange' : 'comp';
        const compType = (it.compType==='use') ? 'use' : 'earn';
        items.push({ kind:'comp', category, compType, unit: it.unit, amount: it.amount, note: it.note||'', date: it.date, raw: '(AI) ' + (it.note||'') });
      } else {
        rejected.push(JSON.stringify(it));
      }
    });

    kwPendingItems = items;
    kwUnmatchedLines = rejected;
    if(items.length===0){ setStatus('AI 沒有辨識出可登記的資料，換個說法再試試看', false); }
    else { setStatus(`AI 辨識出 ${items.length} 筆，請確認後新增`, true); }
    render();
  }catch(err){
    setStatus('AI 解析失敗：' + (err && err.message ? err.message : String(err)), false);
  }finally{
    if(btn){ btn.disabled = false; btn.textContent = 'AI 解析'; }
  }
}

function buildHealthCheckPrompt(pendingItems){
  const contextLines = [];
  const seenKeys = new Set();
  pendingItems.forEach(it=>{
    const ctxKey = it.kind==='leave' ? ('leave:'+it.leaveKey) : ('comp:'+it.category);
    if(seenKeys.has(ctxKey)) return;
    seenKeys.add(ctxKey);
    let recent = [];
    if(it.kind==='leave'){
      recent = (state.records[it.leaveKey]||[]).slice(-8);
      contextLines.push(`${it.leaveLabel}最近既有紀錄：` + (recent.length? recent.map(r=>`${r.date} ${displayAmount(r)}${r.note?'('+r.note+')':''}`).join('；') : '（無）'));
    } else {
      recent = state.compRecords.filter(r=>(r.category||'comp')===it.category).slice(-8);
      const label = COMP_CATEGORIES[it.category].label;
      contextLines.push(`${label}最近既有紀錄：` + (recent.length? recent.map(r=>`${r.date} ${r.type==='earn'?'獲得':'使用'} ${displayAmount(r)}${r.note?'('+r.note+')':''}`).join('；') : '（無）'));
    }
  });

  const pendingLines = pendingItems.map((it,idx)=>{
    if(it.kind==='leave'){
      return `#${idx}：${it.leaveLabel} ${it.date} ${it.amount}${it.unit==='hour'?'小時':'天'}${it.note?'，備註：'+it.note:''}`;
    } else {
      const label = COMP_CATEGORIES[it.category].label;
      return `#${idx}：${label} ${it.date} ${it.compType==='earn'?'獲得':'使用'} ${it.amount}${it.unit==='hour'?'小時':'天'}${it.note?'，備註：'+it.note:''}`;
    }
  });

  return `你是請假紀錄的健檢小幫手。請檢查以下「即將新增」的假期紀錄，看有沒有可能是輸入錯誤或需要使用者留意的地方，例如：
- 跟既有紀錄重複（同一天、同假別、金額也差不多，可能手滑重複登記）
- 備註內容看起來跟選的假別不搭（例如備註寫「感冒」卻選了事假）
- 天數或小時數看起來異常大（例如既有紀錄都是1天，這筆卻是10天）
- 日期看起來可能選錯了（例如年份差很多、或是很久以前/未來的日期）

即將新增的紀錄：
${pendingLines.join('\n')}

參考的既有紀錄（同假別最近幾筆，供比對用）：
${contextLines.join('\n')}

請只回傳一個 JSON 陣列的字串，每個字串是一句簡短的提醒（繁體中文，20字以內），格式例如：["#0 這天跟7/10的紀錄重複，確定要再新增一筆嗎？"]。如果都沒問題，回傳空陣列 []。不要輸出其他文字。`;
}

      quotaItems.map(q=>`・${q.quotaLabel}總天數 → ${fmt(q.total)} 天`).join('\n');
  }
  if(!window.confirm(msg)) return;
  try{
    kwPendingItems.forEach(item=>{
      if(item.kind==='quota'){
        setQuota(item.quotaKey, selectedYear, item.total);
        return;
      }
      const id = uid();
      if(item.kind==='comp'){
        const category = item.category || 'comp';
        const info = COMP_CATEGORIES[category];
        const rec = { id, type:item.compType, date:item.date, unit:item.unit, amount:Number(item.amount), note:item.note||'', category };
        if(rec.type==='earn'){ rec.expiry = addYears(item.date, info.defaultYears); }
        state.compRecords.push(rec);
      } else if(item.kind==='leave'){
        if(!state.records[item.leaveKey]) state.records[item.leaveKey]=[];
        state.records[item.leaveKey].push({ id, date:item.date, unit:item.unit, amount:Number(item.amount), note:item.note||'' });
      }
    });
    kwPendingItems = [];
    kwUnmatchedLines = [];
    await saveState();
    render();
    setStatus('已新增解析出的紀錄', true);
  }catch(err){
    setStatus('新增失敗：' + (err && err.message ? err.message : String(err)), false);
  }
}

async function resetRecords(scope, key){
  let matcher, scopeLabel;
  if(scope==='day'){
    const d = window.prompt('請輸入要清除的日期（格式 YYYY-MM-DD），例如 2026-07-23', TODAY);
    if(!d) return;
    if(!/^\d{4}-\d{1,2}-\d{1,2}$/.test(d.trim())){ alert('日期格式不對，請用 YYYY-MM-DD'); return; }
    const iso = parseFlexibleDate(d.trim());
    matcher = ds => ds===iso;
    scopeLabel = `${toROC(iso)} 當天`;
  } else if(scope==='month'){
    const input = window.prompt('請輸入要清除的年月（格式 YYYY-MM），例如 2026-07', `${selectedYear}-${String(NOW.getMonth()+1).padStart(2,'0')}`);
    if(!input) return;
    if(!/^\d{4}-\d{1,2}$/.test(input.trim())){ alert('格式不對，請用 YYYY-MM'); return; }
    const parts = input.trim().split('-');
    const norm = `${parts[0]}-${parts[1].padStart(2,'0')}`;
    matcher = ds => ds.startsWith(norm);
    scopeLabel = `${norm} 整月`;
  } else if(scope==='year'){
    const input = window.prompt('請輸入要清除的年度（西元），例如 2026', String(selectedYear));
    if(!input) return;
    if(!/^\d{4}$/.test(input.trim())){ alert('格式不對，請輸入 4 位數西元年'); return; }
    matcher = ds => ds.startsWith(input.trim());
    scopeLabel = `西元 ${input.trim()} 年全年`;
  } else {
    matcher = () => true;
    scopeLabel = '全部（不限日期）';
  }

  const keysToClear = key==='ALL' ? LEAVE_TYPES.map(t=>t.key).concat(['comp','exchange']) : [key];
  let count = 0;
  keysToClear.forEach(k=>{
    if(k==='comp' || k==='exchange'){ count += state.compRecords.filter(r=>(r.category||'comp')===k && matcher(r.date)).length; }
    else { count += (state.records[k]||[]).filter(r=>matcher(r.date)).length; }
  });

  if(count===0){ setStatus('這個範圍內沒有符合的紀錄', false); return; }

  const targetLabel = key==='ALL' ? '所有假別（含補休／換休）' : (key==='comp' ? '補休' : key==='exchange' ? '換休' : ((LEAVE_TYPES.find(t=>t.key===key)||{}).label||key));
  if(!window.confirm(`確定要清除「${targetLabel}」在 ${scopeLabel} 的 ${count} 筆紀錄嗎？\n此動作會直接刪除，沒有復原按鈕。`)) return;

  keysToClear.forEach(k=>{
    if(k==='comp' || k==='exchange'){ state.compRecords = state.compRecords.filter(r=> !((r.category||'comp')===k && matcher(r.date))); }
    else { state.records[k] = (state.records[k]||[]).filter(r=>!matcher(r.date)); }
  });

  await saveState();
  render();
  setStatus(`已清除 ${count} 筆紀錄`, true);
}

async function addComp(e, category){
  e.preventDefault();
  category = category || 'comp';
  const info = COMP_CATEGORIES[category];
  try{
    const type = document.getElementById('compType').value;
    const date = parseFlexibleDate(document.getElementById('compDate').value);
    const unit = document.getElementById('compUnit').value;
    const amount = parseFloat(document.getElementById('compAmount').value);
    const expiry = parseFlexibleDate(document.getElementById('compExpiry').value) || null;
    const note = document.getElementById('compNote').value.trim();
    if(!date || isNaN(amount) || amount<=0){ setStatus('請填寫日期與數量', false); return; }
    const daysEquiv = unit==='hour' ? amount/getHoursPerDay() : amount;
    if(type==='use'){
      const currentBal = compBalanceUpTo(selectedYear, category);
      if(currentBal - daysEquiv < 0){
        if(!window.confirm(`這筆會超過可用的${info.label}（目前結餘 ${fmt(currentBal)} 天 ≈ ${fmt(currentBal*getHoursPerDay())} 小時），仍要登記嗎？`)) return;
      }
    }
    const id = uid();
    const record = { id, type, date, unit, amount, note, category };
    if(type==='earn' && expiry) record.expiry = expiry;
    state.compRecords.push(record);
    lastAddedId = id;
    await saveState();
    render();
    setStatus(`已登記${info.label}`, true);
  }catch(err){
    setStatus('儲存失敗：' + (err && err.message ? err.message : String(err)), false);
    console.error(err);
  }
}

async function saveEditComp(id){

    const type = document.getElementById(`editCompType-${id}`).value;
    const date = parseFlexibleDate(document.getElementById(`editCompDate-${id}`).value);
    const amount = parseFloat(document.getElementById(`editCompAmount-${id}`).value);

    editing = null;
    await saveState();
    render();

  }catch(err){
    setStatus('更新失敗：' + (err && err.message ? err.message : String(err)), false);

  }
}

async function removeComp(btnEl, id){
  if(!window.confirm('確定要刪除這筆紀錄嗎？')) return;

    const idx = state.compRecords.findIndex(r=>r.id===id);

    const item = state.compRecords[idx];

    render();

    setStatus('刪除失敗：' + (err && err.message ? err.message : String(err)), false);
  }

function buildFullReportText(){
  const lines = [];
  const now = new Date();
  const stamp = now.getFullYear()+'-'+String(now.getMonth()+1).padStart(2,'0')+'-'+String(now.getDate()).padStart(2,'0')+' '+String(now.getHours()).padStart(2,'0')+':'+String(now.getMinutes()).padStart(2,'0');
  lines.push('📒 假期存摺完整紀錄');
  lines.push('匯出時間：'+stamp);
  lines.push('（含所有年度、所有假別、所有筆數，僅供閱讀與存檔，無法用來還原資料）');
  lines.push('');

  LEAVE_TYPES.forEach(t=>{
    lines.push(`■ ${t.label}`);
    const years = Object.keys(state.quotaByYear).filter(y=> state.quotaByYear[y][t.key]!==undefined).sort();
    if(years.length){
      years.forEach(y=> lines.push(`　${y} 年總天數：${fmt(state.quotaByYear[y][t.key])} 天`));
    }
    const recs = (state.records[t.key]||[]).slice().sort((a,b)=>a.date.localeCompare(b.date));
    if(recs.length===0){ lines.push('　（無使用紀錄）'); }
    else { recs.forEach(r=> lines.push(`　${toROC(r.date)}　用 ${displayAmount(r)}${r.note? '　'+r.note:''}`)); }
    lines.push('');
  });

  ['comp','exchange'].forEach(cat=>{
    const info = COMP_CATEGORIES[cat];
    lines.push(`■ ${info.label}`);
    const compRecs = state.compRecords.filter(r=>(r.category||'comp')===cat).slice().sort((a,b)=>a.date.localeCompare(b.date));
    if(compRecs.length===0){ lines.push('　（無紀錄）'); }
    else {
      compRecs.forEach(r=>{
        let line = `　${toROC(r.date)}　${r.type==='earn'?'獲得':'使用'} ${displayAmount(r)}`;
        if(r.note) line += '　'+r.note;
        if(r.expiry) line += `　（到期：${toROC(r.expiry)}）`;
        lines.push(line);
      });
    }
    lines.push('');
    lines.push(`目前${info.label}結餘：${fmt(compBalanceUpTo(CUR_YEAR,cat))} 天（≈ ${fmt(compBalanceUpTo(CUR_YEAR,cat)*getHoursPerDay())} 小時）`);
    lines.push('');
  });

  return lines.join('\n');
}

function buildSummaryText(){
  const lines = [];
  const now = new Date();
  const stamp = now.getFullYear()+'-'+String(now.getMonth()+1).padStart(2,'0')+'-'+String(now.getDate()).padStart(2,'0')+' '+String(now.getHours()).padStart(2,'0')+':'+String(now.getMinutes()).padStart(2,'0');
  lines.push('📒 假期存摺摘要');
  lines.push('更新時間：'+stamp);
  lines.push('');
  LEAVE_TYPES.forEach(t=>{
    lines.push(`${t.label}：剩餘 ${fmt(remainOf(t.key, CUR_YEAR))} 天（共 ${fmt(getQuota(t.key, CUR_YEAR))} 天）`);
  });
  lines.push(`補休：結餘 ${fmt(compBalanceUpTo(CUR_YEAR,'comp'))} 天（≈ ${fmt(compBalanceUpTo(CUR_YEAR,'comp')*getHoursPerDay())} 小時）`);
  lines.push(`換休：結餘 ${fmt(compBalanceUpTo(CUR_YEAR,'exchange'))} 天（≈ ${fmt(compBalanceUpTo(CUR_YEAR,'exchange')*getHoursPerDay())} 小時）`);
  lines.push('');
  lines.push('最近紀錄：');
  const combined = [];
  LEAVE_TYPES.forEach(t=>{
    (state.records[t.key]||[]).forEach(r=> combined.push({date:r.date, text:`${t.label} 用 ${displayAmount(r)}${r.note? '　'+r.note:''}`}));
  });
  state.compRecords.forEach(r=>{
    const info = COMP_CATEGORIES[r.category||'comp'];
    combined.push({date:r.date, text:`${info.label} ${r.type==='earn'?'獲得':'使用'} ${displayAmount(r)}${r.note? '　'+r.note:''}`});
  });
  combined.sort((a,b)=> b.date.localeCompare(a.date));
  if(combined.length===0){ lines.push('（尚無紀錄）'); }
  else { combined.slice(0,10).forEach(c=> lines.push(`${toROC(c.date)}　${c.text}`)); }
  return lines.join('\n');
}

<!--
  Firebase AI Logic（前身 Vertex AI in Firebase）：Google 官方的「後端中繼」，
  不用自己寫 Cloud Function。App Check 負責擋濫用，金鑰完全不會出現在前端。

  部署前要做的事（Firebase 主控台）：
  1. AI Services → AI Logic → 開始使用 → 選「Gemini Developer API」（免費，不用升級 Blaze）
  2. Security → App Check → 幫這個 Web App 註冊 reCAPTCHA v3 provider，
     把下面的 RECAPTCHA_V3_SITE_KEY 換成你拿到的 site key
  3. 本機測試（例如用 localhost 開啟）：把下面 FIREBASE_APPCHECK_DEBUG_TOKEN 那行取消註解，
     開頁面後主控台會印出一組 debug token，拿去 App Check → Apps → 你的 App → Manage debug tokens 註冊
-->
<script type="module">
  import { initializeApp } from 'https://www.gstatic.com/firebasejs/12.16.0/firebase-app.js';
  import { getAI, getGenerativeModel, GoogleAIBackend } from 'https://www.gstatic.com/firebasejs/12.16.0/firebase-ai.js';
  import { initializeAppCheck, ReCaptchaV3Provider } from 'https://www.gstatic.com/firebasejs/12.16.0/firebase-app-check.js';

  // 本機開發用（正式站台請保持註解）：
  // self.FIREBASE_APPCHECK_DEBUG_TOKEN = true;

  const RECAPTCHA_V3_SITE_KEY = '6LcJyGgtAAAAALqIS95jj0GX1GK1HIURpQDBAvhF';

  function showAiError(msg){
    window.aiReady = false;
    console.error('Firebase AI Logic 初始化失敗：', msg);
    // 等主程式的 setStatus 準備好再顯示，避免載入順序問題
    const tryShow = () => {
      if(typeof window.setStatus === 'function'){ window.setStatus('AI 初始化失敗：' + msg, false); }
      else { setTimeout(tryShow, 300); }
    };
    tryShow();
  }

  function setupAiLogic(retries){
    if(typeof window.firebaseConfig === 'undefined'){
      if(retries <= 0){ showAiError('等不到 firebaseConfig，程式載入順序可能有問題'); return; }
      setTimeout(()=>setupAiLogic(retries-1), 300);
      return;
    }
    try{
      // 用獨立的、跟主程式（compat SDK）分開的 App 實例來跑 AI Logic，
      // 避免 compat 版跟 modular 版的物件型別不相容。
      const aiApp = initializeApp(window.firebaseConfig, 'aiLogicApp');
      initializeAppCheck(aiApp, {
        provider: new ReCaptchaV3Provider(RECAPTCHA_V3_SITE_KEY),
        isTokenAutoRefreshEnabled: true
      });
      const ai = getAI(aiApp, { backend: new GoogleAIBackend() });
      window.aiModel = getGenerativeModel(ai, {
        model: 'gemini-flash-latest',
        generationConfig: { responseMimeType: 'application/json', temperature: 0.2 }
      });
      window.aiReady = true;
    }catch(err){
      showAiError((err && err.message) ? err.message : String(err));
    }
  }
  setupAiLogic(20);
