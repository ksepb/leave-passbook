<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>假期存摺</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#2F5D50" id="themeColorMeta">
<script id="themeBoot">
/* 在畫面出來之前就決定淺色／深色，避免深色模式開App時先閃一下白底。偏好只存在這台裝置，不進雲端同步、不進備份 */
(function(){
  try{
    var pref = localStorage.getItem('themePref') || 'auto';
    var dark = pref==='dark' || (pref!=='light' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
    document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
    var m = document.getElementById('themeColorMeta'); if(m) m.setAttribute('content', dark ? '#1C1A17' : '#2F5D50');
  }catch(e){ document.documentElement.setAttribute('data-theme','light'); }
})();
</script>
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="假期存摺">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;700;900&family=Noto+Sans+TC:wght@400;500;700&family=IBM+Plex+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#F3EFE4;
    --paper-deep:#EAE3D2;
    --ink:#2B2A28;
    --ink-soft:#6B6459;
    --jade:#2F5D50; --jade-soft:#DDE8E2;
    --brick:#A03B3B; --brick-soft:#F1DFDA;
    --blue:#355E7A; --blue-soft:#DCE6EC;
    --olive:#7C7530; --olive-soft:#EAE7D3;
    --plum:#5B5A8C; --plum-soft:#E1E0EE;
    --rust:#A8592F; --rust-soft:#F1DDCC;
    --rose:#A8456B; --rose-soft:#F2DDE6;
    --teal:#2A7A75; --teal-soft:#DBEBE9;
    --amber-soft:#FBEFDC;
    --line:#C9C2B0;
    --amber:#B5761A;
    /* 深色模式要換色的地方，淺色模式維持原本的值 */
    --card:#fff; --field:#fdfcf9; --modal:#fffdf8; --edit-row:#fffaf0;
    --nav:rgba(255,253,248,.97); --hairline:rgba(0,0,0,.08); --tint:rgba(0,0,0,.05);
    --bg-a:#F4E4C8; --bg-b:#D3E6DC; --dot:rgba(43,42,40,.07);
    --paper-soft:#F4EEE2; --cal-cell:#EFEDE7; --cal-adjacent:#D8D2C4;
    --month-open-a:#DCEAE4; --month-open-line:#B9D6C9; --month-body:#EFF6F3;
    --month-closed-a:#F6EAD2; --month-closed-line:#E4D3A8;
    --reminder-bg:#FDF1DC; --amber-ink:#6b4a12; --note-ink:#8A5A00;
    --urgent-bg:#FBE4E2; --urgent-line:#C0392B; --urgent-ink:#8b241a;
    --inverse:var(--ink); --neutral-btn:var(--ink-soft); --undo-bg:#3A2F22;
    --jade-strong:var(--jade); --brick-strong:var(--brick); --blue-strong:var(--blue); --olive-strong:var(--olive); --plum-strong:var(--plum);
    --rust-strong:var(--rust); --rose-strong:var(--rose); --teal-strong:var(--teal); --amber-strong:var(--amber);
    color-scheme:light;
  }
  /* ===== 深色模式（<html data-theme="dark">；由「設定→外觀」或手機設定決定） =====
     暖色系的「夜裡的紙本存摺」：底色是帶一點咖啡的深灰，不是純黑；
     強調色調成中間明度，同時兼顧「深底上的文字」跟「按鈕上的白字」兩種用途都看得清楚 */
  :root[data-theme="dark"]{
      --paper:#1C1A17; --paper-deep:#24211D;
      --ink:#ECE6D8; --ink-soft:#ABA293; --line:#3E3A33;
      /* 兩種明度：文字用亮一點的（深底上看得清楚），按鈕／標籤底色用深一點的（上面的白字看得清楚） */
      --jade:#5EAB94; --brick:#E3857D; --blue:#72A4C7; --olive:#B2A95A; --plum:#9998D0;
      --rust:#D68C5D; --rose:#D77B9F; --teal:#50B2AA; --amber:#DDA548;
      --jade-strong:#407666; --brick-strong:#98534D; --blue-strong:#4E7088; --olive-strong:#6E6938; --plum-strong:#6B6A92;
      --rust-strong:#966241; --rose-strong:#96566F; --teal-strong:#387D77; --amber-strong:#89662D;
      /* 各色淡底＝該色 15%（琥珀 13%）混深底，預先算成固定色碼，舊版 iPhone（iOS 16.2 以前）也能正確顯示 */
      --jade-soft:#2D362F;
      --brick-soft:#41302B;
      --blue-soft:#303536;
      --olive-soft:#393526;
      --plum-soft:#363338;
      --rust-soft:#3F3127;
      --rose-soft:#3F2E30;
      --teal-soft:#2B3732;
      --amber-soft:#3C3223;
      --card:#262420; --field:#1F1D1A; --modal:#2A2723; --edit-row:#2E2A22;
      --nav:rgba(33,31,28,.96); --hairline:rgba(255,255,255,.09); --tint:rgba(255,255,255,.07);
      --bg-a:#231F19; --bg-b:#18201D; --dot:rgba(255,255,255,.035);
      --paper-soft:#2A2723; --cal-cell:#2A2824; --cal-adjacent:#57524A;
      --month-open-a:#20302A; --month-open-line:#34493F; --month-body:#1D2623;
      --month-closed-a:#2D281F; --month-closed-line:#4A4231;
      --reminder-bg:#2E2618; --amber-ink:#E8C98E; --note-ink:#E3B55F;
      --urgent-bg:#35201E; --urgent-line:#E07A6E; --urgent-ink:#F2B8AF;
      --inverse:#3A362F; --neutral-btn:#5E574C; --undo-bg:#463B2D;
      color-scheme:dark;
  }
  *{box-sizing:border-box;}
  html{touch-action:manipulation;}
  body{
    margin:0;
    background:linear-gradient(135deg, var(--bg-a) 0%, var(--paper) 45%, var(--bg-b) 100%);
    background-image:radial-gradient(circle at 1px 1px, var(--dot) 1px, transparent 0), linear-gradient(135deg, var(--bg-a) 0%, var(--paper) 45%, var(--bg-b) 100%);
    background-size:24px 24px, 100% 100%;
    background-attachment:fixed;
    color:var(--ink); font-family:'Noto Sans TC', sans-serif;
    padding:24px 16px calc(86px + env(safe-area-inset-bottom)); min-height:100vh;
  }
  .wrap{max-width:760px;margin:0 auto;}
  @keyframes fadeInPage{from{opacity:0;transform:translateY(4px);}to{opacity:1;transform:translateY(0);}}
  .page-fade{animation:fadeInPage .25s ease-out;}
  .shimmer-once{position:relative;overflow:hidden;}
  .add-success-box{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:60px 20px;text-align:center;animation:fadeInPage .2s ease-out;}
  .add-success-check{width:64px;height:64px;border-radius:50%;background:var(--jade-strong);color:#fff;font-size:32px;font-weight:900;display:flex;align-items:center;justify-content:center;margin-bottom:16px;animation:stampIn .35s ease-out;}
  .add-success-text{font-size:16px;font-weight:700;color:var(--ink);}
  .ledger-thumb{width:36px;height:36px;max-width:36px;max-height:36px;object-fit:cover;border-radius:8px;border:1px solid var(--line);cursor:pointer;flex-shrink:0;}
  .photo-badge{display:inline-flex;align-items:center;background:var(--blue-soft);color:var(--blue);font-size:12.5px;font-weight:700;padding:3px 8px;border-radius:20px;cursor:pointer;flex-shrink:0;}
  .photo-icon{font-size:15px;cursor:pointer;flex-shrink:0;}
  input[type="file"]{width:100%;max-width:100%;box-sizing:border-box;font-size:13px;color:var(--ink-soft);}
  .shimmer-once::after{
    content:'';
    position:absolute; top:0; left:-60%; width:55%; height:100%;
    background:linear-gradient(120deg, transparent, rgba(255,255,255,.55), transparent);
    animation:shimmerSweep 1.2s ease-out 1;
    pointer-events:none;
  }
  @keyframes shimmerSweep{
    0%{left:-60%;}
    100%{left:120%;}
  }
  .bottom-nav{
    position:fixed; left:0; right:0; bottom:0; z-index:50;
    display:flex; justify-content:space-around; align-items:center;
    background:var(--nav); -webkit-backdrop-filter:blur(10px); backdrop-filter:blur(10px);
    border-top:1px solid var(--line);
    padding:12px 8px calc(12px + env(safe-area-inset-bottom));
    box-shadow:0 -4px 16px rgba(43,42,40,.08);
  }
  .nav-item{
    flex:1; display:flex; flex-direction:column; align-items:center; gap:5px;
    background:none; border:none; padding:6px 4px; color:var(--ink-soft);
    font-family:'Noto Sans TC',sans-serif; font-weight:700; font-size:14px;
    border-radius:16px; transition:color .15s ease;
  }
  .nav-item .nav-icon-wrap{
    width:52px; height:44px; border-radius:16px;
    display:flex; align-items:center; justify-content:center;
    transition:background .15s ease, transform .15s ease;
  }
  .nav-item .nav-icon{display:flex;align-items:center;justify-content:center;line-height:1;}
  .nav-item.active{color:var(--jade);}
  .nav-item.active .nav-icon-wrap{background:var(--jade-soft);}
  .nav-item:active .nav-icon-wrap{transform:scale(.9);}
  header{text-align:center;margin-bottom:24px;}
  .eyebrow{font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:.18em;color:var(--ink-soft);text-transform:uppercase;}
  header h1{font-family:'Noto Serif TC',serif;font-weight:900;font-size:30px;margin:6px 0 2px;letter-spacing:.06em;}
  header p.sub{font-size:14px;color:var(--ink-soft);margin:0;}
  header p.sub-lead{font-size:14px;color:var(--ink-soft);margin:6px 0 10px;}
  header p.sub-foot{font-size:11.5px;color:var(--ink-soft);margin:10px 0 0;letter-spacing:.02em;}
  .home-chips{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin:0 auto;max-width:320px;}
  .chip{display:inline-flex;align-items:center;gap:4px;padding:5px 13px;border-radius:20px;font-family:'Noto Sans TC',sans-serif;font-size:12px;font-weight:500;color:var(--ink-soft);background:color-mix(in srgb, var(--card) 50%, transparent);border:1px solid var(--line);}

  .undo-bar{position:fixed;left:16px;right:16px;bottom:calc(92px + env(safe-area-inset-bottom));z-index:250;background:var(--undo-bg);color:#fff;padding:14px 18px;border-radius:12px;font-size:16px;font-weight:600;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;box-shadow:0 10px 30px rgba(0,0,0,.35);animation:fadeInPage .2s ease-out;}
  .storage-warning-banner{background:var(--brick-strong);color:#fff;padding:12px 16px;font-size:14px;font-weight:700;line-height:1.5;position:sticky;top:0;z-index:400;}
  .undo-bar button{font-size:15px;padding:8px 14px;}
  .undo-bar + .undo-bar{bottom:calc(160px + env(safe-area-inset-bottom));}
  .comp-bottom-alerts{position:fixed;left:16px;right:16px;bottom:calc(92px + env(safe-area-inset-bottom));z-index:240;display:flex;flex-direction:column;gap:8px;}
  .select-summary-bar{position:relative;background:var(--inverse);color:#fff;padding:12px 16px;border-radius:12px;font-size:16.5px;font-weight:600;display:flex;align-items:center;justify-content:space-between;gap:10px;box-shadow:0 10px 30px rgba(0,0,0,.3);animation:fadeInPage .15s ease-out;}
  .skip-warning-bar{position:relative;background:var(--amber-strong);color:#fff;padding:11px 16px;border-radius:12px;font-size:15.5px;font-weight:600;box-shadow:0 10px 30px rgba(0,0,0,.3);animation:fadeInPage .15s ease-out;}
  .select-summary-bar .ssb-need{opacity:.75;font-weight:500;}
  .select-summary-bar.ssb-ok{background:var(--jade-strong);}
  .select-summary-bar.ssb-over{background:var(--rust-strong);}
  .undo-bar button{background:var(--amber-strong);padding:5px 10px;font-size:12px;}

  .reminder-bar{background:var(--reminder-bg);border:1px solid var(--amber);color:var(--amber-ink);padding:10px 14px;border-radius:6px;font-size:14px;margin-bottom:16px;line-height:1.7;}
  .reminder-bar strong{display:block;margin-bottom:4px;font-size:13px;}
  .reminder-bar.reminder-urgent{background:var(--urgent-bg);border-color:var(--urgent-line);color:var(--urgent-ink);}
  .reminder-summary-link{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;margin:8px 0 2px;padding:10px 12px;border-radius:10px;border:1.5px solid currentColor;background:transparent;color:inherit;font-size:14.5px;font-weight:700;text-align:left;cursor:pointer;}
  .reminder-summary-arrow{flex-shrink:0;font-size:13.5px;}
  .reminder-more{display:block;margin:6px 0 0;padding:4px 0;background:none;border:none;color:inherit;font-size:13.5px;font-weight:700;opacity:.85;cursor:pointer;}
  .reminder-bar .urgent-line{color:var(--urgent-line);font-weight:700;}
  .reminder-line{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:6px 0;}
  .reminder-line > span{flex:1;min-width:0;}
  .reminder-line .ack-btn{font-size:12px;padding:4px 10px;min-height:30px;white-space:nowrap;box-shadow:none;}
  .ack-btn{flex-shrink:0;font-size:13px;font-weight:800;color:inherit;background:var(--card);border:1.5px solid currentColor;border-radius:14px;padding:6px 14px;min-height:34px;box-shadow:0 2px 6px rgba(0,0,0,.14);}
  .ack-btn:active{box-shadow:0 1px 2px rgba(0,0,0,.14);}

  .stamps{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-bottom:20px;align-items:start;}
  .home-order-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;}
  .home-order-item{display:flex;flex-direction:column;gap:6px;background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;cursor:pointer;transition:border-color .12s ease, background .12s ease;}
  .home-order-item-top{display:flex;align-items:center;justify-content:space-between;gap:8px;}
  .home-order-item.selected{border-color:var(--jade);background:var(--jade-soft);}
  .home-order-item.hidden-item{opacity:.55;}
  .home-order-label{font-size:14.5px;font-weight:700;color:var(--ink);}
  .home-order-visibility-btn{flex-shrink:0;background:none;border:none;padding:2px 4px;min-height:0;display:flex;align-items:center;gap:3px;font-size:12.5px;font-weight:700;color:var(--ink-soft);}
  .home-order-empty-tag{align-self:flex-start;font-size:12px;font-weight:700;color:var(--amber);background:var(--amber-soft, #FBEFDC);border:none;border-radius:10px;padding:3px 9px;min-height:0;}
  .stamp-card{position:relative;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px 16px 16px;overflow:hidden;box-shadow:0 2px 6px rgba(43,42,40,.05);cursor:pointer;transition:transform .12s ease, box-shadow .12s ease;}
  .stamp-card:active{transform:scale(.97);}
  .stamp-card .label{font-size:14px;font-weight:700;color:var(--ink-soft);letter-spacing:.03em;}
  .stamp-card .num{font-family:'IBM Plex Mono',monospace;font-size:22px;font-weight:700;line-height:1.15;margin-top:8px;white-space:nowrap;}
  .stamp-card .num small{font-size:11px;font-weight:500;color:var(--ink-soft);display:block;margin-top:8px;line-height:1.5;}
  .mini-chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:10px;}
  .mini-chip{font-size:10.5px;font-weight:700;padding:3px 8px;border-radius:8px;white-space:nowrap;}
  .hour-inline{font-family:'IBM Plex Mono',monospace;font-size:13.5px;font-weight:700;color:var(--amber);vertical-align:middle;}
  .tint-jade{background:color-mix(in srgb, var(--jade-soft) 45%, var(--card));}
  .tint-brick{background:color-mix(in srgb, var(--brick-soft) 45%, var(--card));}
  .tint-blue{background:color-mix(in srgb, var(--blue-soft) 45%, var(--card));}
  .tint-olive{background:color-mix(in srgb, var(--olive-soft) 45%, var(--card));}
  .tint-plum{background:color-mix(in srgb, var(--plum-soft) 45%, var(--card));}
  .tint-rust{background:color-mix(in srgb, var(--rust-soft) 45%, var(--card));}
  .tint-rose{background:color-mix(in srgb, var(--rose-soft) 45%, var(--card));}
  .tint-teal{background:color-mix(in srgb, var(--teal-soft) 45%, var(--card));}
  .tint-amber{background:color-mix(in srgb, var(--amber-soft, #FBEFDC) 45%, var(--card));}
  .stamp-card.warn .num{color:var(--amber);}
  .stamp-card.level-warn{border-color:var(--amber);}
  .stamp-card.level-warn .num{color:var(--amber);}
  .stamp-card.level-danger{border-color:var(--brick);background:var(--brick-soft);}
  .stamp-card.level-danger .num{color:var(--brick);}
  .seal{position:absolute;right:-8px;top:-8px;width:56px;height:56px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:'Noto Serif TC',serif;font-weight:900;font-size:18px;transform:rotate(-12deg);opacity:.8;border:2px solid currentColor;}
  .seal::after{content:'';position:absolute;inset:4px;border:1px solid currentColor;border-radius:50%;opacity:.6;}
  .c-jade{color:var(--jade);} .c-brick{color:var(--brick);} .c-blue{color:var(--blue);} .c-olive{color:var(--olive);} .c-plum{color:var(--plum);} .c-rust{color:var(--rust);} .c-rose{color:var(--rose);} .c-teal{color:var(--teal);} .c-amber{color:var(--amber);}
  .c-jade-bg{background:var(--jade-strong);} .c-brick-bg{background:var(--brick-strong);} .c-blue-bg{background:var(--blue-strong);} .c-olive-bg{background:var(--olive-strong);} .c-plum-bg{background:var(--plum-strong);} .c-rust-bg{background:var(--rust-strong);} .c-rose-bg{background:var(--rose-strong);} .c-teal-bg{background:var(--teal-strong);} .c-amber-bg{background:var(--amber-strong);}

  .dashboard{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-bottom:18px;}
  .dash-card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 14px;text-align:center;}
  .dash-card .label{font-size:11px;color:var(--ink-soft);}
  .dash-card .num{font-family:'IBM Plex Mono',monospace;font-size:20px;font-weight:700;margin-top:4px;}

  .hero-card{background:linear-gradient(155deg, #5C8A78, var(--jade));color:#fff;border-radius:20px;padding:22px 20px 20px;margin-bottom:16px;box-shadow:0 12px 28px -12px rgba(47,93,80,.4);}
  .hero-card .hero-label{font-size:13px;opacity:.85;}
  .hero-card .hero-num{font-family:'IBM Plex Mono',monospace;font-size:40px;font-weight:700;margin-top:4px;line-height:1.1;color:#F0C868;}
  .hero-card .hero-sub{font-size:11.5px;opacity:.75;margin-top:6px;}
  .hero-card .hero-divider{border:none;border-top:1px solid rgba(255,255,255,.25);margin:16px 0;}
  .hero-card .hero-stats{display:flex;gap:12px;}
  .hero-card .hero-stat{flex:1;}
  .hero-card .hero-stat .hero-stat-label{font-size:12px;opacity:.8;}
  .hero-card .hero-stat .hero-stat-num{font-family:'IBM Plex Mono',monospace;font-size:22px;font-weight:700;margin-top:3px;}

  .toolbar{background:color-mix(in srgb, var(--card) 70%, transparent);border:1px solid var(--line);border-radius:6px;padding:12px 14px;margin:10px 0 18px;}
  .toolbar-row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;}
  .toolbar-row + .toolbar-row{margin-top:10px;padding-top:10px;border-top:1px dashed var(--line);}
  .search-sort-row{display:flex;gap:8px;flex-wrap:nowrap;align-items:center;margin:0 0 14px;}
  .search-sort-row input[type=text]{flex:1;min-width:0;font-family:'Noto Sans TC',sans-serif;font-size:15px;padding:8px 10px;border:1px solid var(--line);border-radius:4px;background:var(--card);color:var(--ink);}
  .search-sort-row .sortbtn{flex-shrink:0;font-size:13.5px;padding:9px 10px;white-space:nowrap;}
  .year-toolbar-row{gap:10px;}
  .year-switch{display:flex;align-items:center;gap:6px;}
  .year-switch button.sortbtn{width:36px;height:36px;padding:0;min-height:0;display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:900;color:var(--jade);background:var(--card);border:1.5px solid var(--jade);border-radius:50%;}
  .back-to-today-btn{font-family:'Noto Sans TC',sans-serif;font-size:14.5px;font-weight:700;color:var(--jade);background:var(--card);border:1.5px solid var(--jade);border-radius:20px;padding:9px 18px;min-height:44px;}
  .view-toggles{display:flex;gap:8px;}
  .view-toggles button{flex:1;}
  button.sortbtn{background:var(--card);color:var(--ink-soft);border:1px solid var(--line);font-weight:500;padding:9px 14px;min-height:38px;}
  .year-label{font-family:'IBM Plex Mono',monospace;font-weight:700;font-size:22px;text-align:center;white-space:nowrap;}
  .section-label{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.14em;color:var(--ink-soft);text-transform:uppercase;margin:6px 2px 10px;}

  }
  .convert-hint{

  .date-row{display:flex;gap:6px;align-items:center;flex-wrap:wrap;}

  .multi-date-toggle{display:flex;align-items:center;gap:6px;margin-top:8px;font-size:13px;color:var(--ink-soft);cursor:pointer;}

  .multi-date-chip-x{cursor:pointer;font-family:'Noto Sans TC',sans-serif;font-weight:900;opacity:.6;padding:0 2px;}
  .multi-date-chip-x:active{opacity:1;}

  .days-row input[type=number]{width:66px;flex:none;border-radius:12px;}

  button:active{transform:scale(.96);}
  .btn-jade{background:var(--jade-strong);} .btn-brick{background:var(--brick-strong);} .btn-blue{background:var(--blue-strong);} .btn-olive{background:var(--olive-strong);} .btn-plum{background:var(--plum-strong);} .btn-rust{background:var(--rust-strong);} .btn-rose{background:var(--rose-strong);} .btn-teal{background:var(--teal-strong);} .btn-amber{background:var(--amber-strong);}
  .btn-outline-jade,.btn-outline-brick,.btn-outline-blue,.btn-outline-olive,.btn-outline-plum,.btn-outline-rust,.btn-outline-rose,.btn-outline-teal,.btn-outline-amber{background:var(--card);border-style:solid;border-width:1.2px;font-weight:700;}
  .btn-outline-jade{color:var(--jade);border-color:var(--jade);} .btn-outline-brick{color:var(--brick);border-color:var(--brick);} .btn-outline-blue{color:var(--blue);border-color:var(--blue);} .btn-outline-olive{color:var(--olive);border-color:var(--olive);} .btn-outline-plum{color:var(--plum);border-color:var(--plum);} .btn-outline-rust{color:var(--rust);border-color:var(--rust);} .btn-outline-rose{color:var(--rose);border-color:var(--rose);} .btn-outline-teal{color:var(--teal);border-color:var(--teal);} .btn-outline-amber{color:var(--amber);border-color:var(--amber);}
  .btn-with-badge{display:flex;align-items:center;justify-content:center;gap:4px;padding-left:8px;padding-right:8px;white-space:nowrap;min-height:34px;box-sizing:border-box;}

  .total-row{display:flex;gap:8px;align-items:flex-end;margin-bottom:16px;padding-bottom:14px;border-bottom:1px dashed var(--line);flex-wrap:wrap;}
  .quota-accordion-item{border:1px solid var(--line);border-radius:10px;padding:2px 10px;margin-bottom:10px;background:var(--card);}
  .quota-accordion-item:last-child{margin-bottom:0;}
  .quota-accordion-head{width:100%;display:flex;justify-content:space-between;align-items:center;background:none;border:none;padding:12px 2px;font-family:'Noto Sans TC',sans-serif;font-size:16.5px;font-weight:700;cursor:pointer;color:var(--ink);}
  .quota-accordion-body{padding:0 2px 14px;display:flex;gap:8px;align-items:flex-end;flex-wrap:wrap;}
  .next-year-quota{flex:1 1 100%;display:flex;gap:8px;align-items:flex-end;flex-wrap:wrap;margin-top:6px;padding-top:12px;border-top:1px dashed var(--line);}
  .auth-option{border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:12px;background:var(--card);}
  .auth-option:last-child{margin-bottom:0;}
  .auth-option-title{font-weight:700;font-size:15px;margin-bottom:4px;}
  .auth-option .hint{margin-bottom:10px;}
  .use-preview-box{background:var(--jade-soft);border-radius:10px;padding:10px 12px;margin:8px 0 14px;}
  .use-preview-line{font-size:13.5px;color:var(--ink);padding:3px 0;}
  .src-batch-list{border:1px solid var(--line);border-radius:10px;padding:6px 12px 10px;overflow:hidden;box-sizing:border-box;max-width:100%;}
  .manual-source-toggle{display:flex;align-items:center;gap:8px;font-size:15px;font-weight:600;margin:-4px 0 10px;cursor:pointer;color:var(--ink);}
  .manual-source-toggle input[type="checkbox"]{width:20px;height:20px;flex-shrink:0;accent-color:var(--jade);}
  .src-batch-row{display:flex;align-items:center;flex-wrap:wrap;gap:6px 10px;padding:12px 8px;border-top:1px solid var(--line);max-width:100%;box-sizing:border-box;border-radius:8px;}
  .src-batch-row:first-child{border-top:none;}
  .src-batch-expired{display:inline-block;margin-left:6px;padding:1px 7px;border-radius:8px;font-size:11.5px;font-weight:700;color:var(--brick);background:var(--brick-soft);vertical-align:1px;}
  .src-batch-row:has(input[type="checkbox"]:checked){background:var(--jade-soft);}
  .src-batch-check{display:flex;align-items:center;gap:8px;font-size:17px;font-weight:600;color:var(--ink);cursor:pointer;flex:0 1 auto;min-width:0;max-width:100%;}
  .src-batch-label{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;flex:0 1 auto;}
  .src-batch-remain{color:var(--jade);font-weight:700;font-size:16px;flex-shrink:0;white-space:nowrap;}
  .src-batch-row:has(input[type="checkbox"]:checked) .src-batch-remain{display:none;}
  .src-batch-check input[type="checkbox"]{flex-shrink:0;width:22px;height:22px;accent-color:var(--jade);}
  .src-batch-days{width:92px;box-sizing:border-box;padding:8px 10px 8px 6px;font-size:17px;font-weight:700;text-align:right;border:1px solid var(--line);border-radius:8px;flex-shrink:0;}
  .src-batch-input-wrap{display:flex;align-items:center;gap:6px;flex-shrink:0;}
  .src-batch-unit{font-size:15.5px;font-weight:600;color:var(--ink);flex-shrink:0;}
  .avail-batch-list{display:flex;flex-direction:column;gap:8px;margin-bottom:16px;}
  .avail-batch-item{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--card);position:relative;}
  .avail-batch-edit-btn{position:absolute;top:8px;right:8px;width:30px;height:30px;display:flex;align-items:center;justify-content:center;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--ink-soft);font-size:14px;cursor:pointer;}
  .avail-batch-title{margin-bottom:3px;display:flex;align-items:center;flex-wrap:wrap;gap:4px;padding-right:38px;}
  .avail-batch-date{font-weight:700;font-size:14.5px;color:var(--ink);}
  .avail-batch-note-tag{display:inline-block;background:var(--plum-soft);color:var(--plum);font-weight:700;padding:2px 9px;border-radius:8px;font-size:13.5px;}
  .avail-batch-list-label{font-size:16.5px;font-weight:800;color:var(--jade);margin:0 0 10px;letter-spacing:.2px;}
  .avail-batch-stack-toggle{display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;background:none;border:none;padding:0;margin:0 0 10px;min-height:0;text-align:left;}
  .avail-batch-stack-toggle .avail-batch-list-label{min-width:0;white-space:normal;font-size:14.5px;line-height:1.3;}
  .avail-batch-stack-right{display:flex;align-items:center;gap:5px;flex-shrink:0;}
  .avail-batch-stack-count{font-size:14px;font-weight:800;color:var(--ink-soft);}
  /* 標題列小圖示：最初那版，純色塊交疊，不帶文字，收合/展開時攤開角度變化 */
  .avail-batch-stack-icon{position:relative;width:26px;height:20px;flex-shrink:0;}
  .stack-card{position:absolute;top:1px;left:2px;width:20px;height:14px;border-radius:3px;border:1.5px solid #1F1F1F;background:var(--card);transition:transform .3s ease;}
  .stack-card-2{background:var(--brick-soft);}
  .stack-card-3{background:var(--amber-soft, #FBEFDC);}
  .avail-batch-stack-icon .stack-card-1{transform:rotate(-6deg) translate(-1px,1px);}
  .avail-batch-stack-icon .stack-card-2{transform:rotate(0deg) translate(0,0);}
  .avail-batch-stack-icon .stack-card-3{transform:rotate(6deg) translate(1px,-1px);}
  .avail-batch-stack-icon.is-open .stack-card-1{transform:rotate(0deg) translate(-6px,3px);}
  .avail-batch-stack-icon.is-open .stack-card-2{transform:rotate(0deg) translate(0,0);}
  .avail-batch-stack-icon.is-open .stack-card-3{transform:rotate(0deg) translate(6px,-3px);}
  /* 內容區真實卡片堆疊預覽：等大卡片，後面的卡片從上方露出一截真實資訊（不是縮小、不是純色條），
     像Apple Wallet卡片疊在一起的手感；文字靠卡片頂部對齊，這樣露出的那一截剛好是完整一行文字，不會卡在文字中間 */
  .avail-batch-stack-preview{position:relative;margin-bottom:14px;cursor:pointer;}
  .avail-batch-stack-preview.is-hidden{display:none;}
  .stack-preview-layer{position:absolute;left:0;right:0;top:0;border:1.5px solid var(--line);border-radius:10px;padding:11px 12px 4px;display:flex;align-items:center;gap:8px;flex-wrap:nowrap;box-shadow:0 2px 6px rgba(43,42,40,.08);transition:transform .3s ease;overflow:hidden;white-space:nowrap;}
  .stack-preview-layer .avail-batch-note-tag{overflow:hidden;text-overflow:ellipsis;max-width:90px;}
  .stack-preview-layer-front{align-items:center;padding:6px 12px;}
  .stack-preview-layer-front .avail-batch-date{font-size:17px;}
  .stack-preview-remain{font-size:13px;font-weight:700;color:var(--ink-soft);margin-left:auto;}
  .stack-preview-layer-empty{border-style:solid;}
  /* 純裝飾用的「下面還有」提示：不放內容，只是一條窄窄的陰影色塊，暗示堆疊還沒完，只有真的還有更多資料時才會出現 */
  .stack-preview-more-hint{position:absolute;left:12px;right:12px;height:10px;border-radius:0 0 8px 8px;background:rgba(43,42,40,.08);z-index:0;}
  /* 用grid-template-rows從0fr到1fr做展開/收合動畫：比起猜一個max-height，這個寫法對「內容筆數不固定、高度不一樣」更穩定，不會animation時間跟實際高度對不上 */
  .avail-batch-collapse-wrap{display:grid;grid-template-rows:0fr;transition:grid-template-rows .32s ease;}
  .avail-batch-collapse-wrap.is-expanded{grid-template-rows:1fr;}
  .avail-batch-collapse-inner{overflow:hidden;min-height:0;}
  .avail-batch-section{margin-top:14px;padding:14px;background:var(--card);border-radius:10px;}
  .avail-batch-remain{font-size:14px;color:var(--ink-soft);font-weight:700;white-space:nowrap;overflow-x:auto;}
  /* 小時的顯示樣式故意拆成兩個class：
     .avail-batch-hours（低調小字）用在首頁明細彈窗、到期倒數文字等4個地方，這些地方要維持不搶眼
     .avail-batch-hours-strong（放大加粗綠色）只用在「假別紀錄→補休/換休→還沒用完的紀錄」這個清單，故意要醒目
     兩者外觀刻意不同，之後如果要調整「小時顯示」的樣式，記得確認是要動哪一個、還是兩個都要動 */
  .avail-batch-hours{color:var(--ink-soft);font-weight:600;font-size:13px;margin-left:2px;}
  .avail-batch-hours-strong{color:var(--jade);font-weight:700;font-size:15px;margin-left:2px;}
  .avail-batch-expiry{font-size:12.5px;margin-top:3px;font-family:'IBM Plex Mono',monospace;}
  .info-icon-btn{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--ink-soft);font-size:13px;cursor:pointer;margin-left:6px;vertical-align:middle;}
  .leave-section-title{display:flex;justify-content:space-between;align-items:center;gap:10px;}
  .overview-unit-toggle{flex-shrink:0;font-size:14px;font-weight:700;color:var(--jade);background:var(--card);border:1px solid var(--line);border-radius:14px;padding:6px 12px;min-height:32px;}
  .overview-unit-arrow-icon{font-size:17px;font-weight:900;margin-right:2px;}
  .overview-panel{background:var(--jade-soft);border-radius:14px;padding:16px 16px 18px;margin-bottom:16px;}
  .overview-balance{font-size:15px;font-weight:700;color:var(--ink);}
  .overview-expiry{font-size:13.5px;padding-top:14px;margin-top:14px;border-top:1px solid var(--hairline);}

  .overview-stat-label{font-size:12px;color:var(--ink-soft);font-weight:600;margin-bottom:6px;}
  .overview-stat-value{font-size:22px;font-weight:800;color:var(--ink);line-height:1.3;}
  .overview-stat-unit{font-size:13px;font-weight:600;margin-left:2px;color:var(--ink-soft);}
  .overview-carryover-note{display:flex;align-items:center;gap:6px;background:var(--card);color:var(--amber-ink);border-radius:10px;padding:8px 12px;margin-top:14px;font-size:13px;font-weight:700;}

  .theme-hint-overlay{position:fixed;inset:0;z-index:260;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;padding:24px;cursor:pointer;}

let currentUser = null;

let fbDb = null;
let fbStorage = null;

function initFirebase(){
  try{
    if(typeof firebase === 'undefined'){ setStatus('雲端功能載入失敗（Firebase 套件沒抓到）', false); return; }
    firebase.initializeApp(firebaseConfig);
    fbAuth = firebase.auth();
    fbDb = firebase.firestore();
    fbStorage = firebase.storage();
    // 開啟離線持久化：離線時的寫入會自動存進手機本機（IndexedDB），
    // 就算 App 中途被關掉、離線很久才重開，網路恢復後 Firestore SDK 會自己補送出去，不會遺失。
    // synchronizeTabs 讓同一台裝置如果同時開多個分頁/視窗也能正確運作。
    fbDb.enablePersistence({ synchronizeTabs: true }).catch(e=>{
      // failed-precondition：瀏覽器不支援多分頁同步持久化（例如已開好幾個分頁）
      // unimplemented：瀏覽器本身不支援（例如 Safari 無痕模式），這兩種都不影響基本功能，只是離線時不會自動排隊
      console.warn('離線持久化未能啟用（不影響基本功能）', e && e.code);
    });
    fbAuth.setPersistence(firebase.auth.Auth.Persistence.LOCAL).catch(e=>console.error('設定登入保存方式失敗', e));
    let firstAuthCheck = true;
    fbAuth.onAuthStateChanged(async (user)=>{
      currentUser = user;
      render();
      if(user){
        cleanupExpiredCompPhotos();
        processPhotoDeleteQueue(); // 之前沒登入／離線時沒刪成功的照片，登入後補刪
        checkForCloudUpdates(); // App剛開啟就已經是登入狀態時，順便安靜檢查一次雲端有沒有更新（例如剛用別台裝置/瀏覽器新增過資料）
      }
      if(firstAuthCheck){
        firstAuthCheck = false;
        if(user){ setStatus('✓ 偵測到已登入：' + (user.email||user.displayName||''), true); }
        else { setStatus('偵測結果：目前沒有登入狀態', false); }
      }
    });
    fbAuth.getRedirectResult().then(async (result)=>{
      if(result && result.user){
        // 真正剛從登入跳轉回來，才需要詢問雲端/本機衝突
        signInFlowInProgress = true;
        currentUser = result.user;
        await pullOrPushOnSignIn();
        applyUiScale();
        render();
      }
    }).catch(e=>{
      setStatus('登入失敗：' + (e && e.message ? e.message : String(e)), false);
    });
  }catch(e){ console.error('Firebase 初始化失敗', e); }
}

async function signInWithGoogle(){
  if(!fbAuth){ setStatus('雲端同步尚未就緒，請稍後再試', false); return; }
  try{
    const provider = new firebase.auth.GoogleAuthProvider();
    const result = await fbAuth.signInWithPopup(provider);
    if(result && result.user){
      signInFlowInProgress = true;
      currentUser = result.user;
      try{ localStorage.setItem('lastSignInMethod', 'google'); }catch(e){}
      await pullOrPushOnSignIn();
      applyUiScale();
      render();
    }
  }catch(e){
    window.alert('Google 登入失敗：' + (e && e.message ? e.message : String(e)));
    setStatus('登入失敗', false);
  }
}

async function submitEmailPasswordAuth(mode, btnEl){
  if(!fbAuth){ setStatus('雲端同步尚未就緒，請稍後再試', false); return; }
  const email = (document.getElementById('emailPwEmail')||{}).value.trim() || '';
  const pw = (document.getElementById('emailPwPassword')||{}).value || '';
  if(!email || !pw){ setStatus('請輸入 Email 跟密碼', false); return; }
  if(pw.length < 6){ setStatus('密碼至少要 6 個字', false); return; }
  if(btnEl){ btnEl.disabled = true; btnEl.textContent = '處理中…'; }
  setStatus('處理中…（跟 Firebase 對話中，最多等 15 秒）', true);
  const withTimeout = (p, ms, label) => Promise.race([
    p,
    new Promise((_, reject) => setTimeout(()=>reject(Object.assign(new Error(`${label}逾時：等了 ${ms/1000} 秒都沒回應，可能是網路問題或這個瀏覽器環境擋住了 Firebase 的連線`), {code:'timeout'})), ms))
  ]);
  try{
    const result = await withTimeout(
      mode==='signup' ? fbAuth.createUserWithEmailAndPassword(email, pw) : fbAuth.signInWithEmailAndPassword(email, pw),
      15000, mode==='signup'?'註冊':'登入'
    );
    if(result && result.user){
      currentUser = result.user; // 直接用剛拿到的結果，不要等 onAuthStateChanged 非同步更新，避免時機沒對上
      try{ localStorage.setItem('lastSignInMethod', 'email-password'); }catch(e){}
      emailAuthMode = null;
      emailPwEmailVal = '';
      emailPwPasswordVal = '';
      setStatus('帳號驗證通過，同步雲端資料中…', true);
      signInFlowInProgress = true;
      await withTimeout(pullOrPushOnSignIn(), 15000, '雲端同步');
      applyUiScale();
      render();
      setStatus(mode==='signup' ? '註冊並登入成功' : '登入成功', true);
      window.alert(mode==='signup' ? '✓ 註冊並登入成功！\n\n以後每次登記資料，都會自動同步到雲端。' : '✓ 登入成功！\n\n之後每次登記資料，都會自動同步到雲端。');
    }
  }catch(e){
    console.error('Email 密碼登入失敗', e);
    const msg = {
      'auth/email-already-in-use': '這個 Email 已經註冊過了，改用「登入」',
      'auth/invalid-email': 'Email 格式不對',
      'auth/weak-password': '密碼太簡單，至少要 6 個字',
      'auth/user-not-found': '找不到這個帳號，確認 Email 是否正確，或改用「註冊」',
      'auth/wrong-password': '密碼不對',
      'auth/invalid-credential': 'Email 或密碼不對',
    }[e && e.code] || (e && e.message) || String(e);
    window.alert('❌ ' + (mode==='signup'?'註冊':'登入') + '失敗：\n\n' + msg);
    setStatus('失敗：' + msg, false);
    if(btnEl){ btnEl.disabled = false; btnEl.textContent = mode==='signup' ? '註冊並登入' : '登入'; }

// 驗證外部資料（匯入備份／雲端拉下來的資料）結構是否合理，
// 避免壞掉或被手動改亂的資料被直接套用進來
function validateState(parsed){
  const errors = [];
  if(!parsed || typeof parsed !== 'object'){ errors.push('資料不是有效的物件格式'); return {valid:false, errors}; }

  const seenIds = new Set(); // 跨records跟compRecords全部一起檢查，因為id理論上應該全域唯一（用uid()產生），不分假別類別
  const VALID_UNITS = ['day','hour'];
  const MAX_REASONABLE_AMOUNT = 3650; // 抓一個寬鬆但有限的上限（約10年份的天數），純粹擋掉Infinity或誤植的誇張數字，正常使用不可能碰到
  // 檢查一個數量欄位是不是「合理的正數」：不是NaN、不是Infinity、不是負數或0、不會誇張大、小數位不會異常多
  function isReasonableAmount(v){
    if(typeof v !== 'number' || !isFinite(v) || v<=0) return false; // isFinite同時擋掉NaN跟±Infinity
    if(v > MAX_REASONABLE_AMOUNT) return false;
    // 小數位最多到小數點後2位就夠用了（例如0.5天、4.25小時），超過視為異常精度，可能是資料損毀或浮點數運算殘留的雜訊
    // 不限制小數位數：App自己算出的剩餘天數（例如1天=9小時時，扣掉4小時剩0.5555…天）本來就可能是循環小數，
    // 之前限制小數位會把App自己產生的正常資料判成異常，導致備份還原失敗、其他裝置永遠同步不到
    return true;
  }
  // 檢查id：必須存在、是字串、而且沒有跟其他紀錄重複過
  function checkId(id, label){
    if(!id || typeof id !== 'string'){ errors.push(`${label} 缺少有效的id`); return; }
    if(seenIds.has(id)){ errors.push(`${label} 的id「${id}」跟其他紀錄重複了`); return; }
    seenIds.add(id);
  }

  if(parsed.records !== undefined){
    if(typeof parsed.records !== 'object' || parsed.records===null){ errors.push('records 假別紀錄區塊格式不對'); }
    else {
      const validKeys = LEAVE_TYPES.map(t=>t.key);
      Object.keys(parsed.records).forEach(key=>{
        if(!validKeys.includes(key)){ errors.push(`「${key}」不是有效的假別代號`); return; }
        const arr = parsed.records[key];
        if(!Array.isArray(arr)){ errors.push(`「${key}」底下的紀錄不是陣列格式`); return; }
        arr.forEach((r,i)=>{
          if(!r || typeof r !== 'object'){ errors.push(`${key} 第 ${i+1} 筆不是有效的紀錄物件`); return; }
          checkId(r.id, `${key} 第 ${i+1} 筆`);
          if(!r.date || !/^\d{4}-\d{1,2}-\d{1,2}$/.test(r.date) || isNaN(new Date(r.date).getTime())){ errors.push(`${key} 第 ${i+1} 筆日期不合法（${r.date}）`); }
          if(r.unit!==undefined && !VALID_UNITS.includes(r.unit)){ errors.push(`${key} 第 ${i+1} 筆的unit「${r.unit}」不是合法的單位（只能是day或hour）`); }
          const amt = r.unit==='hour' ? r.amount : (r.unit==='day' ? r.amount : r.days);
          if(!isReasonableAmount(amt)){ errors.push(`${key} 第 ${i+1} 筆的天數／小時數不合法（${amt}）`); }
        });
      });
    }
  }

  if(parsed.compRecords !== undefined){
    if(!Array.isArray(parsed.compRecords)){ errors.push('compRecords 補休／換休紀錄不是陣列格式'); }
    else {
      parsed.compRecords.forEach((r,i)=>{
        if(!r || typeof r !== 'object'){ errors.push(`補休／換休第 ${i+1} 筆不是有效的紀錄物件`); return; }
        checkId(r.id, `補休／換休第 ${i+1} 筆`);
        if(!['comp','exchange','custom'].includes(r.category||'comp')){ errors.push(`補休／換休第 ${i+1} 筆的類別不合法`); }
        if(!['earn','use'].includes(r.type)){ errors.push(`補休／換休第 ${i+1} 筆的類型不合法`); }
        if(!r.date || !/^\d{4}-\d{1,2}-\d{1,2}$/.test(r.date) || isNaN(new Date(r.date).getTime())){ errors.push(`補休／換休第 ${i+1} 筆日期不合法`); }
        if(r.unit!==undefined && !VALID_UNITS.includes(r.unit)){ errors.push(`補休／換休第 ${i+1} 筆的unit「${r.unit}」不是合法的單位（只能是day或hour）`); }
        const compAmt = (r.unit==='hour' || r.unit==='day') ? r.amount : (r.amount!==undefined ? r.amount : r.days); // 跟loadState一致：很早期的紀錄可能只有days欄位
        if(!isReasonableAmount(compAmt)){ errors.push(`補休／換休第 ${i+1} 筆數量不合法（${compAmt}）`); }
      });
    }
  }

  if(parsed.quotaByYear !== undefined && (typeof parsed.quotaByYear !== 'object' || parsed.quotaByYear===null)){
    errors.push('quotaByYear 總天數設定格式不對');
  }

  return { valid: errors.length===0, errors };
}

function applyCloudData(jsonStr){
  try{
    const parsed = JSON.parse(jsonStr);
    const check = validateState(parsed);
    if(!check.valid){
      console.error('雲端資料驗證失敗，保留本機資料', check.errors);
      logAppError('雲端資料驗證失敗，已保留本機資料', check.errors.slice(0,5).join('；'));
      setStatus('雲端資料格式異常，已保留本機資料（詳情見設定頁錯誤記錄）', false);
      return false;
    }
    // 用雲端資料覆蓋本機前，先記下本機現在引用的照片，蓋過去之後比對雲端資料裡還有哪些，
    // 本機有、雲端沒有的那些照片就是孤兒了（不會再有任何紀錄指向它），直接清掉避免雲端空間一直堆積用不到的照片。
    // 這裡不像還原/重置那樣給30分鐘反悔時間，因為套用雲端資料本身就是使用者已經做過的選擇（例如已經在「保留哪一份」的對話框選過），不是可能誤觸的操作
    const oldUrls = (state.compRecords||[]).filter(r=>r.photoUrl).map(r=>r.photoUrl);
    state = Object.assign(defaultState(), parsed);
    state.records = Object.assign(defaultState().records, parsed.records||{}); // 缺少的假別補回空陣列，避免之後新增時 push 到 undefined
    const newUrls = new Set((state.compRecords||[]).filter(r=>r.photoUrl).map(r=>r.photoUrl));
    const orphanUrls = oldUrls.filter(u=>!newUrls.has(u));
    orphanUrls.forEach(u=>{ deleteCompPhoto(u); }); // 不用await，背景清就好，不要卡住套用雲端資料這個主流程
    return true;
  }catch(e){
    console.error('雲端資料格式錯誤', e);
    logAppError('雲端資料格式錯誤', e && e.message ? e.message : String(e));
    setStatus('雲端資料格式異常，已保留本機資料', false);
    return false;
  }
}

function countAllRecords(s){
  let n = 0;
  Object.values(s.records||{}).forEach(arr=> n += (arr||[]).length);
  n += (s.compRecords||[]).length;
  return n;
}

let signInFlowInProgress = false; // pullOrPushOnSignIn正在跑（可能正要跳出雲端/本機選擇視窗）時鎖住，避免checkForCloudUpdates搶跑蓋過去
async function pullOrPushOnSignIn(){
  if(!fbDb || !currentUser) return;
  signInFlowInProgress = true;
  try{
    const docRef = fbDb.collection('leavePassbook').doc(currentUser.uid);
    const snap = await docRef.get();
    if(!snap.exists){
      const pushedAt = Date.now();
      await docRef.set({ data: JSON.stringify(state), updatedAt: pushedAt, deviceId: getDeviceId(), deviceName: getDeviceName() });
      lastCloudUpdatedAt = pushedAt;
      setStatus('已將目前資料上傳到雲端', true);
    } else {
      const cloudData = snap.data();
      const localCount = countAllRecords(state);
      if(localCount > 0){
        let cloudCount = 0, cloudTimeText = '未知';
        try{
          const cloudParsed = JSON.parse(cloudData.data);
          cloudCount = countAllRecords(cloudParsed);
        }catch(e){}
        if(cloudData.updatedAt){
          const d = new Date(cloudData.updatedAt);
          cloudTimeText = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
        }
        const cloudDeviceText = cloudData.deviceName ? `由「${cloudData.deviceName}」` : '';
        const useCloud = window.confirm(
          `發現雲端跟這台裝置都有資料，請選擇要保留哪一份：\n\n` +
          `☁️ 雲端：共 ${cloudCount} 筆（${cloudDeviceText}最後更新 ${cloudTimeText}）\n` +
          `📱 這台裝置（${getDeviceName()}）：共 ${localCount} 筆\n\n` +
          `按「確定」→ 用雲端資料覆蓋這台裝置畫面\n` +
          `按「取消」→ 用這台裝置的資料覆蓋雲端`
        );
        if(useCloud){
          const applied = applyCloudData(cloudData.data);
          // 套用失敗：本機資料維持原樣，而且絕對不能往下走到saveState——那會把本機資料推上去蓋掉雲端（使用者明明選了要雲端那份）
          if(!applied) return;
          lastCloudUpdatedAt = cloudData.updatedAt||Date.now();
        }
        else {
          const pushedAt = Date.now();
          await docRef.set({ data: JSON.stringify(state), updatedAt: pushedAt, deviceId: getDeviceId(), deviceName: getDeviceName() });
          lastCloudUpdatedAt = pushedAt;
        }
      } else {
        const applied = applyCloudData(cloudData.data);
        // 套用失敗：這台是空的，如果往下走saveState會把「空資料」推上雲端，蓋掉所有裝置的資料——一定要直接停下
        if(!applied) return;
        lastCloudUpdatedAt = cloudData.updatedAt||Date.now();
      }
    }
    try{ localStorage.setItem('lastCloudUpdatedAt', String(lastCloudUpdatedAt)); }catch(e){}
    await saveState();
  }catch(e){
    setStatus('雲端同步失敗：' + (e && e.message ? e.message : String(e)), false);
  }finally{
    signInFlowInProgress = false;
  }
}

let cloudSyncStatus = 'idle'; // idle | syncing | synced | error
let lastSyncTime = null;
let lastCloudUpdatedAt = 0; // 記住我們最後一次知道的雲端資料時間戳，用來判斷之後拉到的雲端資料是不是別台裝置更新的
let isOnline = (typeof navigator!=='undefined' && navigator.onLine!==undefined) ? navigator.onLine : true;
let pendingSync = false; // 離線或同步進行中時又有新變更，記著等這輪結束要再送一次最新的
function loadLastSyncTime(){
  try{
    const raw = localStorage.getItem('lastSyncTime');
    if(raw){ lastSyncTime = new Date(Number(raw)); cloudSyncStatus = 'synced'; }
    const rawCloud = localStorage.getItem('lastCloudUpdatedAt');
    if(rawCloud){ lastCloudUpdatedAt = Number(rawCloud); }
  }catch(e){}
}
function initOnlineDetection(){
  try{
    window.addEventListener('online', ()=>{
      isOnline = true;
      render();
      syncToCloud(); // 恢復網路，主動補送一次，確保離線期間排隊的資料真的送出去
      processPhotoDeleteQueue(); // 離線期間沒刪成功的照片也補刪
      checkForCloudUpdates(); // 順便看看離線這段期間，別的裝置有沒有更新過雲端資料
    });
    window.addEventListener('offline', ()=>{
      isOnline = false;
      render();
    });
    // App 從背景切回前景時，順便安靜檢查一次雲端有沒有其他裝置的新資料
    document.addEventListener('visibilitychange', ()=>{
      if(document.visibilityState === 'visible'){ refreshNowIfDateChanged(); checkForCloudUpdates(); getResetSnapshot(); getPreRestoreSnapshot(); processPhotoDeleteQueue(); }
    });
    // Safari 的分頁「關掉再開」很多時候其實是從瀏覽器快取（bfcache）還原頁面，不是真的重新整理，
    // 這種情況下 App 的啟動流程（包括登入偵測）根本不會重新跑一次，visibilitychange 也不一定可靠抓到。
    // pageshow 搭配 event.persisted 是瀏覽器規格上專門用來偵測「這頁是從 bfcache 還原回來的」的正規做法。
    window.addEventListener('pageshow', (event)=>{
      if(event.persisted){ refreshNowIfDateChanged(); checkForCloudUpdates(); }
    });
    // 保險機制：就算分頁一直開著、螢幕也沒關過（沒有觸發visibilitychange/pageshow），
    // 每10分鐘還是會檢查一次日期有沒有跨過午夜，避免「今天」停在舊的那一天停到隔天中午都沒發現

// 安靜檢查雲端有沒有「別台裝置」更新過的新資料，有的話悄悄套用（不跳確認視窗，只在狀態列小提示一下）。
// 刻意避開兩種情況：(1) 這台裝置還有未送出的變更排隊中，避免蓋掉自己還沒送出的東西
//                   (2) 雲端最後更新的裝置就是自己，避免自己剛推上去又把自己觸發一次
async function checkForCloudUpdates(){
  if(!fbDb || !currentUser || !isOnline) return;
  if(cloudSyncing || pendingSync || signInFlowInProgress) return;
  try{
    const docRef = fbDb.collection('leavePassbook').doc(currentUser.uid);
    const snap = await docRef.get();
    // 等雲端回應的這段時間，使用者可能剛好新增了一筆（正在上傳）或登入流程開始了，這時候不能拿舊的雲端資料蓋過去
    if(cloudSyncing || pendingSync || signInFlowInProgress) return;
    if(!snap.exists) return;
    const cloudData = snap.data();
    if(!cloudData.updatedAt) return;
    const myId = getDeviceId();
    if(cloudData.deviceId === myId){
      // 是自己這台推上去的，只更新我們記住的時間戳，不用套用、不用提示
      lastCloudUpdatedAt = cloudData.updatedAt;
      try{ localStorage.setItem('lastCloudUpdatedAt', String(lastCloudUpdatedAt)); }catch(e){}
      return;
    }
    if(cloudData.updatedAt > lastCloudUpdatedAt){
      const applied = applyCloudData(cloudData.data);
      if(applied){
        // 真的套用成功，才推進時間戳記、才算數，不然下次檢查還是要能再試一次
        lastCloudUpdatedAt = cloudData.updatedAt;
        try{ localStorage.setItem('lastCloudUpdatedAt', String(lastCloudUpdatedAt)); }catch(e){}
        render();
        // 一定要存回本機，不然只是記憶體裡暫時對了、畫面看起來對，重新整理後又會讀回本機舊資料
        await saveState();
        setStatus(`☁️ 已同步「${cloudData.deviceName||'其他裝置'}」的最新資料`, true);
      } else {
        // 套用失敗（例如資料驗證沒過）：這是真正的問題，值得留下紀錄。
        // 時間戳記刻意不推進，讓下次檢查還會再試一次，不會被誤判成「已處理過」
        logAppError('雲端更新檢查：套用失敗，時間戳記不推進，下次會再試一次', `雲端updatedAt=${cloudData.updatedAt}`);
      }
    }
  }catch(e){
    console.error('檢查雲端更新失敗', e);
    logAppError('雲端更新檢查：發生例外錯誤', e && e.message ? e.message : String(e));
  }
}
async function syncToCloud(){
  if(!fbDb || !currentUser) return;
  if(cloudSyncing){ pendingSync = true; return; } // 上一輪還沒結束（可能離線中卡住），先記住，等它結束再補送最新的
  cloudSyncing = true;
  cloudSyncStatus = 'syncing';
  render();
  try{
    // Firestore 已開啟離線持久化：離線時這個 set() 會先存進本機排隊，
    // 要等網路恢復、伺服器真的收到確認後這裡才會 resolve，所以離線時這個 await 會一直卡著是正常的。
    const pushedAt = Date.now();
    await fbDb.collection('leavePassbook').doc(currentUser.uid).set({ data: JSON.stringify(state), updatedAt: pushedAt, deviceId: getDeviceId(), deviceName: getDeviceName() });
    cloudSyncStatus = 'synced';
    lastSyncTime = new Date();
    lastCloudUpdatedAt = pushedAt;
    try{ localStorage.setItem('lastSyncTime', String(lastSyncTime.getTime())); localStorage.setItem('lastCloudUpdatedAt', String(pushedAt)); }catch(e){}
  }catch(e){
    console.error('雲端同步失敗', e);
    cloudSyncStatus = 'error';
    logAppError('雲端同步失敗', e && e.message ? e.message : String(e));
  }finally{
    cloudSyncing = false;
    render();
    if(pendingSync){
      pendingSync = false;
      syncToCloud(); // 這段期間又有新變更，用目前最新的 state 再送一次
    }
  }
}
async function retrySyncNow(){
  if(!currentUser){ setStatus('尚未登入，無法同步', false); return; }
  setStatus('正在重新同步…', true);
  await syncToCloud();
  if(cloudSyncStatus==='synced'){ setStatus('已同步到雲端', true); }
  else if(!isOnline){ setStatus('目前離線，資料已存本機，恢復網路後會自動同步', false); }
  else { setStatus('同步失敗，請檢查網路連線後再試一次', false); }
}

// 國定假日（純參考，不影響任何假別計算）
// 資料來源：ruyut/TaiwanCalendar（源自人事行政總處公告的辦公日曆表），透過 jsDelivr CDN 取得
let holidayCache = {}; // { [year]: {dateStr: {isHoliday, description}}} | false(失敗) | null(讀取中)
async function ensureHolidayYear(year){
  if(holidayCache[year] !== undefined) return; // 已經有資料、讀取中、或已失敗過，都不重複要求
  holidayCache[year] = null;
  const cacheKey = 'taiwanHolidays:' + year;
  try{
    let list = null;
    try{
      const cached = localStorage.getItem(cacheKey);
      if(cached) list = JSON.parse(cached);
    }catch(e){ /* 讀本機快取失敗就當作沒有，繼續往下抓 */ }
    if(!list){
      // 用AbortController加個逾時，網路狀況不好、或請求卡住時最多等8秒就放棄，不要無限等待
      const controller = new AbortController();
      const timeoutId = setTimeout(()=>controller.abort(), 8000);
      let res;
      try{
        res = await fetch(`https://cdn.jsdelivr.net/gh/ruyut/TaiwanCalendar/data/${year}.json`, { signal: controller.signal });
      } finally {
        clearTimeout(timeoutId);
      }
      if(!res.ok) throw new Error('抓取國定假日資料失敗');
      list = await res.json();
      try{ localStorage.setItem(cacheKey, JSON.stringify(list)); }catch(e){ /* 存不下去就算了，不影響功能 */ }
    }
    const map = {};
    list.forEach(it=>{
      if(!it.date || it.date.length!==8) return;
      const iso = it.date.slice(0,4)+'-'+it.date.slice(4,6)+'-'+it.date.slice(6,8);
      map[iso] = { isHoliday: !!it.isHoliday, description: it.description||'' };
    });
    holidayCache[year] = map;
    if(activePage==='viz') render(); // 資料回來時如果還在視覺化分頁，重新畫一次讓假日標記出現
  }catch(e){
    holidayCache[year] = false; // 標記失敗，避免同一年一直重複嘗試
  }
}

// 因為人事總處的辦公日曆表偶爾會在年度中途修正（例如114年就修正過），原本的機制是抓過一次就永久用同一份，不會自動同步最新公告

}

function renderMonthGroups(listKey, rows, emptyMsg, liBuilder, totalFn, forceExpand, subTotalFn){
  if(rows.length===0) return `<div class="empty">${emptyMsg}</div>`;
  const groups = {};
  const order = [];
  rows.forEach(r=>{
    const ym = r.date.slice(0,7);
    if(!groups[ym]){ groups[ym]=[]; order.push(ym); }
    groups[ym].push(r);
  });
  const curYm = `${NOW.getFullYear()}-${String(NOW.getMonth()+1).padStart(2,'0')}`;
  const hasCurMonth = order.includes(curYm);
  // 沒有本月紀錄時，預設展開「最近的」那個月（不管排序是新到舊還是舊到新），不會因為舊到新就打開最久以前的月份
  const latestYm = order.reduce((a,b)=> b>a ? b : a, order[0]);
  return order.map((ym, idx)=>{
    const groupRows = groups[ym];
    const stateKey = `${listKey}-${ym}`;
    const isDefaultOpen = hasCurMonth ? (ym===curYm) : (ym===latestYm);
    const forced = forceExpand ? forceExpand(groupRows) : false;
    const expanded = forced ? true : (searchQuery ? true : (expandedMonths[stateKey] !== undefined ? expandedMonths[stateKey] : isDefaultOpen));
    const metaText = totalFn ? totalFn(groupRows) : `${groupRows.length} 筆`;
    const subText = subTotalFn ? subTotalFn(groupRows) : '';
    return `
      <div class="month-group">
        <button type="button" class="month-header ${expanded?'month-header-open':'month-header-closed'}" onclick="toggleMonthExpand('${stateKey}', ${expanded})">
          <div class="month-header-main">
            <span class="month-title">${monthLabel(ym)}</span>
            <span class="month-meta">${metaText}</span>
            <span class="chevron ${expanded?'chevron-open':'chevron-closed'}">${expanded?'<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>':'<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>'}</span>
          </div>
          ${subText ? `<div class="month-header-sub">${subText}</div>` : ''}
        </button>
        ${expanded? `<div class="month-body"><ul class="ledger">${groupRows.map(liBuilder).join('')}</ul></div>` : ''}
      </div>`;
  }).join('');
}

function yearMin(y){ return y+'-01-01'; }

function addYears(dateStr, n){
  try{
    const d = new Date(dateStr+'T00:00:00');
    const targetMonth = d.getMonth(); // 記住原本的月份，加年份理論上月份不該變
    d.setFullYear(d.getFullYear()+n);
    // 閏年2/29加年數，如果目標年不是閏年，JS原生的setFullYear會直接溢位到3月1日，而不是自動修正回2/28，
    // 這裡偵測「月份跑掉了」就代表溢位了，改成夾回目標月份的最後一天（例如2026年2月最後一天=2/28）
    if(d.getMonth() !== targetMonth){ d.setDate(0); }
    return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
  }catch(e){ return ''; }
}
// 換休規則跟補休不一樣：不是「獲得日期+N年」，是「當年度12/31要用完」
function endOfYear(dateStr){
  try{
    const year = parseInt(String(dateStr).slice(0,4), 10);
    if(!year) return '';
    return year+'-12-31';
  }catch(e){ return ''; }
}
// 補休/換休共用的預設到期日計算：換休固定用當年度12/31，補休（及其他）用「獲得日期+defaultYears年」
function compDefaultExpiry(category, dateStr){
  if(category==='exchange') return endOfYear(dateStr);
  const info = COMP_CATEGORIES[category] || COMP_CATEGORIES.comp;
  return addYears(dateStr, info.defaultYears);
}
function addMonths(dateStr, n){
  try{
    const d = new Date(dateStr+'T00:00:00');
    const targetMonth = ((d.getMonth()+n)%12+12)%12; // 算出理論上加完之後應該落在哪個月份（正規化到0-11）
    d.setMonth(d.getMonth()+n);
    // 原本日期是29/30/31號，加完月份如果目標月天數比較少（例如1/31加1個月，2月只有28/29天），
    // JS原生的setMonth會直接溢位到下下個月初，而不是自動修正回目標月的最後一天，這裡偵測到溢位就夾回去
    if(d.getMonth() !== targetMonth){ d.setDate(0); }
    return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
  }catch(e){ return ''; }
}

function compHourOptions(maxHours, selectedVal){
