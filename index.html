async function loadState(){
  state = defaultState();
  try{
    let raw = null;
    if(window.storage && typeof window.storage.get === 'function'){
      const res = await window.storage.get(STORAGE_KEY, false);
      raw = res && res.value;
    } else {
      raw = localStorage.getItem(STORAGE_KEY);
    }
    if(raw){
      const parsed = JSON.parse(raw);
      // 跟quotaByYear同樣的道理：這裡是App自己開機讀本機資料，原本完全沒有經過任何檢查，
      // 只過濾掉「這一筆」有問題的（缺id、id重複、unit不合法、天數是Infinity/NaN/負數），其他正常的紀錄不受影響，
      // 不會因為一筆壞資料就整批不要或整個載入失敗
      const seenLoadIds = new Set();
      function sanitizeRecordArray(arr){
        if(!Array.isArray(arr)) return [];
        return arr.filter(r=>{
          if(!r || typeof r !== 'object') return false;
          if(!r.id || typeof r.id !== 'string' || seenLoadIds.has(r.id)) return false;
          if(r.unit!==undefined && r.unit!=='day' && r.unit!=='hour') return false;
          const amt = r.unit==='hour' ? r.amount : (r.unit==='day' ? r.amount : r.days);
          const amtNum = Number(amt);
          if(!isFinite(amtNum) || amtNum<=0 || amtNum>3650) return false;
          seenLoadIds.add(r.id);
          return true;
        });
      }
      const sanitizedRecords = {};
      Object.keys(parsed.records||{}).forEach(key=>{ sanitizedRecords[key] = sanitizeRecordArray(parsed.records[key]); });
      state.records = Object.assign(state.records, sanitizedRecords);
      state.compRecords = sanitizeRecordArray(parsed.compRecords);
      // 把年度天數設定裡任何不合理的數值（Infinity/NaN/負數，可能是更早期版本沒有防呆時寫入的壞資料）清掉，
      // 不然重新整理App讀到這種舊的壞資料，總天數會直接顯示Infinity，畫面上的統計全部跟著壞掉
      function sanitizeQuotaByYear(q){
        const clean = {};
        Object.keys(q||{}).forEach(year=>{
          const yearQuotas = q[year];
          if(!yearQuotas || typeof yearQuotas !== 'object') return;
          const cleanYear = {};
          Object.keys(yearQuotas).forEach(k=>{
            const v = Number(yearQuotas[k]);
            if(isFinite(v) && v>=0) cleanYear[k] = v;
          });
          clean[year] = cleanYear;
        });
        return clean;
      }
      if(parsed.quotaByYear){
        state.quotaByYear = sanitizeQuotaByYear(parsed.quotaByYear);
      } else {
        let flatQuotas = null;
        if(parsed.quotas){ flatQuotas = parsed.quotas; }
        else if(parsed.annualTotal !== undefined){
          flatQuotas = { annual: parsed.annualTotal || 0 };
          state.records.annual = parsed.annualRecords || state.records.annual;
        }
        if(flatQuotas){ state.quotaByYear[CUR_YEAR] = sanitizeQuotaByYear({[CUR_YEAR]: flatQuotas})[CUR_YEAR]; }
      }
      if(parsed.hoursPerDay && isFinite(Number(parsed.hoursPerDay)) && Number(parsed.hoursPerDay)>0){ state.hoursPerDay = Number(parsed.hoursPerDay); }
      if(parsed.personalPaidDays !== undefined && parsed.personalPaidDays !== null && isFinite(Number(parsed.personalPaidDays)) && Number(parsed.personalPaidDays)>=0){ state.personalPaidDays = Number(parsed.personalPaidDays); }
      if(parsed.annualMinDays !== undefined && parsed.annualMinDays !== null && isFinite(Number(parsed.annualMinDays)) && Number(parsed.annualMinDays)>=0){ state.annualMinDays = Number(parsed.annualMinDays); }
      if(parsed.uiScale && isFinite(Number(parsed.uiScale)) && Number(parsed.uiScale)>0){ state.uiScale = Number(parsed.uiScale); }
      if(parsed.lastUsedType){ state.lastUsedType = String(parsed.lastUsedType); }
      if(parsed.autoDeleteExpiredPhotos !== undefined){ state.autoDeleteExpiredPhotos = !!parsed.autoDeleteExpiredPhotos; }
      if(parsed.overviewUnit==='day' || parsed.overviewUnit==='hour'){ state.overviewUnit = parsed.overviewUnit; overviewUnit = parsed.overviewUnit; }
      if(parsed.sortAsc !== undefined){ state.sortAsc = !!parsed.sortAsc; sortAsc = !!parsed.sortAsc; }
      if(parsed.yearRecordSortAsc !== undefined){ state.yearRecordSortAsc = !!parsed.yearRecordSortAsc; yearRecordSortAsc = !!parsed.yearRecordSortAsc; }
      if(parsed.activeLeaveTab){
        const validTabKeys = LEAVE_TYPES.map(t=>t.key).concat(['comp','exchange','custom']);
        if(validTabKeys.includes(parsed.activeLeaveTab)){ state.activeLeaveTab = parsed.activeLeaveTab; activeLeaveTab = parsed.activeLeaveTab; }
      }
      if(Array.isArray(parsed.homeCardOrder)){ state.homeCardOrder = parsed.homeCardOrder; }
      if(Array.isArray(parsed.hiddenHomeCards)){ state.hiddenHomeCards = parsed.hiddenHomeCards.filter(k=>HOME_CARD_KEYS.includes(k)); }
      if(parsed.availBatchCollapsed && typeof parsed.availBatchCollapsed==='object'){ state.availBatchCollapsed = parsed.availBatchCollapsed; }
      if(typeof parsed.calendarMode==='boolean'){ state.calendarMode = parsed.calendarMode; calendarMode = parsed.calendarMode; }
      if(typeof parsed.chartMode==='boolean'){ state.chartMode = parsed.chartMode; chartMode = parsed.chartMode; }
      if(typeof parsed.utilizationMode==='boolean'){ state.utilizationMode = parsed.utilizationMode; utilizationMode = parsed.utilizationMode; }
    }
  }catch(e){ /* 無資料，使用預設值 */ }
}

// 「逾期自動取消」這種系統產生的紀錄，數量是按下「已使用」那一刻的剩餘量。
// 如果之後補登了一筆更早的使用、剛好也扣到這一批，這筆取消紀錄就會多扣，多出來的部分會接著去扣「還有效」的批次（等於平白損失）。
// 這裡在每次存檔前把它對齊成「這批現在實際還剩多少」：剩0就整筆移除；補登的那筆之後被刪掉的話，這批會重新出現在過期決定清單，讓使用者再決定一次
function isAutoCancelRecord(r){
  return r && r.type==='use' && (r.autoCancel===true || r.note==='逾期自動取消') && Array.isArray(r.sourceAllocations) && r.sourceAllocations.length===1;
}
function reconcileAutoCancelRecords(){
  if(!state || !Array.isArray(state.compRecords)) return false;
  let changed = false;
  for(let pass=0; pass<5; pass++){
    const cancels = state.compRecords.filter(isAutoCancelRecord);
    if(!cancels.length) break;
    // 每個類別（其他假別依名目）只算一次先進先出，再看每筆取消紀錄「實際從自己指定的那批扣到多少」
    const coreCache = new Map();
    const coreFor = (category, label)=>{
      const k = category + '|' + (label||'');
      if(!coreCache.has(k)) coreCache.set(k, _compFifoCoreCompute(category, null, label));
      return coreCache.get(k);
    };
    const removeIds = new Set();
    let passChanged = false;
    for(const c of cancels){
      const category = c.category||'comp';
      const core = coreFor(category, category==='custom' ? c.customLabel : undefined);
      const batchId = c.sourceAllocations[0].id;
      const fromOwn = (core.breakdown[c.id]||[]).filter(e=>e.batchId===batchId).reduce((s,e)=>s+e.take, 0);
      if(toDays(c) - fromOwn > 0.0001){ // 有一部分不是從自己那批扣的（漏去扣別批、或根本扣不到）→ 對齊
        if(fromOwn <= 0.0001) removeIds.add(c.id);
        else { c.unit = 'day'; c.amount = fromOwn; c.sourceAllocations = [{id: batchId, days: fromOwn}]; }
        passChanged = true;
      }
    }
    if(removeIds.size) state.compRecords = state.compRecords.filter(r=>!removeIds.has(r.id));
    if(!passChanged) break;
    changed = true;
  }
  return changed;
}
async function saveState(){
  try{ reconcileAutoCancelRecords(); }catch(e){ console.error('對齊逾期取消紀錄失敗', e); }
  try{
    const json = JSON.stringify(state);
    if(window.storage && typeof window.storage.set === 'function'){
      await window.storage.set(STORAGE_KEY, json, false);
    } else {
      localStorage.setItem(STORAGE_KEY, json);
    }
    if(storageUnavailable){ storageUnavailable = false; render(); } // 剛才失敗過，這次成功了，警告可以收掉了
  }catch(e){
    console.error('儲存失敗', e);
    // 原本只有console.error，畫面上完全看不出來——使用者會以為東西存好了，其實根本沒真的寫進去，
    // 這比開機當下就偵測到還嚴重，因為是「操作途中資料正在被默默弄丟」，一定要讓使用者馬上知道
    if(!storageUnavailable){
      storageUnavailable = true;
      logAppError('儲存失敗：本機空間可能已滿，或瀏覽器限制了儲存功能', e && e.message ? e.message : String(e));
      render();
    }
  }
  checkCompLedgerConsistency();
  syncToCloud();
}

function getQuota(key, year){
  year = year || selectedYear;
  const y = state.quotaByYear[year];
  if(y && y[key] !== undefined) return y[key];
  const t = LEAVE_TYPES.find(t=>t.key===key);
  return t ? t.defaultQuota : 0;
}
function setQuota(key, year, val){
  if(!state.quotaByYear[year]) state.quotaByYear[year] = {};
  state.quotaByYear[year][key] = val;
}
const MENSTRUAL_FREE_DAYS = 3;
function menstrualExcess(year){
  year = year || selectedYear;
  const used = (state.records['menstrual']||[]).filter(r=>r.date.startsWith(String(year))).reduce((s,r)=>s+toDays(r),0);
  return Math.max(0, used - MENSTRUAL_FREE_DAYS);
}
function sickRawUsed(key, year){
  return (state.records[key]||[]).filter(r=>r.date.startsWith(String(year))).reduce((s,r)=>s+toDays(r),0);
}
function sickExcess(year){
  year = year || selectedYear;
  const used = sickRawUsed('sick', year) + menstrualExcess(year);
  const quota = getQuota('sick', year);
  return Math.max(0, used - quota);
}
function usedOf(key, year){
  year = year || selectedYear;
  let base = (state.records[key]||[]).filter(r=>r.date.startsWith(String(year))).reduce((s,r)=>s+toDays(r),0);
  if(key === 'sick'){ base += menstrualExcess(year); }
  if(key === 'personal'){ base += usedOf('familyCare', year); }
  return base;
}
function remainOf(key, year){
  year = year || selectedYear;
  return getQuota(key,year) - usedOf(key,year);
}
function compUseTotal(category, year){
  year = year || selectedYear;
  return (state.compRecords||[]).filter(r=> r.type==='use' && (r.category||'comp')===category && r.date.startsWith(String(year)))
    .reduce((s,r)=>s+toDays(r), 0);
}
function compEarnTotal(category, year){
  year = year || selectedYear;
  return (state.compRecords||[]).filter(r=> r.type==='earn' && (r.category||'comp')===category && r.date.startsWith(String(year)))
    .reduce((s,r)=>s+toDays(r), 0);
}
function isoDate(y,m,d){
  if(!y||!m||!d) return '';
  return `${y}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
}
function isValidCalendarDate(y,m,d){
  if(!Number.isInteger(y) || !Number.isInteger(m) || !Number.isInteger(d)) return false;
  if(y < 1900 || y > 2200) return false;
  if(m < 1 || m > 12) return false;
  const lastDay = new Date(y, m, 0).getDate(); // 該月實際天數（含閏年2月自動處理）
  if(d < 1 || d > lastDay) return false;
  return true;
}
function parseFlexibleDate(raw){
  if(!raw) return '';
  raw = String(raw).trim();
  if(/^\d{4}-\d{1,2}-\d{1,2}$/.test(raw)){
    const [y,m,d] = raw.split('-').map(Number);
    if(!isValidCalendarDate(y,m,d)) return '';
    return isoDate(y,m,d);
  }
  if(raw.includes('/')){
    const parts = raw.split('/').map(s=>s.trim());
    if(parts.length===3){
      let y = parseInt(parts[0],10);
      const m = parseInt(parts[1],10);
      const d = parseInt(parts[2],10);
      if(!isNaN(y) && y < 200) y += 1911; // 兩三位數視為民國年
      if(!isValidCalendarDate(y,m,d)) return '';
      return isoDate(y,m,d);
    }
    if(parts.length===2){
      const m = parseInt(parts[0],10);
      const d = parseInt(parts[1],10);
      if(!isValidCalendarDate(CUR_YEAR,m,d)) return ''; // 沒填年份，預設今年
      return isoDate(CUR_YEAR, m, d);
    }
  }
  // 其餘格式（例如打錯字、不支援的分隔符號）一律視為解析失敗，不要把原始文字當日期存進去
  return '';
}

function toROC(dateStr){
  if(!dateStr) return '';
  const parts = String(dateStr).split('-');
  if(parts.length!==3) return dateStr;
  const y = parseInt(parts[0],10) - 1911;
  const m = parseInt(parts[1],10);
  const d = parseInt(parts[2],10);
  if(isNaN(y) || isNaN(m) || isNaN(d)) return dateStr;
  return `${y}/${m}/${d}`;
}
function toDays(r){
  if(r.unit==='hour') return Number(r.amount)/getHoursPerDay();
  if(r.unit==='day') return Number(r.amount);
  return Number(r.days)||0;
}
function displayAmount(r){
  return `${fmt(toDays(r)*getHoursPerDay())}小時`;
}
function compBalanceAsOf(category, date, excludeId, customLabel){
  return state.compRecords
    .filter(r=>(r.category||'comp')===category && r.date<=date && r.id!==excludeId && (category!=='custom' || r.customLabel===customLabel))
    .reduce((s,r)=> s + (r.type==='earn'? toDays(r) : -toDays(r)), 0);
}

function compBalanceUpTo(year, category, customLabel){
  category = category || 'comp';
  return state.compRecords.filter(r=> parseInt(r.date.slice(0,4),10) <= year && (r.category||'comp')===category && (category!=='custom' || r.customLabel===customLabel)).reduce((s,r)=> s + (r.type==='earn'? toDays(r): -toDays(r)),0);
}

// 先進先出核心運算：算出每一筆「獲得」紀錄實際還剩多少沒被用掉，
// 同時記錄每一筆「使用」紀錄實際扣了哪些批次各多少天（不管是手動指定還是自動判斷），
// 這樣歷史紀錄畫面才能不管是不是手動指定，都能顯示「這筆實際扣了哪幾批」。
// ---- 扣抵計算快取（只在畫一次畫面的期間有效） ----
// 年度紀錄、補休/換休清單每一筆都要查「這筆扣了哪幾批」，原本每一筆都把全部紀錄從頭重算一次先進先出。
// 同一次畫面裡紀錄不會變，所以同樣的條件只算一次、記下來重複用；畫面畫完就整個丟掉，下次操作再重新算。
// 計算本身（_compFifoCoreCompute）完全沒改，這裡只是避免重複執行。
let fifoMemo = null;
function _compFifoCore(category, excludeId, customLabel){
  if(!fifoMemo) return _compFifoCoreCompute(category, excludeId, customLabel);
  const key = `${category}|${excludeId||''}|${customLabel||''}`;
  let r = fifoMemo.get(key);
  if(!r){ r = _compFifoCoreCompute(category, excludeId, customLabel); fifoMemo.set(key, r); }
  return r;
}
function _compFifoCoreCompute(category, excludeId, customLabel){
  const records = (state.compRecords||[])
    .filter(r=>(r.category||'comp')===category && r.id!==excludeId && (category!=='custom' || r.customLabel===customLabel))
    .slice()
    .sort((a,b)=> a.date.localeCompare(b.date) || (a.type==='earn'?-1:1));
  const batches = [];
  const breakdown = {}; // useRecordId -> [{date, note, take, batchId}]
  let unfulfilledByKept = 0; // 因為跳過「保留」批次而扣不滿的總量，供一致性檢查排除，避免誤判成超扣
  records.forEach(r=>{
    const days = toDays(r);
    if(r.type==='earn'){
      batches.push({id:r.id, date:r.date, expiry:r.expiry, note:r.note, photoUrl:r.photoUrl, remainDays: days, expiryAcknowledgedFor:r.expiryAcknowledgedFor, expiryDecision:r.expiryDecision});
    } else {
      let toDeduct = days;
      const pinnedIds = new Set();
      const useLog = [];
      const takeFrom = (b, amt) => {
        if(amt<=0.0001) return;
        b.remainDays -= amt;
        useLog.push({date:b.date, note:b.note, take:amt, batchId:b.id});
      };
      // 新版：手動指定多筆批次各自的天數
      if(Array.isArray(r.sourceAllocations) && r.sourceAllocations.length){
        r.sourceAllocations.forEach(alloc=>{
          if(!alloc || !alloc.id) return;
          pinnedIds.add(alloc.id);
          if(toDeduct<=0) return;
          const pinned = batches.find(b=>b.id===alloc.id);
          if(pinned && pinned.remainDays>0){
            const want = (alloc.days!=null && alloc.days>0) ? Math.min(alloc.days, pinned.remainDays, toDeduct) : Math.min(pinned.remainDays, toDeduct);
            takeFrom(pinned, want);
            toDeduct -= want;
          }
        });
      }
      // 舊版：手動指定單一批次優先扣（相容舊資料）
      else if(r.sourceEarnId){
        pinnedIds.add(r.sourceEarnId);
        const pinned = batches.find(b=>b.id===r.sourceEarnId);
        if(pinned && pinned.remainDays>0){
          const take = Math.min(pinned.remainDays, toDeduct);
          takeFrom(pinned, take);
          toDeduct -= take;
        }
      }
      // 指定批次扣不夠（或沒有指定）的部分，自動接回先進先出，從最早的開始補
      // 第一階段：優先從「沒被指定過」的批次補，這樣才符合「只指定扣一部分、故意留一部分」的預期
      // 過期後使用者選過「保留」的批次（expiryDecision==='kept'）不會被自動選中，只有手動明確指定才會扣到它，
      // 這是為了不讓系統自動去動用一批使用者已經明確表示「先留著、之後有需要再手動處理」的過期批次
      for(const b of batches){
        if(toDeduct<=0) break;
        if(pinnedIds.has(b.id)) continue;
        if(b.expiryDecision==='kept') continue;
        if(b.expiry && b.expiry < r.date) continue; // 使用當天已經過期的批次，不會被自動扣抵，只能手動指定
        if(b.remainDays<=0) continue;
        const take = Math.min(b.remainDays, toDeduct);
        takeFrom(b, take);
        toDeduct -= take;
      }
      // 第二階段：如果沒被指定的批次全部用完還是不夠，代表真的需要動用「已指定但還有剩」的批次，
      // 這時候不該再放著不用害系統誤判成餘額不足，改回去繼續照日期先後補（不然總量會對不起來，參見一致性檢查）
      // 「保留」的批次同樣跳過，理由跟第一階段一致
      if(toDeduct>0){
        for(const b of batches){
          if(toDeduct<=0) break;
          if(b.expiryDecision==='kept') continue;
          if(b.expiry && b.expiry < r.date) continue; // 同上：過期批次不自動扣
          if(b.remainDays<=0) continue;
          const take = Math.min(b.remainDays, toDeduct);
          takeFrom(b, take);
          toDeduct -= take;
        }
      }
      // 若扣抵量超過目前所有獲得批次總和（理論上不該發生），超出的部分忽略，不影響到期提醒
      // 這裡的toDeduct>0可能有兩種原因：① 剛好被跳過的「保留」批次還有剩餘量（系統正確保護，不是bug）
      // ② 真的所有批次（含保留）都不夠扣（使用者記錄的用量超過實際擁有的總量，這才是真正該被一致性檢查抓到的異常）
      // 只有原因①要排除，不能讓一致性檢查把它誤判成超扣
      if(toDeduct>0.0001){
        // 被刻意跳過（保留、或使用當天已過期）而扣不滿的部分，是規則造成的合理差異，不是超扣
        const keptAvailable = batches.filter(b=>b.expiryDecision==='kept' || (b.expiry && b.expiry < r.date)).reduce((s,b)=>s+Math.max(0,b.remainDays),0);
        unfulfilledByKept += Math.min(toDeduct, keptAvailable);
      }
      if(useLog.length) breakdown[r.id] = useLog;
    }
  });
  return { batches, breakdown, unfulfilledByKept };
}
function compFifoRemaining(category, excludeId, customLabel){
  return _compFifoCore(category, excludeId, customLabel).batches.map(b=>Object.assign({}, b));
}
// 給歷史紀錄畫面用：查某一筆使用紀錄實際扣了哪幾批、各扣多少（不管是手動指定還是自動判斷）
function compUsageBreakdown(category, useRecordId, customLabel){
  return (_compFifoCore(category, null, customLabel).breakdown[useRecordId] || []).map(e=>Object.assign({}, e));
}
// 反向查詢：這筆「獲得」批次，被哪幾筆「使用」紀錄扣過、各扣多少、扣的那天是哪天
// 用途：翻到獲得那筆所在的月份時，就算實際使用紀錄是登記在別的月份，也能看出這批已經被動用了
function compEarnUsedByBreakdown(category, earnId, customLabel){
  const breakdown = _compFifoCore(category, null, customLabel).breakdown;
  const results = [];
  Object.keys(breakdown).forEach(useId=>{
    breakdown[useId].forEach(entry=>{
      if(entry.batchId===earnId){
        const useRec = state.compRecords.find(rr=>rr.id===useId);
        if(useRec) results.push({useDate: useRec.date, take: entry.take});
      }
    });
  });
  return results.sort((a,b)=>a.useDate.localeCompare(b.useDate));
}

// ---- 補休/換休一致性檢查 ----
// 目前結餘實際上有兩套算法：compBalanceAsOf（簡單加總，總獲得-總使用）跟 compFifoRemaining（依批次先進先出）。
// 正常情況下兩邊加總應該要相等；如果不相等，最可能的原因是「使用量超過獲得量」（超扣），
// FIFO那邊扣過頭會停在0不會變負數，但簡單加總會誠實顯示負數，兩邊才會兜不起來。
// 這裡只做「發現了就記一筆錯誤紀錄」，不會跳出來打擾使用者，也不會改動任何現有的計算或畫面。
function checkCompLedgerConsistency(){
  try{
    ['comp','exchange'].forEach(category=>{
      const core = _compFifoCore(category, null);
      const fifoTotal = core.batches.reduce((s,b)=> s + Math.max(0, b.remainDays), 0);
      const simpleTotal = compBalanceAsOf(category, '9999-12-31', null); // 涵蓋所有年度的全時段簡單加總
      // 差異裡如果有一部分是因為「保留」批次被系統正確跳過造成的（不是bug，是刻意的保護機制），要先扣掉這部分，
      // 剩下還兜不起來的才是真正的異常（例如使用量超過所有批次總和，含保留批次都不夠扣）
      const diff = Math.abs(fifoTotal - simpleTotal - core.unfulfilledByKept);
      if(diff > 0.01){
        const label = category==='comp' ? '補休' : '換休';
        console.warn(`[一致性檢查] ${label}結餘不一致：FIFO加總=${fifoTotal}，簡單加總=${simpleTotal}，保留批次差異=${core.unfulfilledByKept}`);
        logAppError(
          `${label}結餘計算不一致`,
          `FIFO加總＝${fmt(fifoTotal)} 天，簡單加總＝${fmt(simpleTotal)} 天，差異＝${fmt(diff)} 天（已排除保留批次造成的合理差異）。最可能是使用量超過獲得量（超扣）造成的，可以去「假別紀錄」檢查${label}紀錄有沒有登記錯誤。`
        );
      }
    });
    // 「其他假別」原本完全沒有涵蓋到這個一致性安全網，每個自訂名目各自獨立算FIFO，要一個個名目分開查
    Array.from(new Set(state.compRecords.filter(r=>(r.category||'comp')==='custom' && r.customLabel).map(r=>r.customLabel))).forEach(label=>{
      const core = _compFifoCore('custom', null, label);
      const fifoTotal = core.batches.reduce((s,b)=> s + Math.max(0, b.remainDays), 0);
      const simpleTotal = compBalanceAsOf('custom', '9999-12-31', null, label);
      const diff = Math.abs(fifoTotal - simpleTotal - core.unfulfilledByKept);
      if(diff > 0.01){
        console.warn(`[一致性檢查] 其他假別「${label}」結餘不一致：FIFO加總=${fifoTotal}，簡單加總=${simpleTotal}，保留批次差異=${core.unfulfilledByKept}`);
        logAppError(
          `其他假別「${label}」結餘計算不一致`,
          `FIFO加總＝${fmt(fifoTotal)} 天，簡單加總＝${fmt(simpleTotal)} 天，差異＝${fmt(diff)} 天（已排除保留批次造成的合理差異）。最可能是使用量超過獲得量（超扣）造成的，可以去「假別紀錄」檢查「${label}」紀錄有沒有登記錯誤。`
        );
      }
    });
  }catch(e){ console.error('一致性檢查本身發生錯誤', e); }
}

// 找出所有「已經過期、還沒用完、使用者還沒決定要怎麼處理」的補休/換休批次
// 「還沒決定」的判斷：earn紀錄上沒有 expiryDecision==='kept' 這個標記（代表使用者選過要保留），
// 而且目前透過FIFO算出來的剩餘量還大於0（代表還沒被別的使用紀錄扣完，包括這次自動加的「逾期自動取消」那筆）
function getExpiringUndecidedBatches(){
  const result = [];
  ['comp','exchange'].forEach(category=>{
    const batches = compFifoRemaining(category);
    batches.forEach(b=>{
      if(!b.expiry || b.remainDays<=0.0001) return;
      if(b.expiry >= TODAY) return; // 還沒到期，不用問
      const rec = state.compRecords.find(r=>r.id===b.id);
      if(rec && rec.expiryDecision==='kept') return; // 已經選過保留，不再問
      result.push(Object.assign({category}, b));
    });
  });
  // 「其他假別」也支援設定到期日，原本這裡完全沒有涵蓋到，導致自訂名目的紀錄過期後永遠不會被提醒去決定要「已使用」還是「保留」。
  // 因為每個自訂名目各自獨立算FIFO，要一個一個名目分開查
  Array.from(new Set(state.compRecords.filter(r=>(r.category||'comp')==='custom' && r.customLabel).map(r=>r.customLabel))).forEach(label=>{
    const batches = compFifoRemaining('custom', null, label);
    batches.forEach(b=>{
      if(!b.expiry || b.remainDays<=0.0001) return;
      if(b.expiry >= TODAY) return;
      const rec = state.compRecords.find(r=>r.id===b.id);
      if(rec && rec.expiryDecision==='kept') return;
      result.push(Object.assign({category:'custom', customLabel:label}, b));
    });
  });
  return result.sort((a,b)=> a.expiry.localeCompare(b.expiry));
}
// 使用者選「已使用」：自動幫這批補一筆「使用」紀錄，日期用到期日（不是今天，才能讓月份分組正確反映實際失效的月份），
// 備註固定寫「逾期自動取消」，並且明確指定扣這一批（sourceAllocations），避免FIFO又跑去扣到別批
async function markExpiredBatchUsed(category, batchId){
  // customLabel直接從這筆紀錄本身反查（用唯一的id），不需要靠呼叫端額外傳入使用者打的文字，
  // 這樣onclick那邊就不用把自訂名目（可能包含單引號等特殊字元）塞進JS字串參數裡，避免跳脫字元的風險
  const sourceRec = state.compRecords.find(r=>r.id===batchId);
  const customLabel = category==='custom' && sourceRec ? sourceRec.customLabel : undefined;
  const batches = compFifoRemaining(category, null, customLabel);
  const b = batches.find(x=>x.id===batchId);
  if(!b || b.remainDays<=0) return; // 這批已經沒有剩餘（可能是快速點兩下、或已經被別的操作扣完了），不要建出一筆0天或負數的無意義紀錄
  const record = {
    id: uid(), type:'use', category, date: b.expiry, unit:'day', amount: b.remainDays,
    note: '逾期自動取消', autoCancel: true,
    sourceAllocations: [{id: batchId, days: b.remainDays}],
  };
  if(category==='custom') record.customLabel = customLabel;
  state.compRecords.push(record);
  await saveState();
}
// 使用者選「保留」：在這批earn紀錄上記一個標記，之後不會再被問到，且系統自動扣抵時會跳過這一批
// （只有手動明確指定才會扣到它，見 _compFifoCore 裡的 expiryDecision==='kept' 判斷）
async function markExpiredBatchKept(category, batchId){
  const rec = state.compRecords.find(r=>r.id===batchId && (r.category||'comp')===category);
  if(!rec) return;
  rec.expiryDecision = 'kept';
  await saveState();
}
async function markAllExpiredBatchesUsed(){
  const list = getExpiringUndecidedBatches();
  for(const b of list){
    await markExpiredBatchUsed(b.category, b.id);
  }
  render();
}
async function decideExpiredBatch(category, id, decision){
  if(decision==='used') await markExpiredBatchUsed(category, id);
  else await markExpiredBatchKept(category, id);
  if(getExpiringUndecidedBatches().length===0) expiryDecisionModalOpen = false;
  render();
}
function closeExpiryDecisionModal(){
  expiryDecisionModalOpen = false; // 稍後決定：不標記任何狀態，下次開App還是會再問
  render();
}
function expiryDecisionModal(){
  const list = getExpiringUndecidedBatches();
  if(!list.length) return '';
  return `
    <div class="modal-overlay" onclick="closeExpiryDecisionModal()">
      <div class="modal-box" onclick="event.stopPropagation()">
        <h3>${ICON_HOURGLASS}補休／換休已過期（${list.length} 筆）<button type="button" class="info-icon-btn" onclick="toggleInfoHint('expiryDecision')" title="說明">ⓘ</button></h3>
        ${infoHintExpanded['expiryDecision'] ? `<p class="hint" style="margin:0 0 14px;">選「已使用」會自動補一筆使用紀錄（備註「逾期自動取消」），讓結餘數字對得起來；選「保留」則維持原狀、之後系統自動扣抵時會跳過這一批（只有手動明確指定才會扣到），且不會再問這一筆。</p>` : ''}
        ${list.length>1 ? `<button type="button" class="ghost" style="width:100%;margin-bottom:14px;" onclick="markAllExpiredBatchesUsed()">✓ 全部標記為已使用</button>` : ''}
        <div class="expiry-decision-list">
          ${list.map(b=>{
            const label = b.category==='custom' ? (b.customLabel||'其他假別') : COMP_CATEGORIES[b.category].label;
            const diffDays = Math.round((new Date(TODAY) - new Date(b.expiry))/86400000);
            return `<div class="expiry-decision-item">
              <div class="expiry-decision-title">${toROC(b.date)} 獲得的 ${escapeHtml(label)}${b.note?`（${escapeHtml(b.note)}）`:''}</div>
              <div class="expiry-decision-sub">剩 ${fmt(b.remainDays)} 天，${toROC(b.expiry)} 到期（已過期 ${diffDays} 天）</div>
              <div class="expiry-decision-actions">
                <button type="button" class="btn-jade" onclick="decideExpiredBatch('${b.category}','${b.id}','used')">已使用</button>
                <button type="button" class="ghost" onclick="decideExpiredBatch('${b.category}','${b.id}','kept')">保留</button>
              </div>
            </div>`;
          }).join('')}
        </div>
        <button type="button" class="ghost" style="width:100%;margin-top:14px;" onclick="closeExpiryDecisionModal()">稍後決定</button>
      </div>
    </div>`;
}
function computeUsePreviewHtml(category, amount, unit, pins, excludeId, useDate){
  if(!amount || amount<=0) return '';
  useDate = useDate || TODAY;
  const isExpiredFor = b => !!(b.expiry && b.expiry < useDate); // 使用當天已經過期：只能手動指定，不自動扣
  // 向下相容：舊呼叫方式傳入單一字串id（代表「優先扣這批，不夠自動接續」），統一轉成陣列格式處理
  if(typeof pins === 'string'){ pins = pins ? [{id:pins, days:null}] : []; }
  if(!Array.isArray(pins)) pins = [];
  pins = pins.filter(p=>p && p.id);
  const days = unit==='hour' ? amount/getHoursPerDay() : amount;
  const info = COMP_CATEGORIES[category];
  const batches = compFifoRemaining(category, excludeId).filter(b=>b.remainDays>0.0001);
  let toDeduct = days;
  const consumed = [];
  const pinnedIds = new Set(pins.map(p=>p.id));
  const skippedPins = []; // 記錄「有勾選、有填天數，但因為前面已經滿足需求而完全沒用到」的批次，之後要明確警告使用者
  pins.forEach(pin=>{
    const pinned = batches.find(b=>b.id===pin.id);
    if(toDeduct<=0.0001){
      if(pinned && pin.days!=null && pin.days>0) skippedPins.push(pinned);
      return;
    }
    if(!pinned || pinned.remainDays<=0.0001) return;
    // 有明確指定天數的話用指定的（但不能超過該批剩餘量、也不能超過還需要的量）；沒指定天數則沿用舊邏輯：這批盡量扣、扣到滿足需求為止
    const want = (pin.days!=null && pin.days>0) ? Math.min(pin.days, pinned.remainDays, toDeduct) : Math.min(pinned.remainDays, toDeduct);
    if(want>0.0001){
      consumed.push({date:pinned.date, note:pinned.note, take:want, remainAfter: pinned.remainDays-want, pinned:true, _id:pinned.id});
      pinned.remainDays -= want;
      toDeduct -= want;
    }
  });
  for(const b of batches){
    if(toDeduct<=0.0001) break;
    if(pinnedIds.has(b.id)) continue;
    if(b.expiryDecision==='kept') continue;
    if(isExpiredFor(b)) continue;
    const take = Math.min(b.remainDays, toDeduct);
    if(take>0.0001){
      consumed.push({date:b.date, note:b.note, take, remainAfter: b.remainDays-take, pinned:false});
      b.remainDays -= take;
      toDeduct -= take;
    }
  }
  // 第二階段：沒被指定的批次都不夠補的話，回頭動用「已指定但還有剩」的批次繼續補，
  // 邏輯要跟compFifoRemaining一致，不然預覽畫面看到的結果會跟實際存檔後不一樣
  // 「保留」的批次同樣跳過（跟_compFifoCore的邏輯保持一致）
  if(toDeduct>0.0001){
    for(const b of batches){
      if(toDeduct<=0.0001) break;
      if(b.expiryDecision==='kept') continue;
      if(isExpiredFor(b)) continue;
      if(b.remainDays<=0.0001) continue;
      const take = Math.min(b.remainDays, toDeduct);
      if(take>0.0001){
        const existing = consumed.find(c=>c._id===b.id);
        b.remainDays -= take;
        toDeduct -= take;
        if(existing){ existing.take += take; existing.remainAfter = b.remainDays; }
        else { consumed.push({date:b.date, note:b.note, take, remainAfter: b.remainDays, pinned:true, _id:b.id}); }
      }
    }
  }
  // 還有剩、但因為已過期而沒被自動扣到的量（提醒使用者：需要的話可以手動勾選）
  const expiredLeft = batches.filter(b=>isExpiredFor(b) && b.expiryDecision!=='kept' && b.remainDays>0.0001).reduce((s,b)=>s+b.remainDays,0);
  const expiredHint = (toDeduct>0.0001 && expiredLeft>0.0001) ? `<p class="hint" style="color:var(--ink-soft);margin:6px 0 0;">已過期的 ${fmt(expiredLeft)} 天不會自動扣抵；如果確定要用，請勾選「手動指定」選它。</p>` : '';
  let html = '<div class="use-preview-box">';
  if(consumed.length===0){
    html += `<p class="hint" style="color:var(--brick);margin:0;">${ICON_WARNING} 目前沒有可自動扣的${info.label}結餘，這筆送出後結餘會變負數。</p>`;
  } else {
    html += `<p class="hint" style="margin:0 0 6px;font-weight:700;color:var(--ink);">這筆會${pins.length?'先扣你指定的那幾筆，不夠再':'自動'}扣最早獲得的那幾筆：</p>`;
    html += consumed.map(c=>`<div class="use-preview-line">${c.pinned?ICON_STAR:''}${toROC(c.date)}${c.note?`（${escapeHtml(c.note)}）`:''}　－${fmt(c.take)} 天，扣完後這筆還剩 ${fmt(c.remainAfter)} 天</div>`).join('');
    if(toDeduct>0.0001){
      html += `<p class="hint" style="color:var(--brick);margin:6px 0 0;">${ICON_WARNING} 現有結餘不夠扣，還缺 ${fmt(toDeduct)} 天，這筆送出後結餘會變負數。</p>`;
    }
  }
  html += expiredHint;
  html += '</div>';
  let skipHtml = '';
  if(skippedPins.length){
    // 這裡故意不做escapeHtml：這段文字之後在畫面上一律用textContent顯示（瀏覽器會自動安全處理），
    // 若在這裡先跳脫，交給textContent顯示時反而會把跳脫符號字面顯示出來
    const skippedList = skippedPins.map(b=>`${toROC(b.date)}${b.note?`（${b.note}）`:''}`).join('、');
    skipHtml = `⚠️ 已選超過需求，未用到：${skippedList}`;
  }
  // 「使用」通常是一換一，備註常常就跟被扣那筆的備註一樣，這裡把被扣批次的備註整理起來，方便畫面自動帶入
  // 用Set去重複：同一個備註如果因為額度不夠被拆成兩筆扣，不要在建議備註裡重複出現兩次
  // 前面加「使用 」讓備註看起來更明確是「這筆是為了用掉哪個假別」，沒有任何備註可帶時就留空，不要顯示單獨一個「使用」沒有意義
  const notesJoined = Array.from(new Set(consumed.map(c=>c.note).filter(Boolean))).join('｜');
  const suggestedNote = notesJoined ? `使用 ${notesJoined}` : '';
  // 手動模式下，即時建議只看使用者「真的有勾選」的那幾筆，不要把自動接續補缺口的批次也算進去，
  // 避免使用者明明只選了一筆、備註卻莫名其妙多出一個沒選過的批次備註，搞不清楚是怎麼跑出來的
  // 用pinnedIds（使用者實際勾選的id）判斷，不是用consumed裡的pinned欄位——
  // 因為第二階段「已指定但還有剩」的批次接續補缺口時，也會被標成pinned:true，但那不是使用者自己選的
  const manualNotesJoined = Array.from(new Set(consumed.filter(c=>c._id && pinnedIds.has(c._id)).map(c=>c.note).filter(Boolean))).join('｜');
  const manualNote = manualNotesJoined ? `使用 ${manualNotesJoined}` : '';
  const fallbackNotesJoined = Array.from(new Set(consumed.filter(c=>!(c._id && pinnedIds.has(c._id))).map(c=>c.note).filter(Boolean))).join('｜');
  return { previewHtml: html, skipHtml, suggestedNote, manualNote, fallbackNote: fallbackNotesJoined, shortfall: Math.max(0,toDeduct), expiredLeft };
}

function gatherCompSrcPins(listElId, hoursPerDay){
  const pins = [];
  const listEl = document.getElementById(listElId);
  if(!listEl) return pins;
  const hpd = hoursPerDay || getHoursPerDay();
  listEl.querySelectorAll('.src-batch-row').forEach(row=>{
    const cb = row.querySelector('input[type="checkbox"]');
    if(cb && cb.checked){
      const hoursInput = row.querySelector('.src-batch-days');
      const raw = hoursInput && hoursInput.value !== '' ? parseFloat(hoursInput.value) : null;
      // 批次清單一律用「小時」輸入，這裡統一換算回天數存起來，內部一律用天數運算
      const days = (raw!=null && raw>0) ? raw/hpd : null;
      pins.push({ id: row.dataset.batchId, days });
    }
  });
  return pins;
}
function onCompSrcRowToggle(checkboxEl, category){
  const row = checkboxEl.closest('.src-batch-row');
  if(!row) return;
  const wrap = row.querySelector('.src-batch-input-wrap');
  const hoursInput = row.querySelector('.src-batch-days');
  const listEl = row.closest('.src-batch-list');
  let isEdit = false, editId = null;
  if(listEl && listEl.id.indexOf('editCompSrcBatchList-')===0){
    isEdit = true;
    editId = listEl.id.slice('editCompSrcBatchList-'.length);
  }
  if(checkboxEl.checked){
    if(wrap) wrap.style.display = '';
    if(hoursInput && !hoursInput.value){
      const remainDays = parseFloat(row.dataset.batchRemain)||0; // 這個一律是天數，換算成小時填入預設值
      if(remainDays>0) hoursInput.value = fmt(remainDays*getHoursPerDay());
    }
  } else {
    if(wrap) wrap.style.display = 'none';
    if(hoursInput) hoursInput.value = '';
  }
  if(isEdit){ updateEditUsePreview(editId, category); } else { updateUsePreview(category); }
}
function resetCompSrcBatchList(listElId){
  const listEl = document.getElementById(listElId);
  if(!listEl) return;
  listEl.querySelectorAll('input[type="checkbox"]').forEach(c=>{ c.checked = false; });
  listEl.querySelectorAll('.src-batch-input-wrap').forEach(w=>{ w.style.display='none'; });
  listEl.querySelectorAll('.src-batch-days').forEach(d=>{ d.value=''; });
}

function toggleManualSource(category){
  const cb = document.getElementById('compManualToggle');
  const field = document.getElementById('manualSourceField');
  if(field) field.style.display = (cb && cb.checked) ? '' : 'none';
  if(cb && !cb.checked) resetCompSrcBatchList('compSrcBatchList');
  updateUsePreview(category);
}

function updateSelectSummaryBar(barId, manualOn, pins, amount, unit){
  const bar = document.getElementById(barId);
  if(!bar) return;
  if(!manualOn || !amount || amount<=0){ bar.style.display = 'none'; return; }
  const hpd = getHoursPerDay();
  const neededHours = unit==='hour' ? amount : amount*hpd;
  const selectedHours = pins.reduce((s,p)=> s + (p.days!=null ? p.days*hpd : 0), 0);
  const isOver = selectedHours > neededHours + 0.001; // 選超過需求：跟「剛好選對」是不同狀態，不能都當成「OK」
  const isExact = !isOver && selectedHours >= neededHours - 0.001;
  bar.style.display = 'flex';
  bar.classList.toggle('ssb-ok', isExact);
  bar.classList.toggle('ssb-over', isOver);
  // 選超過需求時明講「多選了X小時」，不要只是輕描淡寫顯示兩個數字讓使用者自己心算差多少
  const needLabel = isOver ? `多選了 ${fmt(selectedHours-neededHours)} 小時，記得取消勾選` : `需要 ${fmt(neededHours)} 小時`;
  bar.innerHTML = `<span>已選 ${fmt(selectedHours)} 小時</span><span class="ssb-need">${needLabel}</span>`;
}
// 底部浮動的「已選超過需求」警告跟「已選/需要」小結列都是position:fixed，浮在畫面最上層，
// 原本表單沒有預留空間給它們，導致捲到底時，照片上傳欄位、「登記」按鈕會被這兩條蓋住、點不到、看不到。
// 用實際量到的高度（offsetHeight）動態調整表單最下面的間距，這兩條不管顯示幾行文字、有沒有同時出現，都能剛好留出足夠空間
// 底部浮動的「已選超過需求」警告跟「已選/需要」小結列，包在同一個彈性容器裡（.comp-bottom-alerts），
// 容器本身沒有固定高度、文字有幾行、有沒有兩條都顯示，都會自然反映在容器的實際高度上，
// 這裡直接量容器本身的高度（offsetHeight）拿來當表單最下面的預留間距，不用個別加總兩條的高度再手動抓間距
function updateCompBottomSpacer(spacerId, wrapperId){
  const spacer = document.getElementById(spacerId);
  if(!spacer || !spacer.style) return;
  const wrapper = document.getElementById(wrapperId);
  const h = (wrapper && wrapper.offsetHeight) ? wrapper.offsetHeight + 10 : 0;
  spacer.style.height = h + 'px';
}
function updateUsePreview(category){
  const previewEl = document.getElementById('usePreview');
  const wrapEl = document.getElementById('manualSourceWrap');
  const expiryWrapEl = document.getElementById('compExpiryWrap');
  const skipEl = document.getElementById('compSkipWarning');
  if(!previewEl) return;
  const typeEl = document.getElementById('compType');
  const isUse = typeEl && typeEl.value === 'use';
  if(wrapEl) wrapEl.style.display = isUse ? '' : 'none';
  if(expiryWrapEl) expiryWrapEl.style.display = isUse ? 'none' : '';
  if(!isUse){ previewEl.innerHTML = ''; if(skipEl) skipEl.style.display='none'; updateSelectSummaryBar('compSelectSummary', false, [], 0, 'day'); updateCompBottomSpacer('compBottomSpacer', 'compBottomAlerts'); return; }
  const amountEl = document.getElementById('compAmount');
  const unitEl = document.getElementById('compUnit');
  const amount = parseFloat(amountEl && amountEl.value);
  const unit = unitEl ? unitEl.value : 'day';
  const manualOn = document.getElementById('compManualToggle');
  const isManualOn = !!(manualOn && manualOn.checked);
  const pins = isManualOn ? gatherCompSrcPins('compSrcBatchList') : [];
  const dateEl = document.getElementById('compDate');
  const useDate = (dateEl && parseFlexibleDate(dateEl.value)) || TODAY;
  const result = computeUsePreviewHtml(category, amount, unit, pins, null, useDate);
  previewEl.innerHTML = result.previewHtml;
  if(!compNoteTouched){
    const noteEl = document.getElementById('compNote');
    if(noteEl) noteEl.value = isManualOn ? (result.manualNote || '') : (result.suggestedNote || '');
  }
  if(skipEl){
    if(result.skipHtml){ skipEl.style.display = ''; skipEl.textContent = result.skipHtml; }
    else { skipEl.style.display = 'none'; }
  }
  updateSelectSummaryBar('compSelectSummary', isManualOn, pins, amount, unit);
  updateCompBottomSpacer('compBottomSpacer', 'compBottomAlerts');
}

function toggleEditManualSource(id, category){
  const cb = document.getElementById(`editManualToggle-${id}`);
  const field = document.getElementById(`editManualSourceField-${id}`);
  if(field) field.style.display = (cb && cb.checked) ? '' : 'none';
  if(cb && !cb.checked) resetCompSrcBatchList(`editCompSrcBatchList-${id}`);
  updateEditUsePreview(id, category);
}

function updateEditUsePreview(id, category){
  const previewEl = document.getElementById(`editUsePreview-${id}`);
  const wrapEl = document.getElementById(`editManualSourceWrap-${id}`);
  const expiryWrapEl = document.getElementById(`editCompExpiryWrap-${id}`);
  const skipEl = document.getElementById(`editCompSkipWarning-${id}`);
  if(!previewEl) return;
  const typeEl = document.getElementById(`editCompType-${id}`);
  const isUse = typeEl && typeEl.value === 'use';
  if(wrapEl) wrapEl.style.display = isUse ? '' : 'none';
  if(expiryWrapEl) expiryWrapEl.style.display = isUse ? 'none' : '';
  if(!isUse){ previewEl.innerHTML = ''; if(skipEl) skipEl.style.display='none'; updateSelectSummaryBar(`editCompSelectSummary-${id}`, false, [], 0, 'day'); updateCompBottomSpacer(`editCompBottomSpacer-${id}`, `editCompBottomAlerts-${id}`); return; }
  const amountEl = document.getElementById(`editCompAmount-${id}`);
  const unitEl = document.getElementById(`editCompUnit-${id}`);
  const amount = parseFloat(amountEl && amountEl.value);
  const unit = unitEl ? unitEl.value : 'day';
  const manualOn = document.getElementById(`editManualToggle-${id}`);
  const isManualOn = !!(manualOn && manualOn.checked);
  const pins = isManualOn ? gatherCompSrcPins(`editCompSrcBatchList-${id}`) : [];
  const editDateEl = document.getElementById(`editCompDate-${id}`);
  const useDate = (editDateEl && parseFlexibleDate(editDateEl.value)) || TODAY;
  const result = computeUsePreviewHtml(category, amount, unit, pins, id, useDate);
  previewEl.innerHTML = result.previewHtml;
  if(skipEl){
    if(result.skipHtml){ skipEl.style.display = ''; skipEl.textContent = result.skipHtml; }
    else { skipEl.style.display = 'none'; }
  }
  updateSelectSummaryBar(`editCompSelectSummary-${id}`, isManualOn, pins, amount, unit);
  updateCompBottomSpacer(`editCompBottomSpacer-${id}`, `editCompBottomAlerts-${id}`);
}



function pageYearRecord(){
  const year = selectedYear;
  const rows = [];
  LEAVE_TYPES.forEach(t=>{
    (state.records[t.key]||[]).forEach(r=>{
      if(!r.date.startsWith(String(year))) return;
      rows.push({ date:r.date, key:t.key, label:t.label, c:t.c, id:r.id, hours: toDays(r)*getHoursPerDay(), amountText:displayAmount(r), note:r.note, breakdown:null });
    });
  });
  state.compRecords.filter(r=>r.type==='use').forEach(r=>{
    if(!r.date.startsWith(String(year))) return;
    const category = r.category||'comp';
    const info = compCategoryInfo(r);
    const usage = compUsageBreakdown(category, r.id, category==='custom' ? r.customLabel : undefined);
    const breakdown = usage.length ? usage.map(u=>`${toROC(u.date)}${u.note?`（${escapeHtml(u.note)}）`:''}獲得的${escapeHtml(info.label)}`).join('、') : null;
    rows.push({ date:r.date, key:category, label:info.label, c:info.c, id:r.id, hours: toDays(r)*getHoursPerDay(), amountText:displayAmount(r), note:r.note, breakdown });
  });
  rows.sort((a,b)=> yearRecordSortAsc ? a.date.localeCompare(b.date) : b.date.localeCompare(a.date));

  const totalHours = rows.reduce((s,r)=>s+r.hours, 0);

  const liBuilder = (r)=> `
    <li class="ledger">
      <div class="ledger-top">
        <span class="d">${toROC(r.date)}</span>
        <span class="home-detail-tag c-${r.c}">${escapeHtml(r.label)}</span>
        <span class="amt">${r.amountText}</span>
      </div>
      ${r.note ? `<div class="home-detail-note-tag" style="display:inline-block;margin-top:4px;">${escapeHtml(r.note)}</div>` : ''}
      ${r.breakdown ? `<div class="hint" style="margin-top:4px;font-size:12.5px;">${ICON_FOLDER}扣自：${r.breakdown}</div>` : ''}
    </li>`;

  const groups = {};
  const order = [];
  rows.forEach(r=>{
    const ym = r.date.slice(0,7);
    if(!groups[ym]){ groups[ym]=[]; order.push(ym); }
    groups[ym].push(r);
  });
  const listHtml = rows.length ? order.map(ym=>`
    <div class="year-record-month">
      <div class="year-record-month-title">${monthLabel(ym)}</div>
      <ul class="ledger">${groups[ym].map(liBuilder).join('')}</ul>
    </div>`).join('') : `<div class="empty">${year} 年目前還沒有請假紀錄。</div>`;

  return `
    <section class="block">
      <div class="row" style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;">
        <button type="button" class="ghost" onclick="switchPage('home')">‹ 返回</button>
        ${rows.length ? `<button type="button" class="sortbtn" onclick="toggleYearRecordSort()">日期 ${yearRecordSortAsc? '▲ 舊到新':'▼ 新到舊'}</button>` : ''}
      </div>
      <div class="year-switch" style="justify-content:center;margin-bottom:6px;">
        <button type="button" class="sortbtn" onclick="changeYear(-1)">‹</button>
        <div class="year-label">${year}年</div>
        <button type="button" class="sortbtn" onclick="changeYear(1)">›</button>
      </div>
      ${year!==CUR_YEAR ? `<div style="text-align:center;margin-bottom:6px;"><button type="button" class="back-to-today-btn" onclick="setYear(${CUR_YEAR})">回今年</button></div>` : ''}
      <p class="hint" style="text-align:center;margin:0 0 16px;">${year} 年全年共使用 ${fmt(totalHours)} 小時（含特休、病假、事假等所有假別，以及補休、換休的使用紀錄）</p>
      ${listHtml}
    </section>`;
}

const COMP_CATEGORIES = {

// 首頁卡片一律顯示「今年」（CUR_YEAR），跟上面的剩餘合計一致；
// 不跟著假別紀錄頁切換的年份（selectedYear）走，不然切去看別年再回首頁，上下數字會對不起來
function stampCard(t){
  const remain = remainOf(t.key, CUR_YEAR);
  const quota = getQuota(t.key, CUR_YEAR);
  const used = quota - remain;
  // 三段式顏色分級：安全(不特別標色) / 用到70%~90%轉黃 / 用到90%以上或已超額轉紅
  let level = '';
  if(remain < 0){ level = 'level-danger'; }
  else if(quota > 0){
    const usedRatio = used / quota;
    if(usedRatio >= 0.9) level = 'level-danger';
    else if(usedRatio >= 0.7) level = 'level-warn';
  }
  // 特休專屬：如果還沒用到「最低使用天數」設定，且已經進入10月（跟首頁橫幅提醒用完全一樣的判斷邏輯，確保兩邊不會不一致），用邊框顏色提醒
  let minDaysBorder = '';
  if(t.key==='annual'){
    const minDays = getAnnualMinDays();
    const annualUsedNow = usedOf('annual', CUR_YEAR);
    const shortfall = minDays - annualUsedNow;
    const month = NOW.getMonth()+1;
    if(month>=10 && shortfall>0){
      const daysLeftInYear = Math.round((new Date(CUR_YEAR,11,31) - new Date(TODAY+'T00:00:00')) / 86400000);
      minDaysBorder = daysLeftInYear<=30 ? 'border:2px solid var(--brick);' : 'border:2px solid var(--amber);';
    }
  }
  const chips = [];
  if(t.key==='sick'){
    const excess = menstrualExcess(CUR_YEAR);
    if(excess>0) chips.push(`<span class="mini-chip" style="background:var(--rose-soft);color:var(--rose);">生理假併入 ${fmt(excess)}天</span>`);
    if(remain<0) chips.push(`<span class="mini-chip" style="background:var(--brick-soft);color:var(--brick);">超額 ${fmt(-remain)}天，需擇一抵銷</span>`);
  }
  if(t.key==='personal'){
    const fc = usedOf('familyCare', CUR_YEAR);
    if(fc>0) chips.push(`<span class="mini-chip" style="background:var(--plum-soft);color:var(--plum);">家照併入 ${fmt(fc)}天</span>`);
    const paid = personalPaidUsed(CUR_YEAR), unpaid = personalUnpaidUsed(CUR_YEAR);
    if(paid>0) chips.push(`<span class="mini-chip" style="background:var(--jade-soft);color:var(--jade);">${ICON_MONEY}有薪 ${fmt(paid)}天</span>`);
    if(unpaid>0) chips.push(`<span class="mini-chip" style="background:var(--brick-soft);color:var(--brick);">無薪 ${fmt(unpaid)}天</span>`);
  }
  if(t.key==='annual' && minDaysBorder) chips.push(`<span class="mini-chip" style="background:${minDaysBorder.includes('brick')?'var(--brick-soft);color:var(--brick);':'var(--amber-soft, #FBEFDC);color:var(--amber);'}">還沒用滿最低 ${fmt(getAnnualMinDays())} 天</span>`);
  return `
    <div class="stamp-card tint-${t.c} ${level}" style="${minDaysBorder}box-shadow:0 10px 24px -10px color-mix(in srgb, var(--${t.c}) 45%, transparent);" onclick="viewLeaveDetailFromHome('${t.key}')">
      <div class="seal c-${t.c}">${t.seal}</div>
      <div class="label">${t.label}剩餘</div>
      <div class="num c-${t.c}">${fmt(remain)}天 <span class="hour-inline">${fmt(remain*getHoursPerDay())}小時</span><small>共 ${fmt(getQuota(t.key,CUR_YEAR))} 天</small></div>
      ${chips.length? `<div class="mini-chips">${chips.join('')}</div>` : ''}
    </div>`;
}

function compStampCard(category){
  category = category || 'comp';
  const info = COMP_CATEGORIES[category];
  const compBal = compBalanceUpTo(CUR_YEAR, category);
  const reminders = compExpiryReminders().filter(r=>r.category===category);
  let urgentBorder = '';
  if(reminders.length){
    // 改用月份差計算（不是天數），跟特休最低使用天數那邊的判斷方式一致：1個月內算紅色、3個月內算琥珀色
    const expiryDate = new Date(reminders[0].expiry+'T00:00:00');
    const todayDate = new Date(TODAY+'T00:00:00');
    const monthsUntil = (expiryDate.getFullYear()-todayDate.getFullYear())*12 + (expiryDate.getMonth()-todayDate.getMonth());
    if(monthsUntil<=1) urgentBorder = 'border:2px solid var(--brick);';
    else if(monthsUntil<=3) urgentBorder = 'border:2px solid var(--amber);';
  }
  return `
    <div class="stamp-card tint-${info.c} ${compBal<0?'warn':''}" style="${urgentBorder}box-shadow:0 10px 24px -10px color-mix(in srgb, var(--${info.c}) 45%, transparent);" onclick="viewLeaveDetailFromHome('${category}')">
      <div class="seal c-${info.c}">${info.label.slice(0,1)}</div>
      <div class="label">${info.label}結餘</div>
      <div class="num c-${info.c}">${fmt(compBal)}天 <span class="hour-inline">${fmt(compBal*getHoursPerDay())}小時</span><small>至 ${CUR_YEAR} 年底・${category==='exchange' ? '當年度用完' : `期限${info.defaultYears}年`}</small></div>
    </div>`;
}

const KEYWORD_LEAVE_MAP = [
  {re:'特休|年假', key:'annual', label:'特休'},
  {re:'生理假|生理', key:'menstrual', label:'生理假'},
  {re:'病假|病', key:'sick', label:'病假'},
  {re:'事假|事', key:'personal', label:'事假'},
  {re:'家庭照顧假|家照', key:'familyCare', label:'家庭照顧假'},
  {re:'身心照顧假|身照|身心|不爽假', key:'mentalCare', label:'身心照顧假'}
];
const KW_AMOUNT_TOKEN = '(半天|全天|整天|[\\d.]+|[一二三四五六七八九十兩])';
const KW_UNIT_TOKEN = '(H|h|小時|天)?';
const KW_NOTE_TOKEN = '[\\(（]?([^\\)）]*)[\\)）]?';
const CN_NUM_MAP = {'半':0.5,'一':1,'二':2,'兩':2,'三':3,'四':4,'五':5,'六':6,'七':7,'八':8,'九':9,'十':10};
const KW_NUM_OR_CN = '([\\d.]+|[一二三四五六七八九十兩半])';
// 明確的日期格式（不用 \S+ 抓一整段，這樣日期後面不管有沒有空格都能正確切開）
const DATE_TOKEN_RE = '(?:今天|今日|明天|明日|昨天|昨日|\\d{1,4}[\\/\\-]\\d{1,2}[\\/\\-]\\d{1,2}|\\d{1,2}[\\/\\-]\\d{1,2}|\\d{1,2}月\\d{1,2}日?)';
// 給日期區間用，只認斜線格式的日期，避免跟區間用的「-」混在一起分不清
const DATE_SLASH_RE = '(?:\\d{1,4}\\/\\d{1,2}\\/\\d{1,2}|\\d{1,2}\\/\\d{1,2})';
function numOrCn(tok){
  if(tok===undefined || tok===null) return NaN;
  if(CN_NUM_MAP[tok] !== undefined) return CN_NUM_MAP[tok];
  return parseFloat(tok);
}

function shiftDate(dateStr, deltaDays){
  const d = new Date(dateStr+'T00:00:00');
  d.setDate(d.getDate()+deltaDays);
  return isoDate(d.getFullYear(), d.getMonth()+1, d.getDate());
}

// 不存在的日期（13/5、2/30、平年2/29）一律當作看不懂，交給「無法辨識」清單，絕對不能存進去——
// 壞日期一旦上雲端，其他裝置的資料驗證會一直擋下來，同步就卡住了
function validIsoOrNull(y, m, d){ return isValidCalendarDate(y, m, d) ? isoDate(y, m, d) : null; }
function parseDateToken(tok, contextYear){
  if(!tok) return null;
  tok = tok.trim();
  if(tok==='今天'||tok==='今日') return TODAY;
  if(tok==='明天'||tok==='明日') return shiftDate(TODAY,1);
  if(tok==='昨天'||tok==='昨日') return shiftDate(TODAY,-1);
  let m = tok.match(/^(\d{1,4})[\/\-](\d{1,2})[\/\-](\d{1,2})$/);
  if(m){
    let y = parseInt(m[1],10);
    if(y<200) y += 1911; // 民國年自動換算
    return validIsoOrNull(y, parseInt(m[2],10), parseInt(m[3],10));
  }
  m = tok.match(/^(\d{1,2})[\/\-](\d{1,2})$/);
  if(m){ return validIsoOrNull(contextYear, parseInt(m[1],10), parseInt(m[2],10)); }
  m = tok.match(/^(\d{1,2})月(\d{1,2})日?$/);
  if(m){ return validIsoOrNull(contextYear, parseInt(m[1],10), parseInt(m[2],10)); }
  return null;
}

function parseAmountToken(numTok, unitTok){
  if(numTok===undefined || numTok===null || numTok==='') return {amount:1, unit:'day'};
  if(numTok==='半天') return {amount:0.5, unit:'day'};
  if(numTok==='全天' || numTok==='整天') return {amount:1, unit:'day'};
  let amount = parseFloat(numTok);
  if(isNaN(amount) && CN_NUM_MAP[numTok] !== undefined) amount = CN_NUM_MAP[numTok];
  if(!isFinite(amount) || amount<=0) return null; // 原本只擋NaN，沒擋0或負數，打「特休0天」這種會建出無意義的0天紀錄
  const unit = (unitTok==='H'||unitTok==='h'||unitTok==='小時') ? 'hour' : 'day';
  return {amount, unit};
}

function kwBuildFromRest(rest, defaultCompType, leaveKeywordPattern){
  let mm;
  // 加X補Y (備註) -> 補休獲得（固定2年）
  mm = rest.match(new RegExp(`^加\\s*${KW_NUM_OR_CN}\\s*補\\s*${KW_NUM_OR_CN}\\s*${KW_NOTE_TOKEN}$`));
  if(mm){
    const amount = numOrCn(mm[2]);
    if(!isFinite(amount) || amount<=0) return null;
    return { kind:'comp', category:'comp', compType:'earn', unit:'day', amount, note:(mm[3]||'').trim() };
  }
  // 加X換Y (備註) -> 換休獲得（固定1年）
  mm = rest.match(new RegExp(`^加\\s*${KW_NUM_OR_CN}\\s*換\\s*${KW_NUM_OR_CN}\\s*${KW_NOTE_TOKEN}$`));
  if(mm){
    const amount = numOrCn(mm[2]);
    if(!isFinite(amount) || amount<=0) return null;
    return { kind:'comp', category:'exchange', compType:'earn', unit:'day', amount, note:(mm[3]||'').trim() };
  }
  // (使用|用|獲得|得)? 補休/補 X(H/天/半天/全天) (備註) -> 補休（固定2年）
  mm = rest.match(new RegExp(`^(使用|用|獲得|得)?\\s*(?:補休|補)\\s*(?:${KW_AMOUNT_TOKEN}\\s*${KW_UNIT_TOKEN})?\\s*${KW_NOTE_TOKEN}$`));
  if(mm){
    const parsed = parseAmountToken(mm[2], mm[3]);
    if(!parsed) return null;
    let compType = defaultCompType;
    if(mm[1]==='使用' || mm[1]==='用') compType='use';
    else if(mm[1]==='獲得' || mm[1]==='得') compType='earn';
    return { kind:'comp', category:'comp', compType, unit:parsed.unit, amount:parsed.amount, note:(mm[4]||'').trim() };
  }
  // (使用|用|獲得|得)? 換休/換 X(H/天/半天/全天) (備註) -> 換休（固定1年）
  mm = rest.match(new RegExp(`^(使用|用|獲得|得)?\\s*(?:換休|換)\\s*(?:${KW_AMOUNT_TOKEN}\\s*${KW_UNIT_TOKEN})?\\s*${KW_NOTE_TOKEN}$`));
  if(mm){
    const parsed = parseAmountToken(mm[2], mm[3]);
    if(!parsed) return null;
    let compType = defaultCompType;
    if(mm[1]==='使用' || mm[1]==='用') compType='use';
    else if(mm[1]==='獲得' || mm[1]==='得') compType='earn';
    return { kind:'comp', category:'exchange', compType, unit:parsed.unit, amount:parsed.amount, note:(mm[4]||'').trim() };
  }
  // (請|使用|用)? <假別關鍵字> X(H/天/半天/全天) (備註)
  mm = rest.match(new RegExp(`^(請|使用|用)?\\s*(${leaveKeywordPattern})\\s*(?:${KW_AMOUNT_TOKEN}\\s*${KW_UNIT_TOKEN})?\\s*${KW_NOTE_TOKEN}$`));
  if(mm){
    const mapEntry = KEYWORD_LEAVE_MAP.find(k=> new RegExp('^(?:'+k.re+')$').test(mm[2]));
    const parsed = parseAmountToken(mm[3], mm[4]);
    if(!parsed || !mapEntry) return null;
    return { kind:'leave', leaveKey: mapEntry.key, leaveLabel: mapEntry.label, unit:parsed.unit, amount:parsed.amount, note:(mm[5]||'').trim() };
  }
  return null;
}

function parseKeywordLines(text, defaultCompType){
  const items = [];
  const unmatched = [];
  const rawLines = text.split('\n').map(l=>l.replace(/[\s\u3000]+/g,' ').trim());
  const leaveKeywordPattern = KEYWORD_LEAVE_MAP.map(k=>k.re).join('|');

  rawLines.forEach(line=>{
    if(!line) return;
    if(/^(#|\/\/|、)/.test(line)) return; // 忽略註解／項目符號行

    let m;

    // A) 日期區間：M/D~M/D 或 M/D-M/D <內容> -> 展開成每天一筆（有沒有空格都可以）
    m = line.match(new RegExp(`^(${DATE_TOKEN_RE})\\s*[~～]\\s*(${DATE_TOKEN_RE})\\s*(.+)$`))
      || line.match(new RegExp(`^(${DATE_SLASH_RE})-(${DATE_SLASH_RE})\\s*(.+)$`));
    if(m){
      // 沒寫年份的日期一律當作今年（不跟著「假別紀錄」頁最後看的年份走，避免登記到別的年份還不自知）
      const d1 = parseDateToken(m[1], CUR_YEAR);
      let d2 = parseDateToken(m[2], CUR_YEAR);
      if(d1 && d2){
        // 若結束日期比開始日期早，視為跨年（例如 12/30-1/2），結束日期年份自動+1
        if(new Date(d2+'T00:00:00').getTime() < new Date(d1+'T00:00:00').getTime()){
          const d2Parts = d2.split('-');
          d2 = validIsoOrNull(parseInt(d2Parts[0],10)+1, parseInt(d2Parts[1],10), parseInt(d2Parts[2],10));
        }
        const built = d2 ? kwBuildFromRest(m[3].trim(), defaultCompType, leaveKeywordPattern) : null;
        if(built){
          let cur = d1, guard = 0;
          const endTime = new Date(d2+'T00:00:00').getTime();
          while(new Date(cur+'T00:00:00').getTime() <= endTime && guard < 62){
            items.push(Object.assign({}, built, { date: cur, raw: line }));
            cur = shiftDate(cur, 1);
            guard++;
          }
          return;
        }
      }
    }

    // B) 單一日期開頭：<日期><其餘內容>，日期後面有沒有空格都可以
    m = line.match(new RegExp(`^(${DATE_TOKEN_RE})\\s*(.+)$`));
    if(m){
      const d = parseDateToken(m[1], CUR_YEAR);
      if(d){
        const built = kwBuildFromRest(m[2].trim(), defaultCompType, leaveKeywordPattern);
        if(built){ items.push(Object.assign({}, built, { date: d, raw: line })); return; }
      }
    }

    // C) 假別總天數設定：特休/年假/病假/事假/家庭照顧假/身心照顧假 [原]X [剩Y]
    m = line.match(new RegExp(`^(${leaveKeywordPattern})\\s*(?:原)?\\s*([\\d.]+)\\s*(?:剩\\s*([\\d.]+))?\\s*$`));
    if(m){
      const mapEntry = KEYWORD_LEAVE_MAP.find(k=> new RegExp('^(?:'+k.re+')$').test(m[1]));
      items.push({ kind:'quota', quotaKey: mapEntry.key, quotaLabel: mapEntry.label,
        total: parseFloat(m[2]), remain: m[3]!==undefined ? parseFloat(m[3]) : null, raw: line });
      return;
    }

    unmatched.push(line);
  });

  return { items, unmatched };
}

function compExpiryReminders(){
  const todayD = new Date(TODAY);
  const result = [];
  ['comp','exchange'].forEach(category=>{
    compFifoRemaining(category).forEach(b=>{
      if(!b.expiry || b.remainDays<=0.001) return; // 沒有到期日、或這筆已經被用完了，不用提醒
      if(b.expiryAcknowledgedFor && b.expiryAcknowledgedFor===b.expiry) return; // 已經按過「已知悉」，且到期日沒被改過，不再提醒
      const diffDays = Math.round((new Date(b.expiry) - todayD)/86400000);
      if(diffDays <= 90) result.push(Object.assign({}, b, {category, diffDays}));
    });
  });
  return result.sort((a,b)=> a.diffDays-b.diffDays);
}
// 按「已知悉」：記住目前這個到期日已經被看過了，之後只要到期日不變就不會再提醒
// 如果之後這筆紀錄的到期日被改掉（不管是手動改還是重新計算），會自動恢復提醒，不用擔心被永久放生
async function acknowledgeExpiry(category, id){
  const rec = state.compRecords.find(r=>r.id===id && (r.category||'comp')===category);
  if(!rec || !rec.expiry) return;
  rec.expiryAcknowledgedFor = rec.expiry;
  await saveState();
  render();
}

let reminderExpanded = false; // 首頁「即將到期」超過3筆時，是否展開看全部（不存檔，重開App恢復收合）
function toggleReminderExpanded(){ reminderExpanded = !reminderExpanded; render(); }
function openExpiryDecisionFromBanner(){ expiryDecisionModalOpen = true; render(); }
function reminderBanner(){
  // 首頁頂端的補休／換休提醒，分兩種：
  // (1) 已過期、還沒決定「已使用／保留」的：收成一行，點下去打開決定視窗一次處理（同一件事不要在首頁跟視窗各列一次）
  // (2) 即將到期（90天內）的、跟選了「保留」的過期批次：逐筆列，但最多先顯示3筆，其餘收起來
  const undecidedCount = getExpiringUndecidedBatches().length;
  const list = compExpiryReminders().filter(r=> r.diffDays>=0 || r.expiryDecision==='kept');
  const compHtml = (undecidedCount || list.length) ? (()=>{
    const hasUrgent = undecidedCount>0 || list.some(r=>r.diffDays<=7);
    const MAX_SHOWN = 3;
    const shown = reminderExpanded ? list : list.slice(0, MAX_SHOWN);
    const hiddenCount = list.length - shown.length;
    const items = shown.map(r=>{
      const statusTxt = r.diffDays < 0 ? `已過期${Math.abs(r.diffDays)}天・保留中` : (r.diffDays===0? '今天到期' : `還有${r.diffDays}天`);
      const catLabel = COMP_CATEGORIES[r.category||'comp'].label;
      const lineClass = r.diffDays<=7 ? 'urgent-line' : '';
      return `<div class="reminder-line"><span class="${lineClass}">${toROC(r.date)} 的${catLabel} ${fmt(r.remainDays)} 天，${toROC(r.expiry)} 到期（${statusTxt}）</span><button type="button" class="ack-btn" onclick="acknowledgeExpiry('${r.category}','${r.id}')">✕ 不再顯示</button></div>`;
    }).join('');
    const undecidedLine = undecidedCount ? `<button type="button" class="reminder-summary-link" onclick="openExpiryDecisionFromBanner()"><span>${undecidedCount} 筆已過期，還沒決定怎麼處理</span><span class="reminder-summary-arrow">處理 ›</span></button>` : '';
    const moreLine = list.length > MAX_SHOWN ? `<button type="button" class="reminder-more" onclick="toggleReminderExpanded()">${reminderExpanded ? '收起' : `還有 ${hiddenCount} 筆即將到期 ▾`}</button>` : '';
    return `<div class="reminder-bar${hasUrgent?' reminder-urgent':''}"><strong>${ICON_WARNING} 補休／換休到期提醒</strong>${undecidedLine}${items}${moreLine}</div>`;
  })() : '';

  const month = NOW.getMonth()+1;
  const annualUsed = usedOf('annual', CUR_YEAR);
  const annualMin = getAnnualMinDays();
  const shortfall = annualMin - annualUsed;
  const daysLeftInYear = Math.round((new Date(CUR_YEAR,11,31) - new Date(TODAY+'T00:00:00')) / 86400000);
  const annualHtml = (month>=10 && shortfall>0) ? (()=>{
    const urgent = daysLeftInYear <= 30;
    return `<div class="reminder-bar${urgent?' reminder-urgent':''}"><strong>${ICON_STAR}特休最低使用天數提醒</strong>今年（${CUR_YEAR}）特休已使用 ${fmt(annualUsed)} 天，未達最低要求 ${fmt(annualMin)} 天，尚需再休 ${fmt(shortfall)} 天，建議儘早排定（可在「設定」分頁調整門檻）。</div>`;
  })() : '';

  // 新的一年還沒設定特休天數：每年只有特休會依年資變動，其他假別的預設值通常不用改，
  // 所以只提醒特休，點下去直接開特休的小視窗，不用跑去設定頁翻找
  const annualQuotaHtml = needsAnnualQuotaReminder() ? `<div class="reminder-bar"><strong>${ICON_STAR}${CUR_YEAR} 年特休天數還沒設定</strong>新的一年特休天數要重新填，目前先以 0 天計算。<div style="margin-top:8px;"><button type="button" class="btn-jade" style="font-size:14px;padding:8px 14px;" onclick="openAnnualQuotaModal()">設定特休天數</button></div></div>` : '';

  return annualQuotaHtml + compHtml + annualHtml;
}

function needsAnnualQuotaReminder(){
  const y = state && state.quotaByYear ? state.quotaByYear[CUR_YEAR] : null;
  return !(y && y.annual !== undefined);
}

          <button type="button" class="ghost" onclick="closeAnnualQuotaModal()">稍後</button>
        </div>
      </div>
    </div>`;
}

// 把「某個年月有哪些假別紀錄」的計算抽成共用函式，這樣行事曆本月格子、跨月份的灰色格子（上個月尾/下個月頭）都能共用同一套邏輯，
// 不用本月一份、跨月份又另外寫一份幾乎一樣的程式碼
function buildCalDayMap(ymPrefix){
  const dayMap = {};
  LEAVE_TYPES.forEach(t=>{
    (state.records[t.key]||[]).forEach(r=>{
      if(r.date.startsWith(ymPrefix)){
        const d = parseInt(r.date.slice(8,10),10);
        if(!dayMap[d]) dayMap[d]=[];
        dayMap[d].push({kind:'leave', key:t.key, id:r.id, seal:t.label.slice(0,2), wide:true, c:t.c, label:`${t.label} ${displayAmount(r)}${r.note? '：'+r.note:''}`});
      }
    });
  });
  (state.compRecords||[]).forEach(r=>{
    if(r.date.startsWith(ymPrefix)){
      const d = parseInt(r.date.slice(8,10),10);
      if(!dayMap[d]) dayMap[d]=[];
      const cat = r.category||'comp';
      const isCustom = cat==='custom';
      const label = isCustom ? (r.customLabel||'其他假別') : COMP_CATEGORIES[cat].label;
      const c = isCustom ? 'amber' : COMP_CATEGORIES[cat].c;
      const sign = r.type==='earn' ? '+' : '－';
      // seal會被直接塞進行事曆小圓點的HTML裡（沒有再經過escapeHtml），
      // 自訂假別的名稱（customLabel）是使用者自己打的字，這裡要先跳脫，不然打特殊字元進去可能造成XSS
      dayMap[d].push({kind:'comp', key:cat, id:r.id, seal:escapeHtml(sign+label), wide:true, c, label:`${label}${r.type==='earn'?'獲得':'使用'} ${displayAmount(r)}${r.note? '：'+r.note:''}`});
    }
  });
  return dayMap;
}
// 點跨月份的灰色格子（上個月尾／下個月頭）：切換到那個日期實際所在的月份、選取那一天，
// 這樣下面的詳細資訊面板才能正確顯示（面板本來就限定只顯示「目前正在看的月份」裡的日期）
function selectAdjacentCalDay(dateStr){
  const [yy, mm] = dateStr.split('-').map(Number);
  calYear = yy;
  calMonth = mm;
  calSelectedDate = dateStr;
  render();
}
function calendarPanel(){
  if(!calendarMode) return '';
  const y = calYear, m = calMonth;
  ensureHolidayYear(y); // 不等待，資料回來時會自動重新渲染
  const holidays = (holidayCache[y] && typeof holidayCache[y]==='object') ? holidayCache[y] : null;
  const firstDay = new Date(y, m-1, 1);
  const startWeekday = firstDay.getDay();
  const daysInMonth = new Date(y, m, 0).getDate();
  const ymPrefix = `${y}-${String(m).padStart(2,'0')}`;
  const dayMap = buildCalDayMap(ymPrefix);
  // 上個月／下個月的年月，給跨月份灰色格子用（處理1月往前變上一年12月、12月往後變下一年1月的進位）
  const prevYM = m===1 ? {y:y-1, m:12} : {y, m:m-1};
  const nextYM = m===12 ? {y:y+1, m:1} : {y, m:m+1};
  const prevDayMap = buildCalDayMap(`${prevYM.y}-${String(prevYM.m).padStart(2,'0')}`);
  const nextDayMap = buildCalDayMap(`${nextYM.y}-${String(nextYM.m).padStart(2,'0')}`);
  let cells = '';
  const prevMonthDays = new Date(y, m-1, 0).getDate();
  for(let i=0;i<startWeekday;i++){
    const dayNum = prevMonthDays - startWeekday + 1 + i;
    const dateStr = `${prevYM.y}-${String(prevYM.m).padStart(2,'0')}-${String(dayNum).padStart(2,'0')}`;
    const items = prevDayMap[dayNum]||[];
    const dots = items.map(it=>`<span class="cal-dot ${it.wide?'cal-dot-wide':''} c-${it.c}-bg">${it.seal}</span>`).join('');
    cells += `<div class="cal-cell adjacent" onclick="selectAdjacentCalDay('${dateStr}')"><div class="cal-daynum">${dayNum}</div><div class="cal-dots">${dots}</div></div>`;
  }
  const monthUsage = {}; // key -> 天數，給月摘要用
  for(let d=1; d<=daysInMonth; d++){
    const items = dayMap[d]||[];
    const dots = items.map(it=>`<span class="cal-dot ${it.wide?'cal-dot-wide':''} c-${it.c}-bg">${it.seal}</span>`).join('');
    const dateStr = `${y}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const isToday = (dateStr===TODAY);
    const isSelected = (dateStr===calSelectedDate);
    const weekday = (startWeekday + d - 1) % 7;
    const h = holidays ? holidays[dateStr] : null;
    const isNamedHoliday = h && h.isHoliday && h.description; // 只標「有名字」的假日（國定假日/補假等），週六日本來就看得出來，不特別標
    const isMakeupWorkday = h && h.isHoliday===false && h.description; // 例如「補行上班」：本來是假日但這天要上班
    const isSaturday = weekday===6;
    const isSunday = weekday===0;
    const daynumClass = isNamedHoliday ? 'holiday' : '';
    const weekendClass = isMakeupWorkday ? '' : (isSaturday ? 'sat-bg' : (isSunday ? 'weekend' : ''));
    const holidayBgClass = isNamedHoliday ? 'holiday-bg' : '';
    const makeupBadge = isMakeupWorkday ? `<span class="cal-makeup-badge">班</span>` : '';
    cells += `<div class="cal-cell ${isToday?'today':''} ${isSelected?'selected':''} ${weekendClass} ${holidayBgClass}" onclick="selectCalDay('${dateStr}')"><div class="cal-daynum ${daynumClass}">${d}${isNamedHoliday?'<span class="cal-holiday-dot"></span>':''}${makeupBadge}</div><div class="cal-dots">${dots}</div></div>`;
  }
  const trailingCount = (7 - ((startWeekday + daysInMonth) % 7)) % 7;
  for(let i=1;i<=trailingCount;i++){
    const dateStr = `${nextYM.y}-${String(nextYM.m).padStart(2,'0')}-${String(i).padStart(2,'0')}`;
    const items = nextDayMap[i]||[];
    const dots = items.map(it=>`<span class="cal-dot ${it.wide?'cal-dot-wide':''} c-${it.c}-bg">${it.seal}</span>`).join('');
    cells += `<div class="cal-cell adjacent" onclick="selectAdjacentCalDay('${dateStr}')"><div class="cal-daynum">${i}</div><div class="cal-dots">${dots}</div></div>`;
  }
  // 月摘要：這個月每個假別／補休換休「使用」加總了幾天
  LEAVE_TYPES.forEach(t=>{
    (state.records[t.key]||[]).forEach(r=>{
      if(r.date.startsWith(ymPrefix)) monthUsage[t.key] = (monthUsage[t.key]||0) + toDays(r);
    });
  });
  state.compRecords.forEach(r=>{
    if(r.date.startsWith(ymPrefix) && r.type==='use'){
      const cat = r.category||'comp';
      if(cat==='custom'){
        const key = `custom:${r.customLabel||'其他假別'}`;
        monthUsage[key] = (monthUsage[key]||0) + toDays(r);
      } else {
        monthUsage[cat] = (monthUsage[cat]||0) + toDays(r);
      }
    }
  });
  const monthUsageLabels = LEAVE_TYPES.concat([{key:'comp',label:'補休'},{key:'exchange',label:'換休'}]);
  const customUsageParts = Object.keys(monthUsage).filter(k=>k.startsWith('custom:') && monthUsage[k]>0).map(k=>`${escapeHtml(k.slice(7))} ${fmt(monthUsage[k])}天`);
  const monthSummaryParts = monthUsageLabels.filter(t=>monthUsage[t.key]>0).map(t=>`${t.label} ${fmt(monthUsage[t.key])}天`).concat(customUsageParts);
  // 本月國定假日／補班提醒：資料來源跟月曆紅字用的是同一份人事行政行事曆快取，不管日期是過去還是未來，只要在這個月份範圍內都算
  let holidayNote = '';
  if(holidays){
    let holidayCount = 0, makeupHolidayCount = 0, makeupCount = 0;
    Object.keys(holidays).forEach(dateStr=>{
      if(!dateStr.startsWith(ymPrefix)) return;
      const h = holidays[dateStr];
      if(h.isHoliday && h.description){
        // 「補假」是因為國定假日剛好碰到週末，另外補一天放假；跟「真正的國定假日」分開算，才不會把中秋節這種節日跟補假混在一起講
        if(h.description.includes('補假')) makeupHolidayCount++;
        else holidayCount++;
      }
      else if(h.isHoliday===false && h.description) makeupCount++; // 補行上班
    });
    const bits = [];
    if(holidayCount>0) bits.push(`<span class="mini-chip cal-holiday-chip-lg" style="background:var(--card);border:1.5px solid var(--brick);color:var(--brick);">國定假日${holidayCount}天</span>`);
    if(makeupHolidayCount>0) bits.push(`<span class="mini-chip cal-holiday-chip-lg" style="background:var(--card);border:1.5px solid var(--brick);color:var(--brick);">補假${makeupHolidayCount}天</span>`);
    if(makeupCount>0) bits.push(`<span class="mini-chip cal-holiday-chip-lg" style="background:var(--card);border:1.5px solid var(--blue);color:var(--blue);">補班${makeupCount}天</span>`);
    if(bits.length) holidayNote = bits.join(' ');
  }
  const monthSummary = monthSummaryParts.length ? `本月已用：${monthSummaryParts.join('、')}` : '本月尚無請假紀錄';
  const selectedInfo = calSelectedDate && calSelectedDate.startsWith(ymPrefix) ? (()=>{
    const dNum = parseInt(calSelectedDate.slice(8,10),10);
    const items = dayMap[dNum]||[];
    const h = holidays ? holidays[calSelectedDate] : null;
    const holidayLine = (h && h.isHoliday && h.description) ? `<div class="cal-detail-holiday">${ICON_DOT_RED}${escapeHtml(h.description)}</div>`
      : (h && h.isHoliday===false && h.description) ? `<div class="cal-detail-makeup">${ICON_DOT_BLUE}${escapeHtml(h.description)}（原本是假日，這天要補班）</div>` : '';
    const weekLabel = ['日','一','二','三','四','五','六'][new Date(calSelectedDate+'T00:00:00').getDay()];
    const recordChips = items.length ? `<div class="cal-detail-chips">${items.map(it=>`
      <span class="cal-detail-chip" style="background:var(--${it.c}-soft);color:var(--${it.c});">
        <span onclick="viewLeaveDetail('${it.key}','${calSelectedDate}')">${escapeHtml(it.label)} ›</span>
        <button type="button" class="cal-detail-chip-del" onclick="event.stopPropagation();removeFromCalendar(this,'${it.kind}','${it.key}','${it.id}')" aria-label="刪除">✕</button>
      </span>`).join('')}</div>` : `<div class="hint">這天沒有請假紀錄</div>`;
    const typeOptions = `<option value="${LEAVE_TYPES[0].key}">${LEAVE_TYPES[0].label}</option><option value="comp">補休</option>` + LEAVE_TYPES.slice(1).map(t=>`<option value="${t.key}">${t.label}</option>`).join('') + `<option value="exchange">換休</option>`;
    return `<div class="cal-detail-panel">
      <div class="cal-detail-date">${toROC(calSelectedDate)}（${weekLabel}）${calSelectedDate===TODAY?'<span class="cal-detail-today-badge">今日</span>':''}</div>
      ${holidayLine}
      ${recordChips}
      <div class="cal-detail-add-row">
        <select id="calAddTypeSelect">${typeOptions}</select>
        <button type="button" class="btn-jade" onclick="addFromCalendar('${calSelectedDate}')">＋ 新增</button>
      </div>
    </div>`;
  })() : '';
  return `
    <div class="block cal-block">
      <div class="cal-header">
        <button type="button" class="ghost" onclick="changeCalMonth(-1)"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg></button>
        <div class="cal-title" onclick="toggleCalPicker()" style="cursor:pointer;display:flex;align-items:center;gap:6px;">${y} 年 ${m} 月 <span class="cal-title-chevron"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" style="transition:transform .2s ease;${calPickerOpen?'transform:rotate(180deg);':''}"><path d="M6 9l6 6 6-6"/></svg></span></div>
        <button type="button" class="ghost" onclick="changeCalMonth(1)"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg></button>
      </div>
      ${calPickerOpen ? `<div class="cal-picker-row">
        <select onchange="jumpCalYear(this.value)">${Array.from({length:11},(_,i)=>CUR_YEAR-5+i).map(yy=>`<option value="${yy}" ${yy===y?'selected':''}>${yy} 年</option>`).join('')}</select>
        <select onchange="jumpCalMonth(this.value)">${Array.from({length:12},(_,i)=>i+1).map(mm=>`<option value="${mm}" ${mm===m?'selected':''}>${mm} 月</option>`).join('')}</select>
      </div>` : ''}
      ${(y!==CUR_YEAR || m!==NOW.getMonth()+1) ? `<button type="button" class="ghost cal-today-btn" onclick="jumpToToday()" ontouchend="event.preventDefault();jumpToToday();">${ICON_PIN}回到今天</button>` : ''}
      <div class="cal-swipe-area" ontouchstart="calTouchStart(event)" ontouchend="calTouchEnd(event)">
        <div class="cal-grid cal-weekdays"><div>日</div><div>一</div><div>二</div><div>三</div><div>四</div><div>五</div><div>六</div></div>
        <div class="cal-grid">${cells}</div>
      </div>
      ${selectedInfo}
      ${holidayNote ? `<div class="cal-holiday-note-row">${holidayNote}</div>` : ''}
      <div class="cal-month-summary">${monthSummary}</div>
      <p class="hint" style="margin-top:10px;">${ICON_DOT_RED}紅字日期為政府公告國定假日／補假，不影響假別計算。${holidays===null ? '國定假日資料讀取中…' : (holidayCache[y]===false ? '國定假日資料讀取失敗，可能是離線中，稍後重新整理再試。' : '')}<button type="button" class="cal-holiday-refresh-btn" onclick="refreshHolidayData(${y})">${ICON_REFRESH}重新整理國定假日資料</button></p>
    </div>`;
}

function statsChart(){
  if(!chartMode) return '';
  const y = selectedYear;
  const monthTotals = Array(12).fill(0).map(()=> ({}));
  LEAVE_TYPES.forEach(t=>{
    (state.records[t.key]||[]).forEach(r=>{
      if(r.date.startsWith(String(y))){
        const mIdx = parseInt(r.date.slice(5,7),10)-1;
        monthTotals[mIdx][t.key] = (monthTotals[mIdx][t.key]||0) + toDays(r);
      }
    });
  });
  state.compRecords.filter(r=>r.type==='use' && r.date.startsWith(String(y))).forEach(r=>{
    const mIdx = parseInt(r.date.slice(5,7),10)-1;
    const cat = r.category||'comp';
    monthTotals[mIdx][cat] = (monthTotals[mIdx][cat]||0) + toDays(r);
  });
  const maxVal = Math.max(1, ...monthTotals.map(m=> Object.values(m).reduce((s,v)=>s+v,0)));
  const TRACK_H = 130;
  const typeList = LEAVE_TYPES.concat([{key:'comp', c:'brick', label:'補休使用'}, {key:'exchange', c:'teal', label:'換休使用'}, {key:'custom', c:'amber', label:'其他假別'}]);
  const hasCustomUse = monthTotals.some(m=>(m.custom||0)>0);
  const bars = monthTotals.map((m,i)=>{
    const total = Object.values(m).reduce((s,v)=>s+v,0);
    const segments = typeList.map(t=>{
      const v = m[t.key]||0;
      if(v<=0) return '';
      const px = Math.max(2, Math.round(v/maxVal*TRACK_H));
      return `<div class="chart-seg c-${t.c}-bg" style="height:${px}px" title="${t.label} ${fmt(v)}天"></div>`;
    }).join('');
    const isActiveMonth = calendarMode && calYear===y && (i+1)===calMonth;
    return `<div class="chart-col ${isActiveMonth?'chart-col-active':''}" onclick="jumpToCalMonth(${y},${i+1})">
      <div class="chart-bar-track">${segments}</div>
      <div class="chart-label">${i+1}月</div>
      <div class="chart-total">${total>0?fmt(total):''}</div>
    </div>`;
  }).join('');

  // 補休/換休「獲得」趨勢：跟上面「使用」分開看，才看得出來哪幾個月加班比較多
  const monthEarnTotals = Array(12).fill(0).map(()=> ({comp:0, exchange:0}));
  state.compRecords.filter(r=>r.type==='earn' && r.date.startsWith(String(y))).forEach(r=>{
    const mIdx = parseInt(r.date.slice(5,7),10)-1;
    const cat = r.category||'comp';
    monthEarnTotals[mIdx][cat] = (monthEarnTotals[mIdx][cat]||0) + toDays(r);
  });
  const hasEarnData = monthEarnTotals.some(m=> m.comp+m.exchange>0);
  const maxEarnVal = Math.max(1, ...monthEarnTotals.map(m=> m.comp+m.exchange));
  const earnBars = monthEarnTotals.map((m,i)=>{
    const total = m.comp+m.exchange;
    const segments = ['comp','exchange'].map(k=>{
      const v = m[k]||0;
      if(v<=0) return '';
      const px = Math.max(2, Math.round(v/maxEarnVal*TRACK_H));
      const c = k==='comp' ? 'brick' : 'teal';
      const label = k==='comp' ? '補休獲得' : '換休獲得';
      return `<div class="chart-seg c-${c}-bg" style="height:${px}px" title="${label} ${fmt(v)}天"></div>`;
    }).join('');
    return `<div class="chart-col ${(calendarMode && calYear===y && (i+1)===calMonth)?'chart-col-active':''}" onclick="jumpToCalMonth(${y},${i+1})">
      <div class="chart-bar-track">${segments}</div>
      <div class="chart-label">${i+1}月</div>
      <div class="chart-total">${total>0?fmt(total):''}</div>
    </div>`;
  }).join('');
  const earnSection = hasEarnData ? `
    <div class="block" style="margin-top:14px;">
      <h2><span class="dot dot-teal"></span>${y} 年度補休／換休獲得趨勢</h2>
      <div class="chart-wrap">${earnBars}</div>
      <div class="chart-legend">
        <span class="legend-item"><span class="legend-dot c-brick-bg"></span>補休獲得</span>
        <span class="legend-item"><span class="legend-dot c-teal-bg"></span>換休獲得</span>
      </div>
    </div>` : '';

  return `
    <div class="block">
      <h2><span class="dot dot-jade"></span>${y} 年度統計圖</h2>
      <div class="chart-wrap">${bars}</div>
      <div class="chart-legend">
        ${LEAVE_TYPES.map(t=>`<span class="legend-item"><span class="legend-dot c-${t.c}-bg"></span>${t.label}</span>`).join('')}
        <span class="legend-item"><span class="legend-dot c-brick-bg"></span>補休使用</span>
        <span class="legend-item"><span class="legend-dot c-teal-bg"></span>換休使用</span>
        ${hasCustomUse ? `<span class="legend-item"><span class="legend-dot c-amber-bg"></span>其他假別</span>` : ''}
      </div>
    </div>
    ${earnSection}`;
}

// 年度比較：selectedYear 跟前一年，各假別（含補休/換休使用）加總對照
function statsYearCompare(){
  if(!chartMode) return '';
  const y = selectedYear, py = y-1;
  const rows = LEAVE_TYPES.map(t=>({key:t.key, label:t.label, cur:usedOf(t.key,y), prev:usedOf(t.key,py)}))
    .concat([
      {key:'comp', label:'補休使用', cur:compUseTotal('comp',y), prev:compUseTotal('comp',py)},
      {key:'exchange', label:'換休使用', cur:compUseTotal('exchange',y), prev:compUseTotal('exchange',py)},
    ])
    .filter(r=> r.cur>0 || r.prev>0);
  if(!rows.length) return '';
  const items = rows.map(r=>{
    const diff = r.cur - r.prev;
    const diffTxt = Math.abs(diff)<0.001 ? '持平' : (diff>0 ? `多 ${fmt(Math.abs(diff))} 天` : `少 ${fmt(Math.abs(diff))} 天`);
    const arrow = diff>0.001 ? '▲' : (diff<-0.001 ? '▼' : '－');
    return `<div class="cmp-row" onclick="viewLeaveDetail('${r.key}')">
      <span class="cmp-label">${r.label} ›</span>
      <span class="cmp-nums">${py} 年 ${fmt(r.prev)} 天 → ${y} 年 ${fmt(r.cur)} 天</span>
      <span class="cmp-diff">${arrow} ${diffTxt}</span>
    </div>`;
  }).join('');
  return `
    <div class="block" style="margin-top:14px;">
      <h2><span class="dot dot-jade"></span>年度比較（${py} vs ${y}）</h2>
      <div class="cmp-list">${items}</div>
    </div>`;
}

// 使用率：只列有設定總天數（quota>0）的假別，用百分比條讓剩餘量更直覺
// 用自己獨立的 utilizationMode 開關控制顯示/隱藏，跟「隱藏統計圖」是分開的
// 補休/換休沒有固定年度額度（是FIFO批次逐筆累計、各自到期），改用「今年獲得」當分母、
// 「今年使用」當分子換算使用率——這樣至少能看出今年獲得的部分用掉了多少比例
// （如果今年完全沒有新獲得、但用了以前年度結餘的部分，分母是0沒辦法算百分比，就只顯示數字不顯示長條）
function statsUtilization(){
  if(!utilizationMode) return '';
  const y = selectedYear;
  const rows = LEAVE_TYPES.map(t=>({key:t.key, label:t.label, c:t.c, quota:getQuota(t.key,y), used:usedOf(t.key,y)}))
    .filter(r=> r.quota>0);
  const compRows = ['comp','exchange'].map(cat=>({
    key:cat, label:COMP_CATEGORIES[cat].label, c:COMP_CATEGORIES[cat].c, earn:compEarnTotal(cat,y), use:compUseTotal(cat,y),
  })).filter(r=> r.earn>0 || r.use>0);
  if(!rows.length && !compRows.length) return '';
  const items = rows.map(r=>{
    const pct = Math.max(0, Math.min(100, Math.round(r.used/r.quota*100)));
    return `<div class="util-row" onclick="viewLeaveDetail('${r.key}')">
      <div class="util-label">${r.label} ›<span class="util-nums">${fmt(r.used)} / ${fmt(r.quota)} 天（${pct}%）</span></div>
      <div class="util-track"><div class="util-fill c-${r.c}-bg" style="width:${pct}%"></div></div>
    </div>`;
  }).join('');
  const compItems = compRows.map(r=>{
    if(r.earn>0){
      const pct = Math.max(0, Math.min(100, Math.round(r.use/r.earn*100)));
      return `<div class="util-row" onclick="viewLeaveDetail('${r.key}')">
        <div class="util-label">${r.label} ›<span class="util-nums">${fmt(r.use)} / ${fmt(r.earn)} 天（${pct}%）</span></div>
        <div class="util-track"><div class="util-fill c-${r.c}-bg" style="width:${pct}%"></div></div>
      </div>`;
    }
    // 今年沒有新獲得（可能是純粹在用以前結餘），沒有分母可以算百分比，只列數字
    return `<div class="util-row" onclick="viewLeaveDetail('${r.key}')">
      <div class="util-label">${r.label} ›<span class="util-nums">今年無新獲得・使用 ${fmt(r.use)} 天</span></div>
    </div>`;
  }).join('');
  return `
    <div class="block">
      <h2><span class="dot dot-jade"></span>${y} 年使用率</h2>
      ${items}
      ${compItems ? `<h2 style="margin-top:${rows.length?'16px':'0'};font-size:14.5px;">${y} 年補休／換休概況</h2>${compItems}` : ''}
    </div>`;
}

function leaveTabBar(){

  // 但「隱藏」不套用在這裡——首頁隱藏只是少看一眼摘要，分頁是實際的操作入口，藏起來就等於斷了登記/查詢那個假別的路，
  // 所以這裡固定顯示全部分頁，只有排序共用，隱藏各自獨立
  const tabMeta = {
    comp: {label:'補休', c:'brick'},
    exchange: {label:'換休', c:'teal'},
    custom: {label:'其他假別', c:'amber'},
  };
  LEAVE_TYPES.forEach(t=>{ tabMeta[t.key] = {label:t.label, c:t.c}; });
  const tabs = getHomeCardOrder().map(key=>({key, label:tabMeta[key].label, c:tabMeta[key].c}));
  return `
    <div class="leave-tabs" id="leaveTabsRow" onscroll="updateLeaveTabsFade(this)">
      ${tabs.map(t=>{
        const isActive = activeLeaveTab===t.key;

      }).join('')}
    </div>`;
}

              ${currentUser ? `<input type="file" id="compPhotoInput" accept="image/*">` : `<p class="hint" style="margin:0;">需要先登入雲端帳號才能使用這個功能（到「設定」分頁）</p>`}
            </div>

          <div class="form-row">
            <button type="submit" class="btn-${info.c}">登記</button>
          </div>
          <div id="compBottomSpacer" style="height:0;"></div>
        </form>
      </section>`;
  }

  const t = LEAVE_TYPES.find(tt=>tt.key===key) || LEAVE_TYPES[0];
  return backBtn + typeSelector + yearSwitcher + `
    <section class="block">
      <h2><span class="dot dot-${t.c}"></span>使用${t.label}</h2>
      <form class="entry" onsubmit="addRecord('${t.key}', event)">

          <label class="multi-date-toggle"><input type="checkbox" ${multiDateMode?'checked':''} onchange="toggleMultiDateMode('${t.key}Date')"> 一次登記多天（可分別指定不連續的日期）</label>
          ${multiDateMode ? `
          <div style="margin-top:8px;">
            <button type="button" class="btn-outline-${t.c} btn-with-badge" onclick="addMultiDate('${t.key}Date')"><span class="btn-badge-circle btn-badge-circle-outline"><svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></span> 加入這天</button>
          </div>
          <div class="multi-date-chips">
            ${multiDateList.length===0 ? `<span class="hint" style="margin:0;">尚未加入任何日期，選好上面的日期後點「加入這天」</span>` : multiDateList.map(d=>`<span class="multi-date-chip" style="background:var(--${t.c}-soft, var(--jade-soft));color:var(--${t.c});">${toROC(d)}<span class="multi-date-chip-x" onclick="removeMultiDate('${d}')">✕</span></span>`).join('')}
          </div>
          ` : ''}
        </div>
        <div class="field field-days">
          <label>數量${multiDateMode?'（每一天都套用這個數量）':''}</label>
          <div class="days-row">
            <input type="number" id="${t.key}Amount" min="0.5" step="0.5" value="1" required oninput="updateUnitColor('${t.key}Amount','${t.key}Unit','${t.key}ConvertHint');">
            <select id="${t.key}Unit" class="unit-select u-day" onchange="onUnitChange('${t.key}');updateUnitColor('${t.key}Amount','${t.key}Unit','${t.key}ConvertHint');" style="width:96px;padding:8px 4px;">
              <option value="day">天</option>
              <option value="hour">小時</option>
